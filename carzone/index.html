<!--
  CarZone Kuwait, working prototype.

  A single hash routed document. The header, the views and the dialogs are
  all rendered by assets/app.js; this file is the shell and the head.

  Nothing here is a live business. The catalogue is a sample of 46 parts,
  no order is taken, no payment is processed and no message is sent. Every
  screen that could be mistaken for a real transaction says so on the
  screen itself rather than only in this comment. See README.md.
-->
