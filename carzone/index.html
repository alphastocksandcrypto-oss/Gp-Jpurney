<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CarZone Storefront</title>
<meta name="description" content="Auto parts for Kuwait with fitment verified against your car, priced with installation included, fitted at your door.">
<meta name="theme-color" content="#0A0C09">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/chakra-petch@latest/latin-500-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/chakra-petch@latest/latin-600-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/chakra-petch@latest/latin-700-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/barlow@latest/latin-400-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/barlow@latest/latin-500-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/barlow@latest/latin-600-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/barlow@latest/latin-700-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/ibm-plex-mono@latest/latin-400-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/ibm-plex-mono@latest/latin-500-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/ibm-plex-mono@latest/latin-600-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/ibm-plex-sans-arabic@latest/arabic-400-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/ibm-plex-sans-arabic@latest/arabic-500-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/ibm-plex-sans-arabic@latest/arabic-600-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/ibm-plex-sans-arabic@latest/arabic-700-normal.css">
<style>:root{color-scheme:dark light}body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* ============================ design system ============================ */
:root{
--bone:#EDEFEA;--panel:#FFFFFF;--sunk:#E2E6DD;--veil:#F5F6F2;
--asphalt:#1A1D18;--asphalt-2:#252A22;--asphalt-3:#333930;
--ink:#171A14;--ink-2:#4E564A;--ink-3:#646D61;
--on-dark:#EDEFEA;--on-dark-2:#A8B0A2;--on-dark-3:#7C8576;
--rule:#D4D9CC;--rule-2:#BAC1B2;--rule-dark:#343A30;
--flame:#D9401C;--flame-deep:#A82D12;--flame-up:#F2743F;--flame-wash:#FBE6DF;
--steel:#2E5A66;--steel-up:#6FA8B8;--steel-wash:#DFEAED;
--go:#16704A;--go-wash:#DDEDE3;--go-up:#5CC191;
--hold:#8A5F0F;--hold-wash:#F6ECD6;
--stop:#A32418;--stop-wash:#FAE2DE;
--fd:'Chakra Petch',system-ui,sans-serif;
--fb:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
--fm:'IBM Plex Mono',ui-monospace,Menlo,monospace;
--fa:'IBM Plex Sans Arabic','Barlow',sans-serif;
--e1:0 1px 2px rgba(23,26,20,.06);
--e2:0 2px 4px rgba(23,26,20,.06),0 8px 20px -12px rgba(23,26,20,.28);
--e3:0 4px 8px rgba(23,26,20,.08),0 24px 48px -24px rgba(23,26,20,.42);
--e4:0 8px 16px rgba(23,26,20,.1),0 40px 80px -32px rgba(23,26,20,.5);
--sp:cubic-bezier(.2,.9,.25,1);--ease:cubic-bezier(.4,0,.2,1);
--r:3px;--rl:5px;
}
:root[data-theme="dark"]{
--bone:#0F1210;--panel:#181C17;--sunk:#212620;--veil:#141812;
--asphalt:#0A0C09;--asphalt-2:#141811;--asphalt-3:#252A22;
--ink:#E9ECE5;--ink-2:#AEB7A9;--ink-3:#98A294;
--rule:#282E25;--rule-2:#394135;--rule-dark:#242A21;
--flame:#F2743F;--flame-deep:#D9401C;--flame-up:#FF9264;--flame-wash:#2E1811;
--steel:#6FA8B8;--steel-up:#9BCBD8;--steel-wash:#132429;
--go:#5CC191;--go-wash:#0F2519;--hold:#D3A749;--hold-wash:#2A2110;
--stop:#EC8478;--stop-wash:#2C1512;
--e1:0 1px 2px rgba(0,0,0,.5);
--e2:0 2px 4px rgba(0,0,0,.5),0 8px 20px -12px rgba(0,0,0,.8);
--e3:0 4px 8px rgba(0,0,0,.55),0 24px 48px -24px rgba(0,0,0,.9);
--e4:0 8px 16px rgba(0,0,0,.6),0 40px 80px -32px rgba(0,0,0,.95);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bone);color:var(--ink);font-family:var(--fb);font-size:16px;line-height:1.55;
-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background .4s var(--ease),color .4s var(--ease)}
body[dir="rtl"]{font-family:var(--fa)}
h1,h2,h3,h4{font-family:var(--fd);font-weight:700;line-height:1.06;letter-spacing:-.01em;text-wrap:balance}
body[dir="rtl"] h1,body[dir="rtl"] h2,body[dir="rtl"] h3,body[dir="rtl"] h4{font-family:var(--fa);letter-spacing:0}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
img,svg{display:block;max-width:100%}
svg[viewBox="0 0 24 24"]{width:17px;height:17px;flex-shrink:0}
:focus-visible{outline:2px solid var(--flame);outline-offset:2px;border-radius:2px}
.num{font-family:var(--fm);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.wrap{max-width:1280px;margin:0 auto;padding-inline:22px}
.eyebrow{font-family:var(--fm);font-size:10.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3)}
.eyebrow.flame{color:var(--flame-deep)}
:root[data-theme="dark"] .eyebrow.flame{color:var(--flame)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--fd);
font-weight:600;font-size:14px;letter-spacing:.02em;padding:11px 20px;border-radius:var(--r);
border:1px solid transparent;position:relative;overflow:hidden;white-space:nowrap;
transition:transform .18s var(--sp),box-shadow .22s var(--sp),background .18s var(--ease);will-change:transform}
body[dir="rtl"] .btn{font-family:var(--fa)}
.btn::before{content:"";position:absolute;top:0;left:-90%;width:55%;height:100%;
background:linear-gradient(100deg,transparent,rgba(255,255,255,.3),transparent);transform:skewX(-18deg);pointer-events:none}
.btn:hover::before{animation:sweep .7s var(--ease)}
@keyframes sweep{to{left:140%}}
.btn::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.22),transparent 60%);opacity:0;transition:opacity .3s;pointer-events:none}
.btn:hover::after{opacity:1}
.btn-p{background:var(--flame);color:#fff;box-shadow:var(--e2),0 0 0 0 rgba(217,64,28,.3)}
.btn-p:hover{transform:translateY(-2px);box-shadow:var(--e3),0 0 34px -6px rgba(217,64,28,.55)}
.btn-p:active{transform:translateY(0) scale(.98)}
.btn-d{background:var(--asphalt);color:var(--on-dark);box-shadow:var(--e2)}
:root[data-theme="dark"] .btn-d{background:var(--sunk);color:var(--ink);border-color:var(--rule-2)}
.btn-d:hover{transform:translateY(-2px);box-shadow:var(--e3)}
.btn-o{border-color:var(--rule-2);color:var(--ink);background:var(--panel)}
.btn-o:hover{border-color:var(--ink);transform:translateY(-1px);box-shadow:var(--e2)}
.btn-g{color:var(--ink-2);padding:8px 12px}
.btn-g:hover{color:var(--flame);background:var(--flame-wash)}
.btn-sm{padding:7px 13px;font-size:12.5px}
.btn-lg{padding:14px 26px;font-size:15.5px}
.btn[disabled]{opacity:.42;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--fm);font-size:10px;font-weight:600;
letter-spacing:.09em;text-transform:uppercase;padding:3px 7px;border-radius:2px;white-space:nowrap}
body[dir="rtl"] .chip{font-family:var(--fa);letter-spacing:0}
.chip.go{background:var(--go-wash);color:var(--go)}
.chip.hold{background:var(--hold-wash);color:var(--hold)}
.chip.stop{background:var(--stop-wash);color:var(--stop)}
.chip.steel{background:var(--steel-wash);color:var(--steel)}
.chip.flame{background:var(--flame-wash);color:var(--flame-deep)}
:root[data-theme="dark"] .chip.flame{color:var(--flame)}
.chip.ghost{background:var(--sunk);color:var(--ink-3)}
.chip svg{width:11px;height:11px}
header.top{position:fixed;top:0;inset-inline:0;z-index:60;background:color-mix(in srgb,var(--bone) 80%,transparent);
backdrop-filter:blur(16px) saturate(1.5);border-block-end:1px solid var(--rule);
transition:box-shadow .3s var(--ease),transform .4s var(--sp)}
header.top.hid{transform:translateY(-100%)}
header.top.stuck{box-shadow:var(--e2)}
.topbar{display:flex;align-items:center;gap:16px;height:62px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--fd);font-weight:700;font-size:19px;letter-spacing:-.02em;flex-shrink:0}
.brand .mk{width:26px;height:26px;flex-shrink:0}
.brand .mk rect{transition:transform .4s var(--sp);transform-origin:center}
.brand:hover .mk rect:nth-child(2){transform:translateX(2.5px)}
.brand:hover .mk rect:nth-child(3){transform:translateX(-2.5px)}
nav.main{display:flex;gap:2px;margin-inline-start:6px}
nav.main a{font-family:var(--fd);font-weight:600;font-size:13.5px;padding:8px 12px;border-radius:var(--r);
color:var(--ink-2);position:relative;transition:color .18s var(--ease)}
body[dir="rtl"] nav.main a{font-family:var(--fa)}
nav.main a::after{content:"";position:absolute;inset-inline:11px;bottom:2px;height:2px;background:var(--flame);
transform:scaleX(0);transform-origin:inline-start;transition:transform .26s var(--sp)}
nav.main a:hover{color:var(--ink)}nav.main a:hover::after{transform:scaleX(1)}
nav.main a.on{color:var(--flame)}nav.main a.on::after{transform:scaleX(1)}
.tgrow{flex:1}
.tacts{display:flex;align-items:center;gap:4px}
.iconbtn{width:38px;height:38px;display:grid;place-items:center;border-radius:var(--r);color:var(--ink-2);
position:relative;transition:background .18s var(--ease),color .18s var(--ease),transform .2s var(--sp)}
.iconbtn:hover{background:var(--sunk);color:var(--ink);transform:translateY(-1px)}
.iconbtn svg{width:19px;height:19px}
.badge{position:absolute;top:3px;inset-inline-end:3px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;
background:var(--flame);color:#fff;font-family:var(--fm);font-size:9.5px;font-weight:600;display:grid;place-items:center;animation:pop .3s var(--sp)}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
.vstrip{background:var(--asphalt);color:var(--on-dark);border-block-end:1px solid var(--rule-dark)}
.vstrip .inr{display:flex;align-items:center;gap:12px;min-height:44px;padding-block:6px;font-size:13.5px;flex-wrap:wrap}
.vstrip .lab{font-family:var(--fm);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--on-dark-3)}
.vstrip .car{font-family:var(--fd);font-weight:600;font-size:14.5px}
body[dir="rtl"] .vstrip .car{font-family:var(--fa)}
.vstrip button{color:var(--on-dark-2);font-size:12.5px;text-decoration:underline;text-underline-offset:3px;transition:color .18s}
.vstrip button:hover{color:var(--flame-up)}
.vstrip .plate{background:#fff;color:#111;border-radius:2px;padding:1px 7px;font-family:var(--fm);font-size:12px;font-weight:600}
.spacer{height:62px}
</style>
<style>
/* ============================ hero ============================ */
.hero{background:var(--asphalt);color:var(--on-dark);position:relative;overflow:hidden;isolation:isolate}
.hero::before{content:"";position:absolute;inset:0;z-index:-2;
background:radial-gradient(120% 80% at 78% 8%,rgba(217,64,28,.32),transparent 58%),
radial-gradient(90% 70% at 8% 96%,rgba(46,90,102,.36),transparent 62%)}
.hero::after{content:"";position:absolute;inset:0;z-index:-2;opacity:.5;
background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
background-size:64px 64px;
-webkit-mask-image:radial-gradient(ellipse 90% 80% at 60% 30%,#000 30%,transparent 75%);
mask-image:radial-gradient(ellipse 90% 80% at 60% 30%,#000 30%,transparent 75%)}
.hero canvas{position:absolute;inset:0;z-index:-1;opacity:.55}
.hero .inr{display:grid;grid-template-columns:1.06fr .94fr;gap:44px;align-items:center;padding-block:74px 86px}
.hero h1{font-size:clamp(38px,6.2vw,74px);line-height:.98;letter-spacing:-.028em}
.hero h1 .line{display:block;overflow:hidden;padding-bottom:.08em}
.hero h1 .ch{display:inline-block;will-change:transform}
.hero h1 .lit{color:var(--flame-up);text-shadow:0 0 44px rgba(242,116,63,.35)}
.hero .dek{font-size:18px;color:var(--on-dark-2);margin-top:20px;max-width:50ch;line-height:1.5}
.hero .cta{display:flex;gap:11px;margin-top:30px;flex-wrap:wrap}
.hero .proof{display:flex;gap:26px;margin-top:36px;padding-top:24px;border-top:1px solid var(--rule-dark);flex-wrap:wrap}
.hero .proof div{min-width:88px}
.hero .proof .n{font-family:var(--fm);font-size:24px;font-weight:600;color:var(--flame-up);font-variant-numeric:tabular-nums}
.hero .proof .l{font-size:11.5px;color:var(--on-dark-3);margin-top:3px;line-height:1.35}
.console-w{position:relative;perspective:1100px}
.console{background:var(--asphalt-2);border:1px solid var(--rule-dark);border-radius:var(--rl);box-shadow:var(--e4);
overflow:hidden;transform-style:preserve-3d;will-change:transform;animation:consoleGlow 4.5s ease-in-out infinite}
@keyframes consoleGlow{0%,100%{box-shadow:var(--e4),0 0 0 0 rgba(217,64,28,0)}50%{box-shadow:var(--e4),0 0 54px -12px rgba(217,64,28,.5)}}
.console .hd{display:flex;align-items:center;gap:8px;padding:12px 16px;background:var(--asphalt-3);border-block-end:1px solid var(--rule-dark)}
.console .hd .dot{width:7px;height:7px;border-radius:50%;background:var(--go-up);animation:beat 2.4s infinite}
@keyframes beat{0%{box-shadow:0 0 0 0 rgba(92,193,145,.5)}70%{box-shadow:0 0 0 9px rgba(92,193,145,0)}100%{box-shadow:0 0 0 0 rgba(92,193,145,0)}}
.console .hd .t{font-family:var(--fm);font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--on-dark-2)}
.console .bd{padding:18px}
.console .row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:9px}
.selw{position:relative}
.selw select{width:100%;appearance:none;background:var(--asphalt);color:var(--on-dark);border:1px solid var(--rule-dark);
border-radius:var(--r);padding:11px 32px 11px 12px;font-size:14px;cursor:pointer;transition:border-color .2s var(--ease)}
.selw select:hover:not([disabled]){border-color:var(--flame)}
.selw select[disabled]{opacity:.4;cursor:not-allowed}
.selw select option{background:var(--asphalt);color:var(--on-dark)}
.selw::after{content:"";position:absolute;inset-inline-end:12px;top:50%;width:6px;height:6px;
border-inline-end:2px solid var(--on-dark-3);border-block-end:2px solid var(--on-dark-3);
transform:translateY(-70%) rotate(45deg);pointer-events:none}
.console .or{display:flex;align-items:center;gap:10px;margin:14px 0;color:var(--on-dark-3);font-size:11px;
font-family:var(--fm);letter-spacing:.14em;text-transform:uppercase}
.console .or::before,.console .or::after{content:"";flex:1;height:1px;background:var(--rule-dark)}
.vinbox{display:flex;gap:8px}
.vinbox input{flex:1;background:var(--asphalt);color:var(--on-dark);border:1px solid var(--rule-dark);border-radius:var(--r);
padding:11px 12px;font-family:var(--fm);font-size:13px;letter-spacing:.08em;text-transform:uppercase;transition:border-color .2s;min-width:0}
.vinbox input:focus{border-color:var(--flame);outline:none}
.vinbox input::placeholder{color:var(--on-dark-3);letter-spacing:.05em}
.chipf{position:absolute;display:flex;align-items:center;gap:8px;z-index:3;background:rgba(20,24,17,.85);
backdrop-filter:blur(8px);border:1px solid var(--rule-dark);border-radius:50px;padding:8px 14px;
font-family:var(--fm);font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--on-dark-2);
box-shadow:var(--e3);animation:floaty 5.5s ease-in-out infinite}
.chipf svg{width:13px;height:13px;color:var(--flame-up)}
.cf1{top:-16px;inset-inline-end:12%;animation-delay:-1s}
.cf2{bottom:16%;inset-inline-start:-18px;animation-delay:-2.8s}
.cf3{bottom:-14px;inset-inline-end:6%;animation-delay:-4.2s}
@keyframes floaty{50%{transform:translateY(-11px)}}
.spinb{position:absolute;left:3%;bottom:26px;width:104px;height:104px;z-index:2;opacity:.9}
.spinb svg{width:100%;height:100%;animation:spin 16s linear infinite}
.spinb text{fill:var(--on-dark-3);font-size:11px;letter-spacing:3px;font-family:var(--fm)}
.spinb .c{position:absolute;inset:0;display:grid;place-items:center;color:var(--flame-up);font-size:18px}
@keyframes spin{to{transform:rotate(360deg)}}
.shint{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:7px;
font-family:var(--fm);font-size:9.5px;letter-spacing:.4em;text-transform:uppercase;color:var(--on-dark-3);z-index:2}
.shint i{width:1px;height:38px;background:var(--rule-dark);position:relative;overflow:hidden}
.shint i::after{content:"";position:absolute;top:-45%;left:0;width:100%;height:45%;background:var(--flame-up);animation:drop 1.7s ease-in-out infinite}
@keyframes drop{to{top:115%}}
/* ============================ sections / cards ============================ */
.sec{padding-block:64px}
.sec.tight{padding-block:40px}
.sechd{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:26px;flex-wrap:wrap}
.sechd h2{font-size:clamp(24px,3.4vw,36px)}
.sechd p{color:var(--ink-2);margin-top:7px;max-width:58ch;font-size:15.5px}
.rule-t{border-block-start:1px solid var(--rule)}
.mask{display:block;overflow:hidden;padding-bottom:.1em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:var(--rl);overflow:hidden;
display:flex;flex-direction:column;position:relative;transform-style:preserve-3d;will-change:transform;transition:border-color .3s var(--ease)}
.card.tiltable:hover{box-shadow:var(--e3);border-color:var(--rule-2)}
.card .art{position:relative;aspect-ratio:4/3;background:var(--veil);display:grid;place-items:center;overflow:hidden;border-block-end:1px solid var(--rule)}
.card .art>svg{width:62%;height:62%;transition:transform .5s var(--sp)}
.card:hover .art>svg{transform:scale(1.09) rotate(-3deg)}
.card .art::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.4) 50%,transparent 62%);
transform:translateX(-120%);transition:transform .75s var(--ease)}
.card:hover .art::after{transform:translateX(120%)}
.card .tags{position:absolute;top:9px;inset-inline-start:9px;display:flex;flex-direction:column;gap:4px;align-items:flex-start;z-index:2}
.card .bd{padding:13px 14px 14px;display:flex;flex-direction:column;flex:1;gap:7px}
.card .br{font-family:var(--fm);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.card h3{font-family:var(--fd);font-size:15px;font-weight:600;line-height:1.22;letter-spacing:-.005em}
body[dir="rtl"] .card h3{font-family:var(--fa)}
.card .spec{font-family:var(--fm);font-size:11.5px;color:var(--ink-3);line-height:1.45}
.card .rate{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-2)}
.stars{display:inline-flex;gap:1px;vertical-align:middle}
.stars svg,.card .rate svg{width:12px;height:12px;color:var(--hold)}
.card .foot{margin-top:auto;padding-top:9px;border-top:1px solid var(--rule);display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.card .price{font-family:var(--fm);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.03em;line-height:1.1}
.card .price small{font-size:11px;font-weight:400;color:var(--ink-3);letter-spacing:0}
.card .was{font-family:var(--fm);font-size:11.5px;color:var(--ink-3);text-decoration:line-through}
.card .fitted{font-family:var(--fm);font-size:10.5px;color:var(--steel);margin-top:2px}
.card .add{width:34px;height:34px;border-radius:var(--r);background:var(--asphalt);color:var(--on-dark);
display:grid;place-items:center;flex-shrink:0;transition:background .2s,transform .25s var(--sp)}
:root[data-theme="dark"] .card .add{background:var(--flame);color:#fff}

body:[['Start with the group size, not the brand','The group size is the physical case dimension and terminal layout. Get it wrong and the battery either will not sit in the tray or the cables will not reach. A Land Cruiser takes an H8, a Camry an H6, a Yaris an H4. Our fitment engine reads this from your model, which is why the verdict appears before the price.'],

function closeLayer(){
const sc=layers.querySelector('.scrim'),bx=layers.querySelector('.drawer,.dialog .box');
if(bx&&window.gsap&&!window.__reduced){
const isDrawer=bx.classList.contains('drawer');
gsap.to(bx,{x:isDrawer?(document.body.dir==='rtl'?-500:500):0,y:isDrawer?0:14,scale:isDrawer?1:.96,opacity:0,duration:.24,ease:'power2.in'});
}
if(sc)sc.classList.remove('in');
setTimeout(()=>{layers.innerHTML='';document.body.style.overflow='';},window.gsap&&!window.__reduced?230:0);
}
function openLayer(html){
layers.innerHTML=html;document.body.style.overflow='hidden';
layers.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeLayer);
const sc=layers.querySelector('.scrim');if(sc){requestAnimationFrame(()=>sc.classList.add('in'));sc.onclick=closeLayer;}
const dr=layers.querySelector('.drawer');
if(dr&&window.gsap&&!window.__reduced)gsap.to(dr,{x:0,duration:.42,ease:'power3.out'});
const bx=layers.querySelector('.dialog .box');
if(bx&&window.gsap&&!window.__reduced)gsap.to(bx,{opacity:1,y:0,scale:1,duration:.4,ease:'back.out(1.6)'});
}

const WMI={'JT':'toyota','JTM':'toyota','5TD':'toyota','JTH':'lexus','JTJ':'lexus','JN1':'nissan','JN8':'nissan',
'1G1':'chevrolet','1GC':'chevrolet','3GN':'chevrolet','1GK':'gmc','1GT':'gmc','1FT':'ford','1FA':'ford','1FM':'ford',
'WDD':'mercedes','WDC':'mercedes','W1K':'mercedes','WBA':'bmw','WBS':'bmw','5UX':'bmw','1HG':'honda','JHM':'honda',
'2HG':'honda','5FN':'honda','KMH':'hyundai','5NP':'hyundai','KNA':'kia','KND':'kia','JA4':'mitsubishi','JMB':'mitsubishi'};
const VIN_YEAR={A:2010,B:2011,C:2012,D:2013,E:2014,F:2015,G:2016,H:2017,J:2018,K:2019,L:2020,M:2021,N:2022,P:2023,R:2024,S:2025,T:2026};
function decodeVin(v){
const s=(v||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
if(s.length<11)return{err:T('A VIN is 17 characters. Keep going.','رقم الهيكل ١٧ خانة. تابع.')};
const mk=WMI[s.slice(0,3)]||WMI[s.slice(0,2)];
const yr=VIN_YEAR[s[9]];
if(!mk)return{err:T('We could not read that WMI. Pick the car instead.','تعذّرت قراءة الرقم. اختر السيارة يدوياً.')};
return{mk,yr:yr||null,vin:s};
}

root.querySelectorAll('[data-add]').forEach(b=>b.onclick=e=>{e.stopPropagation();addToCart(b.dataset.add);});

if(window.gsap&&!window.__reduced&&matchMedia('(pointer:fine)').matches){
root.querySelectorAll('.card.tiltable').forEach(card=>{
if(card._tilted)return;card._tilted=true;
const rx=gsap.quickTo(card,'rotationX',{duration:.5,ease:'power2.out'});
const ry=gsap.quickTo(card,'rotationY',{duration:.5,ease:'power2.out'});
card.addEventListener('mousemove',e=>{
const r=card.getBoundingClientRect();
const px=(e.clientX-r.left)/r.width-.5,py=(e.clientY-r.top)/r.height-.5;
ry(px*8);rx(-py*8);});
card.addEventListener('mouseleave',()=>{rx(0);ry(0);});
});
}
}

if(S.compare.length&&BY_ID[S.compare[0]].dept!==p.dept){S.compare=[];}
S.compare.push(id);}
save();render();
}

function heroCanvas(c){
if(window.__reduced)return;
const ctx=c.getContext('2d');let w,h,parts=[],raf;
const size=()=>{w=c.width=c.offsetWidth*devicePixelRatio;h=c.height=c.offsetHeight*devicePixelRatio;};
size();addEventListener('resize',size);
for(let i=0;i<52;i++)parts.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.7+.4,
vx:(Math.random()-.35)*.28,vy:-Math.random()*.22-.05,a:Math.random()*.5+.15});
const tick=()=>{
if(!document.body.contains(c)){cancelAnimationFrame(raf);return;}
ctx.clearRect(0,0,w,h);
for(const p of parts){
p.x+=p.vx*devicePixelRatio;p.y+=p.vy*devicePixelRatio;
if(p.y<-10){p.y=h+10;p.x=Math.random()*w;}
if(p.x<-10)p.x=w+10;if(p.x>w+10)p.x=-10;
ctx.beginPath();ctx.arc(p.x,p.y,p.r*devicePixelRatio,0,7);
ctx.fillStyle=`rgba(242,116,63,${p.a})`;ctx.fill();
}
raf=requestAnimationFrame(tick);
};
tick();
}

function shopMatches(){

.toLowerCase().replace(/[\s-]/g,'').includes(q));

const rank=p=>(fitOf(p)==='fits'?0:fitOf(p)==='universal'?1:fitOf(p)==='no'?3:2);
if(SHOP.sort==='rel')list.sort((a,b)=>rank(a)-rank(b)||b.rating-a.rating);

['card',T('Visa or Mastercard','فيزا أو ماستركارد'),T('3D Secure.','تحقق ثلاثي.')],
['cod',T('Cash on delivery','الدفع عند الاستلام'),T('KD 1 fee, orders under KD 150.','رسوم ١ د.ك، للطلبات تحت ١٥٠.')]]
.map(([k,t,d])=>`<label class="radio ${CO.pay===k?'on':''}" data-pay="${k}">

<span><strong style="font-size:14.5px">${esc(t)}</strong><br><span style="font-size:13px;color:var(--ink-2)">${esc(d)}</span></span></label>`).join('')}
</div></div>

<div>
<div class="panel" style="position:sticky;top:100px">
<h3 style="font-size:18px;margin-bottom:13px">${esc(T('Order','الطلب'))}</h3>
${S.cart.map(l=>{const p=BY_ID[l.id];if(!p)return'';
return`<div style="display:flex;justify-content:space-between;gap:9px;font-size:13.5px;padding:6px 0">

<span class="num">${kd(p.price*l.qty)}</span></div>`;}).join('')}
<div style="border-top:1px solid var(--rule);margin-top:10px;padding-top:10px">
<div style="display:flex;justify-content:space-between;font-size:14px;padding:3px 0"><span>${esc(T('Parts','القطع'))}</span><span class="num">${kd(sub)}</span></div>
${fit?`<div style="display:flex;justify-content:space-between;font-size:14px;padding:3px 0;color:var(--steel)"><span>${esc(T('Fitting','التركيب'))}</span><span class="num">${kd(fit)}</span></div>`:''}
<div style="display:flex;justify-content:space-between;font-size:14px;padding:3px 0"><span>${esc(T('Delivery','التوصيل'))}</span><span class="num">${del?kd(del):esc(T('Free','مجاني'))}</span></div>
${cod?`<div style="display:flex;justify-content:space-between;font-size:14px;padding:3px 0"><span>${esc(T('COD fee','رسوم الاستلام'))}</span><span class="num">${kd(cod)}</span></div>`:''}
<div style="display:flex;justify-content:space-between;font-weight:700;font-size:20px;padding-top:9px;margin-top:6px;border-top:1px solid var(--rule)">
<span>${esc(T('Total','الإجمالي'))}</span><span class="num">${kd(total)}</span></div>
</div>
<button class="btn btn-p btn-lg" id="co-go" style="width:100%;margin-top:15px">${esc(T('Place order','تأكيد الطلب'))}</button>
<p style="font-size:12px;color:var(--ink-3);margin-top:10px;text-align:center">${esc(T('Fit guaranteed. If it does not fit, we collect it and carry the cost.','ضمان المطابقة. إن لم تناسب نجمعها ونتحمل التكلفة.'))}</p>
</div></div>
</div></div>`;
}
function wireCheckout(){
const g=$('#co-gov');if(g)g.onchange=()=>{CO.gov=g.value;CO.area=GOVS.find(x=>x.id===g.value).areas[0];repaintView();};
const a=$('#co-area');if(a)a.onchange=()=>{CO.area=a.value;};
$$('[data-pay]').forEach(r=>r.onclick=()=>{CO.pay=r.dataset.pay;repaintView();});
const go=$('#co-go');if(go)go.onclick=()=>requireAccount(()=>{
const sub=cartSub(),fit=cartFit(),cod=CO.pay==='cod'?COD_FEE:0;
const del=deliveryFee(sub);
const id='CZ-'+String(90000+Math.floor(Math.random()*9000));
S.orders.unshift({id,date:new Date().toLocaleDateString('en-GB'),total:round3(sub+fit+del+cod),
items:S.cart.map(l=>BY_ID[l.id]?BY_ID[l.id][LANG]:''),veh:S.vehicle?`${S.vehicle.mk}/${S.vehicle.md}`:'',placed:Date.now()});
S.cart=[];save();location.hash='#/track/'+id;
});
}
function viewTrack(id){
const o=S.orders.find(x=>x.id===id)||S.orders[0];
if(!o)return`<div class="wrap"><div class="empty">${I.truck}<p>${esc(T('No order to track.','لا طلب لتتبّعه.'))}</p></div></div>`;
const steps=[T('Confirmed','تم التأكيد'),T('Picked at Shuwaikh','تم التجهيز'),T('Van on the way','الفان في الطريق'),T('Fitted','تم التركيب')];
return`<div class="wrap" style="padding-block:26px">
<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
<span class="chip go">${I.check}${esc(T('Order placed','تم الطلب'))}</span>
<span class="num" style="color:var(--ink-3)">${esc(o.id)}</span></div>
<h1 style="font-size:clamp(26px,4vw,38px);margin-top:10px"><span class="mask"><span class="splitfx">${esc(T('Yousef is on the way','يوسف في الطريق'))}</span></span></h1>
<p style="color:var(--ink-2);margin-top:7px;max-width:60ch">${esc(T('You can see who is coming to your car, and where they are.','ترى من سيأتي إلى سيارتك وأين هو.'))}</p>
<div class="track rv" style="margin-top:20px">
<div class="map">
<svg viewBox="0 0 600 210" preserveAspectRatio="none">
<g stroke="var(--rule-dark)" stroke-width="1">${[...Array(9)].map((_,i)=>`<line x1="${i*70}" y1="0" x2="${i*70}" y2="210"/>`).join('')}
${[...Array(4)].map((_,i)=>`<line x1="0" y1="${i*60}" x2="600" y2="${i*60}"/>`).join('')}</g>
<path class="route" d="M60 170 L180 170 L180 96 L330 96 L330 44 L520 44"/>
<circle class="pin" cx="520" cy="44" r="7" fill="var(--flame)"/>
<circle cx="520" cy="44" r="14" fill="none" stroke="var(--flame)" stroke-width="1.5" opacity=".4"/>
<g class="van" style="offset-path:path('M60 170 L180 170 L180 96 L330 96 L330 44 L520 44')">
<rect x="-11" y="-8" width="22" height="16" rx="3" fill="var(--flame)"/>
<rect x="-7" y="-5" width="7" height="6" rx="1" fill="#0A0C09" opacity=".5"/></g>
</svg>
<div style="position:absolute;bottom:11px;inset-inline-start:13px;font-family:var(--fm);font-size:11px;color:var(--on-dark-2)">
${esc(T('Shuwaikh hub','مركز الشويخ'))} &rarr; ${esc(CO.area)}</div>
</div>
<div class="bd">
<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
<div style="width:46px;height:46px;border-radius:50%;background:var(--flame);color:#fff;display:grid;place-items:center;
font-family:var(--fd);font-weight:700;font-size:18px">Y</div>
<div style="flex:1"><div style="font-family:var(--fd);font-weight:700;font-size:16px">${esc(T('Yousef A.','يوسف ع.'))}</div>
<div style="font-size:13px;color:var(--on-dark-2);display:flex;align-items:center;gap:6px">
<span style="color:var(--hold)">${I.star}</span><span class="num">4.9</span> &#183; ${esc(T('1,240 fittings','١٢٤٠ عملية تركيب'))}</div></div>
<div style="text-align:end"><div class="num" style="font-size:22px;font-weight:600;color:var(--flame-up)" data-count="18">0</div>
<div style="font-size:11.5px;color:var(--on-dark-3)">${esc(T('min away','دقيقة'))}</div></div>
</div>
<div class="steps">${steps.map((s,i)=>`<div class="step ${i<2?'done':i===2?'now':''}">${esc(s)}</div>`).join('')}</div>
</div>
</div>
<div class="panel" style="margin-top:14px">
<h3 style="font-size:16px;margin-bottom:9px">${esc(T('What happens at the car','ماذا يحدث عند السيارة'))}</h3>
<ol style="padding-inline-start:18px;font-size:14px;color:var(--ink-2);display:grid;gap:6px">
<li>${esc(T('Yousef checks the part against your VIN before opening the box.','يتحقق يوسف من القطعة مقابل رقم هيكلك قبل فتح العلبة.'))}</li>
<li>${esc(T('If it is wrong, that is our error. He carries the right one or we return free.','إن كانت خاطئة فهذا خطؤنا، ويجلب البديل أو نُرجعها مجاناً.'))}</li>
<li>${esc(T('Before and after photographs land in your garage record automatically.','صور قبل وبعد تُحفظ في سجل كراجك تلقائياً.'))}</li>
<li>${esc(T('The old part is taken away for recycling at no charge.','تُؤخذ القطعة القديمة للتدوير مجاناً.'))}</li>
</ol>
<a href="#/account" class="btn btn-o btn-sm" style="margin-top:13px">${esc(T('All orders','كل الطلبات'))}</a>
</div></div>`;
}
</script>
<script>
/* ============================ router + base motion (no gsap needed) ============================ */
const VIEWS={home:viewHome,shop:viewShop,product:viewProduct,compare:viewCompare,service:viewService,
garage:viewGarage,account:viewAccount,help:viewHelp,checkout:viewCheckout,track:viewTrack,bundles:viewBundles,guides:viewGuides,guide:viewGuide};
window.__reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function parseRoute(){
const h=(location.hash||'#/').split('?')[0];
const seg=h.replace(/^#\//,'').split('/').filter(Boolean);
if(!seg.length)return{v:'home'};
if(seg[0]==='p')return{v:'product',a:seg[1]};
if(seg[0]==='track')return{v:'track',a:decodeURIComponent(seg[1]||'')};
if(seg[0]==='guide')return{v:'guide',a:seg[1]};
return{v:VIEWS[seg[0]]?seg[0]:'home',a:seg[1]};
}
function paintHeader(){const t=$('#top');if(t){t.outerHTML=header();wireHeader();}}
function paintTray(){const old=$('.tray');if(old)old.remove();
const h=compareTray();if(h){document.body.insertAdjacentHTML('beforeend',h);wireTray();}}
function wireTray(){
$$('[data-uncmp]').forEach(b=>b.onclick=()=>toggleCompare(b.dataset.uncmp));
const c=$('[data-clearcmp]');if(c)c.onclick=()=>{S.compare=[];save();render();};
}
function wireHeader(){
$$('[data-act]').forEach(b=>b.onclick=()=>{
const a=b.dataset.act;
if(a==='cart')cartDrawer();
if(a==='account')S.account?location.hash='#/account':accountDialog();
if(a==='pickcar')vehicleDialog();
if(a==='search'){location.hash='#/shop';setTimeout(()=>{const q=$('#f-q');if(q)q.focus();},120);}
if(a==='clearcar'){S.vehicle=null;save();render();toast(T('Car cleared','تمت الإزالة'));}
if(a==='theme'){const next=document.documentElement.getAttribute('data-theme')==='light'?'dark':'light';
document.documentElement.setAttribute('data-theme',next);S.theme=next;save();render();}
if(a==='lang'){LANG=LANG==='en'?'ar':'en';S.lang=LANG;save();
document.body.dir=LANG==='ar'?'rtl':'ltr';render();}
});
}
function repaintView(){const r=parseRoute();const m=$('#main');
if(m){m.innerHTML=VIEWS[r.v](r.a);wireView(r);wireCards(m);observeReveals();countUp();}}
function wireView(r){
if(r.v==='home')wireHome();
if(r.v==='shop')wireShop();
if(r.v==='product')wireProduct(r.a);
if(r.v==='checkout')wireCheckout();
if(r.v==='service'||r.v==='bundles')$$('[data-book]').forEach(b=>b.onclick=()=>bookDialog(b.dataset.book));
if(r.v==='help'){runWA();const g=$('#wa-replay');if(g)g.onclick=runWA;
const pg=$('#ph-go');if(pg)pg.onclick=runPhoto;}
if(r.v==='garage'){
$$('[data-usecar]').forEach(b=>b.onclick=()=>{const g=S.garage[+b.dataset.usecar];S.vehicle={mk:g.mk,md:g.md,yr:g.yr,plate:g.plate};save();render();});
$$('[data-rmcar]').forEach(b=>b.onclick=()=>{S.garage.splice(+b.dataset.rmcar,1);save();render();});}
if(r.v==='account'){const so=$('[data-signout]');if(so)so.onclick=()=>{
S.account=null;save();render();toast(T('Signed out','تم الخروج'));};}
$$('[data-uncmp]').forEach(b=>b.onclick=()=>toggleCompare(b.dataset.uncmp));
}
/* reveals + counters: plain JS, always available */
let IO;
function observeReveals(){
if(window.__reduced){$$('.rv,.stagger').forEach(e=>e.classList.add('in'));return;}
IO=IO||new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');IO.unobserve(e.target);}}),
{threshold:0,rootMargin:'0px 0px -60px'});
$$('.rv:not(.in),.stagger:not(.in)').forEach(e=>IO.observe(e));
}
function countUp(){
$$('[data-count]').forEach(el=>{
if(el._done)return;el._done=true;
const to=+el.dataset.count;
if(window.__reduced){el.textContent=to.toLocaleString();return;}
const io=new IntersectionObserver(es=>{
es.forEach(en=>{if(!en.isIntersecting)return;io.disconnect();
let t0=null;
const step=ts=>{t0=t0||ts;const k=Math.min(1,(ts-t0)/900);
el.textContent=Math.round(to*(1-Math.pow(1-k,3))).toLocaleString();
if(k<1)requestAnimationFrame(step);};
requestAnimationFrame(step);});
},{threshold:.4});
io.observe(el);
});
}
/* hook for the gsap enhancement layer */
function afterRender(){if(typeof window.__fx==='function'){try{window.__fx();}catch(e){}}}
function render(){
const r=parseRoute();
document.body.dir=LANG==='ar'?'rtl':'ltr';
app.innerHTML=header()+`<main id="main" class="viewwrap">${VIEWS[r.v](r.a)}</main>`+footer();
wireHeader();wireView(r);wireCards(app);paintTray();observeReveals();countUp();afterRender();
window.scrollTo(0,0);
}
/* button glow origin */
document.addEventListener('pointermove',e=>{
const b=e.target.closest&&e.target.closest('.btn');if(!b)return;
const r=b.getBoundingClientRect();
b.style.setProperty('--mx',((e.clientX-r.left)/r.width*100)+'%');
b.style.setProperty('--my',((e.clientY-r.top)/r.height*100)+'%');
},{passive:true});
/* progress + header hide: plain JS */
let lastY=0;
addEventListener('scroll',()=>{
const t=$('#top');if(t){t.classList.toggle('stuck',scrollY>8);
if(scrollY>160&&scrollY>lastY)t.classList.add('hid');else t.classList.remove('hid');}
lastY=scrollY;
const h=document.documentElement.scrollHeight-innerHeight;
const p=$('#prog');if(p)p.style.width=(h>0?scrollY/h*100:0)+'%';
},{passive:true});
addEventListener('hashchange',()=>{closeLayer();render();});
addEventListener('keydown',e=>{if(e.key==='Escape')closeLayer();});
/* SAFETY NET: the page must never stay stuck on the preloader */
window.__bootFallback=setTimeout(()=>{const p=document.getElementById('pre');if(p&&document.body.contains(p))p.remove();},4500);
/* FIRST PAINT happens here, regardless of what animation libraries do next */
render();
</script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script>
/* ============================ enhancement layer (gsap optional) ============================ */
(function(){
"use strict";
const pre=document.getElementById('pre');
const killPre=()=>{clearTimeout(window.__bootFallback);if(pre&&document.body.contains(pre))pre.remove();};
if(!window.gsap||window.__reduced){killPre();return;}
try{gsap.registerPlugin(window.ScrollTrigger);}catch(e){}
/* split text */
function splitAll(){
$$('.splitch:not(.split-done)').forEach(el=>{
el.classList.add('split-done');
const txt=el.textContent;el.textContent='';
[...txt].forEach(c=>{
const s=document.createElement('span');s.className='ch';
s.innerHTML=c===' '?'&nbsp;':c;el.appendChild(s);});
});
$$('.splitfx.split-done:not(.sfx-anim)').forEach(el=>{
el.classList.add('sfx-anim');
const txt=el.textContent;el.textContent='';
[...txt].forEach(c=>{
const s=document.createElement('span');s.className='ch';
s.style.display='inline-block';
s.innerHTML=c===' '?'&nbsp;':c;el.appendChild(s);});
if(!window.ScrollTrigger)return;
gsap.set(el.querySelectorAll('.ch'),{yPercent:115});
ScrollTrigger.create({trigger:el,start:'top 88%',once:true,onEnter:()=>{
gsap.to(el.querySelectorAll('.ch'),{yPercent:0,duration:.85,ease:'power4.out',stagger:.024});}});
});
}
window.__fx=splitAll;
splitAll();
/* hero intro */
function heroTilt(){
if(!matchMedia('(pointer:fine)').matches)return;
const c=$('#heroConsole');if(!c||c._done)return;c._done=true;
const rx=gsap.quickTo(c,'rotationX',{duration:.6,ease:'power2.out'});
const ry=gsap.quickTo(c,'rotationY',{duration:.6,ease:'power2.out'});
const hero=document.querySelector('.hero');if(!hero)return;
hero.addEventListener('mousemove',e=>{
const r=hero.getBoundingClientRect();
const px=(e.clientX-r.left)/r.width-.5,py=(e.clientY-r.top)/r.height-.5;
ry(px*7);rx(-py*7);});
hero.addEventListener('mouseleave',()=>{rx(0);ry(0);});
}
function heroIntro(){
heroTilt();
if(!document.querySelector('.hero'))return;
const tl=gsap.timeline({defaults:{ease:'power4.out'}});
gsap.set('.hero h1 .ch',{yPercent:120,opacity:0});
gsap.set(['#hEyebrow','#hDek','#hCta','#hProof'],{y:26,autoAlpha:0});
gsap.set('.console-w',{x:60,autoAlpha:0});
gsap.set('.chipf',{y:16,autoAlpha:0});
gsap.set('.spinb',{autoAlpha:0,scale:.6});
tl.from('header.top',{y:-70,autoAlpha:0,duration:.8},0)
.to('#hEyebrow',{y:0,autoAlpha:1,duration:.7},.15)
.to('.hero h1 .ch',{yPercent:0,opacity:1,duration:1.05,stagger:.03},.25)
.to('#hDek',{y:0,autoAlpha:1,duration:.7},'-=.55')
.to('#hCta',{y:0,autoAlpha:1,duration:.7},'-=.5')
.to('#hProof',{y:0,autoAlpha:1,duration:.7},'-=.45')
.to('.console-w',{x:0,autoAlpha:1,duration:1,ease:'power3.out'},.4)
.to('.chipf',{y:0,autoAlpha:1,duration:.6,stagger:.12},'-=.5')
.to('.spinb',{autoAlpha:1,scale:1,duration:.7,ease:'back.out(2)'},'-=.4');
countUp();
}
/* magnetic buttons */
if(matchMedia('(pointer:fine)').matches){
document.addEventListener('pointermove',e=>{
const b=e.target.closest&&e.target.closest('.btn.magnetic');if(!b)return;
const r=b.getBoundingClientRect();
const dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);
if(Math.abs(dx)<r.width&&Math.abs(dy)<r.height)
gsap.to(b,{x:dx*.18,y:dy*.22,duration:.4,ease:'power2.out',overwrite:'auto'});
},{passive:true});
document.addEventListener('pointerout',e=>{
const b=e.target.closest&&e.target.closest('.btn.magnetic');
if(b&&!b.matches(':hover'))gsap.to(b,{x:0,y:0,duration:.5,ease:'elastic.out(1,.5)',overwrite:'auto'});
},{passive:true});
/* custom cursor */
const dot=$('#cursorDot'),ring=$('#cursorRing');
if(dot&&ring){
const dx=gsap.quickTo(dot,'x',{duration:.08}),dy=gsap.quickTo(dot,'y',{duration:.08});
const rx2=gsap.quickTo(ring,'x',{duration:.3,ease:'power2.out'}),ry2=gsap.quickTo(ring,'y',{duration:.3,ease:'power2.out'});
addEventListener('mousemove',e=>{dx(e.clientX);dy(e.clientY);rx2(e.clientX);ry2(e.clientY);});
document.addEventListener('mouseover',e=>{
const hot=e.target.closest&&e.target.closest('a,button,select,input,label,.card');
ring.classList.toggle('big',!!hot);});
}
}
/* preloader: animate, then lift. If anything throws, the fallback timer still frees the page. */
try{
gsap.set('#pre .pb',{opacity:0,x:-16});
gsap.to('#pre .pb',{opacity:1,x:0,duration:.5,stagger:.12,ease:'power3.out',delay:.1});
gsap.to('.pre-name',{opacity:1,duration:.4,delay:.2});
const o={v:0};
gsap.to(o,{v:100,duration:1.4,ease:'power2.inOut',delay:.2,
onUpdate:()=>{
const b=$('#preBar'),p=$('#prePct');
if(b)b.style.width=o.v+'%';
if(p)p.textContent=Math.round(o.v)+'%';
},
onComplete:()=>{
gsap.to(pre,{yPercent:-100,duration:.8,ease:'power4.inOut',
onComplete:()=>{killPre();heroIntro();}});
}});
}catch(e){killPre();heroIntro();}
})();
</script>
</body>
</html>
