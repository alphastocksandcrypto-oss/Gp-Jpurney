      h += '<div class="card"><div class="card-head"><h2>Your ladder in full</h2>' +
        '<span class="aside">' + esc(scopeBox().stage) + "</span></div>" +
        trailHTML(trailFor(S.specialty));

      h += '<div class="row" style="margin-top:12px;border-top:1px solid var(--line);padding-top:12px">' +

        (t.holding

      if (rsit.stillApplying){

        h += '<div class="card"><div class="card-head"><h3>' + esc(S.specialty) + "</h3>" +

      if (step){

      }

      if (yearBeats()) h += yearShapeCard();

          others.map(function(o){
            var c = CYCLE[o.body] || CYCLE.RCPI, d = until(c.apply);
            var k = d < 0 ? "mute" : (d <= 21 ? "crit" : (d <= 60 ? "warn" : "good"));
            return '<div class="row"><span class="t">' + esc(o.name) + "<small>" + esc(o.exam) + " via " + esc(o.body) + "</small></span>" +
              '<span class="r"><span class="chip mute">' + esc(o.body) + '</span><span class="chip ' + k + '">' +
              (d < 0 ? "Closed" : awayText(d) + " to apply") + "</span></span></div>";
          }).join("") +
          '<p class="lede" style="margin-top:10px">Illustrative application windows for these, not the published dates each college sets. ' +
          "This route stays your main one everywhere else on the dashboard. " + '<a href="#/deadlines">See the full dates</a>.</p></div>';
      }
      return h;
    }
  };

  /* ================= GAP ANALYSIS =================
     Three pages became one, and not for tidiness. Readiness, Shortlisting
     score and the old Gap analyser were one table (DOMAINS) rendered three
     times by hand, and the three renderings drifted: the gap page's tier list
     named five domain ids and omitted "exams", so a doctor holding no MRCPI
     stage at all, eight points down, was told "No gaps left" by the page whose
     whole job is completeness, while the summary beneath it said the opposite.

     The fix is structural. Nothing here hand-lists domains: it iterates
     DOMAINS and orders by points at stake, so a domain cannot be dropped
     again, and the page finally does what its subtitle always promised. */
  /* Which application the gap analysis is scoring. Links rather than buttons,
     for the same reason the tracker's cards are: this is navigation, and it
     should be linkable and survive the back button. Selecting one also sets
     what the tracker opens, so the two pages never disagree about which
     application the doctor is working on. */
  function gapSwitch(progs, cur){
    if (!progs.length || progs.length < 2 || !cur) return "";
    return '<div class="prep-head"><div class="seg" role="tablist" aria-label="Application scored">' +
      progs.map(function(x){
        var on = x.id === cur.id;
        return '<a role="tab" aria-selected="' + on + '" href="#/gaps/' + encodeURIComponent(x.id) + '">' +
          esc(x.t) + "</a>";
      }).join("") + "</div></div>";
  }

  function domOrder(prog){
    return DOMAINS.slice().sort(function(a, b){
      var d = (b.maxPts - b.pts(prog)) - (a.maxPts - a.pts(prog));
      return d !== 0 ? d : b.weight - a.weight;
    });
  }

  /* the personal deadline for a domain, if it has one. Was a two-entry lookup
     table, so four of six domains could never show a date however close. */
  function dueForDomain(id){
    return deadlines().filter(function(d){
      return d.kind === "personal" && d.domain === id && !d.done;
    })[0] || null;
  }

  /* a small line, not a chart: the trend only has to say "moving, and which
     way". Drawn from the real log, so a flat record draws nothing. */
  function spark(points, w, h){
    if (!points || points.length < 3) return "";
    var max = scoreMax(), step = w / (points.length - 1);
    var pts = points.map(function(v, i){
      return (i * step).toFixed(1) + "," + (h - (v / max) * h).toFixed(1);
    }).join(" ");
    return '<svg class="spark" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + " " + h +
      '" fill="none" aria-hidden="true"><polyline points="' + pts +
      '" stroke="var(--mint)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }

  VIEWS.gaps = {
    title:"Gap analysis", sub:"What is missing, what it costs you, and what closes it.",
    render:function(){
      var gsit = situation(), gstep = nextStep();
      /* WHICH application this scores. The page used to answer for the record's
         primary route whatever else the doctor tracked, against that route's
         closing date, without ever saying so -- a doctor tracking a GP scheme
         beside Cardiology was scored on MRCPI stages for both. */
      var gp = gapProg(), gprogs = progsTracked();
      var gc = gp ? cycleForProg(gp) : gsit.cycle;
      var gcollege = gp ? gp.body : gsit.college;
      var pts = scorePts(gp), max = scoreMax(), ready = readiness(gp);
      var owed = max - pts, scoredPct = Math.round(pts / max * 100);
      var elig = cycleEligibility();
      var tr = scoreTrend();

      /* a percentage is a verdict unless you say what it is measured against */
      var h = (elig && !elig.eligible)
        ? ctx("Measured against the " + elig.targetCycle + " intake, which is the one you are building for. " +
            "A low figure this far out is what building looks like, not a result.")
        : "";

      /* ---- which application, when there is more than one ---- */
      h += gapSwitch(gprogs, gp);

      /* ---- eligibility, before scoring. A weak portfolio scores badly; a
         missing eligibility requirement stops the application whatever the
         portfolio looks like, and those are different problems. This reads
         the same checklist the application tracker does, so it can never
         disagree with it, and it costs one line rather than a duplicated
         page. */
      var blockers = eligibilityBlockers(gp);
      if (gp){
        h += '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px">' +
          '<span class="chip ' + (blockers.length ? "warn" : "good") + '">' +
          ico(blockers.length ? I.warn : I.tick, 12) +
          (blockers.length
            ? blockers.length + (blockers.length === 1 ? " eligibility issue" : " eligibility issues")
            : "No application blockers") + "</span>" +
          (blockers.length
            ? '<a class="btn-link" style="display:inline-flex;align-items:center;min-height:24px" href="#/progress/' +
              encodeURIComponent(gp.id) + '">View on the application tracker</a>'
            : "") + "</div>";
      }

      /* ---- the two measures, which have never been in one viewport ---- */
      h += '<p class="sec-label">Where you stand' +
        (gp ? ' <span class="g-count">\u00b7 ' + esc(gp.t) + "</span>" : "") + "</p>";
      h += '<div class="heads">';
      h += '<div class="card"><div class="ring-wrap">' + ring(ready, "assembled") +
        '<div><h2 style="font-size:16px;color:var(--deep)">' + ready + "% assembled</h2>" +
        '<p class="lede" style="margin-top:6px">Weighted across ' + DOMAINS.length +
        " domains, and it counts part-finished work.</p></div></div></div>";
      h += '<div class="card"><div class="ring-wrap">' + ring(scoredPct, "scored") +
        '<div><h2 style="font-size:16px;color:var(--deep)">' + pts + " of " + max + " points</h2>" +
        '<p class="lede" style="margin-top:6px">Colleges score in bands, so part-finished work scores nothing.</p>' +
        (tr
          ? '<p class="trend' + (tr.delta > 0 ? " up" : tr.delta < 0 ? " down" : "") + '">' +
            spark(tr.points, 64, 20) + "<span>" +
            (tr.delta > 0 ? "Up " + tr.delta + (tr.delta === 1 ? " point" : " points")
              : tr.delta < 0 ? "Down " + Math.abs(tr.delta) + (tr.delta === -1 ? " point" : " points")
              : "No change") + " since " + fmtLong(new Date(tr.since).toISOString().slice(0, 10)) + "</span></p>"
          : '<p class="trend quiet"><span>Tracking from today. Anything you mark complete moves this.</span></p>') +
        "</div></div></div>";
      h += "</div>";

      /* ---- the card that could not exist while these were two pages ---- */
      var worst = domOrder(gp).filter(function(d){
        return d.maxPts - d.pts(gp) > 0 && d.ready(gp) - Math.round(d.pts(gp) / d.maxPts * 100) >= 15;
      })[0];
      if (owed > 0){
        h += '<div class="card lead" style="margin-top:14px"><div class="card-head">' +
          "<h2>" + owed + (owed === 1 ? " point" : " points") + " still on the table</h2>" +
          '<span class="aside">' + ready + "% assembled, " + scoredPct + "% scored</span></div>";
        h += '<p class="lede" style="max-width:70ch">You read as ' + ready + "% assembled and score " +
          scoredPct + "%" + (worst
            ? ", and the difference is work that is started but not finished. <b>" + esc(worst.name) +
              "</b> is the clearest case: " + worst.ready(gp) + "% assembled, " + worst.pts(gp) + " of " +
              worst.maxPts + " scored, because " + esc(worst.bands.toLowerCase()) + "."
            : ".") + "</p></div>";
      } else {
        h += '<div class="card lead" style="margin-top:14px"><div class="card-head">' +
          "<h2>Nothing left on the table</h2>" +
          '<span class="chip good">' + ico(I.tick, 12) + "Maximum score</span></div>" +
          '<p class="lede">Every domain is at its maximum against the criteria modelled here. Keep the ' +
          "evidence dated and uploaded before the window closes.</p></div>";
      }

      /* ---- what to actually do, ranked. This is the answer the page used to
         bury one level down: the card above explains WHY the two numbers
         disagree, this says what closes the gap, in order of what gains the
         most. Every entry comes from levers(), which now reads DOMAINS
         directly, so a row here can never contradict the domain it belongs
         to further down the page -- the exact drift that let this list
         recommend a leadership course while the exams domain sat at 0 of 8,
         untouched, because the two used to be written by hand in two places. */
      var topLevers = levers(gp).slice(0, 3);
      if (topLevers.length){
        h += '<p class="sec-label">Your best next moves</p>';
        h += topLevers.map(function(lv, i){
          return '<div class="gap-item" data-domain="' + esc(lv.domain) + '"><div class="gap-top"><b>' +
            (i + 1) + ". " + esc(lv.t) + "</b>" +
            '<span class="r"><span class="chip ' + (i === 0 ? "warn" : "mute") + '">' + ico(I.bolt, 11) +
              "+" + lv.pts + (lv.pts === 1 ? " point" : " points") + "</span></span></div>" +
            '<p class="gap-meta">' + esc(lv.why) + ".</p>" +
            '<div class="gap-acts">' + leverBtn(lv, i === 0) + "</div></div>";
        }).join("");
        h += '<p class="lede" style="margin:8px 0 0"><a class="btn-link" ' +
          'style="display:inline-flex;align-items:center;min-height:24px" href="#/opportunities">' +
          "Everything that closes a gap</a></p>";
      }

      /* ---- the rule the whole page is governed by ---- */
      if (gc && gstep && gstep.usesCycle && until(gc.apply) >= 0){
        var left = until(gc.apply);
        h += '<div class="card" style="margin-top:14px"><div class="card-head">' +
          "<h2>All of it has to be dated before " + fmtLong(gc.apply) + "</h2>" +
          '<span class="aside">' + awayText(left) + "</span></div>" +
          '<p class="lede" style="max-width:66ch">Anything dated after that will not appear on this ' +
          "application, however good it is. That is the deadline for every row below, whatever else each " +
          "of them needs.</p>" +
          ctxFoot("This closing date is illustrative in this prototype. Confirm it against " + gcollege +
            "'s published date before you plan around it.") + "</div>";
      }

      /* ---- domain by domain, open gaps first, maxed ones collapsed ----
         Six cards of near-identical visual weight forced a doctor to do their
         own triage every visit: which of these still needs me. Splitting on
         the same owed-points test domOrder already sorts by means a domain at
         its maximum never competes with one still open for the same amount
         of space, and it costs nothing extra to compute -- domOrder(gp)
         already puts them in this order, this just draws the line. */
      var allDoms = domOrder(gp);
      var openDoms = allDoms.filter(function(d){ return d.maxPts - d.pts(gp) > 0; });
      var doneDoms = allDoms.filter(function(d){ return d.maxPts - d.pts(gp) === 0; });
      h += '<p class="sec-label">Domain by domain</p>';
      if (openDoms.length && doneDoms.length){
        h += openDoms.map(function(d){ return domainRow(d, gp); }).join("");
        h += '<button class="btn-link" data-act="toggleDoneDomains" style="margin:12px 0 4px">' +
          (S.showDoneDomains ? "Hide" : "Show") + " " + doneDoms.length +
          (doneDoms.length === 1 ? " domain" : " domains") + " already at maximum " +
          (S.showDoneDomains ? "▴" : "▾") + "</button>";
        if (S.showDoneDomains) h += doneDoms.map(function(d){ return domainRow(d, gp); }).join("");
      } else {
        h += allDoms.map(function(d){ return domainRow(d, gp); }).join("");
      }

      /* This used to be an apology: "do not read this figure as covering both".
         The figure IS one application's now, so the note says what carries
         across instead -- five of six domains are facts about the doctor and
         count everywhere, and the sixth is the one that does not. */
      if (gprogs.length > 1 && gp){
        var shared = DOMAINS.filter(function(d){ return d.shared; }).length;
        h += ctxFoot("Scored for " + gp.t + " via " + gcollege + ". " + shared + " of " + DOMAINS.length +
          " domains are facts about you and count for every application you track; exams and membership " +
          "is the exception, because " + gp.t + " asks for " +
          (entryFamilyFor(gp.specialty) || "its own exam") + " and holding a stage of one says nothing " +
          "about the other. Weights and bands are the same model for both and are illustrative either way.");
      }

      /* this application's interview, not the primary route's. deadlines() is
         the primary route's list, so reading iview from it showed a GP
         applicant the RCPI interview date on a page scoring GP. */
      var ivIso = gc ? gc.interview : null, ivDays = ivIso ? until(ivIso) : null;
      if (ivIso && ivDays >= 0 && gstep && gstep.usesCycle){
        h += '<div class="card" style="margin-top:14px"><div class="card-head"><h2>These score again at interview</h2>' +
          '<span class="aside">' + awayText(ivDays) + "</span></div>" +
          '<p class="lede" style="max-width:66ch">The interview scores the same domains as the portfolio, so ' +
          "nothing you close now is wasted on it.</p>" +
          '<div style="margin-top:12px"><a class="btn btn-sm btn-ghost" href="#/interviews">Open interview prep</a></div></div>';
      }

      h += ctxFoot("Domain weights and scoring bands are illustrative in this prototype and are not " +
        gcollege + "'s published criteria. Confirm them before you plan around them.");
      return h;
    }
  };

  /* one row, both measures, and the reason they disagree where they do */
  function domainRow(d, prog){
    var got = d.pts(prog), owed = d.maxPts - got, rd = d.ready(prog);
    var scoredPct = Math.round(got / d.maxPts * 100), drift = rd - scoredPct;
    var due = dueForDomain(d.id);
    var note = (S.domainNotes || {})[d.id] || "";

    /* a doctor tracking two applications needs to know which rows carry across
       and which do not, in the row itself rather than in a footnote */
    var many = progsTracked().length > 1;
    var h = '<div class="dom' + (owed === 0 ? " clear" : "") + '" data-domain="' + esc(d.id) +
      '"><div class="dom-h"><b>' + esc(d.name) + "</b>" +
      (many ? '<span class="chip sm ' + (d.shared ? "mute" : "good") + '">' +
        (d.shared ? "Counts for both" : "This application only") + "</span>" : "") +
      '<span class="dom-w">weight ' + d.weight + "%</span>" +
      (due ? chip({k: due.days <= 21 ? "crit" : "warn", icon:I.clock,
                   label:"Due " + fmt(due.iso) + ", " + awayText(due.days)}) : "") +
      '<span class="r">' + (owed === 0
        ? '<span class="chip good">' + ico(I.tick, 12) + got + "/" + d.maxPts + "</span>"
        : '<span class="chip ' + (got === 0 ? "crit" : "warn") + '">' + ico(I.bolt, 11) + owed +
          (owed === 1 ? " point" : " points") + "</span>") + "</span></div>";

    h += '<div class="dom-bars">' +
      '<span class="bl">Assembled</span><div class="bar sm"><i style="width:' + rd + '%"></i></div>' +
      '<span class="bv num">' + rd + "%</span>" +
      '<span class="bl">Scores</span><div class="bar sm band"><i style="width:' + scoredPct + '%"></i></div>' +
      '<span class="bv num">' + got + "/" + d.maxPts + "</span></div>";

    h += '<p class="dom-n">' + esc(d.note(prog)) + ' <span class="muted">· ' + esc(d.bands) + "</span></p>";

    /* the explanation earns its space only where the two measures actually
       disagree. Printed on every row it would be wallpaper. */
    if (drift >= 15 && owed > 0){
      h += '<p class="dom-why">' + ico(I.warn, 13) + "<span>Part-finished work is assembled but unscored here. " +
        esc(d.bands.charAt(0).toUpperCase() + d.bands.slice(1)) + ".</span></p>";
    }

    if (note){
      h += '<p class="dom-note">' + ico(I.flag, 12) + "<span>" + esc(note) + "</span>" +
        '<button class="btn-link" data-note="' + d.id + '">Edit</button>' +
        '<button class="btn-link" data-note-clear="' + d.id + '">Clear</button></p>';
    }

    h += '<div class="dom-a">' + gapActions(d.id, prog) +
      (note ? "" : '<button class="btn btn-sm btn-ghost" data-note="' + d.id + '">Add a note</button>') +
      "</div></div>";
    return h;
  }

  /* the two removed pages keep working as routes. Links live all over the app
     and in whatever a doctor has bookmarked, and a merge is not a reason to
     break either. */
  function gapActions(id, prog){
    if (id === "exams"){
      /* the exam this APPLICATION wants. Reading situation().exam here put an
         "MRCPI prep" button directly under the words "0 of 2 ICGP entry stages
         held" -- the row had been fixed and its own action had not. */
      var gx = (prog && entryFamilyFor(prog.specialty)) || situation().exam || "membership";
      return '<a class="btn btn-sm btn-primary" href="#/exams">' + esc(gx) + " prep</a>" +
        '<a class="btn btn-sm btn-ghost" href="#/deadlines">Sitting dates</a>';
    }
    if (id === "auditqi") return actBtn("finishQI", "Mark QI project complete", true) +
      '<a class="btn btn-sm btn-ghost" href="#/opportunities">Find a QI course</a>';
    if (id === "teaching") return actBtn("logTeaching", "Log a session", true) +
      '<a class="btn btn-sm btn-ghost" href="#/opportunities">Find teaching opportunities</a>';
    if (id === "research") return actBtn("addResearch", "Record an output", true);
    if (id === "leadership") return actBtn("doLeadership", "Mark course complete", true);
    return '<span class="lede">Accrues with time in post. Nothing to do.</span>';
  }

  VIEWS.readiness = VIEWS.gaps;
  VIEWS.score = VIEWS.gaps;

  /* Deadlines merged into the Application tracker. The route still resolves —
     links all over the app and whatever a doctor has bookmarked point at it —
     and lands on the tab that holds the calendar. */
  /* Deadlines is gone as a page and kept as a route. Every link across the
     app and whatever a doctor has bookmarked still resolves; it lands on the
     tracker, on the tab that holds the calendar. The old body is deleted
     rather than left behind: two renderers of one list is how the two pages
     drifted apart in the first place. */
  VIEWS.deadlines = null;   /* assigned below, once VIEWS.progress exists */

  /* ================= APPLICATION TRACKER =================
     Was the Progress tracker, whose milestones became the roadmap ladder and
     whose portfolio items became Gap analysis. What was left was a page of
     other pages' content.

     It answers a question nothing else did: am I actually able to apply. The
     Gap analysis page scores a portfolio; this one tracks the paperwork, and
     they fail differently. A weak portfolio scores badly. A missing Garda
     vetting stops the application dead however good the portfolio is. */
  /* ================= APPLICATION TRACKER =================
     Was the Progress tracker, whose milestones became the roadmap ladder and
     whose portfolio items became Gap analysis.

     It answers a question nothing else does: am I actually able to apply, and
     what happens after I do. Gap analysis scores a portfolio; this tracks the
     paperwork and the calendar, and they fail differently. A weak portfolio
     scores badly. A missing Garda vetting delays a start date.

     Two rules. Nothing is asked for twice: wherever the record knows the
     answer the item derives it. And nothing sends the doctor away to do a
     thing they could do here: an item that can be acted on carries the action,
     with the fuller page as a second option rather than the only one. */
  /* ================= THE MERGE =================
     Deadlines and the Application tracker were one thing rendered twice.
     phaseMilestones() already called deadlines() and filtered it into each
     phase, so the tracker was a consumer of the deadlines list -- the dates
     were the work's schedule, kept on a separate page.

     One page, two tabs. "This application" is the tracker with its dates in
     place; "All dates" is the calendar, widened from the primary route to
     every programme tracked. Neither tab computes whether the remaining work
     fits the remaining time: the dates are known placeholders, and telling a
     doctor to give up on points they could still earn is the wrong way to be
     wrong. */
  function trackTabs(){
    /* the count matches the rows, so it counts grouped dates not raw ones */
    var dates = datesGrouped(allDates().filter(function(d){ return d.days >= 0; })).length;
    var on = S.trackTab === "dates";
    return '<div class="prep-head"><div class="seg" role="tablist" aria-label="Tracker view">' +
      '<button role="tab" aria-selected="' + (!on) + '" aria-controls="trackPanel" ' +
        'data-track-tab="app">Programmes<span class="n">' + progsTracked().length + "</span></button>" +
      '<button role="tab" aria-selected="' + on + '" aria-controls="trackPanel" ' +
        'data-track-tab="dates">All dates<span class="n">' + dates + '</span></button>' +
      "</div></div>";
  }

  /* the header line both tabs share: a count and a date, never a verdict */
  function trackStats(prog){
    var pr = prog ? checkProgress(prog.id) : {done:0, total:0};
    var next = allDates().filter(function(d){ return d.days >= 0; })[0] || null;
    var cyc = cycleForProg(prog);
    var phase = prog ? PHASES.filter(function(x){
      return x.id === (PHASES.filter(function(y){ return y.id === S.trackPhase; })[0]
        ? S.trackPhase : currentPhase(cyc));
    })[0] : null;
    return '<div class="tstat">' +
      '<div><span class="k">Outstanding</span><span class="v num">' +
        (pr.total - pr.done) + " of " + pr.total + '</span>' +
        '<span class="d">Requirements not yet ready</span></div>' +
      '<div><span class="k">Next date</span><span class="v num">' +
        (next ? esc(fmtLong(next.iso)) : "None") + '</span><span class="d">' +
        (next ? esc(next.t) + " \u00b7 " + esc(awayText(next.days)) : "Nothing open") +
        "</span></div>" +
      '<div><span class="k">Stage</span><span class="v">' +
        (phase ? esc(phase.t) : "\u2014") + '</span><span class="d">' +
        (phase && cyc ? esc(phaseLabel(phase.id, cyc)) : "No cycle held") + "</span></div></div>";
  }

  /* The tracked programmes, as the cards from the picker. Concept D's top half
     is the switcher: a doctor picking between two applications is picking
     between two programmes, and the thin pills said neither the closing date
     nor how ready each one was -- the two things that decide which to look at
     first. The whole card is the control, so the target is the card, not a
     word inside it. */
  function trackCard(x, on, primary){
    var cyc = cycleForProg(x), pr = checkProgress(x.id), d = cyc ? until(cyc.apply) : null;
    var meta = [x.fam || x.body];
    /* the long form, matching the stats bar directly above it: a card that
       says "closes 8 Nov" beside a header saying "8 Nov 2026" makes the
       reader check whether they are the same date */
    if (d !== null && d >= 0) meta.push("closes " + fmtLong(cyc.apply));
    meta.push(pr.done + " of " + pr.total + " ready");
    /* an anchor, not a tab: this OPENS the application rather than switching a
       panel on the page, so it has to be linkable, middle-clickable and
       reachable by the back button like any other navigation */
    return '<a class="pc pcsw ' + specClass(x.grp) + (on ? " lead on" : "") +
      '" href="#/progress/' + encodeURIComponent(x.id) + '">' +
      '<span class="pc-band" aria-hidden="true"></span><span class="pc-b">' +
      '<span class="pc-k">' + esc(x.grp) + " \u00b7 " + esc(x.body) + " \u00b7 " +
        esc(TIER_LABEL[x.tier] || "") + "</span>" +
      '<b class="pcsw-t">' + esc(x.t) + "</b>" +
      '<span class="pc-sub">' + esc(meta.join(" \u00b7 ")) + "</span>" +
      '<span class="pc-f">' +
        '<span class="chip ' + (primary ? "good" : "mute") + '">' +
          (primary ? "Main route" : "Also tracking") + "</span>" +
        '<span class="pcsw-s">' + (on ? "You are here" : "Open") + "</span>" +
      "</span></span></a>";
  }
  /* the way back up, and the other applications one click away. A doctor
     chasing a reference on one application should be able to see they have a
     second without returning to the index first. */
  function trackBack(progs, prog, action){
    var others = progs.filter(function(x){ return x.id !== prog.id; });
    return '<div class="trk-back">' +
      '<a class="btn-link trk-up" href="#/progress">' + ico(I.arrow, 13) + "All programmes</a>" +
      (others.length
        ? '<span class="trk-also">Also tracking: ' + others.map(function(x){
            return '<a class="btn-link" href="#/progress/' + encodeURIComponent(x.id) + '">' +
              esc(x.t) + "</a>";
          }).join('<span aria-hidden="true"> \u00b7 </span>') + "</span>"
        : "") +
      (action ? '<span style="margin-left:auto">' + action + "</span>" : "") + "</div>";
  }

  /* the index-level header: the dates tab spans every application, so its
     figures have to as well. trackStats() answers for one programme and would
     be quietly wrong here. */
  function trackAllStats(progs){
    var out = 0, total = 0;
    progs.forEach(function(p){ var pr = checkProgress(p.id); out += pr.total - pr.done; total += pr.total; });
    var next = allDates().filter(function(d){ return d.days >= 0; })[0] || null;
    return '<div class="tstat">' +
      '<div><span class="k">Outstanding</span><span class="v num">' + out + " of " + total + '</span>' +
        '<span class="d">Across every application you track</span></div>' +
      '<div><span class="k">Next date</span><span class="v num">' +
        (next ? esc(fmtLong(next.iso)) : "None") + '</span><span class="d">' +
        (next ? esc(next.t) + " \u00b7 " + esc(awayText(next.days)) : "Nothing open") + "</span></div>" +
      '<div><span class="k">Applications</span><span class="v num">' + progs.length + '</span>' +
        '<span class="d">' + (progs.length === 1 ? "One programme tracked" : "Programmes tracked") +
        "</span></div></div>";
  }

  /* tab two: every date, every application, grouped by month */
  function allDatesPanel(){
    var rows = datesGrouped(allDates().filter(function(d){ return S.showPast || d.days >= 0; }));
    var elig = cycleEligibility(), notMine = elig && !elig.eligible;
    var h = "";
    if (notMine){
      h += ctx("The college dates below belong to the " + elig.thisCycle +
        " cycle. On your record you are building for " + elig.targetCycle +
        ", so treat them as the shape of the year rather than your own countdown.");
    }
    if (!rows.length){
      return h + '<p class="empty"><b>Nothing scheduled.</b>Every date on the programmes you ' +
        "track has passed.</p>" + datesFoot();
    }
    var lastMonth = "";
    rows.forEach(function(d){
      var mk = MON_LONG[day(d.iso).getMonth()] + " " + day(d.iso).getFullYear();
      if (mk !== lastMonth){ h += '<p class="month">' + mk + "</p>"; lastMonth = mk; }
      /* a college date cannot be "done" -- it passes. Only a date the doctor
         set is theirs to clear, which is the one done-rule this merge fixes:
         deadlinesDone and checks were two stores for overlapping ideas. */
      var own = d.kind === "personal";
      var theirs = !(notMine && d.kind === "official");
      var k = !theirs ? "mute" : d.days < 0 ? "mute" : d.days <= 21 ? "crit" : d.days <= 60 ? "warn" : "good";
      h += '<div class="dl ' + k + (own ? " own" : "") + '">' +
        '<div class="dl-top"><b>' + esc(d.t) + "</b>" +
        '<span class="away" style="color:var(--' +
          (k === "crit" ? "crit" : k === "warn" ? "warn" : k === "mute" ? "txt" : "good") +
          '-text)">' + esc(awayText(d.days)) + "</span></div>" +
        '<div class="dl-sub"><span>' + esc(fmtLong(d.iso)) + "</span>" +
        (own ? '<span class="chip good">Your own</span>'
             : !theirs ? '<span class="chip mute">Next cycle for you</span>'
             : d.progs.map(function(n){ return '<span class="chip mute">' + esc(n) + "</span>"; }).join("")) +
        (own ? "" : "<span>" + esc(d.note) + "</span>") +
        "</div></div>";
    });
    var past = datesGrouped(allDates().filter(function(d){ return d.days < 0; })).length;
    h += '<div style="margin-top:18px;display:flex;gap:8px;flex-wrap:wrap">' +
      '<button class="btn btn-sm btn-ghost" data-act="togglePast">' +
      (S.showPast ? "Hide past dates" : "Show past dates" + (past ? " (" + past + ")" : "")) + "</button>" +
      '<button class="btn btn-sm btn-ghost" data-act="printReport">Print this</button></div>';
    return h + datesFoot();
  }
  function datesFoot(){
    return ctxFoot("College dates follow the same illustrative cycle as the rest of the dashboard. A date you " +
      "set yourself is yours and moves when you move it; a college date is not yours to tick, it simply passes.");
  }

  VIEWS.progress = {
    title:"Application tracker", sub:"Every stage of the application, and what each one needs from you.",
    render:function(){
      var sit = situation();
      var progs = progsTracked();

      if (!sit.stillApplying || !progs.length){
        return '<div class="card"><div class="card-head"><h2>No application open</h2></div><p class="lede">' +
          (sit.isConsultant
            ? "You have reached consultant, so there is no training application to track. Your record stays here."
            : "Set a specialty on your profile and this page tracks what that application needs, stage by stage.") + "</p>" +
          (sit.isConsultant ? "" : '<div style="margin-top:12px"><a class="btn btn-sm btn-primary" href="#/profile">Edit profile</a></div>') +
          "</div>" + '<p class="sec-label">Recent activity</p>' + activityCard();
      }

      /* the calendar half of the merged page. It spans every programme, so it
         belongs at the index level rather than inside one application. */
      if (S.trackTab === "dates" && !currentArg()){
        return trackTabs() + '<div id="trackPanel" role="tabpanel" tabindex="-1">' +
          trackAllStats(progs) + allDatesPanel() + "</div>";
      }

      /* ============ FRONT OR DETAIL ============
         The Programmes page and the tracker were the same thing at two levels:
         the page listed what you could apply to, the tracker showed one
         application's checklist, and both rendered the same programme cards.
         One module now, two levels. #/progress is the index -- what you track
         and everything you could -- and #/progress/<id> is one application,
         with a way back. The url carries which one, so it is linkable and the
         back button works. */
      var openProg = currentArg() ? progById(currentArg()) : null;
      if (!openProg || !progTracked(openProg.id)) return trackFront(progs);
      /* remember it, so the nav comes back HERE rather than to the index. A
         doctor working one application should not re-pick it every session. */
      if (S.lastProg !== openProg.id){ S.lastProg = openProg.id; save(); }

      /* which stage sticks, so a doctor who came back to chase a reference is
         not returned to the top each time */
      var prog = openProg;
      var target = prog.id;
      var cyc = cycleForProg(prog);
      var phase = PHASES.filter(function(x){ return x.id === S.trackPhase; })[0]
        ? S.trackPhase : currentPhase(cyc);
      var ph = PHASES.filter(function(x){ return x.id === phase; })[0];
      var body = prog.body;
      var app = applicationFor(prog.t);
      var overall = checkProgress(target);

      /* Stop tracking, at the top now rather than buried under the whole
         checklist: it is a decision about this application, made before
         reading what it wants, as often as after. progsTracked() falls back
         to S.specialty/S.otherTargets whenever S.programmes is empty, so
         dropping your only tracked application would not stay dropped -- it
         would reappear on the next render, reseeded from the same
         specialty, which reads as the button silently failing. The actual
         lever for "I don't want this application any more" when it is your
         only one is changing your target on the profile, so say that
         instead of hiding the control with no explanation. */
      var stopAction = progs.length > 1
        ? '<button class="btn btn-sm btn-ghost" data-prog-off="' + esc(prog.id) + '">Stop tracking this</button>'
        : '<a class="btn btn-sm btn-ghost" href="#/profile">Change your target instead</a>';
      var h = trackBack(progs, prog, stopAction) + '<div id="trackPanel">';
      if (progs.length <= 1){
        h += '<p class="lede" style="max-width:60ch;margin:-8px 0 14px;font-size:12.5px;color:var(--txt-mute)">' +
          "This is your only tracked application, so there is nothing to fall back to if you stop tracking it " +
          "here — track a second application first, or change your target specialty on your profile.</p>";
      }
      h += trackStats(prog);

      /* ---- the four phases ---- */
      h += '<div class="phases" role="tablist" aria-label="Stage">' + PHASES.map(function(x){
        var st = phaseState(x.id, cyc), pr = phaseProgress(x.id, target);
        return '<button class="ph ' + st + (x.id === phase ? " on" : "") + '" role="tab" aria-selected="' +
          (x.id === phase ? "true" : "false") + '" data-track-phase="' + x.id + '">' +
          '<span class="ph-n">' + x.n + "</span>" +
          '<span class="ph-t">' + esc(x.t) + "</span>" +
          '<span class="ph-p">' + (pr.total ? pr.done + "/" + pr.total : "—") +
          (st === "now" ? " · now" : st === "past" ? " · passed" : "") + "</span></button>";
      }).join("") + "</div>";

      /* ---- the phase itself ---- */
      var pst = phaseState(phase, cyc), pr = phaseProgress(phase, target);
      h += '<div class="card lead" style="margin-top:14px"><div class="card-head">' +
        '<h2>' + esc(ph.t) + "</h2>" +
        '<span class="r" style="margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap">' +
        (app && app.outcome ? '<span class="chip ' + OUTCOMES[app.outcome].k + '">' + esc(OUTCOMES[app.outcome].label) + "</span>" : "") +
        chip(pst === "now" ? {k:"good", icon:I.target, label:"You are here"}
           : pst === "past" ? {k:"mute", icon:I.tick, label:"Passed"}
           : {k:"mute", icon:I.clock, label:"Ahead"}) + "</span></div>";
      h += '<p class="ph-when">' + esc(phaseLabel(phase, cyc)) + "</p>";
      h += '<p class="lede" style="max-width:68ch;margin-bottom:14px">' + esc(ph.blurb) + "</p>";

      /* phaseMilestones wants a NAME to put in front of "applications close",
         not the key the checklist is stored under. target became a programme
         id in the merge and this line rendered "p-cardiology applications
         close" until the programme's own title was passed instead. */
      var ms = phaseMilestones(phase, cyc, prog.t);
      if (ms.length){
        h += '<p class="group-h">Key dates</p>';
        h += ms.map(function(d){
          var dd = d.days === undefined ? until(d.iso) : d.days;
          return '<div class="ms"><span class="ms-d"><b>' + fmtLong(d.iso) + "</b><small>" + esc(d.t) + "</small></span>" +
            '<span class="ms-r">' + chip(d.done ? {k:"good", icon:I.tick, label:"Done"}
              : {k: dd < 0 ? "mute" : dd <= 21 ? "crit" : dd <= 60 ? "warn" : "mute",
                 icon:I.clock, label: dd < 0 ? "Passed" : awayText(dd)}) + "</span></div>";
        }).join("");
      }

      h += '<div class="barrow" style="margin:16px 0 6px">' +
        '<span class="lbl">' + pr.done + " of " + pr.total + " ready for this stage</span>" +
        '<span class="val num">' + pr.pct + "%</span>" + bar(pr.pct) +
        '<span class="note">' + overall.done + " of " + overall.total + " across the whole application, for " +
        esc(prog.t) + " via " + esc(body) + "." +
        /* the rows below suppress a deadline chip when the closing date is the
           only date governing them, so the card has to say that once */
        (cyc && until(cyc.apply) >= 0
          ? " Everything here has to be in place by " + fmtLong(cyc.apply) + ", when applications close, " +
            "unless it carries a date of its own."
          : "") + "</span></div>";

      /* grouped, because eligibility failing is a different kind of problem to
         a reference not being back yet */
      var list = checksFor().filter(function(c){ return c.p === phase; }), groups = [];
      list.forEach(function(c){ if (groups.indexOf(c.g) === -1) groups.push(c.g); });
      if (!list.length){
        h += '<p class="empty">Nothing to prepare for this stage yet.</p>';
      }
      groups.forEach(function(g){
        var items = list.filter(function(c){ return c.g === g; });
        var gdone = items.filter(function(c){ return checkState(c, target).done; }).length;
        h += '<p class="group-h">' + esc(g) + ' <span class="g-count">' + gdone + " of " + items.length + "</span></p>";
        h += items.map(function(c){ return checkRow(c, target); }).join("");
      });
      h += "</div>";

      h += '<div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center">' +
        '<button class="btn btn-sm btn-ghost" data-act="addMilestone">Add your own requirement</button></div>';

      h += ctxFoot("The requirement categories here are the shape " + esc(body || "an Irish training application") +
        " takes, not " + esc(body || "the college") + "'s own published checklist. Dates are sourced from " +
        esc(body || "the college") + "'s published cycle, but colleges update these without notice — don't " +
        "rely on this page alone. Always confirm the current date and requirement list on " +
        esc(body || "the college") + "'s own site before a deadline.");
      return h + "</div>";
    }
  };

  /* Both old routes resolve into the module that absorbed them: #/deadlines
     lands on the dates tab, #/programmes on the index that used to be its own
     page. Links across the app and anything a doctor bookmarked keep working. */
  VIEWS.deadlines = VIEWS.progress;
  VIEWS.programmes = VIEWS.progress;

  function checkRow(c, target){
    var st = checkState(c, target), due = checkDue(c);
    var dd = due ? until(due.iso) : null;
    var h = '<div class="chk' + (st.done ? " done" : "") + '">' +
      (st.auto
        /* derived: not a control, because ticking it here would mean entering
           the same fact twice */
        ? '<span class="chk-box auto' + (st.done ? " on" : "") + '" aria-hidden="true">' +
          (st.done ? ico(I.tick, 12) : ico(I.clock, 11)) + "</span>"
        : '<button class="chk-box' + (st.done ? " on" : "") + '" data-check="' + esc(c.id) +
          '" data-check-target="' + esc(target) + '" aria-pressed="' + (st.done ? "true" : "false") +
          '"><span class="sr-only">' + (st.done ? "Mark not ready: " : "Mark ready: ") + esc(c.t) + "</span>" +
          (st.done ? ico(I.tick, 12) : "") + "</button>");

    h += '<div class="chk-b"><b>' + esc(c.t) + "</b>" +
      (c.shared ? '<span class="chip mute sm">Shared</span>' : "") +
      (st.auto ? '<span class="chip mute sm">From your record</span>' : "") +
      (c.d ? "<small>" + esc(c.d) + "</small>" : "") +
      (st.note ? '<small class="chk-note">' + esc(st.note) + "</small>" : "") +
      /* the action lives with the requirement. Sending a doctor to another
         page to tick something they are looking at is the whole complaint. */
      (!st.done && (c.act || c.fix)
        ? '<span class="chk-a">' +
          (c.act ? '<button class="btn btn-sm btn-primary" data-act="' + esc(c.act[0]) + '">' + esc(c.act[1]) + "</button>" : "") +
          (c.fix ? '<a class="btn btn-sm btn-ghost" href="' + c.fix[0] + '">' + esc(c.fix[1]) + "</a>" : "") +
          "</span>" : "") +
      "</div>";

    /* a date of your own, on the requirement it belongs to. This is what
       replaced the two dates deadlines() used to invent and call yours. */
    var mine = ownDue(c, target), mineD = mine ? until(mine) : null;
    h += '<div class="chk-r">' +
      (!st.done && mine
        ? '<span class="due-set">' + ico(I.flag, 11) + "Due " + esc(fmt(mine)) +
          " \u00b7 " + esc(awayText(mineD)) + "</span>" +
          '<button class="btn-link" data-own-due-clear="' + esc(checkKey(c, target)) +
          '">Clear</button>'
        /* any outstanding requirement can carry a date of your own, derived
           or not. Gating this on manual checks meant the whole Preparation
           stage offered it nowhere: every requirement in it is derived. */
        : !st.done
        ? '<button class="btn-link" data-own-due="' + esc(checkKey(c, target)) +
          '">Set a date</button>' : "") +
      (!st.done && due && !due.governing && dd !== null && dd >= 0
        ? chip({k: dd <= 21 ? "crit" : dd <= 60 ? "warn" : "mute", icon:I.clock,
                label:due.why + ", " + awayText(dd)}) : "") +
      (c.custom ? '<button class="btn-link" data-check-remove="' + esc(c.id) + '">Remove</button>' : "") +
      "</div></div>";
    return h;
  }

  /* the log, which belongs beside the requirements it is a log of */
  function activityCard(){

    var h = '<div class="card">';
    h += acts.length ? acts.map(function(a){
      return '<div class="feed-item"><span class="fi">' + ico(I.tick, 13) + "</span>" +

        '<span class="fw">' + esc(ago(a.at)) + "</span></div>";

  /* ================= PROGRAMMES =================
     The shelf that was missing. Same shape as the prep catalogues on purpose:
     a doctor who has browsed exams already knows how to read this, and
     prepFilters, prepGroups and specClass all work here unchanged. */
  /* ============ THE TRACKER'S FRONT ============
     This was the Programmes page. It and the tracker were one module at two
     levels: the page listed what you could apply to, the tracker held one
     application's checklist, and BOTH rendered the same programme cards --
     the same duplication that let Deadlines and the tracker drift apart.
     The front lists them; clicking one opens its checklist and its dates. */
  function trackFront(progs){
    {
      var sit = situation();
      var all = programmes(), tracked = progsTracked();

      var shelf = all.map(function(p){
        return {id:p.id, p:p, label:p.t, grp:p.grp, body:p.body,
                meta:TIER_LABEL[p.tier] + " \u00b7 " + (p.fam || ""), d:p.d};
      });
      /* one filtered set, read by every section. Filtering only the browse
         grid leaves a doctor who typed "psychiatry" still looking at
         Cardiology at the top of the page, which reads as a broken search. */
      var filtering = !!(S.prepQuery || S.prepGroup || S.progTier);
      var vis = shelf.filter(function(o){
        return prepMatches(o) && prepInGroup(o) && (!S.progTier || o.p.tier === S.progTier);
      });
      var visIds = vis.map(function(o){ return o.id; });
      var shown = {}, h = "";

      function section(label, items, lead){
        if (!items.length) return;
        h += '<p class="sec-label">' + esc(label) + "</p>";
        h += '<div class="pgrid">' + items.map(function(x, i){
          shown[x.p.id] = 1;
          return progCard(x.p, x.why || "", lead && i === 0);
        }).join("") + "</div>";
      }

      /* the filter controls sit right under the tabs and above every card, the
         same order exam prep and interview prep already use (prepTabs() then
         prepFilters() then the cards). They used to sit below Tracking now
         and Recommended, which put a doctor's own applications underneath a
         search box that had nothing to do with finding them -- the tracked
         and recommended cards are not something to filter your way down to. */
      h += prepFilters(shelf, "programmes");
      h += '<div class="picks" style="margin-bottom:16px">' +
        '<button class="pick pick-b' + (!S.progTier ? " on" : "") + '" data-prog-tier="">Any stage</button>' +
        Object.keys(TIER_LABEL).map(function(t){
          return '<button class="pick pick-b' + (S.progTier === t ? " on" : "") + '" data-prog-tier="' +
            t + '">' + esc(TIER_LABEL[t]) + "</button>";
        }).join("") + "</div>";

      /* the tracked ones are the way IN to an application, not just entries in
         a catalogue, so they are the switcher cards and each opens its own
         checklist rather than offering "track this" on something already
         tracked */
      var mine = tracked.filter(function(p){ return visIds.indexOf(p.id) > -1; });
      if (mine.length){
        h += '<p class="sec-label">Tracking now \u00b7 ' + tracked.length + "</p>";
        h += '<div class="pgrid pgrid-sw">' + mine.map(function(x, i){
          shown[x.id] = 1;
          return trackCard(x, false, tracked.indexOf(x) === 0);
        }).join("") + "</div>";
      }
      if (!tracked.length && !filtering){
        h += '<p class="sec-label">Tracking now</p>' +
          '<p class="empty"><b>Nothing tracked yet.</b>Pick a programme below and it gets its own ' +
          "checklist, its own dates and its own interview.</p>";
      }

      var rec = recommendProgrammes().filter(function(r){
        return visIds.indexOf(r.prog.id) > -1 && !shown[r.prog.id];
      }).slice(0, 6).map(function(r){ return {p:r.prog, why:r.why}; });
      section("Recommended for you", rec, true);
      if (!rec.length && !sit.hasTarget && !filtering){
        h += ctx("No specialty set, so nothing is recommended yet. Everything below is still here to browse, " +
          "and setting a route on your profile turns this into a shortlist.");
      }

      h += '<p class="sec-label">Everything you could apply to</p>';
      var rest = vis.filter(function(o){ return !shown[o.id]; });
      if (!vis.length){
        h += '<p class="empty"><b>Nothing matches.</b>Try a college, a specialty, or part of the ' +
          "programme name.</p>";
      } else if (rest.length){
        prepGroups(rest).forEach(function(g){
          h += groupHead(g, true);
          h += '<div class="pgrid">' + rest.filter(function(o){ return specGroup(o.grp) === g; })
            .map(function(o){ return progCard(o.p, "", false); }).join("") + "</div>";
        });
      } else {
        h += '<p class="empty">Everything that matches is already above.</p>';
      }
      h += ctxFoot("Scheme names, and which specialties each basic training trunk feeds, are the shape Irish " +
        "training takes rather than any college's published prospectus. Entry rules and dates are illustrative " +
        "in this prototype: confirm both with the college before planning around them.");
      /* the activity log is the doctor's record, not one application's. It used
         to sit inside the tracker, which now means inside ONE application,
         where the same entries would render again under the next one. */
      h += '<p class="sec-label">Recent activity</p>' + activityCard();
      return trackTabs() + '<div id="trackPanel" role="tabpanel" tabindex="-1">' + h + "</div>";
    }
  }
  var TIER_LABEL = {bst:"Entry to training", hst:"Higher training", run:"Direct entry"};

  function progCard(p, why, lead){
    var on = progTracked(p.id), cyc = CYCLE[p.body] || null;
    var d = cyc ? until(cyc.apply) : null;
    var trunk = p.tier === "hst" ? trunkFor(p.specialty) : null;
    var h = '<div class="pc ' + specClass(p.grp) + (lead ? " lead" : "") + (on ? "" : " lock") + '">' +
      '<div class="pc-band" aria-hidden="true"></div><div class="pc-b">' +
      '<p class="pc-k">' + esc(p.grp) + " \u00b7 " + esc(p.body) + " \u00b7 " +
        esc(TIER_LABEL[p.tier]) + "</p>" +
      "<h2>" + esc(p.t) + "</h2>" +
      '<p class="pc-sub">' + esc(p.fam || "No entry exam recorded") +
        (d !== null && d >= 0 ? " \u00b7 closes " + esc(fmt(cyc.apply)) : "") + "</p>" +
      (why ? '<p class="pc-why">' + esc(why) + "</p>" : '<p class="pc-d">' + esc(p.d) + "</p>");

    /* the question a doctor at BST actually has: what do I apply to first */
    if (trunk && !progTracked(trunk.id)){
      h += '<p class="pc-sub" style="margin-top:9px">Entered from <b>' + esc(trunk.t) + "</b>.</p>";
    }

      (on ? '<button class="btn btn-sm btn-ghost" data-prog-off="' + esc(p.id) + '">Stop tracking</button>'
          : '<button class="btn btn-sm btn-primary" data-prog-on="' + esc(p.id) + '">Track this</button>') +

          : d !== null && d >= 0 ? '<span class="pc-wk ' + (d <= 21 ? "crit" : d <= 60 ? "warn" : "") + '">' +
              esc(awayText(d)) + "</span>" : "") +
      "</div></div></div>";
    return h;
  }

  /* the three membership stages, named for whichever exam family the doctor's
     specialty actually sits. The names come from SPECIALTY_INFO, so a surgical
     trainee sees MRCS parts here and never MRCPI ones. */
  /* ================= THE EXAM REGISTRY =================
     The unit a doctor actually prepares for is a STAGE, not a family. Nobody
     revises for "MRCPI" — they revise for Part 1, sit it, and then start on
     something with a different format and a different syllabus. So a stage is
     what the catalogue lists, what gets recommended, and what has a hub.

     examParts() below assumed every family was three parts shaped Part 1 /
     Part 2 written / clinical. That is not what ICGP runs, and it is not what
     several of these run either, which is why a GP applicant was being shown
     an MRCPI-shaped exam they will never sit.

     WHEN matters as much as the name. An applicant to GP training sits the
     SJT and CPST to get in; MICGP is the membership exam they sit years later
     inside training. Listing both without saying which is which is how a
     doctor ends up preparing for the wrong one.

     ILLUSTRATIVE. Stage names, formats and structures are each college's and
     they change. Confirmed structures replace these before launch. */
  var EXAMS = [
    /* RCPI medicine */
    {id:"mrcpi-1", grp:"Medicine",   fam:"MRCPI", body:"RCPI", stage:"Part 1", when:"entry",
     fmt:"Written, single best answer", d:"Basic sciences and clinical knowledge. The stage most applications ask for."},
    {id:"mrcpi-2w", grp:"Medicine",  fam:"MRCPI", body:"RCPI", stage:"Part 2 Written", when:"membership",
     fmt:"Written, applied knowledge", d:"Applied clinical knowledge across general medicine."},
    {id:"mrcpi-2c", grp:"Medicine",  fam:"MRCPI", body:"RCPI", stage:"Part 2 Clinical", when:"membership",
     fmt:"Clinical, examined cases", d:"Examined on real or simulated patients. Prepared for by practising, not by reading."},
    /* RCSI surgery */
    {id:"mrcs-a", grp:"Surgery",    fam:"MRCS", body:"RCSI", stage:"Part A", when:"entry",
     fmt:"Written, two papers", d:"Applied basic sciences and principles of surgery."},
    {id:"mrcs-b", grp:"Surgery",    fam:"MRCS", body:"RCSI", stage:"Part B", when:"membership",
     fmt:"Clinical, OSCE", d:"Structured clinical stations."},
    /* general practice: the entry assessment and the membership exam are not
       the same thing, and conflating them is the whole point of this table */
    {id:"icgp-sjt", grp:"General Practice",  fam:"ICGP entry", body:"ICGP", stage:"SJT", when:"entry",
     fmt:"Situational judgement", d:"Scenario-based judgement. Carries heavy weight in the entry score."},
    {id:"icgp-cpst", grp:"General Practice", fam:"ICGP entry", body:"ICGP", stage:"CPST", when:"entry",
     fmt:"Clinical problem solving", d:"Sat alongside the SJT, scored separately."},
    {id:"micgp", grp:"General Practice",     fam:"MICGP", body:"ICGP", stage:"MICGP", when:"exit",
     fmt:"Written and clinical", d:"The membership exam, sat inside GP training rather than to enter it."},
    /* psychiatry */
    {id:"mrcpsych-a", grp:"Psychiatry", fam:"MRCPsych", body:"College of Psychiatrists", stage:"Paper A", when:"entry",
     fmt:"Written", d:"Scientific and theoretical basis of psychiatry."},
    {id:"mrcpsych-b", grp:"Psychiatry", fam:"MRCPsych", body:"College of Psychiatrists", stage:"Paper B", when:"membership",
     fmt:"Written", d:"Critical review and clinical topics."},
    {id:"mrcpsych-c", grp:"Psychiatry", fam:"MRCPsych", body:"College of Psychiatrists", stage:"CASC", when:"membership",
     fmt:"Clinical, OSCE", d:"Clinical assessment of skills and competencies."},
    /* emergency medicine */
    {id:"mrcem-p", grp:"Emergency Medicine",   fam:"MRCEM", body:"RCSI", stage:"Primary", when:"entry",
     fmt:"Written", d:"Basic sciences applied to emergency medicine."},
    {id:"mrcem-i", grp:"Emergency Medicine",   fam:"MRCEM", body:"RCSI", stage:"Intermediate SBA", when:"membership",
     fmt:"Written", d:"Applied knowledge."},
    {id:"mrcem-o", grp:"Emergency Medicine",   fam:"MRCEM", body:"RCSI", stage:"OSCE", when:"membership",
     fmt:"Clinical, OSCE", d:"Structured clinical stations."},
    /* paediatrics and obstetrics, on the RCPI faculties */
    {id:"mrcpch-1", grp:"Paediatrics",  fam:"MRCPI Paediatrics", body:"RCPI", stage:"Part 1", when:"entry",
     fmt:"Written", d:"Basic and applied sciences in paediatrics."},
    {id:"mrcpch-2", grp:"Paediatrics",  fam:"MRCPI Paediatrics", body:"RCPI", stage:"Part 2", when:"membership",
     fmt:"Written and clinical", d:"Applied knowledge and examined cases."},
    {id:"mrcog-1", grp:"Obstetrics and Gynaecology",   fam:"MRCPI O and G", body:"RCPI", stage:"Part 1", when:"entry",
     fmt:"Written", d:"Basic sciences for obstetrics and gynaecology."},
    {id:"mrcog-2", grp:"Obstetrics and Gynaecology",   fam:"MRCPI O and G", body:"RCPI", stage:"Part 2", when:"membership",
     fmt:"Written and clinical", d:"Applied knowledge and examined cases."},
    /* the language requirement, which is an exam a great many IMGs sit and
       which no part of this product acknowledged */
    {id:"ielts", grp:"Any specialty",     fam:"English language", body:"Medical Council", stage:"IELTS or OET", when:"entry",
     fmt:"Four papers", d:"Where your primary qualification was not taught in English. The accepted tests and scores are the Council's.",
     imgOnly:true}
  ];

  /* "MICGP MICGP" is what family + stage gives you when a family has one stage
     named after it, so the label is built once rather than concatenated at
     every call site */
  /* ================= LOCKED AND UNLOCKED =================
     Both catalogues are shelves of the same kind of thing, so the rules that
     govern them live in one place rather than being written twice and drifting. */
  function prepUnlocked(id){ return (S.unlocked || []).indexOf(id) > -1; }
  function prepOpen(id, included){ return included || prepUnlocked(id); }

  /* free-text match across everything a doctor might type: the exam or
     interview name, the college, the specialty group, and the format */
  function prepMatches(o){
    var q = (S.prepQuery || "").trim().toLowerCase();
    if (!q) return true;
    /* word starts, not raw substrings: "BST" matched "obstetrics" on a plain
       indexOf, which is the kind of result that makes a search box feel
       broken. Every typed term has to start some word in the haystack. */
    var words = [o.label, o.body, o.grp, specGroup(o.grp), o.meta, o.d].filter(Boolean).join(" ")
      .toLowerCase().split(/[^a-z0-9]+/).filter(Boolean);
    return q.split(/\s+/).filter(Boolean).every(function(term){
      return words.some(function(w){ return w.indexOf(term) === 0; });
    });
  }
  /* ---- specialty colour ----
     One hue per specialty, assigned in a fixed order and never cycled: a
     specialty we have no slot for gets the neutral rather than a generated
     hue, which is how a ninth colour nobody validated gets onto a page.
     The hue is only ever an aid — every card and every group heading names
     its specialty in words, in that specialty's own text step. */
  var SPEC_CLASS = {
    "Medicine":"sp-med", "Surgery":"sp-surg", "General Practice":"sp-gp",
    "Psychiatry":"sp-psy", "Emergency Medicine":"sp-em", "Paediatrics":"sp-paed",
    "Obstetrics and Gynaecology":"sp-og", "Any specialty":"sp-any",
    "Other specialties":"sp-other"
  };
  /* Eleven specialties, eight slots. Rather than four blocks with no colour,
     the four that hold an interview and no exam share one labelled group: a
     reader is told they are a bucket instead of being left to wonder why four
     headings look alike. The CARD still names the real specialty — only the
     grouping and the hue are shared. */
  var OTHER_SPECIALTIES = ["Anaesthesiology", "Radiology", "Pathology", "Public Health"];
  var OTHER_LABEL = "Other specialties";
  function specGroup(grp){ return OTHER_SPECIALTIES.indexOf(grp) > -1 ? OTHER_LABEL : grp; }
  function specClass(grp){ return SPEC_CLASS[specGroup(grp)] || "sp-none"; }
  /* a group heading is the legend for its own grid */
  function groupHead(grp, coloured){
    return '<p class="group-h ' + (coloured ? esc(specClass(grp)) : "") + '">' +
      (coloured ? '<span class="spdot" aria-hidden="true"></span>' : "") + esc(grp) + "</p>";
  }

  function prepInGroup(o){ return !S.prepGroup || specGroup(o.grp) === S.prepGroup; }

  /* the specialty groups present in a registry, in a stable order, so the
     filter row does not reshuffle itself as the shelf changes */
  function prepGroups(list){
    var out = [];
    list.forEach(function(o){
      var g = specGroup(o.grp);
      if (g && out.indexOf(g) === -1) out.push(g);
    });
    return out;
  }

  /* the search and group row, rendered the same above both catalogues */
  function prepFilters(list, noun){
    var groups = prepGroups(list);
    var h = '<div class="prep-find">' +
      '<input id="prepQ" type="search" placeholder="Search ' + esc(noun) +
      ', college or specialty" value="' + esc(S.prepQuery || "") + '" aria-label="Search ' + esc(noun) + '">' +
      (S.prepQuery ? '<button class="btn btn-sm btn-ghost" data-prep-q="">Clear</button>' : "") + "</div>";
    h += '<div class="picks" style="margin-bottom:16px">' +
      '<button class="pick pick-b' + (!S.prepGroup ? " on" : "") + '" data-prep-grp="">All specialties</button>' +
      groups.map(function(g){
        return '<button class="pick pick-b' + (S.prepGroup === g ? " on" : "") + '" data-prep-grp="' +
          esc(g) + '">' + esc(g) + "</button>";
      }).join("") + "</div>";
    return h;
  }

  /* what is behind the lock, shown BEFORE unlocking rather than after. Nobody
     should have to pay to find out what they are paying for. */
  function prepFeatures(surfaces){
    return '<div class="feat">' + surfaces.map(function(g){
      return '<div class="feat-i">' + ico(g.ic, 15) + "<span><b>" + esc(g.t) + "</b>" + esc(g.d) + "</span></div>";
    }).join("") + "</div>";
  }

  /* ================= THE SHARED ROUTE =================
     Exams and interviews stay separate pages, because a doctor arrives wanting
     one or the other and mixing them made both harder to scan. What the two
     pages share is the ORDER, so the route is built once and rendered
     identically from either side: switching to it from Exams and from
     Interviews lands on the same thing.

     The order is read off the registry rather than invented. An entry stage is
     one a route asks for before you can apply, the interview IS the
     application, and membership and exit stages are sat once you are in. */
  var WHEN_ORDER = {entry:0, membership:2, exit:3};

  /* the exam families one route actually touches: the one that gets you in,
     and the one you finish. For general practice those are two different
     families, which is the case that makes this a function. */
  function routeFamilies(sp){
    var out = [], info = SPECIALTY_INFO[sp] || {};
    [entryFamilyFor(sp), info.exam].forEach(function(f){
      if (f && out.indexOf(f) === -1) out.push(f);
    });
    return out;
  }

  /* every stop on one target's route, in order, each carrying its own state.
     Nothing here reads situation().cycle: an exam is paced by the college that
     sets it and the interview by the college that runs it, which is the leak
     that has bitten this file at every view that showed two routes at once. */
  function routeStops(sp){
    var stops = [], sit = situation();
    if (sit.isIMG || sit.newToIreland){
      var lang = examById("ielts");
      if (lang) stops.push({kind:"exam", e:lang, ord:-1, pre:true});
    }
    routeFamilies(sp).forEach(function(f){
      examsInFamily(f).forEach(function(e){
        if (!stops.some(function(x){ return x.kind === "exam" && x.e.id === e.id; })){
          stops.push({kind:"exam", e:e, ord:WHEN_ORDER[e.when]});
        }
      });
    });
    var iv = interviewFor(sp);
    if (iv) stops.push({kind:"iv", iv:iv, ord:1});

    stops.forEach(function(x, i){ x.seq = i; });
    stops.sort(function(a, b){ return a.ord - b.ord || a.seq - b.seq; });

    /* what is done, then the first thing that is not, then the rest. An
       interview counts as behind you only when the application it belongs to
       has an outcome recorded — we have no other way of knowing you sat it. */
    var info = SPECIALTY_INFO[sp] || {}, app = applicationFor(info.target || sp), running = false;
    stops.forEach(function(x){
      x.done = x.kind === "exam"
        ? stageHeld(x.e.id)
        : !!(app && app.outcome && app.outcome !== "waiting");
      if (!x.done && !running){ x.now = true; running = true; }
    });
    return stops;
  }

  function routeStopCard(x, n){
    var cls = "rstop " + (x.kind === "iv" ? "iv " + specClass(x.iv.grp) : specClass(x.e.grp)) +
      (x.done ? " done" : x.now ? " now" : " todo");
    var node = x.done ? ico(I.tick, 14) : x.now ? "●" : String(n);
    var h = '<div class="' + cls + '"><span class="rnode" aria-hidden="true">' + node + "</span>";

    if (x.kind === "iv"){
      var iv = x.iv, d = iv.cycle ? until(iv.cycle.interview) : null;
      var open = prepOpen(iv.id, ivIncluded(iv.id)), rd = ivReady(iv.id);
      h += '<div class="rcard"><p class="rk">Step ' + n + " · Interview · " +
        (x.done ? "outcome recorded" : x.now ? "next" : "later") + "</p>" +
        "<h2>" + esc(iv.t) + "</h2><p>" + esc(iv.fmt) + ". " + esc(iv.d) + "</p>" +
        '<div class="rmeta">' +
        '<span class="rm mute">' + esc(iv.body) + "</span>" +
        (d === null ? '<span class="rm mute">No date held</span>'
         : d < 0 ? '<span class="rm mute">That date has passed</span>'
         : '<span class="rm ' + (d <= 21 ? "warn" : "mute") + '">' + esc(awayText(d)) + "</span>") +
        (rd !== null ? '<span class="rm mute">' + rd + "% graded</span>" : "") +
        '<button class="btn btn-sm ' + (x.now ? "btn-primary" : "btn-ghost") + '" data-iv-open="' +
        esc(iv.id) + '">' + (open ? "Open the hub" : "Look inside") + "</button></div></div></div>";
      return h;
    }

    var e = x.e, wk = weeksTo(e), pred = predictedFor(e.id);
    var inc = examIncluded(e.id), eopen = prepOpen(e.id, inc);
    h += '<div class="rcard"><p class="rk">Step ' + n + " · Exam · " +
      (x.done ? "held" : x.pre ? "before registration" : WHEN_LABEL[e.when]) + "</p>" +
      "<h2>" + esc(examLabel(e)) + "</h2><p>" + esc(e.fmt) + ". " + esc(e.d) + "</p>" +
      '<div class="rmeta">' +
      '<span class="rm mute">' + esc(e.body) + "</span>" +
      (x.done ? '<span class="rm">Held</span>' : "") +
      (pred !== null ? '<span class="rm mute">' + pred + "% predicted</span>" : "") +
      /* a stage already behind you has no countdown: the date it was paced
         against stopped meaning anything the moment it was passed */
      (wk !== null && !x.done ? '<span class="rm ' + (wk <= 10 ? "warn" : "mute") + '">' + wk +
        (wk === 1 ? " week" : " weeks") + " to the close</span>" : "") +
      '<button class="btn btn-sm ' + (x.now ? "btn-primary" : "btn-ghost") + '" data-exam-open="' +
      esc(e.id) + '">' + (eopen ? (x.done ? "Review" : "Open the hub") : "Look inside") +
      "</button></div></div></div>";
    return h;
  }

  /* the route panel, rendered from the exams page and the interviews page
     alike. One target gets one line; a doctor tracking two gets two, labelled,
     because a single merged line would put one college's dates on the other's
     exams. */
  function routePanel(){
    var targets = [S.specialty].concat(S.otherTargets || []).filter(function(sp, i, a){
      return sp && a.indexOf(sp) === i;
    });
    if (!targets.length){
      return '<p class="empty"><b>No route set yet.</b>The route is built from the specialty you are ' +
        "heading for, so there is nothing to order until you pick one. Both shelves are still browsable." +
        '</p><div class="prep-cta" style="justify-content:center">' +
        '<a class="btn btn-sm btn-primary" href="#/profile">Set a target specialty</a></div>';
    }
    var h = "";
    targets.forEach(function(sp){
      var stops = routeStops(sp), info = SPECIALTY_INFO[sp] || {};
      h += '<p class="sec-label">' + esc(info.target || sp) +
        (info.body ? " · via " + esc(info.body) : "") +
        " · " + stops.length + " step" + (stops.length === 1 ? "" : "s") + "</p>";
      if (!stops.length){
        h += '<p class="empty">Nothing is registered against this route yet.</p>';
        return;
      }
      h += '<div class="rte">' + stops.map(function(x, i){
        return routeStopCard(x, i + 1);
      }).join("") + "</div>";
    });
    h += ctxFoot("The order is the registry's: stages marked as needed to apply come before the interview, " +
      "and the rest are sat once you are in. Stage names, formats and what each college assesses are " +
      "illustrative and are each college's to set.");
    return h;
  }

  /* the two-tab header both prep pages carry. The list tab is the page you are
     on; the route tab is the same on both. */
  function prepTabs(kind, n, extra){
    var route = S.prepTab === "route";
    var listLabel = kind === "exam" ? "Exams" : "Interviews";
    var h = '<div class="prep-head"><div class="seg" role="tablist" aria-label="' +
      esc(listLabel) + ' view">' +
      '<button role="tab" aria-selected="' + (!route) + '" aria-controls="prepPanel" data-prep-tab="list">' +
      esc(listLabel) + '<span class="n">' + n + "</span></button>" +
      '<button role="tab" aria-selected="' + route + '" aria-controls="prepPanel" data-prep-tab="route">' +
      "My route</button></div>" + (extra || "") + "</div>";
    return h;
  }

  function examLabel(e){ return e && e.fam === e.stage ? e.fam : (e ? e.fam + " " + e.stage : ""); }
  function examById(id){ return EXAMS.filter(function(e){ return e.id === id; })[0] || null; }
  function examsInFamily(fam){ return EXAMS.filter(function(e){ return e.fam === fam; }); }

  /* which family a given route actually needs to ENTER training. General
     practice is the case that makes this necessary: SPECIALTY_INFO says MICGP,
     which is the exam sat years into the scheme, not the one that gets you on
     it. */
  function entryFamilyFor(specialty){
    var info = SPECIALTY_INFO[specialty] || {};
    if (info.body === "ICGP") return "ICGP entry";
    return info.exam || "";
  }

  /* a stage is held when the doctor says so. The legacy counter seeded from
     onboarding still counts for the primary route's family, so nobody loses
     progress they already recorded. */
  function stageHeld(id){
    var rec = (S.examStageDone || {})[id];
    if (rec) return rec;
    var e = examById(id);
    if (!e) return null;
    var primary = entryFamilyFor(S.specialty);
    if (e.fam !== primary) return null;
    var fam = examsInFamily(primary), idx = fam.indexOf(e);
    return (idx > -1 && idx < (S.examStages || 0)) ? "seeded" : null;
  }
  function stagesHeldIn(fam){
    return examsInFamily(fam).filter(function(e){ return stageHeld(e.id); }).length;
  }
  /* the count for the route being looked at, which is what every scoring and
     eligibility check in the app actually meant when it read S.examStages */
  function stagesHeld(specialty){
    var fam = entryFamilyFor(specialty || S.specialty);
    return fam ? stagesHeldIn(fam) : 0;
  }
  function stagesTotal(specialty){
    var fam = entryFamilyFor(specialty || S.specialty);
    return fam ? Math.max(1, examsInFamily(fam).length) : 3;
  }

  /* what to recommend, derived from the record rather than chosen by us: the
     first stage they do not hold in the family their route needs, plus the
     same for any second route they are tracking. */
  function recommendedExams(){
    var out = [], sit = situation(), seen = {};
    /* driven by the programmes tracked rather than by the specialty, so the
       sentence can name the application that actually asks for the stage */
    progsTracked().forEach(function(p){
      if (!p.fam) return;
      var next = examsInFamily(p.fam).filter(function(e){ return !stageHeld(e.id); })[0];
      if (!next || seen[next.id]) return;
      seen[next.id] = 1;
      out.push({exam:next, why:p.t + " asks for " + p.fam + ", and " + examLabel(next) +
        " is the next stage you do not hold."});
    });
    if (sit.isIMG || sit.newToIreland){
      var lang = examById("ielts");
      if (lang && !stageHeld("ielts")){
        out.push({exam:lang, why:"Commonly required where a primary qualification was not taught in English."});
      }
    }
    return out;
  }

  /* ================= EXAM PREP =================
     Two levels, because a doctor arrives with one of two questions.

     "What should I be sitting?" is answered by a catalogue: what your route
     needs next, then everything else, browsable. Someone who came to MedNav
     only for exams and never finished onboarding still gets a usable list.

     "Get me ready for MRCPI Part 1" is answered by a hub: a plan, the
     material, practice, a mock, and what the mock says. The hub belongs to the
     STAGE, because Part 1 and Part 2 Clinical share a family and nothing else:
     different format, different syllabus, and one of them cannot be prepared
     for with a question bank at all. */
  var GYM = [
    {id:"plan",  t:"Study planner",  ic:I.cal,   d:"Weeks to the sitting, and what this week is for",
     feeds:"Sets the pace the rest is measured against"},
    {id:"kb",    t:"Knowledge base", ic:I.book,  d:"The topics this stage covers, and what you have been through",
     feeds:"Coverage feeds your predicted result"},
    {id:"qbank", t:"Question bank",  ic:I.list,  d:"Practice by topic, with explanations",
     feeds:"Accuracy by topic feeds Analytics"},
    {id:"mock",  t:"Mock exam",      ic:I.clip,  d:"A full sitting under timed conditions",
     feeds:"Your score moves the predicted result"},
    {id:"stats", t:"Analytics",      ic:I.chart, d:"Where you are losing marks",
     feeds:"Reads your mocks and your coverage"},
    {id:"tutor", t:"Live tutor",     ic:I.mic,   d:"Sessions with someone who has sat this stage",
     feeds:"Attendance is logged to your record"}
  ];
  /* a clinical or OSCE stage is not prepared for with a question bank, and
     offering one is the fastest way to look like we have never sat it */
  function gymFor(e){
    var clinical = /Clinical|OSCE/i.test(e.fmt || "");
    return GYM.filter(function(g){ return !(clinical && g.id === "qbank"); });
  }

  /* the stages in the family your route needs come with the account. Anything
     else is taken on deliberately, the same way an interview prep is. */
  function examIncluded(id){
    var e = examById(id);
    if (!e) return false;
    return progsTracked().some(function(p){ return p.fam === e.fam; });
  }
  /* examActive holds what the doctor ADDED. Opening a stage to look inside is
     not adding it: browsing a shelf is not buying from it. */
  function examActive(id){ return (S.examActive || []).indexOf(id) > -1; }
  function examHas(id){ return examIncluded(id) || examActive(id); }
  function mocksFor(id){ return (S.mocks || {})[id] || []; }
  function topicsFor(id){ return (S.topicsDone || {})[id] || {}; }
  function predictedFor(id){
    var m = mocksFor(id);
    if (!m.length) return null;
    var r = m.slice(-3);
    return Math.round(r.reduce(function(a, x){ return a + x.pct; }, 0) / r.length);
  }
  function trendFor(id){
    var m = mocksFor(id);
    if (m.length < 2) return null;
    return {from:m[0].pct, to:m[m.length - 1].pct, delta:m[m.length - 1].pct - m[0].pct,
            points:m.map(function(x){ return x.pct; })};
  }
  /* weeks to the sitting. We hold a closing date, not a sitting timetable, so
     an entry-stage exam is paced against the application that asks for it and
     anything else says plainly that it has no date. */
  /* A stage is paced against the application that asks for it, so the cycle
     has to be one the doctor is actually applying into. Reading
     situation().cycle put RCPI's closing date on an RCSI exam a cardiologist
     had merely added: the same leak the roadmap and the tracker each had. */
  function weeksTo(e){
    if (!e || e.when !== "entry") return null;
    var sit = situation();
    var bodies = progsTracked().map(function(p){ return p.body; });
    if (bodies.indexOf(e.body) === -1) return null;
    var c = CYCLE[e.body];
    if (!c) return null;
    var d = until(c.apply);
    return d < 0 ? null : Math.max(0, Math.round(d / 7));
  }
  var TOPICS = ["Cardiology", "Respiratory", "Gastroenterology", "Nephrology",
                "Endocrinology", "Neurology", "Haematology", "Infectious disease"];

  VIEWS.exams = {
    title:"Exam prep", sub:"Every stage you could sit, a hub for each one, and the order they come in.",
    render:function(){
      var open = S.examOpen ? examById(S.examOpen) : null;
      return open ? examHub(open) : examCatalogue();
    }
  };

  /* every exam stage as a shelf item the filters can see */
  function examShelf(){
    return EXAMS.map(function(e){
      return {id:e.id, kind:"exam", e:e, label:examLabel(e), grp:e.grp, body:e.body,
              meta:e.fmt + " · " + WHEN_LABEL[e.when], d:e.d};
    });
  }

  function examCatalogue(){
    var shelf = examShelf();
    var vis = shelf.filter(function(o){ return prepMatches(o) && prepInGroup(o); });
    var h = prepTabs("exam", shelf.length);

    if (S.prepTab === "route"){
      return h + '<div id="prepPanel" role="tabpanel" tabindex="-1">' + routePanel() + "</div>";
    }

    h += '<div id="prepPanel" role="tabpanel" tabindex="-1">' + prepFilters(shelf, "exams");
    if (!vis.length){
      return h + '<p class="empty"><b>Nothing matches.</b>Try a college, a specialty, or part of the ' +
        "exam name.</p></div>";
    }

    var rec = recommendedExams();
    var shown = {}, out = "";
    /* one grid per section. The section label carries the meaning, so the card
       never has to explain twice why it is where it is. */
    function section(label, items, lead){
      if (!items.length) return;
      out += '<p class="sec-label">' + esc(label) + "</p>";
      out += '<div class="pgrid">' + items.map(function(o, i){
        shown[o.id] = 1;
        return examCard(o.e, o.why || "", lead && i === 0);
      }).join("") + "</div>";
    }

    /* only worth recommending when the doctor has not filtered away from
       their own route */
    var recVis = rec.filter(function(r){
      return vis.some(function(o){ return o.id === r.exam.id; });
    }).map(function(r){ return {id:r.exam.id, e:r.exam, why:r.why}; });
    section("Recommended for you", recVis, true);
    if (!recVis.length && !S.specialty && !S.prepQuery && !S.prepGroup){
      out += ctx("No specialty set, so nothing is recommended yet. Everything below is still here to browse, " +
        "and setting a route on your profile turns this into a shortlist.");
    }

    section("Also included with your route", vis.filter(function(o){
      return examIncluded(o.id) && !shown[o.id]; }), false);
    section("You have unlocked", vis.filter(function(o){
      return !examIncluded(o.id) && prepUnlocked(o.id) && !shown[o.id]; }), false);

    var rest = vis.filter(function(o){ return !shown[o.id]; });
    if (rest.length){
      out += '<p class="sec-label">Browse other routes</p>';
      prepGroups(rest).forEach(function(g){
        out += groupHead(g, true);
        out += '<div class="pgrid">' + rest.filter(function(o){ return specGroup(o.grp) === g; })
          .map(function(o){ return examCard(o.e, "", false); }).join("") + "</div>";
      });
    }
    h += out;
    h += ctxFoot("Unlocking records that you want a prep. Nothing here charges anybody and no billing is wired " +
      "up in this prototype. Stage names, formats and structures are illustrative and are each college's to " +
      "set: confirm the current structure before planning around it.");
    return h + "</div>";
  }

  /* One exam stage as a course card. The colour band says exam, the kind line
     says it again in words, and the progress bar only appears when there is
     something real to draw: an empty bar reads as nought out of a hundred. */
  function examCard(e, why, lead){
    var held = stageHeld(e.id), wk = weeksTo(e), pred = predictedFor(e.id);
    var inc = examIncluded(e.id), open = prepOpen(e.id, inc);
    var topics = topicsFor(e.id), covered = Object.keys(topics).filter(function(k){ return topics[k]; }).length;

    var state = held ? "held" : inc ? "included" : open ? "unlocked" : "locked";
    /* the eyebrow leads with the specialty, in that specialty's own colour, so
       the band above it is never a hue with nothing to read it against */
    var h = '<div class="pc ' + specClass(e.grp) + (lead ? " lead" : "") + (open ? "" : " lock") + '">' +
      '<div class="pc-band" aria-hidden="true"></div><div class="pc-b">' +
      '<p class="pc-k">' + ico(I.book, 11) + esc(e.grp) + " \u00b7 " + esc(e.body) +
        " \u00b7 " + esc(state) + "</p>" +
      "<h2>" + esc(examLabel(e)) + "</h2>" +
