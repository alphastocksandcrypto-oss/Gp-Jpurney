       exam stages must not be shown a third as passed */
    var qualified = S.stage !== "student";
    var onLadder = S.clinicalMonths > 0;
    var m = [
      {t:"Final medical degree", when:"Complete", state: qualified ? "done" : "todo"},
      {t:"Internship", when: onLadder ? "Complete" : "Not started", state: onLadder ? "done" : "todo"},
      {t:"IMC registration", when: onLadder ? "Complete" : "Not started", state: onLadder ? "done" : "todo"}
    ];
    [S.exam + " Part 1", S.exam + " Part 2 written", S.exam + " clinical exam"].forEach(function(label, n){
      m.push({t:label, when: stagesHeld() > n ? "Passed" : "Not held", state: stagesHeld() > n ? "done" : "todo"});
    });
    m.push({t:"Advanced Life Support", when: onLadder ? "Held" : "Not held", state: onLadder ? "done" : "todo"});
    m.push({t:"Basic specialist training, year 1", when: S.clinicalMonths >= 12 ? "Complete" : "In progress",
            state: S.clinicalMonths >= 12 ? "done" : "todo"});
    m.push({t:"Basic specialist training, year 2", when: S.clinicalMonths >= 24 ? "Complete" : "In progress",
            state: S.clinicalMonths >= 24 ? "done" : "todo"});

    m.push({t:"Audit and QI project", state: S.auditComplete >= 1 ? "done" : "doing",
     pct: S.auditComplete >= 1 ? 100 : S.qiPct, when: S.auditComplete >= 1 ? "Complete" : S.qiPct + "% done",
     act:"finishQI", cta:"Mark complete"});
    m.push({t:"Teaching sessions", state: S.teachingDone >= S.teachingTarget ? "done" : "doing",
     pct: Math.round(S.teachingDone / S.teachingTarget * 100),
     when: S.teachingDone + " of " + S.teachingTarget, act:"logTeaching", cta:"Log a session"});
    m.push({t:"Research output", state: S.research >= 2 ? "done" : (S.research >= 1 ? "doing" : "todo"),
     pct: Math.min(100, Math.round(S.research / 2 * 100)), when: S.research + " of 2",
     act:"addResearch", cta:"Record output"});
    m.push({t:"Leadership training", state: S.leadership ? "done" : "todo", when:"Optional",
     act:"doLeadership", cta:"Mark complete"});

    /* the tail of the ladder is the application itself, and a consultant has
       already walked it: showing them an upcoming application is the loudest
       possible sign nothing here adapts */
    var msit = situation();
    if (msit.stillApplying){
      var mc = msit.cycle;
      m.push({t: msit.target + " application", state:"todo",
        when: mc ? "Closes " + fmt(mc.apply) : "Date not set"});
      m.push({t:"Interview preparation", state:"todo",
        when: mc ? "From " + fmt(addDays(mc.apply, 7)) : "After applications close"});
      m.push({t: msit.target + " interview", state:"todo",
        when: mc ? fmtLong(mc.interview) : "Date not set"});
      m.push({t:"CSCST", state:"todo", when:"Future"});
    }

    (S.customMilestones || []).forEach(function(c){ m.push({t:c, state:"todo", when:"Custom", custom:true}); });
    return m;
  }

  /* ================= DEADLINES ================= */
  function deadlines(){
    /* Every official row is composed from the doctor's own target and college,
       never written out as a literal. A surgical trainee used to be shown
       "HST Cardiology applications close" because these strings were hardcoded. */
    var sit = situation();
    /* The doctor's own dates, and only the ones they actually set. Two rows
       used to be hardcoded here with fixed 2026 dates and the words "Your own
       deadline" -- a claim the doctor had set them. They set them now, on the
       requirement itself, in the tracker. */
    var out = ownDueRows();
    /* a consultant has no application cycle ahead of them, and showing one
       would be the clearest possible tell that nothing here is really adapting */
    if (sit.stillApplying && sit.cycle){
      var c = sit.cycle, col = sit.college, tgt = sit.target;
      out.push(
        {id:"apps",   t:tgt + " applications close", iso:c.apply, kind:"official", note:col + ", 5pm"},
        {id:"upload", t:"Portfolio evidence upload closes", iso:addDays(c.apply, 26), kind:"official",
         note:col + ", evidence must already be dated"},
        {id:"iview",  t:tgt + " interviews", iso:c.interview, kind:"official", note:col + ", week commencing"},
        {id:"offers", t:"Offers issued", iso:addDays(c.interview, 39), kind:"official", note:col},
        {id:"start",  t:tgt + " post starts", iso:c.start, kind:"official", note:col}
      );
    }
    return out.map(function(d){ d.days = until(d.iso); d.done = !!S.deadlinesDone[d.id]; return d; });
  }
  /* Every date the record holds, across every programme tracked, each one
     tagged with the application it belongs to. deadlines() above stays exactly
     as it was -- seven other callers read it for the primary route -- and this
     sits beside it for the merged calendar. */
  function allDates(){
    var out = ownDueRows().map(function(d){
      d.prog = null; d.progName = "Counts for every application"; return d;
    });
    progsTracked().forEach(function(p){
      var c = cycleForProg(p);
      if (!c) return;
      /* cycleEvents prefixes each row with the target name ("HST Cardiology
         applications close"). Here the row already carries the programme as
         a chip, so the prefix is stripped rather than said twice -- and the
         WHOLE name goes, not just the specialty, or "HST" is left behind. */
      var nm = (SPECIALTY_INFO[p.specialty] || {}).target || p.specialty;
      cycleEvents(c, p.specialty).forEach(function(e, i){
        var t = e.t.replace(nm, "").replace(/\s+/g, " ").trim() || e.t;
        t = t.charAt(0).toUpperCase() + t.slice(1);
        out.push({id:p.id + ":" + i, t:t,
                  iso:e.iso, kind:"official", prog:p, progName:p.t,
                  note:p.body});
      });
    });
    return out.map(function(d){ d.days = until(d.iso); return d; })
      .sort(function(a, b){ return day(a.iso) - day(b.iso); });
  }
  /* Two programmes under the same college share a cycle, so the raw list says
     "Applications close, 8 Nov" once per application -- five dates rendered as
     ten near-identical rows whose only difference is the chip. One date is one
     row, carrying every programme it belongs to. They are still two separate
     applications; this is one calendar entry, not one deadline. */
  function datesGrouped(rows){
    var out = [], byKey = {};
    rows.forEach(function(d){
      var k = d.kind + "|" + d.t + "|" + d.iso + "|" + (d.note || "");
      if (byKey[k]){ byKey[k].progs.push(d.progName); return; }
      var row = {};
      Object.keys(d).forEach(function(f){ row[f] = d[f]; });
      row.progs = [d.progName];
      byKey[k] = row; out.push(row);
    });
    return out;
  }

  function nextDeadline(){
    /* Today answers "what is next for me". A college date belonging to a cycle
       this doctor cannot meet is real, but it is not theirs, and surfacing it
       as their next deadline is what made the dashboard read like a verdict.
       The deadlines page still lists every date, labelled. */
    var elig = cycleEligibility();
    var skipOfficial = elig && !elig.eligible;
    var open = deadlines().filter(function(d){
      if (d.done || d.days < 0) return false;
      return !(skipOfficial && d.kind === "official");
    });
    return open.length ? open[0] : null;
  }

  /* ================= HEDGING AND LOCATION =================
     Onboarding lets a doctor name other specialties they are applying to and
     a region they would work in. Neither is scored: they filter and remind,
     they never move readiness or the shortlisting score.

     SPECIALTY_INFO and CYCLE below exist only so "also applying to" can name
     a real exam family and college for whichever specialty was picked, and
     show it a plausible next date rather than nothing. The dates in CYCLE are
     illustrative in exactly the way the primary deadlines() above already are,
     see the README placeholders list. */
  var SPECIALTY_INFO = {
    "General Internal Medicine":   {exam:"MRCPI",             body:"RCPI",                              target:"HST General Internal Medicine"},
    "Cardiology":                  {exam:"MRCPI",             body:"RCPI",                              target:"HST Cardiology"},
    "Respiratory Medicine":        {exam:"MRCPI",             body:"RCPI",                              target:"HST Respiratory Medicine"},
    "Gastroenterology":            {exam:"MRCPI",             body:"RCPI",                              target:"HST Gastroenterology"},
    "Nephrology":                  {exam:"MRCPI",             body:"RCPI",                              target:"HST Nephrology"},
    "Geriatric Medicine":          {exam:"MRCPI",             body:"RCPI",                              target:"HST Geriatric Medicine"},
    "Neurology":                   {exam:"MRCPI",             body:"RCPI",                              target:"HST Neurology"},
    "General Surgery":             {exam:"MRCS",              body:"RCSI",                              target:"HST General Surgery"},
    "Trauma and Orthopaedics":     {exam:"MRCS",              body:"RCSI",                              target:"HST Trauma and Orthopaedics"},
    "Urology":                     {exam:"MRCS",              body:"RCSI",                              target:"HST Urology"},
    "Otolaryngology, ENT":         {exam:"MRCS",              body:"RCSI",                              target:"HST Otolaryngology"},
    "Plastic Surgery":             {exam:"MRCS",              body:"RCSI",                              target:"HST Plastic Surgery"},
    "General Practice":            {exam:"MICGP",             body:"ICGP",                              target:"GP training scheme"},
    "Psychiatry":                  {exam:"MRCPsych",          body:"College of Psychiatrists",          target:"HST Psychiatry"},
    "Emergency Medicine":          {exam:"MRCEM",             body:"RCSI",                              target:"HST Emergency Medicine"},
    "Anaesthesiology":             {exam:"FFARCSI",           body:"College of Anaesthesiologists",     target:"HST Anaesthesiology"},
    "Paediatrics":                 {exam:"MRCPI Paediatrics", body:"RCPI",                              target:"HST Paediatrics"},
    "Obstetrics and Gynaecology":  {exam:"MRCPI O and G",     body:"RCPI",                              target:"HST Obstetrics and Gynaecology"},
    "Radiology":                   {exam:"FRCR",              body:"Faculty of Radiologists",           target:"Radiology training"},
    "Histopathology":              {exam:"FRCPath",           body:"Faculty of Pathology",              target:"Histopathology training"},
    "Ophthalmology":               {exam:"FRCOphth",          body:"RCSI",                              target:"Ophthalmology training"},
    "Public Health Medicine":      {exam:"MFPHMI",            body:"Faculty of Public Health Medicine", target:"Public Health Medicine training"}
  };
  /* one illustrative cycle per college, distinct so several other-target
     cards never look copy-pasted from each other */
  var CYCLE = {
    "RCPI":                                {apply:"2026-11-08", interview:"2027-01-18", start:"2027-07-12", offers:"2027-02-26"},
    "RCSI":                                {apply:"2026-10-01", interview:"2026-12-10", start:"2027-07-06", offers:"2027-01-22"},
    "College of Psychiatrists":            {apply:"2026-09-19", interview:"2026-11-21", start:"2027-07-05", offers:"2027-01-09"},
    "ICGP":                                {apply:"2026-12-05", interview:"2027-02-10", start:"2027-07-01", offers:"2027-03-19"},
    "College of Anaesthesiologists":       {apply:"2026-10-24", interview:"2027-01-08", start:"2027-07-13", offers:"2027-02-19"},
    "Faculty of Radiologists":             {apply:"2026-11-14", interview:"2027-01-27", start:"2027-07-06", offers:"2027-03-05"},
    "Faculty of Pathology":                {apply:"2026-10-17", interview:"2027-01-15", start:"2027-07-06", offers:"2027-02-23"},
    "Faculty of Public Health Medicine":   {apply:"2026-09-26", interview:"2026-12-04", start:"2027-07-01", offers:"2027-01-15"}
  };
  /* the resolved list, excluding whatever is already the primary target and
     anything we have no record for, so a stray or malformed name never renders */
  /* ================= THE PROGRAMME REGISTRY =================
     A PROGRAMME is the thing a doctor actually applies to: it has a tier, a
     college, a cycle, an entry exam, an interview and a checklist. Until now
     the product had no such object. Every target it could name was HST
     something or a named scheme, tier was DERIVED from months post-internship
     and never chosen, and yet INTERVIEWS already shipped three tier:"bst"
     products. A doctor could buy BST General Internal Medicine interview prep
     for a programme the tracker could not track.

     The entry layer is written out because it does not follow from anything we
     already hold: Irish basic specialist training is a handful of broad
     schemes, not one per specialty. There is no BST Cardiology — you do BST
     General Internal Medicine and then apply to HST Cardiology, which is what
     feeds[] records. The higher layer IS derivable, so it is generated from
     SPECIALTY_INFO rather than typed twice and left to drift.

     ILLUSTRATIVE, like everything else of this kind here. The scheme names and
     which specialties each one feeds are the shape Irish training takes, not
     any college's published prospectus. See the README placeholders list. */
  var ENTRY_PROGRAMMES = [
    {id:"bst-gim",   t:"BST General Internal Medicine", grp:"Medicine", body:"RCPI",
     fam:"MRCPI", iv:"bst-gim",
     d:"The medicine trunk. Most RCPI higher specialties are entered from it rather than directly.",
     feeds:["General Internal Medicine","Cardiology","Respiratory Medicine","Gastroenterology",
            "Nephrology","Geriatric Medicine","Neurology"]},
    {id:"cst",       t:"Core surgical training", grp:"Surgery", body:"RCSI",
     fam:"MRCS", iv:"bst-surg",
     d:"The surgical trunk, entered before any of the higher surgical specialties.",
     feeds:["General Surgery","Trauma and Orthopaedics","Urology","Otolaryngology, ENT","Plastic Surgery"]},
    {id:"bst-paeds", t:"BST Paediatrics", grp:"Paediatrics", body:"RCPI",
     fam:"MRCPI Paediatrics", iv:"paeds-sel",
     d:"Basic specialist training in paediatrics.", feeds:["Paediatrics"]},
    {id:"bst-og",    t:"BST Obstetrics and Gynaecology", grp:"Obstetrics and Gynaecology", body:"RCPI",
     fam:"MRCPI O and G", iv:"og-sel",
     d:"Basic specialist training in obstetrics and gynaecology.", feeds:["Obstetrics and Gynaecology"]},
    {id:"bst-psych", t:"BST Psychiatry", grp:"Psychiatry", body:"College of Psychiatrists",
     fam:"MRCPsych", iv:"psych-sel",
     d:"Basic specialist training in psychiatry.", feeds:["Psychiatry"]},
    {id:"bst-em",    t:"BST Emergency Medicine", grp:"Emergency Medicine", body:"RCSI",
     fam:"MRCEM", iv:"em-sel",
     d:"Basic specialist training in emergency medicine.", feeds:["Emergency Medicine"]}
  ];

  /* specialties entered directly rather than through a trunk. These have one
     programme, not two, and calling it "higher" would be wrong. */
  var RUN_THROUGH = ["General Practice", "Anaesthesiology", "Radiology", "Histopathology",
                     "Ophthalmology", "Public Health Medicine"];

  function programmes(){
    var out = ENTRY_PROGRAMMES.map(function(e){
      return {id:e.id, t:e.t, tier:"bst", grp:e.grp, body:e.body, fam:e.fam, iv:e.iv,
              d:e.d, feeds:e.feeds, specialty:e.feeds[0]};
    });
    /* the higher and run-through layer, generated so it can never disagree
       with the table the rest of the app scores against */
    Object.keys(SPECIALTY_INFO).forEach(function(sp){
      var info = SPECIALTY_INFO[sp], run = RUN_THROUGH.indexOf(sp) > -1;
      out.push({
        id: "p-" + sp.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, ""),
        t: info.target, tier: run ? "run" : "hst", grp: examGroupFor(sp), body: info.body,
        /* no iv here: it is resolved by ivForProgramme() from the PROGRAMME's
           own tier. Reading interviewFor(sp) would resolve it from the
           doctor's derived tier, which is exactly the bug below. */
        fam: entryFamilyFor(sp), iv: "",
        d: run ? "Entered directly rather than through a basic training trunk."
               : "Higher specialist training, entered after a basic training trunk.",
        feeds: [], specialty: sp
      });
    });
    return out;
  }
  /* The interview a PROGRAMME runs, resolved from that programme's tier rather
     than the doctor's. situation().tier holds one value for the whole doctor,
     so a doctor tracking a trunk and the thing it feeds — which is the normal
     case, not an edge case — collapsed to a single interview and was shown the
     HST panel for an application that is two years away, while the BST panel
     they are actually sitting went missing. */
  function ivForProgramme(p){
    if (!p) return null;
    if (p.iv) return interviewById(p.iv);
    var pool = INTERVIEWS.filter(function(x){ return x.body === p.body; });
    var want = p.tier === "hst" ? "hst" : p.tier === "bst" ? "bst" : null;
    return (want && pool.filter(function(x){ return x.tier === want; })[0]) || pool[0] || null;
  }
  function progById(id){ return programmes().filter(function(p){ return p.id === id; })[0] || null; }
  /* the trunk a higher programme is entered from, which is the question a
     doctor at BST actually has: what do I apply to FIRST to end up here */
  function trunkFor(specialty){
    return ENTRY_PROGRAMMES.filter(function(e){ return e.feeds.indexOf(specialty) > -1; })[0] || null;
  }
  /* the specialty group a programme belongs to, so the picker can wear the
     same colours the prep shelves do */
  function examGroupFor(sp){
    var fam = entryFamilyFor(sp);
    var e = EXAMS.filter(function(x){ return x.fam === fam; })[0];
    return e ? e.grp : "Other specialties";
  }

  /* ---- which programmes this doctor tracks ----
     S.programmes is the record. S.specialty and S.otherTargets stay as a
     DERIVED view of it, because fifty call sites across the app read them and
     rewriting all of them at once to gain nothing is how a working product
     gets broken. New surfaces read programmes; everything else keeps working. */
  function progsTracked(){
    var all = programmes(), ids = S.programmes || [];
    var out = ids.map(progById).filter(Boolean);
    if (!out.length){
      /* a record made before programmes existed. Seed from what it does hold,
         rather than showing a doctor mid-application an empty tracker. */
      [S.specialty].concat(S.otherTargets || []).filter(Boolean).forEach(function(sp){
        var p = all.filter(function(x){ return x.specialty === sp && x.tier !== "bst"; })[0];
        if (p && out.indexOf(p) === -1) out.push(p);
      });
    }
    return out;
  }
  function progTracked(id){ return progsTracked().some(function(p){ return p.id === id; }); }

  /* writing back. The derived view is rebuilt here and nowhere else. */
  function setProgrammes(ids){
    S.programmes = ids.filter(function(id, i, a){ return id && a.indexOf(id) === i; });
    var list = S.programmes.map(progById).filter(Boolean);
    if (list.length){
      var first = list[0];
      if (SPECIALTY_INFO[first.specialty]){
        S.specialty = first.specialty;
        S.target = SPECIALTY_INFO[first.specialty].target;
        S.body   = SPECIALTY_INFO[first.specialty].body;
        S.exam   = SPECIALTY_INFO[first.specialty].exam;
      }
      S.otherTargets = list.slice(1).map(function(p){ return p.specialty; })
        .filter(function(sp){ return sp && sp !== S.specialty; });
      S.dualTrack = S.otherTargets.length ? "multi" : "single";
    }
    save();
  }

  /* ---- recommended, and why ----
     One rule per reason, and the sentence is COMPOSED from the record at
     render time. The moment a why is stored as a literal it starts lying to
     somebody: "Matched to you" hardcodes "closes your largest gap" onto a QI
     course and says it to a surgeon who has none left. */
  function recommendProgrammes(){
    var sit = situation(), t = routeTiming(), out = [], seen = {};
    var all = programmes();
    function add(p, why, rank){
      if (!p || seen[p.id] || progTracked(p.id)) return;
      seen[p.id] = 1; out.push({prog:p, why:why, rank:rank});
    }
    if (!sit.hasTarget || !sit.stillApplying) return out;

    var mine = S.specialty;
    var trunk = trunkFor(mine);
    var atTrunk = sit.isStudent || sit.isIntern ||
                  (sit.tier === "bst" && t.stageYear < STAGE_YEARS.bst) || t.holding;

    /* the one a doctor at this stage actually applies to next */
    if (trunk && atTrunk){
      /* "0 years post-internship" is not a sentence anybody says to an intern */
      var where = sit.isStudent ? "You are still a student"
        : sit.isIntern ? "You are in your intern year"
        : t.holding ? "You are " + t.yearsIn + " years post-internship and outside a scheme"
        : "You are " + t.yearsIn + " years post-internship";
      add(all.filter(function(p){ return p.id === trunk.id; })[0],
        where + ", and " + trunk.t + " is the trunk " + mine + " is entered from.", 1);
    }
    var own = all.filter(function(p){ return p.specialty === mine && p.tier !== "bst"; })[0];
    add(own, "It is the programme your specialty leads to.", trunk && atTrunk ? 2 : 1);

    /* anything entered on an exam already held. A fact about our own registry,
       not a claim about entry rules. */
    var held = stagesHeld(mine);
    if (held > 0){
      all.filter(function(p){ return p.fam === entryFamilyFor(mine) && p.specialty !== mine; })
        .slice(0, 4).forEach(function(p){
          add(p, "Entered on " + entryFamilyFor(mine) + ", which you already hold " +
            held + " stage" + (held === 1 ? "" : "s") + " of.", 3);
        });
    }
    /* the sideways move the product owner named, and only that one */
    (PIVOTS[sit.exam] || []).forEach(function(sp){
      var p = all.filter(function(x){ return x.specialty === sp && x.tier !== "hst"; })[0];
      add(p, "A different exam, but hospital training is commonly credited towards it.", 4);
    });
    return out.sort(function(a, b){ return a.rank - b.rank; });
  }

  function otherTargetsInfo(){
    return (S.otherTargets || []).filter(function(n){ return n && n !== S.specialty; })
      .map(function(n){ return {name:n, exam:(SPECIALTY_INFO[n] || {}).exam, body:(SPECIALTY_INFO[n] || {}).body}; })
      .filter(function(o){ return !!o.body; });
  }
  var REGION_LABEL = {
    east:"Dublin and the east", sw:"Cork and the south west", west:"Galway and the west",
    mw:"Limerick and the mid west", se:"The south east", mid:"The midlands",
    ne:"The north east", nw:"The north west", outside:"Outside Ireland", any:"Anywhere in Ireland"
  };
  var REGIONS = ["east","sw","west","mw","se","mid","ne","nw"];
  function regionLabel(id){ return REGION_LABEL[id] || id; }
  /* an item matches if the doctor said "anywhere", said nothing at all, or
     named this item's own region. Nothing is ever hidden, only reordered and
     badged, since a handful of demo rows filtered down to zero would read as
     "nothing found" rather than "this is a small demo". */
  function regionMatches(itemRegion){
    var w = S.willing || [];
    if (!w.length || w.indexOf("any") > -1) return true;
    return itemRegion === "any" || w.indexOf(itemRegion) > -1;
  }

  /* ================= PRACTICAL TRACKING =================
     Garda vetting and occupational health. None of this is scored: it never
     moves readiness or the shortlisting score, it is administrative state with
     its own clock, separate from the training one. It had two pages of its own
     and has neither now -- both are requirements on the application checklist,
     which is where a doctor meets them. */
  function addDays(iso, n){ var d = day(iso); d.setDate(d.getDate() + n); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  /* Garda vetting is not a one-off tick: it renews every 3 years, so the
     thing worth showing is not "done" but "days until it needs doing again". */
  function gardaExpiry(){ return S.gardaVettingDate ? addDays(S.gardaVettingDate, 365 * 3) : null; }
  function gardaDaysLeft(){ var e = gardaExpiry(); return e ? until(e) : null; }
  function gardaStatus(){
    if (!S.gardaVettingDate) return {k:"crit", label:"Not logged"};
    var d = gardaDaysLeft();
    if (d < 0) return {k:"crit", label:"Expired"};
    if (d <= 56) return {k:"crit", label:"Renew soon"};
    if (d <= 180) return {k:"warn", label:"Renew this year"};
    return {k:"good", label:"Current"};
  }
  /* the target follows the doctor's regime until they set one themselves, at
     which point their own number wins and stops moving under them */
  /* who the admin page leads with. Nothing is hidden from anyone, this only
     changes which line opens the page: someone newly in the Irish system is
     the person this page matters most to, per the product owner. */
  function newToIrishSystem(){ return S.route === "coming" || (S.origin === "noneu" && S.clinicalMonths < 12); }

  /* ================= SITUATION =================
     One derivation, read by every view. Before this existed, adaptivity was
     three scattered conditionals and the rest of the app rendered the same
     thing for an intern, an SHO and a consultant. The rule now: no view reads
     a raw record field to decide what kind of doctor this is, it asks here.
     Adding a grade or a specialty updates every view at once. */
  function situation(){
    var info = SPECIALTY_INFO[S.specialty] || {};
    var college = info.body || S.body || "";
    var cyc = CYCLE[college] || null;
    var months = S.clinicalMonths;

    /* tier is derived from what the doctor actually told us, not stored, so it
       cannot drift out of sync with the months and stage behind it */
    var tier = S.stage === "student" ? "student"
      : S.stage === "consultant" ? "consultant"
      : months <= 0 ? "intern"
      : S.stage === "spr" || S.stage === "hst" ? "hst"
      : "bst";

    var others = otherTargetsInfo();
    var applyDays = cyc ? until(cyc.apply) : null;

    return {
      tier: tier,
      isStudent: tier === "student",
      isIntern: tier === "intern",
      isConsultant: tier === "consultant",
      /* a consultant is the one group for whom the whole shortlisting apparatus
         is behind them, and pretending otherwise is the fastest way to look
         like a toy */
      stillApplying: tier !== "consultant",
      college: college,
      exam: info.exam || S.exam || "",
      target: info.target || S.target || "",
      hasTarget: !!S.specialty,
      /* hedging: a doctor running two applications is a different product to
         one running a single track, and the dashboard should say so */
      targetCount: 1 + others.length,
      dualTrack: others.length > 0,
      others: others,
      newToIreland: newToIrishSystem(),
      isIMG: S.route === "coming" || S.origin === "noneu" || S.origin === "eu",
      cycle: cyc,
      applyDays: applyDays,
      /* where in the annual cycle they are sitting right now */
      phase: applyDays === null ? "unknown"
        : applyDays > 120 ? "far"
        : applyDays >= 0 ? "approaching"
        : "closed"
    };
  }

  /* ================= CYCLE ELIGIBILITY =================
     A date can be correct and still land wrong. A doctor four months into
     Irish practice was being shown "applications close in 9 days" in critical
     red beside a score of 0 out of 35, which reads as "you have already
     failed" when the truth is that this cycle was never theirs and they are
     building for the next one.

     ENTRY is ILLUSTRATIVE, like the DOMAINS bands and the CYCLE dates it sits
     beside. Replace with each college's published eligibility rules. See the
     README placeholders list. */
  var ENTRY = { monthsByStart: 24, examStagesByApply: 1 };

  /* ================= ROUTE TIMING =================
     The ladder used to assume a doctor moves up one rung at a time and never
     stalls, which is not how Irish training actually runs. HST places are
     limited, so people do standalone registrar years, apply more than once,
     and arrive at the same rung years apart. An IMG can spend three years
     reaching where an Irish graduate got in one. A model that cannot show
     that will tell most of its users they are behind.

     So position is three numbers, not one: which stage, which year inside it,
     and how long has been spent NOT progressing. Holding time is reported as
     its own fact rather than folded into the stage, because "BST year 4" is
     not a thing and saying it would be wrong.

     STAGE_YEARS is ILLUSTRATIVE. Intern and BST are stable across routes;
     HST length genuinely varies by specialty and only the ones named below
     came from the product owner. Everything else falls back to the default
     and needs the real published figure. See README placeholders. */
  var STAGE_YEARS = { intern: 1, bst: 2, hst: 6 };
  var HST_YEARS = { "Cardiology": 6, "General Practice": 4 };

  function hstYears(){ return HST_YEARS[S.specialty] || STAGE_YEARS.hst; }

  function routeTiming(){
    var sit = situation();
    var m = S.clinicalMonths;
    var bstMonths = STAGE_YEARS.bst * 12;

    /* how much of the elapsed time is accounted for by the stage they are in,
       and how much is time spent waiting for a place */
    var stageYear, holdingMonths = 0;
    /* once the doctor has told us they are outside a scheme, believe them
       rather than inferring from months: someone who finished BST and went
       standalone looks identical to someone who never got a place */
    if (S.inScheme === false){
      stageYear = 1;
      holdingMonths = Math.max(0, m - bstMonths);
    } else if (sit.tier === "bst"){
      stageYear = S.schemeYear || Math.min(STAGE_YEARS.bst, Math.floor(m / 12) + 1);
      holdingMonths = S.inScheme === true ? 0 : Math.max(0, m - bstMonths);
    } else if (sit.tier === "hst"){
      stageYear = Math.max(1, Math.floor((m - bstMonths) / 12) + 1);
    } else {
      stageYear = 1;
    }

    /* remaining is a range, never a date. Places are limited and a doctor who
       does not get in this cycle has not failed a schedule we invented. */
    var remainLow, remainHigh;
    if (sit.tier === "consultant"){ remainLow = remainHigh = 0; }
    else if (sit.tier === "hst"){
      var doneHst = Math.max(0, (m - bstMonths) / 12);
      remainLow = Math.max(0, hstYears() - doneHst);
      remainHigh = remainLow + 1;
    } else {
      var bstLeft = Math.max(0, STAGE_YEARS.bst - m / 12);
      var internLeft = sit.tier === "intern" || sit.isStudent ? STAGE_YEARS.intern : 0;
      var studentLeft = sit.isStudent ? 1 : 0;
      remainLow = studentLeft + internLeft + bstLeft + hstYears();
      /* the high end carries one more application cycle, because not getting
         a place first time is common rather than exceptional */
      remainHigh = remainLow + 1;
    }
    return {
      stageYear: stageYear,
      stageYears: sit.tier === "hst" ? hstYears() : (sit.tier === "bst" ? STAGE_YEARS.bst : 1),
      holdingMonths: holdingMonths,
      holding: holdingMonths >= 6,
      yearsIn: +(m / 12).toFixed(1),
      remainLow: Math.round(remainLow),
      remainHigh: Math.round(remainHigh),
      totalTypical: STAGE_YEARS.intern + STAGE_YEARS.bst + hstYears()
    };
  }

  /* What to do next depends on where they are standing, not on which domain
     scores lowest. An intern's next move is an application; a first-year BST
     trainee's is an exam; a standalone registrar's is getting a place at all.
     Each returns the module that actually helps with that. */
  function nextStep(){
    var sit = situation(), t = routeTiming();
    if (sit.isConsultant) return null;

    if (t.holding){
      return {k:"Get a training place", t:"Getting into a scheme is the step", usesCycle:true,
        why:"You are " + t.yearsIn + " years post-internship and not in a training post. That is common when " +
             "places are limited, and the portfolio is what moves it.",
        links:[["#/gaps","Close the gaps"],["#/readiness","Check your readiness"]]};
    }
    if (sit.isStudent || sit.isIntern){
      /* deliberately no date: the cycle we hold is the HST one, and showing an
         HST closing date to someone applying to BST would be worse than
         showing none */
      return {k:"Your next application", t:"Apply to basic specialist training",
        why:"Intern year leads into BST, and that application is scored on the portfolio you build during it. " +
             "BST dates are set separately from the " + sit.target + " cycle shown elsewhere.",
        links:[["#/readiness","Check your readiness"],["#/interviews","Interview prep"]]};
    }
    if (sit.tier === "bst" && t.stageYear <= 1 && stagesHeld() < stagesTotal()){
      return {k:"Your next milestone", t:"Sit the " + sit.exam + " parts you do not hold",
        why:"First year of BST is when the membership exam is cheapest to sit. HST applications ask for it.",
        links:[["#/exams", sit.exam + " prep"],["#/gaps","See what else is missing"]]};
    }
    if (sit.tier === "bst"){
      return {k:"Your next application", t:"Apply to " + sit.target, usesCycle:true,
        why:"Second year of BST is the application year. The interview follows within months of it closing.",
        links:[["#/readiness","Check your readiness"],["#/interviews","Interview prep"]]};
    }
    return {k:"Your next milestone", t:"Complete " + sit.target + " and reach CSCST",
      why:"You hold a training place. Progress is logged year by year on the tracker.",
      links:[["#/progress","Progress tracker"]]};
  }

  function cycleEligibility(){
    var sit = situation();
    if (!sit.stillApplying || !sit.cycle) return null;
    var c = sit.cycle;
    /* eligibility is judged at the post start date, not today: months keep
       accruing between now and July, and not counting them would understate
       everyone mid-cycle */
    var monthsAtStart = S.clinicalMonths + Math.max(0, Math.floor(until(c.start) / 30.44));
    var gaps = [];
    if (monthsAtStart < ENTRY.monthsByStart)
      gaps.push("you would have " + monthsAtStart + " months post-internship by " +
        fmtLong(c.start) + ", and entry is set around " + ENTRY.monthsByStart);
    if (stagesHeld() < ENTRY.examStagesByApply)
      gaps.push("no " + sit.exam + " stage is held yet, and applications close " + fmtLong(c.apply));
    /* Not simply "next year". Someone four months in does not become eligible
       by waiting one cycle, and naming the wrong one is the same failure as
       naming the wrong college: confidently specific, and wrong. Step forward
       a year at a time until the months bar is actually met. */
    var yr = day(c.apply).getFullYear(), startIso = c.start, ahead = 0;
    while (ahead < 8){
      var m = S.clinicalMonths + Math.max(0, Math.floor(until(startIso) / 30.44));
      if (m >= ENTRY.monthsByStart) break;
      ahead++;
      startIso = addDays(startIso, 365);
    }
    var ty = yr + ahead;
    return {
      eligible: gaps.length === 0,
      gaps: gaps,
      monthsAtStart: monthsAtStart,
      cyclesAhead: ahead,
      thisCycle: yr + " to " + (yr + 1),
      targetCycle: ty + " to " + (ty + 1),
      targetStart: startIso
    };
  }

  /* ================= LADDER ================= */
  function rungs(){
    return [
      {t:"Internship", sub: S.clinicalMonths > 0 ? "Complete" : "Not started", state: S.clinicalMonths > 0 ? "done" : "todo"},
      {t:"Basic training", sub: S.clinicalMonths >= 24 ? "Complete" : S.clinicalMonths + " months", state: S.clinicalMonths >= 24 ? "done" : "todo"},
      {t:S.target, sub:"Not yet applied", state:"here"},
      {t:"CSCST", sub:"About 2033", state:"todo"},
      {t:"Consultant", sub:"Typical 11 years", state:"todo"}
    ];
  }

  /* ================= COMPONENTS ================= */
  var uid = 0;
  /* rings, bars and figures all render at zero and are animated to their real
     value after paint, so a recalculation is visible rather than instantaneous */
  function ring(pct, label){
    var r = 54, c = 2 * Math.PI * r, id = "rg" + (++uid);
    return '<div class="ring"><svg width="140" height="140" viewBox="0 0 140 140" role="img" aria-label="' + pct + '% ' + esc(label) + '">' +
      '<defs><linearGradient id="' + id + '" x1="0" y1="0" x2="1" y2="1">' +
        '<stop offset="0" stop-color="#14b394"/><stop offset="1" stop-color="#3ed1a8"/></linearGradient></defs>' +
      '<circle class="track" cx="70" cy="70" r="' + r + '" fill="none" stroke-width="13"/>' +
      '<circle class="fill" cx="70" cy="70" r="' + r + '" fill="none" stroke-width="13" stroke="url(#' + id + ')" ' +
        'stroke-dasharray="0 ' + c.toFixed(1) + '" data-dash="' + (c * pct / 100).toFixed(1) + " " + c.toFixed(1) + '"/>' +
      "</svg>" +
      '<span class="mid"><span><b class="num" data-count="' + pct + '" data-suffix="%">0%</b><span>' + esc(label) + "</span></span></span></div>";
  }
  function chip(s){ return '<span class="chip ' + s.k + '">' + ico(s.icon, 12) + esc(s.label) + "</span>"; }
  /* a caveat that has to sit with its claim but must not shout: two full amber
     panels on one page is how a warning colour stops being read */
  function ctxFoot(text){
    return '<div class="ctx foot">' + ico(I.warn, 13) + "<span>" + esc(text) + "</span></div>";
  }
  function ctx(text, illustrative){
    return '<div class="ctx' + (illustrative ? " illustrative" : "") + '">' +
      ico(illustrative ? I.warn : I.flag, 15) + "<span>" + esc(text) + "</span></div>";
  }
  function bar(pct){ return '<div class="bar"><i style="width:0%" data-w="' + pct + '"></i></div>'; }
  function stat(k, v, d, icon){
    return '<div class="stat">' + (icon ? '<span class="ic">' + ico(icon, 15) + "</span>" : "") +
      '<p class="k">' + esc(k) + '</p><p class="v num">' + v + '</p><p class="d">' + d + "</p></div>";
  }
  function counter(n, suffix){ return '<span data-count="' + n + '"' + (suffix ? ' data-suffix="' + suffix + '"' : "") + ">0" + (suffix || "") + "</span>"; }

  function animateAll(){
    var root = document.getElementById("view");
    root.querySelectorAll(".bar i[data-w]").forEach(function(el){
      var w = el.getAttribute("data-w") + "%";
      if (reduced){ el.style.width = w; return; }
      requestAnimationFrame(function(){ requestAnimationFrame(function(){ el.style.width = w; }); });
    });
    root.querySelectorAll(".ring .fill[data-dash]").forEach(function(el){
      var d = el.getAttribute("data-dash");
      if (reduced){ el.setAttribute("stroke-dasharray", d); return; }
      requestAnimationFrame(function(){ requestAnimationFrame(function(){ el.setAttribute("stroke-dasharray", d); }); });
    });
    root.querySelectorAll("[data-count]").forEach(function(el){
      var target = parseFloat(el.getAttribute("data-count")), suffix = el.getAttribute("data-suffix") || "";
      if (!isFinite(target)) return;
      if (reduced){ el.textContent = target + suffix; return; }
      var started = null, dur = 620;
      requestAnimationFrame(function step(ts){
        if (started === null) started = ts;
        var pr = Math.min((ts - started) / dur, 1), eased = 1 - Math.pow(1 - pr, 3);
        el.textContent = Math.round(target * eased) + suffix;
        if (pr < 1) requestAnimationFrame(step);
      });
    });
  }
  function actBtn(act, label, primary){
    return '<button class="btn btn-sm ' + (primary ? "btn-primary" : "btn-ghost") + '" data-act="' + act + '">' + esc(label) + "</button>";
  }

  /* ================= VIEWS ================= */
  var VIEWS = {};


  /* ================= PREP =================
     The one block on Today with a route to revenue, and the reason exam and
     interview prep get visited at all. Three registers, because the same card
     has to work for someone with an interview in a fortnight, someone two
     years out, and someone who has not picked a specialty.

     Weights come from DOMAINS, which the readiness page already tells doctors
     their interview is scored against. They are illustrative like everything
     else in the rubric. Nothing here claims to be published criteria. */
  function prepBlock(){
    var sit = situation();
    /* a consultant is not buying membership exam prep */
    if (!sit.stillApplying) return "";

    if (!sit.hasTarget){
      var common = ["Cardiology", "General Surgery", "General Practice"].map(function(n){
        return {n:n, exam:(SPECIALTY_INFO[n] || {}).exam, body:(SPECIALTY_INFO[n] || {}).body};
      });
      return '<div class="prep"><p class="k">Not sure yet</p>' +
        "<h2>Where most doctors start</h2>" +
        '<p class="lede">You do not have to decide today. These are the entry points doctors at your stage are ' +
        "usually choosing between, and each one leads to a different exam and a different college.</p>" +
        '<div class="prep-list">' + common.map(function(c){
          return '<div class="prep-row">' + esc(c.exam) + "<b>" + esc(c.body) + "</b></div>";
        }).join("") + "</div>" +
        '<div class="prep-cta"><a class="btn btn-sm btn-primary" href="#/profile">Pick a target specialty</a>' +
        '<a class="btn-link" href="#/roadmap">See how a route works</a></div></div>';
    }

    var c = sit.cycle, iv = c ? until(c.interview) : null;
    var elig = cycleEligibility();
    var near = iv !== null && iv >= 0 && iv <= 60 && (!elig || elig.eligible);
    var ranked = DOMAINS.slice().sort(function(a, b){ return b.weight - a.weight; });
    /* two open and two locked, not two and four: six rows made this block
       taller than the next move card it sits under */
    var open = ranked.slice(0, 2), locked = ranked.slice(2, 4), rest = ranked.length - 4;

    /* phrased without an article so it reads for every college: "an RCPI" and
       "a College of Psychiatrists" need different ones */
    return '<div class="prep"><p class="k">' + (near ? "Coming up" : "Worth knowing early") + "</p>" +
      "<h2>" + (near
        ? "Your interview is " + esc(awayText(iv))
        : "How " + esc(sit.college) + " scores your interview") + "</h2>" +
      '<p class="lede">' + (near
        ? "There are " + ranked.length + " scored domains and they are weighted. These two carry the most."
        : "Most doctors meet the scoring domains a fortnight before the interview. This far out is when they are " +
          "still cheap to fix.") + "</p>" +
      '<div class="prep-list">' +
      open.map(function(d){
        return '<div class="prep-row">' + esc(d.name) + "<b>" + d.weight + "%</b></div>";
      }).join("") +
      locked.map(function(d){
        return '<div class="prep-row locked">' + esc(d.name) + '<span class="lock">In interview prep</span></div>';
      }).join("") +
      (rest > 0 ? '<p class="lede" style="margin:2px 0 0">And ' + rest + " more, with what a strong answer covers.</p>" : "") +
      "</div>" +
      '<div class="prep-cta"><a class="btn btn-sm btn-primary" href="#/interviews">Open interview prep</a>' +
      (stagesHeld() < stagesTotal() ? '<a class="btn-link" href="#/exams">' + esc(sit.exam) + " prep</a>" : "") +
      "</div></div>";
  }

  VIEWS.today = {
    title:"Today", sub:"Your record, and the one thing worth doing next.",
    render:function(){
      var top = levers()[0], nd = nextDeadline();
      var open = deadlines().filter(function(d){ return !d.done && d.days >= 0; }).slice(0, 3);
      var hr = new Date().getHours();
      var greet = hr < 12 ? "Good morning" : (hr < 18 ? "Good afternoon" : "Good evening");
      var elig = cycleEligibility();
      var buildingForNext = elig && !elig.eligible;
      var h = '<p class="hello">' + greet + ", " + esc(S.name.split(/\s+/)[0]) + ".</p>" +
        '<p class="hello-sub">' + (buildingForNext
            ? "You are building towards the " + esc(elig.targetCycle) + " intake, not the one closing now."
            : top ? "One thing would move you further than anything else today."
                  : "Nothing is outstanding. Keep the evidence dated.") + "</p>";
      /* said once, at the top, before any figure that would otherwise read as
         a verdict on a race this doctor is not yet running */
      if (buildingForNext){
        h += ctx("The " + elig.thisCycle + " cycle is closing, but on your record it was never yours: " +
          elig.gaps.join("; ") + ". The first intake you can actually make is " + elig.targetCycle +
          ", starting " + fmtLong(elig.targetStart) + ". Everything below is measured against that.");
      }
      /* 2. orientation before action. Greeting, ladder and next move together
         come to 513px and the phone's first fold holds 665px, so putting the
         ladder here costs nothing and answers "where am I" before "what now". */
      h += '<div class="card"><div class="card-head"><h2>Your ladder</h2><a class="btn-link aside" href="#/roadmap">Open roadmap</a></div>' +
        rungsHTML() + '<p class="rungs-note">Three of five stages. Full ladder on My roadmap.</p></div>';

      h += '<div class="move" style="margin-top:14px">' +
        '<span class="ic">' + ico(I.bolt, 22) + "</span>" +
        '<div class="body"><p class="k">Your next move</p><h2>' + (top ? esc(top.t) : "Nothing outstanding") + "</h2>" +
        "<p>" + (top ? esc(top.why) + ". Worth " + top.pts + " points on your shortlisting score, the largest single gain available to you right now."
                     : "Every scored domain is at its maximum. Keep the evidence dated and current.") + "</p></div>" +
        (top ? leverBtn(top, true) : "") + "</div>";

      /* 4. two figures, not four. Shortlisting score and milestones are each a
         whole page in the nav and neither is actionable from here. */
      h += '<div class="grid g2" style="margin-top:16px">' +
        stat("Application readiness", counter(readiness(), "%"),
          elig && !elig.eligible ? "Measured against " + esc(elig.targetCycle) : "Weighted across 6 domains", I.clip) +
        stat("Next deadline", nd ? counter(nd.days) + "<small> days</small>" : "None",
          nd ? esc(nd.t) : "Nothing open", I.cal) + "</div>";

      h += '<div style="margin-top:14px">';
      h += '<div class="card"><div class="card-head"><h2>What is closing</h2><a class="btn-link aside" href="#/deadlines">All deadlines</a></div>';
      h += open.length ? open.map(function(d){
        var k = d.days <= 14 ? "crit" : (d.days <= 60 ? "warn" : "mute");
        return '<div class="row"><span class="t">' + esc(d.t) + "<small>" + fmtLong(d.iso) + " · " + esc(d.note) + "</small></span>" +
          '<span class="r">' + chip({k:k, icon:d.days <= 14 ? I.warn : I.clock, label:awayText(d.days)}) + "</span></div>";
      }).join("") : '<p class="empty">Nothing open. Everything ahead of you is marked done.</p>';
      h += "</div>";

      h += "</div>";

      /* 6. the prep slot. "Where you would gain most" used to sit here and
         repeated the same ranked list the next move card already leads with,
         and the activity feed answered what you did rather than what to do.
         Activity moved to the progress tracker, which is where a log belongs. */
      h += prepBlock();
      return h;
    }
  };

  /* Each rung carries its distance from the doctor's current stage, so the
     phone can drop everything two steps away and show three rungs instead of
     five. Five rungs need 480px of rail and a 390px phone gives 314px, which
     used to clip the last one mid-word. Distance is computed rather than
     positional, so it works wherever "here" falls on the ladder. */
  function rungsHTML(){
    var rs = rungs();
    var here = 0;
    rs.forEach(function(r, i){ if (r.state === "here") here = i; });
    return '<div class="rungs">' + rs.map(function(r, i){
      return '<div class="rung ' + r.state + ' d' + Math.abs(i - here) + '">' +
        '<div class="dot"></div><b>' + esc(r.t) + "</b><span>" + esc(r.sub) + "</span></div>";
    }).join("") + "</div>";
  }

  /* ================= ROLL FORWARD =================
     The Irish training year turns over in July. A record that is never asked
     about drifts quietly: months keep accruing, so a doctor who did not get a
     place looks to the dashboard exactly like one who moved up a year. Rather
     than guess, ask once a year and branch on the answer.

     Deliberately not a modal. A doctor reading this on a shift break should be
     able to ignore it, and it will still be there next time. */
  /* shared by runAction and the roll-forward, which both need to append to the
     same feed the progress tracker reads */
  function logActivity(t, d){
    if (!t) return;
    S.activity = S.activity || [];
    S.activity.unshift({t:t, d:d || "", at:Date.now()});
    S.activity = S.activity.slice(0, 20);
    noteScore();
    save();
  }

  /* every action that moves a domain logs activity, so this is the one place
     that sees them all. Only a changed total is recorded: a log of identical
     numbers would be noise, and the trend needs turning points, not ticks. */
  function noteScore(){
    S.scoreLog = S.scoreLog || [];
    var pts = scorePts(), last = S.scoreLog[S.scoreLog.length - 1];
    if (last && last.pts === pts) return;
    S.scoreLog.push({at:Date.now(), pts:pts});
    S.scoreLog = S.scoreLog.slice(-40);
  }

  /* what the log can honestly say. For a record with no history the answer is
     "nothing yet", said plainly, rather than a flat line pretending to be one. */
  function scoreTrend(){
    var log = S.scoreLog || [];
    if (log.length < 2) return null;
    var first = log[0], last = log[log.length - 1];
    return {from:first.pts, to:last.pts, delta:last.pts - first.pts,
            since:first.at, points:log.map(function(e){ return e.pts; })};
  }

  function rollDue(){
    if (situation().isConsultant) return false;
    var now = new Date();
    /* the year turns in July, so a prompt for the 2026 turnover is only due
       from July 2026 onward */
    var turnover = now.getFullYear() + (now.getMonth() >= 6 ? 0 : -1);
    if (!S.lastRolledAt) return now.getMonth() >= 6;
    return day(S.lastRolledAt).getFullYear() < turnover;
  }

  /* Each step names its question and its answers. An answer either sets fields
     and finishes, or hands off to another step. */
  function rollFlow(){
    var sit = situation(), t = routeTiming();
    var scheme = S.schemeName || (sit.tier === "hst" ? sit.target : "basic specialist training");
    var F = {};

    F.start = {
      q: "The training year has turned over. Is your record still right?",
      sub: scopeBox().stage + ", " + t.yearsIn + " years post-internship" +
           (S.inScheme === false ? ", not in a training post" : S.schemeName ? ", on " + S.schemeName : ""),
      a: [
        {t:"Yes, nothing has changed", act:"rollDone"},
        {t:"No, something changed", go: S.inScheme === false ? "gotPlace" : "stillOn"}
      ]
    };
    /* on a scheme: did they move up, finish, or leave */
    /* only offer "moved up a year" when the scheme actually has another year
       in it. BST runs two years, so year 2 plus one is not year 3, it is
       finished, and offering the wrong answer invites a wrong record. */
    var yearNow = S.schemeYear || t.stageYear;
    var hasNextYear = yearNow < t.stageYears;
    F.stillOn = {
      q: "Are you still on " + scheme + "?",
      sub: "Year " + yearNow + " of " + t.stageYears + " on your record.",
      a: (hasNextYear ? [{t:"Yes, now in year " + (yearNow + 1), act:"rollAdvance"}] : [])
        .concat([
          {t:"Yes, same year again", act:"rollDone"},
          {t:"I have finished it", go:"gotPlace"},
          {t:"I left it", act:"rollLeft"}
        ])
    };
    /* standalone, or just finished: the question that decides everything else */
    F.gotPlace = {
      q: "Did you get a training place for this year?",
      sub:"Places are limited, so both answers are common.",
      a: [
        {t:"Yes", go:"whichScheme"},
        {t:"No", go:"whatRole"}
      ]
    };
    F.whichScheme = {
      q: "Which one?",
      a: [{t:sit.target, act:"rollJoinTarget"}]
        .concat(otherTargetsInfo().map(function(o){ return {t:o.name, act:"rollJoinOther", val:o.name}; }))
        .concat([{t:"Something else", act:"rollJoinOther", val:""}])
    };
    F.whatRole = {
      q: "What are you working as this year?",
      sub:"This is recorded as time in post. It is not scored against you.",
      a: [
        {t:"SHO", act:"rollRole", val:"SHO"},
        {t:"Registrar", act:"rollRole", val:"Registrar"},
        {t:"Something else", act:"rollRole", val:"Other"}
      ]
    };
    return F[S.rollStep || "start"] || F.start;
  }

  function rollCard(){
    if (!rollDue() && !S.rollStep) return "";
    var f = rollFlow();
    var h = '<div class="prep" style="margin-top:0;margin-bottom:14px"><p class="k">Once a year</p>' +
      "<h2>" + esc(f.q) + "</h2>" +
      (f.sub ? '<p class="lede">' + esc(f.sub) + "</p>" : "");
    h += '<div class="prep-cta">' + f.a.map(function(a, i){
      return '<button class="btn btn-sm ' + (i === 0 ? "btn-primary" : "btn-ghost") + '" data-roll="' +
        esc(a.go ? "go:" + a.go : a.act) + '" data-rollval="' + esc(a.val || "") + '">' + esc(a.t) + "</button>";
    }).join("") + "</div>";
    if (S.rollStep) h += '<p class="lede" style="margin-top:10px"><button class="btn-link" data-roll="rollCancel">Ask me later</button></p>';
    return h + "</div>";
  }

  /* ================= THE SHAPE OF THE YEAR =================
     The ladder counts years. It never showed what one year looks like, and
     the year has a fixed rhythm: applications close, interviews run, offers
     go out, the post starts. A doctor deciding when to run an audit is
     planning against that rhythm, not against a six-year total.

     Everything outstanding is back-planned to one date rather than to invented
     per-item lead times. Evidence has to be dated before the application
     closes, so that is the deadline for all of it, and how long each takes is
     the doctor's own business rather than something to guess at. */
  function yearBeats(){
    var sit = situation(), c = sit.cycle, step = nextStep();
    /* the cycle we hold is the target's. Someone applying to something else
       this year, or not applying at all, must not be shown it as their year:
       the same leak usesCycle was added to close on the next-step card. */
    if (!sit.stillApplying || !c || !step || !step.usesCycle) return null;
    return [
      {t:"Applications close", iso:c.apply, note:"Evidence must already be dated"},
      {t:"Interviews", iso:c.interview, note:esc(sit.college)},
      {t:"Offers issued", iso:c.offers || addDays(c.interview, 39), note:esc(sit.college)},
      {t:sit.target + " starts", iso:c.start, note:"If you are offered a place"}
    ];
  }

  function yearShapeCard(){
    var sit = situation(), beats = yearBeats();
    if (!beats) return "";

    /* the first beat still ahead is where the doctor actually stands in the
       year, and it is the only one that should carry emphasis */
    var nowIdx = -1;
    beats.forEach(function(bt, i){ if (nowIdx < 0 && until(bt.iso) >= 0) nowIdx = i; });

    var h = '<div class="card" style="margin-top:14px"><div class="card-head"><h2>How this year runs</h2>' +
      '<span class="aside">' + esc(cycleLabel()) + " cycle, " + esc(sit.college) + "</span></div>";
    h += '<div class="beats">' + beats.map(function(bt, i){
      var d = until(bt.iso), state = d < 0 ? "past" : (i === nowIdx ? "now" : "");
      return '<div class="beat ' + state + '"><span class="node">' +
        (d < 0 ? ico(I.tick, 8) : "") + "</span>" +
        '<span class="bk">' + esc(bt.t) + "</span>" +
        '<span class="bd">' + fmtLong(bt.iso) + "</span>" +
        chip(d < 0 ? {k:"mute", icon:I.tick, label:"Passed"}
           : {k: d <= 21 ? "crit" : (d <= 60 ? "warn" : "mute"), icon:I.clock, label:awayText(d)}) +
        '<span class="bn">' + bt.note + "</span></div>";
    }).join("") + "</div>";
    h += ctxFoot("These dates are illustrative and follow the same cycle as the rest of the dashboard. " +
      "Confirm them against " + sit.college + "'s published dates before you plan around them.");
    return h + "</div>";
  }

  /* ================= WHERE TWO ROUTES DIVERGE =================
     Two ladders side by side were mostly the same ladder twice, because both
     read off one record. The question a hedging doctor actually has is which
     work counts twice and which only counts once, so lead with that. */
  function divergenceCard(){
    var others = otherTargetsInfo();
    if (!others.length) return "";
    var sit = situation();
    var routes = [{name:S.specialty, exam:sit.exam, body:sit.college, cycle:sit.cycle}]
      .concat(others.map(function(o){ return {name:o.name, exam:o.exam, body:o.body, cycle:CYCLE[o.body] || null}; }));

    var h = '<div class="card" style="margin-top:14px"><div class="card-head"><h2>Where these routes differ</h2>' +
      '<span class="aside">' + routes.length + " routes</span></div>";

    /* the good news first, because it is the larger half and the one nobody
       tells them: the portfolio is one portfolio */
    h += '<p class="group-h">Counts for every route</p>';
    h += '<div class="row"><span class="t" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">' +
      "<b>Everything in your portfolio</b>" + chip({k:"good", icon:I.tick, label:"Shared"}) +
      "<small style=\"flex-basis:100%\">" + DOMAINS.map(function(d){ return d.name; }).join(", ") +
      '. Months post-internship count once and apply everywhere.</small></span></div>';

    h += '<p class="group-h">Differs by route</p>';
    var rows = [
      {t:"Exam family", get:function(r){ return r.exam || "Not set"; }},
      {t:"College", get:function(r){ return r.body || "Not set"; }},
      {t:"Applications close", get:function(r){ return r.cycle ? fmtLong(r.cycle.apply) : "Date not set"; }},
      {t:"Interview", get:function(r){ return r.cycle ? fmtLong(r.cycle.interview) : "Date not set"; }}
    ];
    h += '<div style="overflow-x:auto"><table class="data"><thead><tr><th></th>' +
      routes.map(function(r){ return "<th>" + esc(r.name) + "</th>"; }).join("") + "</tr></thead><tbody>";
    h += rows.map(function(row){
      var vals = routes.map(function(r){ return row.get(r); });
      /* a row where every route agrees is not a difference, so say so */
      var same = vals.every(function(v){ return v === vals[0]; });
      return "<tr><td><b>" + esc(row.t) + "</b>" +
        (same ? "<small>Same either way</small>" : "") + "</td>" +
        vals.map(function(v){ return "<td>" + esc(v) + "</td>"; }).join("") + "</tr>";
    }).join("");
    h += "</tbody></table></div>";
    h += ctxFoot("Both ladders read off one record, so your months and exam stages are shared. Entry rules that " +
      "let one route credit time served on another are not modelled here, so check eligibility with each college.");
    return h + "</div>";
  }

  /* ================= WHERE YOU HAVE BEEN =================
     The ladder is a projection. This is the record: what actually happened
     each July, including the years where the answer was "no place". Nothing
     else in the product stores that, and it is the fact a doctor is most
     often asked to account for. */
  function historyCard(){
    var hist = S.rollHistory || [];
    if (!hist.length){
      return '<div class="strip"><b>Where you have been</b><p>Nothing recorded yet. Each July the dashboard asks ' +
        "what changed, and the answers build up here as a record of the route you actually took rather than the " +
        "one you planned." + (S.rotations && S.rotations.length
          ? ' Your logged rotations are on <a href="#/profile">your profile</a> in the meantime.' : "") +
        "</p></div>";
    }
    var h = '<div class="card"><div class="card-head"><h2>Where you have been</h2>' +
      '<span class="aside">' + hist.length + (hist.length === 1 ? " update" : " updates") + "</span></div>";
    h += hist.map(function(e){
      return '<div class="row"><span class="t">' + esc(e.note) + "<small>Recorded " + fmtLong(e.at) +
        "</small></span><span class=\"r\"><span class=\"chip mute\">" + e.year + "</span></span></div>";
    }).join("");
    return h + "</div>";
  }

  /* ================= IF THIS CYCLE DOES NOT LAND =================
     Places are limited and a large share of applicants do not get one first
     time. The product knows that and says nothing about it, which leaves the
     doctor to discover it alone at the worst moment. Descriptive only: what
     people commonly do, never what this doctor should do.

     ALT_ROUTES content is ILLUSTRATIVE. The two cross-route facts here that
     trace to research are in the MedPath competitor analysis: ICAT is a
     funded-PhD pathway entered across specialties rather than through one,
     and several RCPI medicine subspecialties sit under a General Internal
     Medicine trunk. Anything not listed says so rather than inventing an
     alternative route into a named specialty. */
  /* ================= MOVING SIDEWAYS =================
     Two different kinds of move, and conflating them would be dishonest.

     Same membership exam: derived from SPECIALTY_INFO rather than asserted.
     Every RCPI medicine specialty is entered on MRCPI, so a doctor holding it
     genuinely does carry that exam across all of them. That is a fact about
     our own data, not a claim about entry rules.

     A different exam: NOT derivable, and not a free-for-all. You cannot drift
     from general medicine into plastic surgery, so listing every non-MRCPI
     specialty as reachable would be false. This map is deliberately narrow and
     holds only the move the product owner named as common, general practice,
     which ICGP does enter from hospital training. It is illustrative and says
     so: the entry and credit rules behind it are the college's, not ours. */
  var PIVOTS = {
    "MRCPI":    ["General Practice"],
    "MRCS":     ["General Practice"],
    "MRCPCH":   ["General Practice"],
    "MRCPsych": ["General Practice"],
    "MRCEM":    ["General Practice"],
    "MRCOG":    ["General Practice"]
  };

  function relatedSpecialties(){
    var sit = situation(), mine = S.specialty, myExam = sit.exam;
    if (!mine || !myExam) return {same:[], other:[]};
    var already = (S.otherTargets || []);
    function row(n){
      var i = SPECIALTY_INFO[n] || {};
      return {name:n, exam:i.exam || "", body:i.body || "", target:i.target || n,
              added: already.indexOf(n) > -1};
    }
    var same = Object.keys(SPECIALTY_INFO).filter(function(n){
      return n !== mine && SPECIALTY_INFO[n].exam === myExam;
    }).map(row);
    var other = (PIVOTS[myExam] || []).filter(function(n){
      return n !== mine && SPECIALTY_INFO[n];
    }).map(row);
    return {same:same, other:other};
  }

  function altRoutes(){
    var sit = situation();
    /* each route goes somewhere. A card that names an option and leaves the
       doctor to find it is only half the help. */
    var out = [
      {t:"Apply again next cycle", d:"Nothing in a portfolio expires between cycles, and another year of evidence " +
        "usually scores higher than the same application resubmitted.",
       go:[["#/deadlines","See the next cycle dates"],["#/gaps","Build the portfolio"]]},
      {t:"A standalone post in the meantime", d:"Service posts still count as clinical experience, and audit, " +
        "teaching and research all continue from one.",
       go:[["#/opportunities","Posts matched to you"]]}
    ];
    out.push({t:"ICAT", d:"Irish Clinical Academic Training, a funded PhD integrated with clinical training. " +
      "Entered across specialties rather than through one, so it runs parallel to this route.",
     go:[["#/readiness","Check your research evidence"]]});
    return out;
  }

  /* ================= PLAN B =================
     This was a card that sat on the page from the moment a doctor came within
     six months of applying, telling someone mid-application that we had
     already started planning around their failure. It is the same content, but
     asked for: a Plan B control on the application rung opens it.

     It opens on a question, because everything below depends on the answer and
     the product had no way of knowing it. The answer writes to the same
     applications[] record the ladder keeps, so answering here also updates the
     rung: one fact, one place. */
  function planBCard(){
    var target = S.planB;
    if (!target) return "";
    var sit = situation(), app = applicationFor(target), cy = cycleLabel();

    var h = '<div class="card" id="planb" style="margin-top:14px;border-color:var(--deep);border-width:1.5px">' +
      '<div class="card-head"><h2>Plan B for ' + esc(target) + "</h2>" +
      '<button class="btn btn-sm btn-ghost" data-rung="planb-close">Close</button></div>';

    /* the gate */
    if (!app || !app.outcome){
      h += '<p class="lede" style="max-width:62ch;margin-bottom:14px">Before anything else: did you get a place ' +
        "in the " + esc(cy) + " cycle? Nothing below is worth reading if you did, and your answer is recorded on " +
        "the ladder either way.</p>";
      h += '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
        '<button class="btn btn-sm btn-primary" data-rung="answer:offer" data-rungval="' + esc(target) +
          '">Yes, I have a place</button>' +
        '<button class="btn btn-sm btn-ghost" data-rung="answer:none" data-rungval="' + esc(target) +
          '">No, not this cycle</button>' +
        '<button class="btn btn-sm btn-ghost" data-rung="answer:waiting" data-rungval="' + esc(target) +
          '">Still waiting to hear</button></div>';
      return h + "</div>";
    }

    /* they have a place: say so and stop, rather than counselling them anyway */
    if (app.outcome === "offer"){
      h += '<p class="lede" style="max-width:62ch;margin-bottom:12px">You recorded an offer for ' + esc(target) +
        " in the " + esc(cy) + " cycle, so this is not the question any more. If that changes, the routes come back.</p>" +
        '<button class="btn btn-sm btn-ghost" data-rung="reanswer" data-rungval="' + esc(target) +
        '">Change the answer</button>';
      return h + "</div>";
    }

    var pt = routeTiming();
    h += '<p class="lede" style="max-width:64ch">' +
      (app.outcome === "waiting"
        ? "You are waiting to hear. Places are limited, so it is worth knowing the routes now rather than in the week the answer lands."
        : pt.holding
          /* someone years outside a scheme has already lived this, and telling
             them it happens as though it were news reads badly */
          ? "No place this cycle. You have already been here, so none of this is news: places are limited and missing one is not a verdict on the doctor."
          : "No place this cycle. That is common where places are limited and it is not a verdict on the doctor.") +
      " What stays true either way is that the portfolio carries forward. Months, exams, audit and teaching all " +
      "keep counting.</p>" +
      '<button class="btn btn-sm btn-ghost" style="margin-top:10px" data-rung="reanswer" data-rungval="' +
      esc(target) + '">Change the answer</button>';

    h += '<p class="group-h" style="margin-top:16px">What people commonly do</p>';
    h += '<div class="opts">' + altRoutes().map(function(r){
      return '<div class="opt"><b>' + esc(r.t) + "</b><p>" + esc(r.d) + "</p>" +
        ((r.go || []).length ? '<span class="acts">' + r.go.map(function(g){
          return '<a class="btn btn-sm btn-ghost" href="' + g[0] + '">' + esc(g[1]) + "</a>";
        }).join("") + "</span>" : "") + "</div>";
    }).join("") + "</div>";

    h += relatedBlock();
    h += ctxFoot("Routes are descriptive, not advice, and the alternatives above are illustrative in this " +
      "prototype. Check eligibility with the college before acting on any of them.");
    return h + "</div>";
  }

  /* ================= A DIFFERENT SPECIALTY FROM HERE =================
     The routes above all assume the same destination. A doctor who has missed
     a place twice is often asking a different question, which is whether the
     training already done opens anything else. Adding one here is not a
     detour: it writes to otherTargets, which is what the dual-track comparison
     on this same page already reads. */
  function relatedBlock(){
    var rel = relatedSpecialties();
    if (!rel.same.length && !rel.other.length) return "";
    var sit = situation();
    var h = '<p class="group-h" style="margin-top:18px">A different specialty from here</p>';

    function addCtl(r, small){
      return r.added
        ? '<span class="chip good">' + ico(I.tick, 12) + "Tracking</span>"
        : '<button class="btn btn-sm btn-ghost" data-addtarget="' + esc(r.name) + '">' +
          (small ? "Track" : "Track this too") + "</button>";
    }

    if (rel.same.length){
      h += '<p class="lede" style="max-width:64ch;margin-bottom:10px">These are entered on the same membership ' +
        "exam you are already working towards, so <b>" + esc(sit.exam) + " carries</b>, and so does the portfolio. " +
        "What differs is competition and the programme itself. Some are entered through a General Internal " +
        "Medicine trunk rather than directly, which is worth checking for any you are considering.</p>";
      /* one line each rather than a tile each: the describing sentence was the
         same for all of them, so it is said once above */
      h += '<div class="picks">' + rel.same.map(function(r){
        return '<span class="pick">' + esc(r.name) + addCtl(r, true) + "</span>";
      }).join("") + "</div>";
    }
    if (rel.other.length){
      h += '<p class="lede" style="max-width:64ch;margin:18px 0 10px">A different membership exam, but hospital ' +
        "training is commonly credited towards it. Your months and portfolio still count for something; the exam " +
        "does not carry.</p>";
      h += '<div class="opts">' + rel.other.map(function(r){
        return '<div class="opt"><b>' + esc(r.name) + "</b><p>" + esc(r.exam + " via " + r.body +
          ". A different exam, entered from hospital training.") + '</p><span class="acts">' +
          addCtl(r) + "</span></div>";
      }).join("") + "</div>";
      h += ctxFoot("Whether your specific posts count towards " + rel.other.map(function(r){ return r.name; }).join(" or ") +
        ", and how much, is set by " + rel.other.map(function(r){ return r.body; }).join(" and ") +
        " and is not modelled here. Confirm it with them before you plan around it.");
    }
    return h;
  }

  /* ================= LADDER STATE =================
     A stage is complete when the doctor says so. Failing that we infer it
     from months, which is a reasonable default and a bad certainty, so the
     inference is always overridable and a stated date always wins. */
  function stageDone(id, inferred){
    var d = (S.stagesDone || {})[id];
    if (d) return d;
    return inferred ? true : false;
  }
  function stageWhen(id, inferredLabel){
    var d = (S.stagesDone || {})[id];
    return d ? "Complete " + fmtLong(d) : inferredLabel;
  }

  /* the application for a given target in the cycle currently open */
  function cycleLabel(){
    var c = situation().cycle;
    if (!c) return "";
    var y = day(c.apply).getFullYear();
    return y + " to " + (y + 1);
  }
  function applicationFor(target){
    var cy = cycleLabel();
    return (S.applications || []).filter(function(a){
      return a.target === target && a.cycle === cy;
    })[0] || null;
  }

  var OUTCOMES = {
    offer:   {k:"good", label:"Offer"},
    none:    {k:"crit", label:"No offer"},
    waiting: {k:"warn", label:"Waiting"}
  };

  /* One ladder builder, called once for the main route and again for each
     hedged route when the dual-track view is on. It takes a specialty rather
     than reading the record's own, which is what makes side by side possible. */
  function trailFor(specName){
    var info = SPECIALTY_INFO[specName] || {};
    var exam = info.exam || S.exam, target = info.target || S.target;
    /* this ladder's own exam family, and this ladder's own progress in it */
    var lfam = entryFamilyFor(specName) || exam;
    var lheld = stagesHeldIn(lfam), ltotal = Math.max(1, examsInFamily(lfam).length);
    var lfirst = (examsInFamily(lfam)[0] || {}).stage || "Part 1";
    var c = CYCLE[info.body] || null;
    var onLadder = stageDone("internship", S.clinicalMonths > 0);
    var bstInferred = S.clinicalMonths >= 24;
    var bstDone = stageDone("bst", bstInferred);
    /* a doctor who told us they never got a place is not "complete" no matter
       what the month count says */
    if (S.inScheme === false && !S.schemeName && !(S.stagesDone || {}).bst) bstDone = false;

    var trail = [
      {k: onLadder ? "done" : "todo", t:"Internship",
       when: stageWhen("internship", onLadder ? "Complete" : "Not started"), rung:"internship"},
      {k:"flag", t: lheld >= 1 ? lfam + " " + lfirst + " passed" : lfam + " " + lfirst + " not held",
       when: lheld >= 1 ? "Passed" : "Outstanding", go:["#/exams","Exam prep"],
       rung: lheld < 1 ? "exam" : null, rungLabel:"Mark passed"},
      {k: bstDone ? "done" : "todo", t:"Basic specialist training",
       when: bstDone ? stageWhen("bst", "Complete")
         : (S.inScheme === false && !S.schemeName
             ? (S.roleTitle ? "Not on a scheme, working as " + S.roleTitle : "No training place yet")
             : S.clinicalMonths + " months in"),
       rung:"bst"},
      {k:"flag", t: lheld >= ltotal ? "Full " + lfam : lfam + " not yet complete",
       when: lheld + " of " + ltotal + " stages", go: lheld < ltotal ? ["#/exams","Exam prep"] : null,
       rung: lheld < ltotal ? "exam" : null, rungLabel:"Mark a stage passed"}
    ];
    if (situation().stillApplying){
      /* the application rung is the application tracker: it records whether
         they applied, and then what came of it */
      var app = applicationFor(target);
      /* the cycle we hold is THIS year's. An intern reaches this rung in about
         three years, so naming this year's closing date on it is a date that
         is not theirs, the same leak the year cards and the contingency card
         each had. Only a doctor applying into this cycle gets the date. */
      var thisCycle = (nextStep() || {}).usesCycle;
      var appWhen = !app ? (c && thisCycle ? "Applications close " + fmt(c.apply) : "When you reach it")
        : app.outcome ? OUTCOMES[app.outcome].label + ", " + fmtLong(app.outcomeAt)
        : "Applied " + fmtLong(app.appliedAt);
      trail.push(
        {k: app && app.outcome === "offer" ? "done" : "here",
         t: target + (!app ? ", not yet applied" : app.outcome === "offer" ? ", offer accepted"
              : app.outcome === "none" ? ", no offer this cycle"
              : app.outcome === "waiting" ? ", waiting to hear" : ", applied"),
         when: appWhen, app: app || true, appTarget: target, planB: !!thisCycle},
        {k:"flag", t:"Interview", when: c && thisCycle ? fmt(c.interview) : "After you apply",
         go:["#/interviews","Interview prep"]},
        {k:"todo", t:"CSCST", when: stageWhen("cscst", "Future"), rung:"cscst"},
        {k:"todo", t:"Consultant post", when:"Future"}
      );
    } else {
      trail.push({k:"here", t:"Consultant post", when:"Reached"});
    }
    return trail;
  }

  function trailHTML(trail){
    return '<div class="trail">' + trail.map(function(s){
      if (s.k === "flag"){
        /* exam and interview markers used to be inert text. Both modules exist
           now, so the rung is the way into them, and an exam stage can be
           marked passed from here too. */
        return '<div class="trail-item flag"><span class="knob">' + ico(I.flag, 9) + "</span>" +
          '<p class="trail-flagline">' + esc(s.t) + '<span class="chip mute">' + esc(s.when) + "</span>" +
          (s.rung ? '<button class="btn-link" data-rung="' + esc(s.rung) + '">' +
            esc(s.rungLabel || "Mark complete") + "</button>" : "") +
          (s.go ? '<a class="btn-link" href="' + s.go[0] + '">' + esc(s.go[1]) + "</a>" : "") + "</p></div>";
      }
      var mark = s.k === "done" ? ico(I.tick, 11) : (s.k === "here" ? ico(I.target, 11) : "");
      var ctrl = "";
      /* the application rung carries its own small flow: applied, then what
         came of it. Both are facts only the doctor has. */
      if (s.app){
        var a = s.app === true ? null : s.app;
        if (!a){
          ctrl = '<button class="btn-link" data-rung="apply" data-rungval="' + esc(s.appTarget) + '">Mark as applied</button>';
        } else if (!a.outcome){
          ctrl = '<span class="rung-acts">' +
            Object.keys(OUTCOMES).map(function(o){
              return '<button class="btn-link" data-rung="outcome:' + o + '" data-rungval="' + esc(s.appTarget) + '">' +
                esc(OUTCOMES[o].label) + "</button>";
            }).join("") + "</span>";
        } else {
          ctrl = '<span class="chip ' + OUTCOMES[a.outcome].k + '">' + esc(OUTCOMES[a.outcome].label) + "</span>" +
            '<button class="btn-link" data-rung="unapply" data-rungval="' + esc(s.appTarget) + '">Undo</button>';
        }
        /* the way into the contingency, sitting on the rung it is contingent
           on. Pointless once they hold a place, and premature for a doctor who
           reaches this rung in three years: an intern was being offered a
           Plan B for an application they have not made yet. */
        if (s.planB && !(a && a.outcome === "offer")){
          ctrl += '<button class="btn-link plan-b" data-rung="planb" data-rungval="' + esc(s.appTarget) + '">' +
            ico(I.map, 12) + "Plan B</button>";
        }
      } else if (s.rung){
        ctrl = '<button class="btn-link" data-rung="' + esc(s.k === "done" ? "undo:" + s.rung : "done:" + s.rung) +
          '">' + esc(s.k === "done" ? "Undo" : (s.rungLabel || "Mark complete")) + "</button>";
      }
      return '<div class="trail-item ' + s.k + '"><span class="knob">' + mark + "</span>" +
        '<div class="trail-card"><b>' + esc(s.t) + '</b><span class="when">' + esc(s.when) + "</span>" +
        (ctrl ? '<span class="rung-ctrl">' + ctrl + "</span>" : "") + "</div></div>";
    }).join("") + "</div>";
  }

  VIEWS.roadmap = {
    title:"My roadmap", sub:"Your route to consultant, with your position pinned.",
    render:function(){
      var rsit = situation(), t = routeTiming(), step = nextStep();
      var others = otherTargetsInfo();
      var h = rollCard();

      /* Five equal white slabs in a row told the eye nothing about what
         mattered. Three labelled phases do: where you stand, the year you are
         in, and the longer view. The labels are the existing .sec-label the
         rest of the app already groups with. */
      h += '<p class="sec-label">Where you stand</p>';

      /* The ladder leads. It already shows position, so the separate "where you
         are" card was saying twice what the here-marker says once. What it did
         carry that the ladder cannot is the timing, so that folds in below. */
