  /* CV freshness and rotation history: identity and history facts rather than
     active trackers, so they live here on profile rather than getting a nav
     item of their own. */
  function cvRotationCard(){
    var stale = S.cvUpdatedAt ? Math.round((Date.now() - day(S.cvUpdatedAt)) / 2592000000) : null;
    var h = '<div class="card" style="margin-top:14px"><div class="card-head"><h2>CV and rotation history</h2></div>';
    h += '<div class="field"><label for="pCV">CV last updated</label>' +
      '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">' +
      '<input id="pCV" type="date" value="' + esc(S.cvUpdatedAt) + '" style="flex:1;min-width:160px" disabled>' +
      '<button class="btn btn-sm btn-primary" data-act="saveCV">Mark updated today</button></div>' +
      '<span class="hint">' + (stale === null ? "Not recorded yet." : stale >= 6 ? "That is " + stale + " months ago. Worth a look before you next apply." : stale + " months ago.") + "</span></div>";

    h += '<p class="group-h">Rotation history</p>';
    var rots = S.rotations || [];
    h += rots.length ? rots.map(function(r, i){
      var span = (r.from ? fmt(r.from) : "?") + (r.to ? " to " + fmt(r.to) : " to present");
      return '<div class="row"><span class="t">' + esc(r.hospital) + (r.specialty ? ", " + esc(r.specialty) : "") +
        "<small>" + esc(span) + '</small></span><span class="r"><button class="btn-link" data-remove-rotation="' + i + '">Remove</button></span></div>';
    }).join("") : '<p class="empty" style="padding:16px 0">Nothing logged yet.</p>';
    h += '<button class="btn btn-sm btn-ghost" style="margin-top:10px" data-act="addRotation">Add a rotation</button></div>';
    return h;
  }

  /* split out of VIEWS.profile.render for its own size, and because
     saveProfile reads exactly the ids this writes */
  function locationCard(){
    var DUAL = [["single","No, just this one"],["narrow","One or two similar specialties"],["wide","Several different specialties"]];
    var otherNames = Object.keys(SPECIALTY_INFO).filter(function(n){ return n !== S.specialty; });
    return '<div class="card" style="margin-top:14px"><div class="card-head"><h2>Location and other applications</h2>' +
      '<span class="aside">Neither of these is scored</span></div>' +
      '<div class="grid g2">' +
      '<div><div class="field"><label for="pBased">Based now</label><select id="pBased">' +
        '<option value="">Not set</option>' +
        REGIONS.map(function(r){ return '<option value="' + r + '"' + (r === S.basedIn ? " selected" : "") + ">" + esc(REGION_LABEL[r]) + "</option>"; }).join("") +
        '<option value="outside"' + (S.basedIn === "outside" ? " selected" : "") + ">" + esc(REGION_LABEL.outside) + "</option>" +
      "</select></div>" +
      '<div class="field"><label>Willing to work</label><div class="chk-grid">' +
        '<label><input type="checkbox" data-willing-box value="any"' + ((S.willing || []).indexOf("any") > -1 ? " checked" : "") + ">" + esc(REGION_LABEL.any) + "</label>" +
        REGIONS.map(function(r){
          return '<label><input type="checkbox" data-willing-box value="' + r + '"' + ((S.willing || []).indexOf(r) > -1 ? " checked" : "") + ">" + esc(REGION_LABEL[r]) + "</label>";
        }).join("") +
      "</div><span class=\"hint\">Filters and reorders posts on Matched to you. Checking Anywhere ignores the rest.</span></div></div>" +

      '<div><div class="field"><label for="pDual">Applying to more than one specialty</label><select id="pDual">' +
        DUAL.map(function(d){ return '<option value="' + d[0] + '"' + (d[0] === S.dualTrack ? " selected" : "") + ">" + esc(d[1]) + "</option>"; }).join("") +
      "</select></div>" +
      '<div class="field"><label>Also applying to</label><div class="chk-grid">' +
        otherNames.map(function(n){
          return '<label><input type="checkbox" data-other-box value="' + esc(n) + '"' + ((S.otherTargets || []).indexOf(n) > -1 ? " checked" : "") + ">" + esc(n) + "</label>";
        }).join("") +
      "</div><span class=\"hint\">Ignored unless you picked more than one above. Named here so your roadmap and deadlines can show them too.</span></div></div>" +
      "</div>" +
      '<button class="btn btn-primary" style="margin-top:8px" data-act="saveLocation">Save location and applications</button></div>';
  }

  /* ================= NAV ================= */
  /* ================= MODULE REGISTRY =================
     Zones are fixed and ordered. The nav a doctor learns in week one is the
     same nav in month six, which is also what lets a pricing boundary land on
     a zone later without reshuffling anything.

     What adapts is not the order but the STATE of each module, and there are
     only three. Nothing is ever hidden: a module that does not apply says so
     in a sentence, because personalised disclosure without a stated reason
     reads as the product deciding things behind your back.

       active  the normal case
       ahead   real, just not yet, with the date it starts mattering
       aside   not on your route, with the reason in plain words          */
  /* "Practical" held the CPD tracker and the Occupational health page and
     holds nothing now. renderNav skips an empty zone, so leaving it would
     have been invisible rather than broken -- and a heading waiting for
     pages that were deliberately removed. */
  var ZONES = ["Overview", "Your pathway", "Your applications", "Preparation", "Account"];

  /* the scored application apparatus, which a consultant has finished with */
  function applyingOnly(sit){
    return sit.stillApplying ? null
      : {k:"aside", why:"You have reached consultant, so nothing here is scoring you any more. It stays visible because your record does."};
  }

  var MODULES = [
    {id:"today",         t:"Today",                          ic:I.home,   zone:"Overview"},
    {id:"roadmap",       t:"My roadmap",                     ic:I.map,    zone:"Your pathway"},
    {id:"progress",      t:"Application tracker",            ic:I.clip,   zone:"Your applications", rel:applyingOnly},
    /* one entry, because it is one table. Readiness and Shortlisting score
       still resolve as routes, they just no longer occupy the nav with two
       more views of what this one already shows. */
    {id:"gaps",          t:"Gap analysis",                   ic:I.list,   zone:"Your applications", rel:applyingOnly},
    {id:"opportunities", t:"Matched to you",                 ic:I.brief,  zone:"Your applications"},
    {id:"exams",         t:"Exam prep",                      ic:I.book,   zone:"Preparation", rel:function(sit){
      if (!sit.stillApplying) return {k:"aside", why:"Your membership exams are behind you. Kept here so the record stays complete."};
      if (stagesHeld() >= stagesTotal()) return {k:"aside", why:"You hold every stage your route asks for. The catalogue stays open for anything else you want to sit."};
      return null;
    }},
    {id:"interviews",    t:"Interview prep",                 ic:I.mic,    zone:"Preparation", rel:function(sit){
      if (!sit.stillApplying) return {k:"aside", why:"You are not interviewing for a training post."};
      if (sit.phase === "far" && sit.cycle) return {k:"ahead", why:"Interviews are " + fmtLong(sit.cycle.interview) + ". Worth opening once applications close."};
      return null;
    }},
    {id:"profile",       t:"Your profile",                   ic:I.user,   zone:"Account"}
  ];

  /* the sidebar scope box, derived rather than stored. It used to render
     S.stageLabel, a string written once at onboarding, so a consultant was
     still told they were "working towards HST Cardiology, SHO 2 years
     post-intern" no matter what the rest of the record said. */
  /* ================= PREP WORKSPACES =================
     A prep product is opened daily for six to eight weeks. The dashboard
     around it is built for a monthly visit, and making someone climb back out
     to a card grid every time they want the next surface is the wrong shape.

     So entering one swaps the shell: the sidebar becomes that product's own
     nav, the scope box says which product you are in rather than which
     consultant post you are years from, and one item at the top gets you out.
     Same app, same record, different chrome. */
  function activeWorkspace(){
    var id = currentId();
    if (id === "exams" && S.examOpen){
      var e = examById(S.examOpen);
      /* looking inside a locked prep is browsing, not entering: the shell
         stays put so the doctor can still see where they are in the app */
      if (e && prepOpen(e.id, examIncluded(e.id))){
        return {kind:"exam", id:e.id, name:examLabel(e), sub:e.body,
                surfaces:gymFor(e), backTo:"exams"};
      }
    }
    if (id === "interviews" && S.ivOpen){
      var iv = allInterviews().filter(function(x){ return x.id === S.ivOpen; })[0];
      if (iv && prepOpen(iv.id, ivIncluded(iv.id))){
        return {kind:"interview", id:iv.id, name:iv.t, sub:iv.body,
                surfaces:IV_GYM, backTo:"interviews"};
      }
    }
    return null;
  }

  function renderWorkspaceNav(ws){
    var cur = S.gymSurface || "";
    var html = '<p class="nav-group">' + esc(ws.kind === "exam" ? "Exam prep" : "Interview prep") + "</p>";
    /* the way out, first, because being unable to find it is the failure mode
       of every product that takes over the screen */
    html += '<button class="nav-item nav-back" data-ws-exit="1">' + ico(I.arrow, 16) +
      "All of MedNav</button>";
    html += '<p class="nav-group">' + esc(ws.name) + "</p>";
    html += '<button class="nav-item' + (cur === "" ? " on" : "") + '" data-gym="">' +
      ico(I.home, 17) + "Overview</button>";
    html += ws.surfaces.map(function(g){
      return '<button class="nav-item' + (cur === g.id ? " on" : "") + '" data-gym="' + g.id + '">' +
        ico(g.ic, 17) + esc(g.t) + "</button>";
    }).join("");
    document.getElementById("nav").innerHTML = html;
  }

  function scopeBox(){
    var sit = situation();
    var yrs = (S.clinicalMonths / 12).toFixed(1).replace(/\.0$/, "");
    var stage = sit.isStudent ? "Final year student"
      : sit.isIntern ? "Intern"
      : sit.isConsultant ? "Consultant in " + (S.specialty || "practice")
      : (sit.tier === "hst" ? "SpR" : "SHO") + ", " + yrs + (yrs === "1" ? " year" : " years") + " post-intern";
    return sit.isConsultant
      ? {label:"Currently", target:"Consultant", stage:stage}
      : {label:"Working towards", target:sit.target || "No target set", stage:stage};
  }

  function moduleById(id){
    for (var i = 0; i < MODULES.length; i++) if (MODULES[i].id === id) return MODULES[i];
    return null;
  }
  /* the single place a module's state is decided, so the nav and the page it
     leads to can never disagree about whether something applies to you */
  function relevance(id){
    var m = moduleById(id);
    if (!m || !m.rel) return null;
    return m.rel(situation());
  }

  function navBadge(id){
    if (id === "gaps"){
      var n = losingDomains();
      return n ? {n:n, alert:false} : null;
    }
    /* Deadlines carried an urgency badge and the merge absorbed the page;
       the badge moves with it rather than quietly disappearing. It counts
       across every programme tracked, which the old one could not. */
    if (id === "progress"){
      var u = datesGrouped(allDates().filter(function(d){ return d.days >= 0 && d.days <= 21; })).length;
      return u ? {n:u, alert:true} : null;
    }
    return null;
  }

  /* Where a nav item actually goes. For the tracker that is the application
     you had open last, because someone working one application should not have
     to re-pick it every time they come back; #/progress stays the index, so
     "All programmes" goes there and STAYS there rather than bouncing. A
     redirect on #/progress itself would have made the way back unreachable. */
  function navHref(id){
    if (id === "progress" && S.lastProg && progTracked(S.lastProg)){
      return "#/progress/" + encodeURIComponent(S.lastProg);
    }
    return "#/" + id;
  }

  function renderNav(active){
    var sit = situation();
    var html = "";
    ZONES.forEach(function(zone){
      var items = MODULES.filter(function(m){ return m.zone === zone; });
      if (!items.length) return;
      html += '<p class="nav-group">' + esc(zone) + "</p>";
      html += items.map(function(n){
        var r = n.rel ? n.rel(sit) : null;
        var b = navBadge(n.id);
        /* a module that does not apply still renders, still routes, still
           reachable by keyboard. It just stops competing for attention. */
        var cls = "nav-item" + (n.id === active ? " on" : "") + (r ? " rel-" + r.k : "");
        return '<a class="' + cls + '" href="' + navHref(n.id) + '"' +
          (n.id === active ? ' aria-current="page"' : "") +
          (r ? ' title="' + esc(r.why) + '"' : "") + ">" + ico(n.ic, 17) + esc(n.t) +
          (r ? '<span class="pill quiet">' + (r.k === "ahead" ? "later" : "n/a") + "</span>"
             : b ? '<span class="pill' + (b.alert ? " alert" : "") + '">' + b.n + "</span>" : "") + "</a>";
      }).join("");
    });
    document.getElementById("nav").innerHTML = html;
  }

  /* ================= ROUTER ================= */
  /* The hash carries a module and, for a module with a detail level, the thing
     being looked at: #/progress is the tracker's index, #/progress/bst-gim is
     one application inside it. Splitting on segments rather than replacing
     "#/" is what makes the second level linkable, back-button-able, and
     something a doctor can return to. */
  function routeParts(){
    var raw = (location.hash || "#/today").replace(/^#\/?/, "").split("?")[0];
    var parts = raw.split("/").filter(Boolean);
    return {id: parts[0] || "today", arg: parts[1] || ""};
  }
  function currentId(){
    var id = routeParts().id;
    return VIEWS[id] ? id : "today";
  }
  function currentArg(){
    try { return decodeURIComponent(routeParts().arg); } catch (e) { return routeParts().arg; }
  }
  /* routes that survive a merge, pointing at the module that absorbed them */
  var ROUTE_ALIAS = {readiness:"gaps", score:"gaps", deadlines:"progress", programmes:"progress"};
  function moduleFor(id){ return ROUTE_ALIAS[id] || id; }
  function render(){
    /* the one choke point every navigation runs through -- a gym-tile switch,
       opening a different interview, the exit control, back/forward, all of
       it. A live camera/mic stream cannot survive #view being torn out from
       under it, so this is also the one place a recording left running while
       the doctor moves on is guaranteed to be stopped rather than leaking.
       recSuppressGuard is on for exactly the render() call recStart() makes
       to show the recording it just started -- without it this guard would
       fire on that very call and abort a recording before recorder.start()
       even runs, every time, for anyone: not a leak-on-navigation edge case
       but the ordinary path, found only once a browser here actually had a
       working encoder to expose it. */
    if (recState && recState.recording && !recSuppressGuard) recAbort();
    /* a mock-interview session is scenario picks and results banked in
       memory until the doctor logs it -- ephemeral the same way an unsaved
       recording is, so leaving the Mock interview surface (or the hub
       entirely) drops whatever was not yet logged rather than leaving it to
       reappear stale later */
    if (mockSession && (S.gymSurface !== "mock" || S.ivOpen !== mockSession.ivId)) mockSession = null;
    /* which scenario is open for practice in Voice/Video simulator is
       navigation state, not record state -- reset it the same way leaving
       either surface resets everything else about the attempt in progress */
    if (simScenario && S.gymSurface !== "voice" && S.gymSurface !== "video") simScenario = null;
    var id = currentId(), v = VIEWS[id];
    /* the old Deadlines link means "show me the dates" and the old Programmes
       link means "show me the list", so each lands on the tab it meant */
    if (id === "deadlines" && S.trackTab !== "dates"){ S.trackTab = "dates"; save(); }
    if (id === "programmes" && S.trackTab !== "app"){ S.trackTab = "app"; save(); }
    /* picking an application to score is picking the one you are working on, so
       the tracker follows it. One notion, two pages, never disagreeing. */
    if (moduleFor(id) === "gaps" && currentArg()){
      var ga = currentArg();
      if (S.lastProg !== ga && progTracked(ga)){ S.lastProg = ga; save(); }
    }
    var wsT = activeWorkspace();
    /* one application open inside the tracker names itself in the header. The
       detail level is about ONE programme and the page has to say which: the
       name was otherwise only reachable from a sentence under a progress bar. */
    var openProg = null;
    if (moduleFor(id) === "progress" && currentArg()){
      var cand = progById(currentArg());
      if (cand && progTracked(cand.id)) openProg = cand;
    }
    document.getElementById("viewTitle").textContent =
      wsT ? wsT.name : openProg ? openProg.t : v.title;
    document.getElementById("viewSub").textContent = wsT
      ? wsT.sub + " \u00b7 " + (wsT.kind === "exam" ? "Exam preparation" : "Interview preparation")
      : openProg
        ? openProg.body + " \u00b7 " + (TIER_LABEL[openProg.tier] || "") +
          " \u00b7 what this application needs from you"
        : v.sub;
    var host = document.getElementById("view");
    /* if a module is dimmed in the nav, landing on it must say why in the same
       words, rather than leaving the doctor to guess why it looked greyed out */
    var r = relevance(moduleFor(id));
    host.innerHTML = (r ? ctx(r.why, r.k === "aside") : "") + v.render();
    host.classList.remove("enter");
    void host.offsetWidth;
    if (!reduced) host.classList.add("enter");
    animateAll();
    var ws = activeWorkspace();
    document.body.classList.toggle("in-ws", !!ws);
    if (ws){
      renderWorkspaceNav(ws);
      document.getElementById("scopeLabel").textContent = ws.kind === "exam" ? "Preparing for" : "Interview";
      document.getElementById("scopeTarget").textContent = ws.name;
      document.getElementById("scopeStage").textContent = ws.sub;
    } else {
      renderNav(moduleFor(id));
      var sc = scopeBox();
      document.getElementById("scopeLabel").textContent = sc.label;
      document.getElementById("scopeTarget").textContent = sc.target;
      document.getElementById("scopeStage").textContent = sc.stage;
    }
    document.getElementById("whoName").textContent = S.name;
    document.getElementById("avatar").textContent = initials(S.name);
    document.title = v.title + " · MedNav";
  }
  function initials(n){
    return n.split(/\s+/).filter(Boolean).slice(0, 2).map(function(p){ return p[0].toUpperCase(); }).join("") || "MN";
  }
  window.addEventListener("hashchange", function(){
    render();
    document.getElementById("view").focus();
    window.scrollTo({top:0, behavior: reduced ? "auto" : "smooth"});
  });

  /* ================= TOAST ================= */
  var toastEl = document.getElementById("toast"), toastTimer = null;
  function toast(msg){
    document.getElementById("toastText").innerHTML = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove("show"); }, 4200);
  }

  /* ================= ACTIONS =================
     Every mutation reports the delta it actually caused, computed rather than
     asserted, because the causal link is the thing worth teaching. */
  var ACTIONS = {
    finishQI: function(){ S.auditComplete = 1; S.qiPct = 100; return "QI project marked complete"; },
    secondQI: function(){ S.auditComplete = 2; S.qiPct = 100; return "Second QI project marked complete"; },
    logTeaching: function(){
      S.teachingDone = Math.min(S.teachingTarget, S.teachingDone + 1);
      return "Teaching session logged, " + S.teachingDone + " of " + S.teachingTarget;
    },
    addResearch: function(){ S.research = Math.min(2, S.research + 1); return "Research output recorded"; },
    toggleDual: function(){ S.showDual = !S.showDual; return null; },
    passExam: function(){
      var nx = examsInFamily(entryFamilyFor(S.specialty)).filter(function(e){ return !stageHeld(e.id); })[0];
      if (!nx) return null;
      S.examStageDone = S.examStageDone || {};
      S.examStageDone[nx.id] = new Date().toISOString().slice(0, 10);
      var ex = situation().exam;
      return stagesHeld() >= stagesTotal() ? "Full " + ex + " recorded"
        : nx.stage + " recorded, " + stagesHeld() + " of " + stagesTotal();
    },
    doLeadership: function(){ S.leadership = true; return "Leadership course recorded"; },
    togglePast: function(){ S.showPast = !S.showPast; return null; },
    toggleDoneDomains: function(){ S.showDoneDomains = !S.showDoneDomains; return null; },
    reset: function(){
      try { window.localStorage.removeItem(KEY); } catch (e) {}
      S = load();
      S.activity = [];
      return "Demo record reset";
    },
    printReport: function(){ window.print(); return null; },
    exportCal: function(){ toast("Calendar export is not wired up in this demo."); return null; },
    remind: function(){ toast("Reminders are not wired up in this demo."); return null; },
    saveProfile: function(){
      var name = document.getElementById("pName").value.trim();
      var spec = document.getElementById("pSpec").value;
      var months = parseInt(document.getElementById("pMonths").value, 10);
      var teach = parseInt(document.getElementById("pTeach").value, 10);
      if (name) S.name = name;
      /* every specialty the dropdown offers resolves here, not just the five a
         second lookup table used to carry: picking Nephrology once left the
         target reading "HST Cardiology" */
      if (SPECIALTY_INFO[spec]){
        S.specialty = spec;
        S.target = SPECIALTY_INFO[spec].target;
        S.body = SPECIALTY_INFO[spec].body;
        S.exam = SPECIALTY_INFO[spec].exam;
      }
      if (!isNaN(months) && months >= 0) S.clinicalMonths = months;
      if (!isNaN(teach) && teach >= 1){
        S.teachingTarget = teach;
        S.teachingDone = Math.min(S.teachingDone, teach);
      }
      return "Profile saved";
    },
    saveLocation: function(){
      S.basedIn = document.getElementById("pBased").value;
      var willing = Array.prototype.slice.call(document.querySelectorAll("[data-willing-box]:checked")).map(function(el){ return el.value; });
      S.willing = willing.indexOf("any") > -1 ? ["any"] : willing;
      S.dualTrack = document.getElementById("pDual").value;
      S.otherTargets = S.dualTrack === "single" ? [] :
        Array.prototype.slice.call(document.querySelectorAll("[data-other-box]:checked")).map(function(el){ return el.value; });
      return "Location and other applications saved";
    },
    /* a mock result belongs to the stage it was sat for, and moves the
       predicted figure only: a mock is not a stage held and must never touch
       the shortlisting rubric. */
    logMock: function(){
      var el = document.getElementById("mockPct");
      var n = el ? parseInt(el.value, 10) : NaN;
      if (isNaN(n) || n < 0 || n > 100){ toast("Enter a score between 0 and 100."); return null; }
      if (!S.examOpen) return null;
      S.mocks = S.mocks || {};
      S.mocks[S.examOpen] = S.mocks[S.examOpen] || [];
      S.mocks[S.examOpen].push({pct:n, at:new Date().toISOString().slice(0, 10)});
      var me = examById(S.examOpen);
      logActivity("Mock recorded, " + n + "%", me ? examLabel(me) : "");
      return "Mock recorded. Predicted now " + predictedFor(S.examOpen) + "%";
    },
    saveCV: function(){
      S.cvUpdatedAt = new Date().toISOString().slice(0, 10);
      return "CV marked updated today";
    },
    /* the admin page's versions read date inputs that only exist there. These
       record today, which is the common case, and the admin page stays the
       way to enter any other date. */
    logGardaToday: function(){
      S.gardaVettingDate = new Date().toISOString().slice(0, 10);
      return "Garda vetting dated today, renews " + fmtLong(gardaExpiry());
    },
    logOccToday: function(){
      S.occClearance = true;
      S.occClearanceAt = new Date().toISOString().slice(0, 10);
      return "Occupational health clearance recorded";
    }
  };

  function runAction(name){
    var fn = ACTIONS[name];
    if (!fn) return;
    var beforeScore = scorePts(), beforeReady = readiness();
    var msg = fn();
    save();
    render();
    if (!msg) return;
    var dScore = scorePts() - beforeScore, dReady = readiness() - beforeReady;
    var bits = [];
    if (dScore) bits.push("shortlisting score <em>" + (dScore > 0 ? "+" : "") + dScore + "</em>");
    if (dReady) bits.push("readiness <em>" + (dReady > 0 ? "+" : "") + dReady + "%</em>");

    if (name !== "reset"){
      logActivity(msg,
        (dScore ? "Shortlisting score " + (dScore > 0 ? "+" : "") + dScore : "") +
        (dScore && dReady ? ", " : "") +
        (dReady ? "readiness " + (dReady > 0 ? "+" : "") + dReady + "%" : ""));
      render();
    }
    toast(esc(msg) + (bits.length ? ". " + bits.join(", ") : "."));
  }

  document.addEventListener("click", function(ev){
    var act = ev.target.closest("[data-act]");
    if (act){ ev.preventDefault(); runAction(act.getAttribute("data-act")); return; }

    var tog = ev.target.closest("[data-toggle]");
    if (tog){
      ev.preventDefault();
      var id = tog.getAttribute("data-toggle");
      S.deadlinesDone[id] = !S.deadlinesDone[id];
      save(); render();
      toast(S.deadlinesDone[id] ? "Marked done." : "Marked not done.");
      return;
    }

    /* ladder rungs. Marking a stage done, or recording an application and what
       came of it. Per-rung identity means these cannot go through ACTIONS. */
    /* "track this too" writes to otherTargets, which is the same list the
       dual-track comparison on this page reads. Exploring a specialty and
       tracking one are then the same act rather than two features. */
    var addT = ev.target.closest("[data-addtarget]");
    if (addT){
      ev.preventDefault();
      var tn = addT.getAttribute("data-addtarget");
      S.otherTargets = S.otherTargets || [];
      if (S.otherTargets.indexOf(tn) === -1 && tn !== S.specialty){
        S.otherTargets.push(tn);
        S.dualTrack = "multi";
        logActivity("Added " + tn + " as a second target", "From Plan B");
        save(); render();
        toast("Now tracking <em>" + esc(tn) + "</em> alongside " + esc(S.specialty) + ".");
      }
      return;
    }

    var rung = ev.target.closest("[data-rung]");
    if (rung){
      ev.preventDefault();
      var rc = rung.getAttribute("data-rung"), rv = rung.getAttribute("data-rungval") || "";
      var today = new Date().toISOString().slice(0, 10);
      S.stagesDone = S.stagesDone || {};
      S.applications = S.applications || [];
      var m;

      if ((m = /^done:(.+)$/.exec(rc))){
        S.stagesDone[m[1]] = today;
        logActivity(({internship:"Internship", bst:"Basic specialist training", cscst:"CSCST"}[m[1]] || m[1]) + " marked complete", "");
        save(); render(); toast("Marked complete."); return;
      }
      if ((m = /^undo:(.+)$/.exec(rc))){
        delete S.stagesDone[m[1]];
        save(); render(); toast("Unmarked."); return;
      }
      if (rc === "exam"){
        var nex = examsInFamily(entryFamilyFor(S.specialty)).filter(function(e){ return !stageHeld(e.id); })[0];
        if (nex){ S.examStageDone = S.examStageDone || {}; S.examStageDone[nex.id] = today; }
        var ex = situation().exam;
        logActivity(stagesHeld() >= stagesTotal() ? "Full " + ex + " recorded"
                                      : (nex ? nex.stage : "Stage") + " recorded", "");
        save(); render();
        toast(stagesHeld() + " of " + stagesTotal() + " stages held."); return;
      }
      if (rc === "apply"){
        S.applications.unshift({target:rv, cycle:cycleLabel(), appliedAt:today, outcome:"", outcomeAt:""});
        logActivity("Applied to " + rv, cycleLabel() + " cycle");
        save(); render(); toast("Recorded as applied."); return;
      }
      if ((m = /^outcome:(.+)$/.exec(rc))){
        var app = applicationFor(rv);
        if (app){
          app.outcome = m[1];
          app.outcomeAt = today;
          logActivity(rv + ": " + OUTCOMES[m[1]].label, cycleLabel() + " cycle");
        }
        save(); render(); toast(app ? OUTCOMES[m[1]].label + " recorded." : "Nothing to record."); return;
      }
      if (rc === "planb"){
        S.planB = rv; save(); render();
        /* the panel renders below the ladder, which can be off-screen on a
           phone, so a control that appeared to do nothing would be the bug */
        var el = document.getElementById("planb");
        if (el) el.scrollIntoView({behavior: reduced ? "auto" : "smooth", block:"center"});
        return;
      }
      if (rc === "planb-close"){ S.planB = ""; save(); render(); return; }
      /* the Plan B gate. Same store as the rung's own outcome buttons: a
         doctor must never be able to answer this twice and get two answers.
         appliedAt stays empty when no application was logged, and is never
         rendered once an outcome exists. */
      if ((m = /^answer:(.+)$/.exec(rc))){
        var ans = applicationFor(rv);
        if (!ans){
          ans = {target:rv, cycle:cycleLabel(), appliedAt:"", outcome:"", outcomeAt:""};
          S.applications.unshift(ans);
        }
        ans.outcome = m[1];
        ans.outcomeAt = today;
        logActivity(rv + ": " + OUTCOMES[m[1]].label, cycleLabel() + " cycle");
        save(); render(); toast(OUTCOMES[m[1]].label + " recorded."); return;
      }
      if (rc === "reanswer"){
        var re = applicationFor(rv);
        if (re){ re.outcome = ""; re.outcomeAt = ""; }
        save(); render(); toast("Answer cleared."); return;
      }
      if (rc === "unapply"){
        var cy = cycleLabel();
        S.applications = S.applications.filter(function(a){ return !(a.target === rv && a.cycle === cy); });
        save(); render(); toast("Application record removed."); return;
      }
      return;
    }

    /* the annual roll-forward. Its buttons carry the branch or the commit
       directly, because each answer decides which question comes next and
       ACTIONS has no way to take an argument. */
    var roll = ev.target.closest("[data-roll]");
    if (roll){
      ev.preventDefault();
      var cmd = roll.getAttribute("data-roll"), val = roll.getAttribute("data-rollval") || "";
      var yr = new Date().getFullYear(), note = "";

      if (cmd.indexOf("go:") === 0){ S.rollStep = cmd.slice(3); save(); render(); return; }

      if (cmd === "rollCancel"){ S.rollStep = ""; save(); render(); toast("Asked again next time."); return; }
      if (cmd === "rollDone"){ note = "Confirmed record unchanged"; }
      if (cmd === "rollAdvance"){
        var rt = routeTiming();
        S.schemeYear = Math.min(rt.stageYears, (S.schemeYear || rt.stageYear) + 1);
        S.inScheme = true;
        note = "Moved up to year " + S.schemeYear + (S.schemeName ? " of " + S.schemeName : "");
      }
      if (cmd === "rollLeft"){
        S.inScheme = false; S.schemeName = ""; S.schemeYear = 0;
        note = "Left the training scheme";
      }
      if (cmd === "rollJoinTarget"){
        S.inScheme = true; S.schemeName = situation().target; S.schemeYear = 1; S.roleTitle = "";
        note = "Started " + S.schemeName;
      }
      if (cmd === "rollJoinOther"){
        S.inScheme = true; S.schemeName = val || "a training scheme"; S.schemeYear = 1; S.roleTitle = "";
        note = "Started " + S.schemeName;
      }
      if (cmd === "rollRole"){
        S.inScheme = false; S.schemeName = ""; S.schemeYear = 0; S.roleTitle = val;
        note = "Working as " + (val === "Other" ? "a non-training post" : val) + ", not in a scheme";
      }
      /* every turnover is recorded, including the ones where nothing happened,
         because "no place this year" is the fact the ladder needs most */
      S.rollHistory = S.rollHistory || [];
      S.rollHistory.unshift({ year: yr, note: note, at: new Date().toISOString().slice(0, 10) });
      S.rollHistory = S.rollHistory.slice(0, 12);
      S.lastRolledAt = new Date().toISOString().slice(0, 10);
      S.rollStep = "";
      logActivity(note, "Annual update for " + yr);
      save(); render();
      toast(esc(note) + ".");
      return;
    }

    var rmRot = ev.target.closest("[data-remove-rotation]");
    if (rmRot){
      ev.preventDefault();
      var ri = parseInt(rmRot.getAttribute("data-remove-rotation"), 10);
      (S.rotations || []).splice(ri, 1);
      save(); render();
      toast("Rotation removed.");
      return;
    }

    /* custom milestone: swap the button for an inline field rather than a
       browser prompt, which some embedded contexts block outright */
    var add = ev.target.closest('[data-act="addMilestone"]');
    if (add){ ev.preventDefault(); }
  });

      ev.preventDefault();
      recStopClick();
      return;
    }
    var rd = ev.target.closest("[data-rec-discard]");
    if (rd){
      ev.preventDefault();
      recDiscard();
      return;
    }
    var rlg = ev.target.closest("[data-rec-log]");
    if (rlg){
      ev.preventDefault();
      if (!S.ivOpen) return;
      recLogClick(S.ivOpen);
      return;
    }
    var rnx = ev.target.closest("[data-rec-next]");
    if (rnx){
      ev.preventDefault();
      recNextClick();
      return;
    }
    var wx = ev.target.closest("[data-ws-exit]");
    if (wx){
      ev.preventDefault();
      /* two levels out, and they are different places: the in-page control
         goes up to the catalogue, this one leaves the product entirely.
         Making both land on the catalogue was two controls for one action. */
      S.examOpen = ""; S.ivOpen = ""; S.gymSurface = "";
      save();
      if (location.hash === "#/today") render(); else location.hash = "#/today";
      return;
    }
    var gs = ev.target.closest("[data-gym]");
    if (gs){
      ev.preventDefault();
      var gid = gs.getAttribute("data-gym");
      S.gymSurface = S.gymSurface === gid ? "" : gid;
      save(); render(); return;
    }
    var tp = ev.target.closest("[data-topic]");
    if (tp){
      ev.preventDefault();
      if (!S.examOpen) return;
      var tname = tp.getAttribute("data-topic");
      S.topicsDone = S.topicsDone || {};
      S.topicsDone[S.examOpen] = S.topicsDone[S.examOpen] || {};
      S.topicsDone[S.examOpen][tname] = new Date().toISOString().slice(0, 10);
      logActivity(tname + " covered", (examById(S.examOpen) || {}).stage || "");
      save(); render();
      toast("<em>" + esc(tname) + "</em> covered."); return;
    }
  }, true);

  /* typing filters as you go. The value is written straight to the record and
     focus restored after the rerender, because a search box that loses the
     caret on the second keystroke is worse than no search box. */
  document.addEventListener("input", function(ev){
    var q = ev.target.closest("#prepQ");
    if (!q) return;
    S.prepQuery = q.value;
    var pos = q.selectionStart;
    save(); render();
    var again = document.getElementById("prepQ");
    if (again){ again.focus(); try { again.setSelectionRange(pos, pos); } catch (e) {} }
  }, true);

  document.getElementById("resetBtn").addEventListener("click", function(){ runAction("reset"); });
  document.getElementById("signOut").addEventListener("click", function(){
    toast("Sign out is not wired up in this demo.");
  });

  /* the baseline the trend is measured from, written once everything above is
     defined. Without it the first logged change would read as the whole
     history of the doctor's portfolio. */
  if (!(S.scoreLog || []).length){ noteScore(); save(); }

  render();
})();
</script>
</body>
</html>
