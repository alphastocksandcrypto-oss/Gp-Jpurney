  /* a note against a domain, edited in place like the rotation row */
  document.addEventListener("click", function(ev){
    var clr = ev.target.closest("[data-note-clear]");
    if (clr){
      ev.preventDefault();
      var cid = clr.getAttribute("data-note-clear");
      S.domainNotes = S.domainNotes || {};
      delete S.domainNotes[cid];
      save(); render(); toast("Note cleared.");
      return;
    }
    var btn = ev.target.closest("[data-note]");
    if (!btn) return;
    ev.preventDefault();
    var id = btn.getAttribute("data-note");
    var row = btn.closest(".dom");
    if (!row) return;
    var wrap = document.createElement("div");
    wrap.style.cssText = "display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px";
    wrap.innerHTML =
      '<input id="domNote" maxlength="140" placeholder="Why is this where it is?" ' +
      'style="border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;flex:1;min-width:180px">' +
      '<button class="btn btn-sm btn-primary" id="domNoteSave">Save</button>' +
      '<button class="btn btn-sm btn-ghost" id="domNoteCancel">Cancel</button>';
    row.querySelector(".dom-a").replaceWith(wrap);
    var input = document.getElementById("domNote");
    input.value = (S.domainNotes || {})[id] || "";
    input.focus();
    function commit(){
      S.domainNotes = S.domainNotes || {};
      var v = input.value.trim();
      if (v) S.domainNotes[id] = v.slice(0, 140); else delete S.domainNotes[id];
      save(); render(); toast(v ? "Note saved." : "Note cleared.");
    }
    document.getElementById("domNoteSave").addEventListener("click", commit);
    document.getElementById("domNoteCancel").addEventListener("click", function(){ render(); });
    input.addEventListener("keydown", function(e){ if (e.key === "Enter") commit(); });
  }, true);

  /* switching application or stage. Both stick, so a doctor who came back to
     chase one reference is not returned to the top of the year each time. */
  document.addEventListener("click", function(ev){
    var tt = ev.target.closest("[data-track-target]");
    if (tt){ ev.preventDefault(); S.trackTarget = tt.getAttribute("data-track-target"); save(); render(); return; }
    var tp = ev.target.closest("[data-track-phase]");
    if (tp){ ev.preventDefault(); S.trackPhase = tp.getAttribute("data-track-phase"); save(); render(); return; }
  }, true);

  /* a rotation logged where it is asked for, rather than on another page */
  document.addEventListener("click", function(ev){
    var btn = ev.target.closest('[data-act="addRotationHere"]');
    if (!btn) return;
    ev.preventDefault();
    ev.stopPropagation();
    var wrap = document.createElement("div");
    wrap.style.cssText = "display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px";
    var fld = "border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px";
    wrap.innerHTML =
      '<input id="rotHosp" placeholder="Hospital" style="' + fld + ';min-width:150px">' +
      '<input id="rotSpec" placeholder="Specialty" style="' + fld + ';min-width:130px">' +
      '<input id="rotFrom" type="date" style="' + fld + '">' +
      '<input id="rotTo" type="date" style="' + fld + '">' +
      '<button class="btn btn-sm btn-primary" id="rotAdd">Add</button>' +
      '<button class="btn btn-sm btn-ghost" id="rotCancel">Cancel</button>';
    btn.closest(".chk-a").replaceWith(wrap);
    document.getElementById("rotHosp").focus();
    function commit(){
      var hosp = document.getElementById("rotHosp").value.trim();
      if (!hosp){ render(); return; }
      S.rotations = S.rotations || [];
      S.rotations.unshift({
        hospital: hosp.slice(0, 80),
        specialty: document.getElementById("rotSpec").value.trim().slice(0, 60),
        from: document.getElementById("rotFrom").value,
        to: document.getElementById("rotTo").value
      });
      logActivity("Rotation logged", hosp.slice(0, 80));
      save(); render(); toast("Rotation added.");
    }
    document.getElementById("rotAdd").addEventListener("click", commit);
    document.getElementById("rotCancel").addEventListener("click", function(){ render(); });
  }, true);

  /* a manual requirement ticked, or a custom one removed */
  document.addEventListener("click", function(ev){
    var rm = ev.target.closest("[data-check-remove]");
    if (rm){
      ev.preventDefault();
      var rid = rm.getAttribute("data-check-remove").replace(/^custom:/, "");
      S.customChecks = (S.customChecks || []).filter(function(c){ return String(c.id) !== rid; });
      save(); render(); toast("Requirement removed.");
      return;
    }
    var box = ev.target.closest("[data-check]");
    if (!box) return;
    ev.preventDefault();
    var id = box.getAttribute("data-check"), target = box.getAttribute("data-check-target");
    var all = checksFor(), item = all.filter(function(c){ return c.id === id; })[0];
    if (!item) return;
    S.checks = S.checks || {};
    var key = checkKey(item, target);
    if (S.checks[key]){
      delete S.checks[key];
      save(); render(); toast("Marked not ready.");
    } else {
      S.checks[key] = new Date().toISOString().slice(0, 10);
      logActivity(item.t + " marked ready", item.shared ? "Counts for every application" : target);
      save(); render();
      var pr = checkProgress(target);
      toast("<em>" + esc(item.t) + "</em> ready. " + pr.done + " of " + pr.total + " for " + esc(target) + ".");
    }
  }, true);

  /* opening a stage's hub, moving between its surfaces, and the two things
     they write. Everything is keyed by stage id, never by family. */
  document.addEventListener("click", function(ev){
    var xo = ev.target.closest("[data-exam-open]");
    if (xo){
      ev.preventDefault();
      var xid = xo.getAttribute("data-exam-open");
      S.examOpen = xid;
      S.gymSurface = "";
      if (xid){
        S.examActive = S.examActive || [];
        if (S.examActive.indexOf(xid) === -1){
          S.examActive.push(xid);
          var xe = examById(xid);
          if (xe) logActivity("Started preparing for " + xe.fam + " " + xe.stage, xe.body);
        }
      }
      save(); render(); return;
    }
    var xh = ev.target.closest("[data-exam-held]");
    if (xh){
      ev.preventDefault();
      var hid = xh.getAttribute("data-exam-held"), he = examById(hid);
      S.examStageDone = S.examStageDone || {};
      S.examStageDone[hid] = new Date().toISOString().slice(0, 10);
      if (he) logActivity(he.fam + " " + he.stage + " recorded as held", he.body);
      save(); render();
      toast(he ? "<em>" + esc(he.fam + " " + he.stage) + "</em> recorded." : "Recorded."); return;
    }
    var io = ev.target.closest("[data-iv-open]");
    if (io){
      ev.preventDefault();
      S.ivOpen = io.getAttribute("data-iv-open");
      S.gymSurface = "";
      save(); render(); return;
    }
    var isub = ev.target.closest("[data-iv-sub]");
    if (isub){
      ev.preventDefault();
      var sid = isub.getAttribute("data-iv-sub");
      S.ivSubscribed = S.ivSubscribed || [];
      if (S.ivSubscribed.indexOf(sid) === -1){
        S.ivSubscribed.push(sid);
        logActivity("Added " + ((INTERVIEWS[sid] || {}).t || sid) + " prep", sid);
      }
      save(); render();
      toast("<em>" + esc((INTERVIEWS[sid] || {}).t || sid) + "</em> added. Billing is not wired up in this demo.");
      return;
    }
    var ir = ev.target.closest("[data-iv-rate]");
    if (ir){
      ev.preventDefault();
      var bits = ir.getAttribute("data-iv-rate").split(":");
      if (!S.ivOpen) return;
      S.ivRatings = S.ivRatings || {};
      S.ivRatings[S.ivOpen] = S.ivRatings[S.ivOpen] || {};
      /* clicking the rating you already hold clears it, so a doctor can undo
         without having to pick a number they do not mean */
      if (S.ivRatings[S.ivOpen][bits[0]] === +bits[1]) delete S.ivRatings[S.ivOpen][bits[0]];
      else S.ivRatings[S.ivOpen][bits[0]] = +bits[1];
      save(); render(); return;
    }
    var im = ev.target.closest("[data-iv-mock]");
    if (im){
      ev.preventDefault();
      var mid = im.getAttribute("data-iv-mock");
      var rated = Object.keys(ivRatings(mid)).length;
      if (!rated){ toast("Rate at least one domain first."); return; }
      S.ivMocks = S.ivMocks || {};
      S.ivMocks[mid] = S.ivMocks[mid] || [];
      S.ivMocks[mid].push({at:new Date().toISOString().slice(0, 10), ready:ivReady(mid)});
      logActivity("Mock interview logged, " + ivReady(mid) + "% self-rated", mid);
      save(); render();
      toast("Mock logged. <em>" + ivReady(mid) + "%</em> self-rated across " + rated + " domains."); return;
    }
    var wx = ev.target.closest("[data-ws-exit]");
    if (wx){
      ev.preventDefault();
      /* two levels out, and they are different places: the in-page control
         goes up to the catalogue, this one leaves the product entirely.
         Making both land on the catalogue was two controls for one action. */
      S.examOpen = ""; S.ivOpen = ""; S.gymSurface = "";
      save();
      if (location.hash === "#/today") render(); else location.hash = "#/today";
      return;
    }
    var gs = ev.target.closest("[data-gym]");
    if (gs){
      ev.preventDefault();
      var gid = gs.getAttribute("data-gym");
      S.gymSurface = S.gymSurface === gid ? "" : gid;
      save(); render(); return;
    }
    var tp = ev.target.closest("[data-topic]");
    if (tp){
      ev.preventDefault();
      if (!S.examOpen) return;
      var tname = tp.getAttribute("data-topic");
      S.topicsDone = S.topicsDone || {};
      S.topicsDone[S.examOpen] = S.topicsDone[S.examOpen] || {};
      S.topicsDone[S.examOpen][tname] = new Date().toISOString().slice(0, 10);
      logActivity(tname + " covered", (examById(S.examOpen) || {}).stage || "");
      save(); render();
      toast("<em>" + esc(tname) + "</em> covered."); return;
    }
  }, true);

  document.getElementById("resetBtn").addEventListener("click", function(){ runAction("reset"); });
  document.getElementById("signOut").addEventListener("click", function(){
    toast("Sign out is not wired up in this demo.");
  });

  /* the baseline the trend is measured from, written once everything above is
     defined. Without it the first logged change would read as the whole
     history of the doctor's portfolio. */
  if (!(S.scoreLog || []).length){ noteScore(); save(); }

  render();
})();
</script>
</body>
</html>
