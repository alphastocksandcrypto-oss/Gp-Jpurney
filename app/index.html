      '<p class="pc-sub">' + esc(e.fmt) + " \u00b7 " + esc(WHEN_LABEL[e.when]) + "</p>" +
      (why ? '<p class="pc-why">' + esc(why) + "</p>" : '<p class="pc-d">' + esc(e.d) + "</p>");

    if (held){
      var on = (S.examStageDone || {})[e.id];
      h += '<div class="pc-prog"><div class="pr"><span>Held</span><span>' +
        (typeof on === "string" && /^\d{4}-/.test(on) ? esc(fmt(on)) : "On your ladder") +
        '</span></div><div class="pc-bar"><i style="width:100%"></i></div></div>';
    } else if (pred !== null){
      h += '<div class="pc-prog"><div class="pr"><span>' + pred + " % predicted</span><span>" +
        mocksFor(e.id).length + " mock" + (mocksFor(e.id).length === 1 ? "" : "s") +
        '</span></div><div class="pc-bar"><i style="width:' + pred + '%"></i></div></div>';
    } else if (covered){
      h += '<div class="pc-prog"><div class="pr"><span>' + covered + " of " + TOPICS.length +
        " topics covered</span><span>No mock yet</span></div><div class=\"pc-bar\"><i style=\"width:" +
        Math.round(covered / TOPICS.length * 100) + '%"></i></div></div>';
    } else if (!open){
      h += '<p class="pc-sub" style="margin-top:10px">' + gymFor(e).length +
        " surfaces inside. Look inside to see them before unlocking.</p>";
    }

    h += '<div class="pc-f">' +
      (open
        ? '<button class="btn btn-sm btn-primary" data-exam-open="' + esc(e.id) + '">Open the hub</button>'
        : '<button class="btn btn-sm btn-primary" data-unlock="' + esc(e.id) + '">Get access</button>' +
          '<button class="btn btn-sm btn-ghost" data-exam-open="' + esc(e.id) + '">Look inside</button>') +
      (held ? '<span class="pc-st held">Held</span>'
            : wk !== null ? '<span class="pc-wk ' + (wk <= 4 ? "crit" : wk <= 10 ? "warn" : "") + '">' +
                wk + (wk === 1 ? " wk" : " wks") + "</span>" : "") +
      "</div>";
    /* recording a stage is book-keeping on your own route, not a shelf action:
       on all nineteen cards it was nineteen buttons of noise */
    if (!held && open) h += '<div class="pc-f" style="padding-top:8px">' +
      '<button class="btn btn-sm btn-ghost" data-exam-held="' + esc(e.id) + '">Mark as held</button></div>';
    return h + "</div></div>";
  }


  var WHEN_LABEL = {entry:"Usually needed to apply", membership:"Sat during training", exit:"Sat to complete training"};

  function examHub(e){
    if (!prepOpen(e.id, examIncluded(e.id))) return prepLocked(e, "exam");
    var surface = S.gymSurface || "";
    var list = gymFor(e), g = list.filter(function(x){ return x.id === surface; })[0];
    var wk = weeksTo(e), pred = predictedFor(e.id), held = stageHeld(e.id);

    var h = '<button class="btn btn-sm btn-ghost" data-exam-open="" style="margin-bottom:12px">' +
      ico(I.arrow, 13) + "All exams</button>";

    h += '<div class="gym-h"><div class="gym-id"><span class="gym-k">' + esc(e.body) + "</span>" +
      "<h2>" + esc(examLabel(e)) + "</h2>" +
      "<p>" + esc(e.fmt) + ". " + (wk === null
        ? "No sitting dated for this stage in your record."
        : wk + (wk === 1 ? " week" : " weeks") + " until the application that asks for it closes.") + "</p></div>";
    h += '<div class="gym-stat"><span class="k">Predicted</span><b>' + (pred === null ? "—" : pred + "%") + "</b>" +
      "<small>" + (pred === null ? "Sit a mock to start" : "Mean of your last " + Math.min(3, mocksFor(e.id).length)) + "</small></div>";
    h += '<div class="gym-stat"><span class="k">This stage</span><b>' + (held ? "Held" : "Open") + "</b>" +
      "<small>" + (held ? "Recorded on your ladder" : "Not yet passed") + "</small></div></div>";

    h += '<div class="gym-grid">' + list.map(function(x){
      return '<button class="gym-card' + (x.id === surface ? " on" : "") + '" data-gym="' + x.id + '">' +
        '<span class="gym-ic">' + ico(x.ic, 17) + "</span><b>" + esc(x.t) + "</b>" +
        '<span class="gd">' + esc(x.d) + "</span>" +
        '<span class="gf">' + ico(I.arrow, 11) + esc(x.feeds) + "</span></button>";
    }).join("") + "</div>";

    if (!g){
      h += ctx("This is the structure of the hub. The teaching text and the questions behind each surface are " +
        "written by doctors who have sat this stage and are never generated, so what is here is the shape they " +
        "go into.");
      return h;
    }
    h += '<p class="sec-label">' + esc(g.t) + "</p>" + gymSurface(g, e, wk);
    return h;
  }

  function gymSurface(g, e, wk){
    if (g.id === "plan"){
      if (wk === null){
        return '<div class="card"><p class="empty"><b>No date to plan against.</b>' +
          "This stage is sat during training rather than to enter it, so the plan starts when you book a sitting.</p></div>";
      }
      var blocks = [
        {w:"Weeks 1 to 2", t:"Cover the ground", d:"One pass of the knowledge base, flagging what you do not know rather than stopping to fix it"},
        {w:"Weeks 3 to 5", t:"Practice by topic", d:"Work the flagged topics in blocks, reading the explanations"},
        {w:"Week 6", t:"First mock", d:"Timed and full length, to find out where you actually are"},
        {w:"Weeks 7 to 8", t:"Close what the mock found", d:"Analytics ranks them. Work down, not across."},
        {w:"Final week", t:"Second mock, then taper", d:"Confirm the direction of travel and stop"}
      ];
      var h = '<div class="card"><div class="card-head"><h2>' + wk + (wk === 1 ? " week" : " weeks") + " to go</h2>" +
        '<span class="aside">Six to eight weeks is the working minimum</span></div>';
      h += blocks.map(function(b){
        return '<div class="row"><span class="t">' + esc(b.t) + "<small>" + esc(b.d) + "</small></span>" +
          '<span class="r"><span class="chip mute">' + esc(b.w) + "</span></span></div>";
      }).join("");
      return h + ctxFoot("The shape of the plan is ours. The weeks come from your own cycle dates, which are " +
        "illustrative in this prototype.") + "</div>";
    }

    if (g.id === "kb" || g.id === "qbank"){
      var done = topicsFor(e.id), n = TOPICS.filter(function(t){ return done[t]; }).length;
      var h2 = '<div class="card"><div class="card-head"><h2>' + n + " of " + TOPICS.length + " topics covered</h2>" +
        '<span class="aside">' + esc(examLabel(e)) + "</span></div>" + bar(Math.round(n / TOPICS.length * 100));
      h2 += '<div class="picks" style="margin-top:14px">' + TOPICS.map(function(t){
        return '<span class="pick">' + esc(t) + (done[t]
          ? '<span class="chip good">' + ico(I.tick, 12) + "Covered</span>"
          : '<button class="btn btn-sm btn-ghost" data-topic="' + esc(t) + '">Mark covered</button>') + "</span>";
      }).join("") + "</div>";
      return h2 + ctx("The topic list is illustrative and is not this stage's syllabus. The teaching text and the " +
        "questions behind each topic are authored by doctors who have sat it and are not generated, which is why " +
        "this shows the structure rather than pretending to hold the content.", true) + "</div>";
    }

    if (g.id === "mock"){
      var ms = mocksFor(e.id);
      var h3 = '<div class="card"><div class="card-head"><h2>Record a mock result</h2>' +
        '<span class="aside">' + ms.length + " recorded for this stage</span></div>" +
        '<p class="lede" style="max-width:64ch;margin-bottom:14px">Sit it timed and full length, then enter what you ' +
        "scored. It moves the predicted result for this stage and nothing else on your record: a mock is not a stage held.</p>" +
        '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">' +
        '<input id="mockPct" type="number" min="0" max="100" placeholder="Score %" ' +
        'style="border:1.5px solid var(--line);border-radius:11px;padding:9px 13px;font-size:13.5px;width:118px">' +
        '<button class="btn btn-sm btn-primary" data-act="logMock">Record it</button></div>';
      if (ms.length){
        h3 += '<p class="group-h">Your mocks</p>' + ms.slice().reverse().map(function(m){
          return '<div class="row"><span class="t">' + m.pct + "%<small>" + fmtLong(m.at) + "</small></span>" +
            '<span class="r"><span class="chip ' + (m.pct >= 70 ? "good" : m.pct >= 50 ? "warn" : "crit") + '">' +
            (m.pct >= 70 ? "Comfortable" : m.pct >= 50 ? "Borderline" : "Behind") + "</span></span></div>";
        }).join("");
      }
      return h3 + "</div>";
    }

    if (g.id === "stats"){
      var tr = trendFor(e.id), pr = predictedFor(e.id);
      var h4 = '<div class="card"><div class="card-head"><h2>' + (pr === null ? "Nothing to read yet" : pr + "% predicted") + "</h2>" +
        (tr ? '<span class="aside">' + (tr.delta >= 0 ? "up " : "down ") + Math.abs(tr.delta) + " across " +
          mocksFor(e.id).length + " mocks</span>" : "") + "</div>";
      if (pr === null){
        h4 += '<p class="empty">Record a mock and this reads it back: your trend, and what your coverage says.</p>';
      } else {
        h4 += '<p class="trend' + (tr && tr.delta > 0 ? " up" : tr && tr.delta < 0 ? " down" : "") + '">' +
          (tr ? spark(tr.points, 80, 24) : "") + "<span>" +
          (tr ? "From " + tr.from + "% to " + tr.to + "%" : "One mock recorded, so no trend yet") + "</span></p>";
        var cov = Object.keys(topicsFor(e.id)).length;
        h4 += '<div class="barrow" style="margin-top:14px"><span class="lbl">Topics covered</span>' +
          '<span class="val num">' + cov + " of " + TOPICS.length + "</span>" +
          bar(Math.round(cov / TOPICS.length * 100)) +
          '<span class="note">Coverage and score together are what a prediction can honestly be built from.</span></div>';
      }
      return h4 + ctxFoot("Predicted is the mean of your last three mocks for this stage. It reads your own scores " +
        "back to you and is not a claim about what the college will award.") + "</div>";
    }

    return '<div class="card"><div class="card-head"><h2>Live tutor</h2>' +
      '<span class="chip mute">Not wired up in this prototype</span></div>' +
      '<p class="lede" style="max-width:64ch">Sessions with a doctor who has sat ' + esc(examLabel(e)) +
      ". Availability, booking and payment are real product surfaces rather than things to mock up here, so this " +
      "one is named and left honest.</p></div>";
  }

  /* ================= INTERVIEW PREP =================
     Built the same shape as exam prep, because it is the same kind of thing:
     a catalogue of what you could be sitting, and a hub for each one you are.

     The unit is the interview for a PROGRAMME, not a generic "interview". An
     RCPI HST panel and the ICGP scenario assessment are different formats
     scored on different things, and a doctor tracking both is preparing twice.

     The surface that makes this worth having is "Your evidence". The interview
     scores the same domains the portfolio does, and this product already holds
     the portfolio. So when the panel asks about quality improvement it can
     name the audit the doctor logged, rather than leaving them to remember it
     under pressure. Nothing else in the market can do that, because nothing
     else holds both halves. */
  var IV_DOMAINS = [
    {id:"clinical",   t:"Clinical skills and knowledge", from:["clinical","exams"],
     d:"Judgement on real cases, and the knowledge behind it"},
    {id:"qi",         t:"Quality improvement", from:["auditqi"],
     d:"A project you ran, what changed, and what you would do differently"},
    {id:"comm",       t:"Communication and teaching", from:["teaching"],
     d:"Explaining to patients, families and colleagues"},
    {id:"appraisal",  t:"Research and critical appraisal", from:["research"],
     d:"Reading a paper properly and saying what it is worth"},
    {id:"teamwork",   t:"Teamwork and leadership", from:["leadership"],
     d:"Where you led, where you followed, and how you handled it going wrong"},
    {id:"self",       t:"Professionalism and self-awareness", from:[],
     d:"Insight, probity, and knowing your own limits"}
  ];

  /* Interview preps are PRODUCTS, not a per-college derivation. A doctor
     applying to BST General Internal Medicine is preparing for a different
     interview to one applying to HST Cardiology, even though both go through
     RCPI, and the old lookup could not say so.

     ILLUSTRATIVE. Formats and the domains scored are each college's and change. */
  var INTERVIEWS = [
    {id:"bst-gim",  grp:"Medicine", body:"RCPI", tier:"bst",
     t:"BST General Internal Medicine interview", fmt:"Structured panel",
     d:"Entry to basic specialist training in medicine. Scored on the same domains the portfolio is."},
    {id:"hst-rcpi", grp:"Medicine", body:"RCPI", tier:"hst",
     t:"HST selection interview", fmt:"Structured panel",
     d:"A panel scoring you against set domains, with your portfolio in front of them."},
    {id:"bst-surg", grp:"Surgery", body:"RCSI", tier:"bst",
     t:"Core surgical training interview", fmt:"Structured panel",
     d:"Entry to core surgical training, scored on portfolio and structured questions."},
    {id:"hst-rcsi", grp:"Surgery", body:"RCSI", tier:"hst",
     t:"HST surgical selection interview", fmt:"Structured panel",
     d:"Higher specialist training selection, with operative experience examined alongside the portfolio."},
    {id:"icgp-sbca", grp:"General Practice", body:"ICGP", tier:"bst",
     t:"Scenario-Based Competency Assessment", fmt:"Simulated stations",
     d:"Competency-based stations rather than a panel. Scored per station, on the same domains."},
    {id:"psych-sel", grp:"Psychiatry", body:"College of Psychiatrists", tier:"hst",
     t:"Psychiatry selection interview", fmt:"Structured panel",
     d:"A panel scoring you against set domains."},
    {id:"em-sel",    grp:"Emergency Medicine", body:"RCSI", tier:"hst",
     t:"Emergency Medicine selection interview", fmt:"Structured panel",
     d:"Selection into higher training in emergency medicine."},
    {id:"anaes-sel", grp:"Anaesthesiology", body:"College of Anaesthesiologists", tier:"hst",
     t:"Anaesthesiology selection interview", fmt:"Structured panel",
     d:"A panel scoring you against set domains."},
    {id:"rad-sel",   grp:"Radiology", body:"Faculty of Radiologists", tier:"hst",
     t:"Radiology selection interview", fmt:"Structured panel",
     d:"A panel scoring you against set domains."},
    {id:"path-sel",  grp:"Pathology", body:"Faculty of Pathology", tier:"hst",
     t:"Pathology selection interview", fmt:"Structured panel",
     d:"A panel scoring you against set domains."},
    {id:"ph-sel",    grp:"Public Health", body:"Faculty of Public Health Medicine", tier:"hst",
     t:"Public Health Medicine selection interview", fmt:"Structured panel",
     d:"A panel scoring you against set domains."},
    {id:"paeds-sel", grp:"Paediatrics", body:"RCPI", tier:"hst",
     t:"Paediatrics selection interview", fmt:"Structured panel",
     d:"A panel scoring you against set domains."},
    {id:"og-sel",    grp:"Obstetrics and Gynaecology", body:"RCPI", tier:"hst",
     t:"Obstetrics and Gynaecology selection interview", fmt:"Structured panel",
     d:"A panel scoring you against set domains."}
  ];
  function interviewById(id){ return INTERVIEWS.filter(function(x){ return x.id === id; })[0] || null; }

  /* which interview a route implies: the college it goes through, at the tier
     the doctor is actually applying at. An intern applying to BST is not
     preparing for an HST panel. */
  function interviewFor(specialty){
    var info = SPECIALTY_INFO[specialty] || {}, sit = situation();
    var body = (specialty === S.specialty ? sit.college : info.body) || info.body;
    if (!body) return null;
    var tier = (sit.isStudent || sit.isIntern || sit.tier === "bst" && routeTiming().stageYear <= 1)
      ? "bst" : "hst";
    var exact = INTERVIEWS.filter(function(x){ return x.body === body && x.tier === tier; })[0];
    var any   = INTERVIEWS.filter(function(x){ return x.body === body; })[0];
    var iv = exact || any;
    return iv ? {id:iv.id, grp:iv.grp, body:iv.body, tier:iv.tier, t:iv.t, fmt:iv.fmt, d:iv.d,
                 target:info.target || specialty, cycle:CYCLE[iv.body] || null} : null;
  }
  /* The interviews this doctor is heading for: one per PROGRAMME they track,
     each at that programme's own tier. This used to walk specialties and let
     interviewFor() guess the tier from situation(), so tracking a trunk and
     the higher programme it feeds produced one interview instead of two. */
  function myInterviews(){
    var out = [], seen = [];
    progsTracked().forEach(function(p){
      var iv = ivForProgramme(p);
      if (!iv || seen.indexOf(iv.id) > -1) return;
      seen.push(iv.id);
      out.push({id:iv.id, grp:iv.grp, body:iv.body, tier:iv.tier, t:iv.t, fmt:iv.fmt, d:iv.d,
                /* the programme, not the specialty: "BST General Internal
                   Medicine" is what the doctor is sitting this panel for */
                target:p.t, cycle:CYCLE[iv.body] || null});
    });
    return out;
  }
  /* every prep that exists, not only the ones a route implies. A product
     people browse has to show its shelf. */
  function allInterviews(){
    var mine = myInterviews(), mineIds = mine.map(function(x){ return x.id; });
    return mine.concat(INTERVIEWS.filter(function(x){ return mineIds.indexOf(x.id) === -1; })
      .map(function(x){
        return {id:x.id, grp:x.grp, body:x.body, tier:x.tier, t:x.t, fmt:x.fmt, d:x.d,
                target:"", cycle:CYCLE[x.body] || null};
      }));
  }
  function ivIncluded(id){ return myInterviews().some(function(x){ return x.id === id; }); }

  /* what the doctor already holds that answers a given interview domain,
     read straight off the portfolio rather than asked for again */
  function evidenceFor(d){
    return (d.from || []).map(function(id){
      return DOMAINS.filter(function(x){ return x.id === id; })[0];
    }).filter(Boolean);
  }
  /* whether a domain's answer-structure notes have been marked read */
  function ivKbDone(id){ return (S.ivKbDone || {})[id] || {}; }
  /* every graded scenario attempt (Voice/Video simulator) and every full
     graded session (Mock interview), per interview prep */
  function ivAttempts(id){ return (S.ivAttempts || {})[id] || []; }
  function ivSessions(id){ return (S.ivSessions || {})[id] || []; }
  function ivAllScores(id){
    return ivAttempts(id).map(function(a){ return a.overall; })
      .concat(ivSessions(id).map(function(s){ return s.overall; }));
  }
  /* the headline readiness figure now reads graded attempts and sessions --
     the panel is the simulated grade, not a number the doctor typed in */
  function ivReady(id){
    var scores = ivAllScores(id);
    if (!scores.length) return null;
    return Math.round(scores.reduce(function(a, b){ return a + b; }, 0) / scores.length);
  }
  function ivDomainAvg(id, domainId){
    var xs = ivAttempts(id).filter(function(a){ return a.domain === domainId; }).map(function(a){ return a.overall; });
    if (!xs.length) return null;
    return Math.round(xs.reduce(function(a, b){ return a + b; }, 0) / xs.length);
  }
  /* the same shape trendFor() gives an exam stage, read off full mock
     sessions rather than individual scenario attempts -- a session is the
     comparable, complete unit */
  function ivTrend(id){
    var s = ivSessions(id);
    if (s.length < 2) return null;
    var pts = s.map(function(x){ return x.overall; });
    return {from:pts[0], to:pts[pts.length - 1], delta:pts[pts.length - 1] - pts[0], points:pts};
  }
  /* weeks to the interview itself, the same shape weeksTo() gives an exam
     stage. Only ever paced against a cycle the doctor is actually in. */
  function ivWeeksTo(iv){
    if (!iv.cycle) return null;
    var d = until(iv.cycle.interview);
    return d < 0 ? null : Math.max(0, Math.round(d / 7));
  }

  /* ============ SCORING CRITERIA, KNOWLEDGE BASE, SCENARIOS ============
     Real, populated content rather than a "to be authored" stub -- every
     scenario, example answer and rubric line below is placeholder content
     written for this prototype, not any college's actual material, and is
     listed in the README placeholders section. The point of writing it out
     in full is that the pages read and behave like the finished product; the
     content itself still has to come from doctors who have sat these panels
     before this reaches a real one. */
  var IV_CRITERIA = {
    clinical:{summary:"Judgement on real cases under pressure, and the knowledge behind the decision.", weight:25,
      anchors:["Vague or textbook; no sense of a real decision being made",
        "States a plan but cannot say why, or misses an obvious safety step",
        "A safe, reasonable plan with the main differentials covered",
        "A clear plan, prioritised correctly, with reasoning the panel can follow",
        "Anticipates complications, states what would change the plan, and why"]},
    qi:{summary:"A project you actually ran: the problem, what changed, and what you would do differently.", weight:15,
      anchors:["No project, or describes attending one rather than running it",
        "A project with no measured before and after",
        "A completed audit cycle with a clear before and after",
        "A cycle plus a real, described change in practice",
        "A cycle, a change, re-measurement, and honest reflection on what did not work"]},
    comm:{summary:"Explaining to patients, families and colleagues, clearly and without jargon.", weight:20,
      anchors:["Jargon-heavy or one-directional; no check for understanding",
        "Clear but generic; not adapted to the person in the scenario",
        "Adapts language to the audience and checks understanding once",
        "Structures the conversation, checks understanding, and handles emotion in the room",
        "All of that, plus names what they would do differently if it went badly"]},
    appraisal:{summary:"Reading a paper properly and saying what it is actually worth.", weight:15,
      anchors:["Accepts a claim at face value",
        "Names one obvious limitation, such as a small sample or industry funding",
        "Weighs study design and population against the claim being made",
        "All of that, plus states what evidence would change their mind",
        "Ties the appraisal to a real decision they would or would not make in practice"]},
    teamwork:{summary:"Where you led, where you followed, and how you handled it going wrong.", weight:15,
      anchors:["Describes a team event without naming their own role in it",
        "Names their role but not what they would do differently",
        "A clear account of leading or following well",
        "Names a real conflict or failure and how they handled it in the moment",
        "All of that, plus what changed in how they work afterward"]},
    self:{summary:"Insight, probity, and knowing your own limits.", weight:10,
      anchors:["No real mistake named, or blame placed entirely elsewhere",
        "Names a mistake but minimises it",
        "Owns a real mistake and its consequence",
        "Owns it, and states what changed afterward",
        "All of that, plus how they now catch the same error earlier"]}
  };
  var IV_KB = {
    clinical:{technique:"State the immediate priority first (safety, resuscitation), then your differential, then " +
        "how you would confirm or rule each one out. Say what you would do while waiting for results, not just " +
        "what you would order.",
      example:"“First I would check this patient is haemodynamically stable before anything else. Given the " +
        "chest pain and instability, my leading concerns are ACS and a PE, so I'd get an ECG and troponin while " +
        "starting oxygen and IV access, keeping aortic dissection in mind before reaching for anticoagulation.”"},
    qi:{technique:"Name the problem in one sentence, then the baseline measurement, then the specific change you " +
        "made, then the re-measurement, then what you would still change. A project with no numbers either side of " +
        "the change is not a completed cycle.",
      example:"“We were missing VTE prophylaxis in about a third of surgical admissions. I audited 40 charts, " +
        "introduced a prompt on the admission form, then re-audited at 8 weeks -- missed doses dropped to under " +
        "10%. What I would change next time is measuring weekly rather than waiting eight weeks to find out.”"},
    comm:{technique:"Say what you would find out before you start talking (what do they already know, who is in " +
        "the room), then how you would open, then how you would check they have understood -- not just whether " +
        "they nodded.",
      example:"“I would first find out what she already understands and who she wants in the room. I'd give " +
        "a warning shot before the diagnosis itself, then pause. Rather than asking if that makes sense, I'd ask " +
        "her to tell me in her own words what she is taking from this.”"},
    appraisal:{technique:"State the claim, then the study design, then the population it was tested in, then " +
        "whether that matches your patients, then what would make you actually change practice.",
      example:"“It's a single industry-funded trial in a population younger and fitter than most of my " +
        "patients. The effect size is real but the number needed to treat is large, and I'd want independent " +
        "replication before changing first-line practice on this alone.”"},
    teamwork:{technique:"Describe the situation briefly, then your specific action, not the team's, then the " +
        "outcome, then what you would do differently if it happened again.",
      example:"“A junior colleague prescribed a dose I thought was wrong. I checked with them directly " +
        "rather than overriding it in front of the patient, we corrected it together, and afterward I flagged it " +
        "as a near-miss so the ward could look at why the chart made that error easy to make.”"},
    self:{technique:"Name the actual mistake plainly, not a humble-brag disguised as one, then the consequence, " +
        "then what specifically changed in how you practise afterward.",
      example:"“I once discharged a patient without reviewing a pending potassium result. It came back " +
        "critically high after they had left, and we had to recall them. I now do not sign a discharge until " +
        "every pending result either is back or has a named plan for who checks it.”"}
  };
  var IV_SCENARIOS = [
    {id:"cl1", domain:"clinical", t:"Acute chest pain", prompt:"A 68-year-old man presents with acute chest pain and looks unwell. Walk the panel through your immediate assessment and management priorities."},
    {id:"cl2", domain:"clinical", t:"A diagnosis you got wrong", prompt:"Describe a case where your initial diagnosis was wrong. What changed your mind, and what did you learn?"},
    {id:"qi1", domain:"qi", t:"A project you led", prompt:"Describe an audit or quality improvement project you led. What was the problem, what did you change, and what happened after?"},
    {id:"qi2", domain:"qi", t:"Resistance to change", prompt:"A colleague resists a process change you believe improves patient safety. How do you handle it?"},
    {id:"co1", domain:"comm", t:"Breaking bad news", prompt:"You need to break bad news to a patient and their family on a busy ward. Talk the panel through how you would approach it."},
    {id:"co2", domain:"comm", t:"Explaining a complex plan", prompt:"Describe a time you had to explain a complex treatment plan to a patient with low health literacy."},
    {id:"ap1", domain:"appraisal", t:"A paper that changes practice", prompt:"You read a paper claiming a new drug halves mortality in a condition you treat. Walk the panel through how you would critically appraise it before changing your own practice."},
    {id:"ap2", domain:"appraisal", t:"Research you have done", prompt:"Describe a piece of research or audit you have been involved in, and what you would do differently."},
    {id:"tm1", domain:"teamwork", t:"A junior's error", prompt:"Describe a time a junior colleague made a significant error. How did you handle it in the moment, and afterward?"},
    {id:"tm2", domain:"teamwork", t:"Disagreeing with a senior", prompt:"Tell the panel about a time you disagreed with a senior colleague's clinical decision. What did you do?"},
    {id:"sf1", domain:"self", t:"A mistake that affected care", prompt:"Describe a mistake you made that affected patient care. What did you do next, and what changed?"},
    {id:"sf2", domain:"self", t:"Knowing your limits", prompt:"How do you know when you are out of your depth, and what do you do about it?"}
  ];
  function scenarioById(id){ return IV_SCENARIOS.filter(function(s){ return s.id === id; })[0] || null; }
  function scenariosFor(domainId){ return IV_SCENARIOS.filter(function(s){ return s.domain === domainId; }); }

  /* ============ SIMULATED GRADING ============
     This is a static file with no backend and nowhere safe to hold a real
     model API key client-side, so it cannot call a real model. What it
     builds instead is the full grading EXPERIENCE -- a score, a breakdown,
     feedback -- from a small illustrative pool rather than any actual
     analysis of what was said, labelled "simulated" everywhere it appears.
     Swapping this one function for a real call (transcribe the recording,
     score the transcript against IV_CRITERIA) is a backend job later, not a
     redesign: nothing that reads its output would need to change shape. */
  var GRADE_BANK = {
    high:["Clear structure and a specific example rather than a general answer.",
          "Named the safety-critical step early, which is what panels listen for first.",
          "Answered the question that was actually asked, rather than a nearby one."],
    mid:["The structure is there, but stayed general where a specific detail would land harder.",
         "Good content, delivered a little too fast to follow under pressure.",
         "Right answer, but the reasoning behind it needs to come out loud, not stay implied."],
    low:["Started well but drifted away from the actual question partway through.",
         "Described the situation at length before saying what was actually done.",
         "Missing the ‘what I would do differently’ close a panel is listening for."]
  };
  var GRADE_CRITERIA_LABELS = ["Structure", "Specific detail", "What you'd do differently"];
  function simulateGrade(domainId){
    var overall = 48 + Math.round(Math.random() * 42); // an illustrative 48-90 spread
    var band = overall >= 75 ? "high" : overall >= 58 ? "mid" : "low";
    var subs = GRADE_CRITERIA_LABELS.map(function(){
      var jitter = Math.round((Math.random() - 0.5) * 24);
      return Math.max(20, Math.min(100, overall + jitter));
    });
    var pool = GRADE_BANK[band].slice(), feedback = [];
    while (feedback.length < 2 && pool.length){
      feedback.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
    }
    return {overall:overall, subs:subs, feedback:feedback};
  }

  /* ============ RECORDING ENGINE ============
     Shared by Voice simulator, Video simulator and Mock interview -- all
     three are the same mechanic (answer a scenario on camera or audio, get
     graded), just entered from a different place and, for Mock interview,
     run several times in a row.

     State lives OUTSIDE S on purpose: render() replaces #view wholesale on
     every change (see render() below), and a live MediaStream or an
     in-progress MediaRecorder cannot survive having its DOM torn out from
     under it. recToken guards the async gaps -- getUserMedia resolving, the
     recorder stopping, the simulated grading delay -- so a doctor starting a
     NEW recording, discarding, or simply navigating away can never have a
     stale, in-flight callback overwrite what they are now looking at; each
     async step checks its own token is still current before touching
     recState or calling render(). recAbort() is render()'s own cleanup
     guard (see the top of render()) for the one case a token cannot cover by
     itself: leaving mid-recording, while a live stream is still open. */
  var recState = null; // {kind, scenarioId, domain, stream, recorder, chunks, startedAt, timerId, recording, grading, reviewUrl, grade}
  var recToken = 0;
  var mockSession = null; // {ivId, scenarioIds, idx, results}
  /* true for exactly the one render() call recStart() makes to show its own
     "now recording" state -- without this, render()'s own cleanup guard
     (see render() below) would see recording:true on that very call and
     abort the recording it had just started */
  var recSuppressGuard = false;
  function recSupported(){
    return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
  }
  function recAbort(){
    if (!recState) return;
    recToken++;
    if (recState.timerId) clearInterval(recState.timerId);
    if (recState.recorder){
      recState.recorder.onstop = null;
      recState.recorder.ondataavailable = null;
      if (recState.recorder.state !== "inactive"){ try { recState.recorder.stop(); } catch (e){} }
    }
    if (recState.stream) recState.stream.getTracks().forEach(function(t){ t.stop(); });
    if (recState.reviewUrl) URL.revokeObjectURL(recState.reviewUrl);
    recState = null;
  }
  function recElapsed(){
    return recState ? Math.floor((Date.now() - recState.startedAt) / 1000) : 0;
  }
  function recFmtTime(s){
    var m = Math.floor(s / 60), sec = s % 60;
    return (m < 10 ? "0" : "") + m + ":" + (sec < 10 ? "0" : "") + sec;
  }
  function recStart(scenario, kind){
    if (!recSupported()) return;
    var myToken = ++recToken;
    var constraints = kind === "video" ? {video:true, audio:true} : {video:false, audio:true};
    navigator.mediaDevices.getUserMedia(constraints).then(function(stream){
      if (myToken !== recToken){ stream.getTracks().forEach(function(t){ t.stop(); }); return; }
      var chunks = [], recorder;
      try { recorder = new MediaRecorder(stream); }
      catch (e){
        stream.getTracks().forEach(function(t){ t.stop(); });
        recState = {error:"This browser could not start a recorder for that combination."};
        render();
        return;
      }
      recorder.ondataavailable = function(e){ if (e.data && e.data.size) chunks.push(e.data); };
      recorder.onstop = function(){
        var type = recorder.mimeType || (kind === "video" ? "video/webm" : "audio/webm");
        var blob = new Blob(chunks, {type:type});
        var url = URL.createObjectURL(blob);
        stream.getTracks().forEach(function(t){ t.stop(); });
        if (myToken !== recToken){ URL.revokeObjectURL(url); return; }
        recState = {kind:kind, scenarioId:scenario.id, domain:scenario.domain, reviewUrl:url,
                    recording:false, grading:true};
        render();
        setTimeout(function(){
          if (myToken !== recToken) return;
          recState.grade = simulateGrade(scenario.domain);
          recState.grading = false;
          render();
        }, 1300 + Math.round(Math.random() * 500));
      };
      /* render() must show this recording's own "recording" state without its
         own guard tearing it straight back down -- see the note on that
         guard, at the top of render() */
      recState = {kind:kind, scenarioId:scenario.id, domain:scenario.domain, stream:stream, recorder:recorder,
                  chunks:chunks, recording:true, startedAt:Date.now(), timerId:null};
      recSuppressGuard = true;
      render();
      recSuppressGuard = false;
      var vEl = document.getElementById("recLive");
      if (vEl) vEl.srcObject = stream;
      try { recorder.start(); }
      catch (e){
        stream.getTracks().forEach(function(t){ t.stop(); });
        recState = {error:"This browser could not start recording just now."};
        render();
        return;
      }
      recState.timerId = setInterval(function(){
        if (myToken !== recToken){ clearInterval(recState && recState.timerId); return; }
        var t = document.getElementById("recTimer");
        if (t) t.textContent = recFmtTime(recElapsed());
      }, 500);
    }).catch(function(err){
      if (myToken !== recToken) return;
      var msg = err && err.name === "NotAllowedError" ? "Camera or microphone access was denied."
        : err && err.name === "NotFoundError" ? "No camera or microphone was found on this device."
        : "Camera or microphone access could not be started.";
      recState = {error:msg};
      render();
    });
  }
  function recStopClick(){
    if (!recState || !recState.recording) return;
    if (recState.timerId){ clearInterval(recState.timerId); recState.timerId = null; }
    recState.recording = false;
    try { recState.recorder.stop(); } catch (e){}
  }
  function recDiscard(){
    recToken++;
    if (recState && recState.reviewUrl) URL.revokeObjectURL(recState.reviewUrl);
    recState = null;
    render();
  }
  /* standalone practice (Voice/Video simulator): logs one graded attempt */
  function recLogClick(ivId){
    if (!recState || !recState.grade) return;
    var sc = scenarioById(recState.scenarioId);
    S.ivAttempts = S.ivAttempts || {};
    S.ivAttempts[ivId] = S.ivAttempts[ivId] || [];
    S.ivAttempts[ivId].push({at:new Date().toISOString().slice(0, 10),
      mode:recState.kind === "video" ? "video" : "voice", scenarioId:recState.scenarioId,
      domain:recState.domain, overall:recState.grade.overall, subs:recState.grade.subs});
    logActivity("Practised " + (sc ? sc.t : "a scenario") + ", graded " + recState.grade.overall + "%", ivId);
    recToken++;
    if (recState.reviewUrl) URL.revokeObjectURL(recState.reviewUrl);
    recState = null;
    save(); render();
    toast("Attempt logged.");
  }
  /* inside a mock session: banks the result and advances instead of logging
     to S directly -- the session itself is what gets logged, once complete */
  function recNextClick(){
    if (!recState || !recState.grade || !mockSession) return;
    mockSession.results.push({scenarioId:recState.scenarioId, domain:recState.domain,
      overall:recState.grade.overall, subs:recState.grade.subs});
    recToken++;
    if (recState.reviewUrl) URL.revokeObjectURL(recState.reviewUrl);
    recState = null;
    mockSession.idx++;
    render();
  }
  function startMockSession(ivId){
    var picks = IV_DOMAINS.map(function(d){
      var opts = scenariosFor(d.id);
      return opts[Math.floor(Math.random() * opts.length)];
    });
    mockSession = {ivId:ivId, scenarioIds:picks.map(function(s){ return s.id; }), idx:0, results:[]};
  }
  function logMockSession(){
    if (!mockSession || mockSession.idx < mockSession.scenarioIds.length) return;
    var overall = Math.round(mockSession.results.reduce(function(a, r){ return a + r.overall; }, 0) /
      mockSession.results.length);
    S.ivSessions = S.ivSessions || {};
    S.ivSessions[mockSession.ivId] = S.ivSessions[mockSession.ivId] || [];
    S.ivSessions[mockSession.ivId].push({at:new Date().toISOString().slice(0, 10), overall:overall,
      results:mockSession.results});
    logActivity("Mock interview session logged, " + overall + "% overall", mockSession.ivId);
    mockSession = null;
    save(); render();
    toast("Session logged.");
  }
  function abandonMockSession(){ mockSession = null; render(); }

  /* the recording/review/grading card, shared by Voice simulator, Video
     simulator and each step of a Mock interview session */
  function recordAndGradeUI(scenario, kind, inSession){
    if (!recSupported()){
      return '<div class="card"><p class="empty"><b>Recording is not available here.</b>This browser does not ' +
        "expose camera or microphone recording, or this page is embedded somewhere that blocks it -- for example " +
        "inside a Claude Artifact. Open MedNav in its own browser tab and it should work.</p></div>";
    }
    var errMsg = recState && recState.error ? recState.error : null;
    if (errMsg) recState = null;
    var h = '<div class="card">';
    if (errMsg){
      h += '<p class="empty"><b>Could not start.</b>' + esc(errMsg) + " If this page is embedded (for example " +
        "inside a Claude Artifact), the browser may be blocking camera and microphone access entirely -- try " +
        "opening MedNav in its own tab, or try again below.</p>";
    }
    var active = recState && recState.scenarioId === scenario.id;

    if (active && recState.recording){
      h += '<div class="rec-stage' + (kind === "audio" ? " audio-only" : "") + '">' +
        (kind === "video" ? '<video id="recLive" autoplay muted playsinline></video>' : "") +
        '<span class="rec-badge"><span class="rec-dot" aria-hidden="true"></span><span id="recTimer">00:00</span></span>' +
        "</div>";
      h += '<div style="margin-top:12px"><button class="btn btn-sm btn-primary" data-rec-stop>Stop and grade</button></div>';
      return h + "</div>";
    }

    if (active && recState.grading){
      h += '<div class="rec-stage' + (kind === "audio" ? " audio-only" : "") + '">' +
        (kind === "video"
          ? '<video src="' + recState.reviewUrl + '" controls playsinline></video>'
          : '<audio src="' + recState.reviewUrl + '" controls style="width:100%"></audio>') + "</div>";
      h += '<p class="grading-line"><span class="grading-dot" aria-hidden="true"></span>Grading your answer' +
        '…<span class="chip mute" style="margin-left:8px">simulated</span></p>';
      return h + "</div>";
    }

    if (active && recState.grade){
      var g = recState.grade;
      h += '<div class="rec-stage' + (kind === "audio" ? " audio-only" : "") + '">' +
        (kind === "video"
          ? '<video src="' + recState.reviewUrl + '" controls playsinline></video>'
          : '<audio src="' + recState.reviewUrl + '" controls style="width:100%"></audio>') + "</div>";
      h += '<div class="grade-result"><div class="grade-score"><b>' + g.overall + "%</b>" +
        '<span>simulated grade</span></div><div class="grade-subs">' +
        GRADE_CRITERIA_LABELS.map(function(lbl, i){
          return '<div class="barrow" style="padding:6px 0"><span class="lbl">' + esc(lbl) + "</span>" +
            '<span class="val num">' + g.subs[i] + "%</span>" + bar(g.subs[i]) + "</div>";
        }).join("") + "</div>";
      h += '<ul class="grade-fb">' + g.feedback.map(function(f){ return "<li>" + esc(f) + "</li>"; }).join("") + "</ul></div>";
      h += '<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">' +
        '<button class="btn btn-sm btn-ghost" data-rec-discard>Discard and try again</button>' +
        '<button class="btn btn-sm btn-primary" data-rec-' + (inSession ? "next" : "log") + '>' +
        (inSession ? "Next question" : "Log this attempt") + "</button></div>";
      return h + "</div>";
    }

    h += '<p class="lede" style="max-width:66ch;margin-bottom:14px">Answer ' +
      (kind === "video" ? "on camera" : "out loud") + ", then it is graded automatically. Nothing is uploaded -- " +
      "the recording and the grade both live only in this browser tab.</p>";
    h += '<div class="rec-stage' + (kind === "audio" ? " audio-only" : "") + '">' +
      '<p class="rec-empty">' + ico(kind === "video" ? I.video : I.mic, 20) +
      "Nothing recorded yet. If this page is embedded (for example inside a Claude Artifact), camera and " +
      "microphone access may be blocked entirely.</p></div>";
    h += '<div style="margin-top:12px"><button class="btn btn-sm btn-primary" data-rec-start>Start recording</button></div>';
    return h + "</div>";
  }

  /* Nine surfaces. Exam prep had a countdown plan and interview prep never
     did; the scoring criteria were a thin domain list rather than a page you
     could actually read; the knowledge base and the practice surfaces were
     both stubs, "content to be authored"; and there was nothing between
     "rate yourself" and an unwired tutor booking -- no actual practice
     MOMENT, just a score entered after one happened somewhere else. Voice
     and Video simulator are that moment: a real scenario, answered for
     real, graded automatically. Mock interview is the same mechanic run as
     one continuous session instead of one scenario at a time. */
  var IV_GYM = [
    {id:"plan",     t:"Countdown plan", ic:I.cal, d:"Weeks to interview day, and what this week is for",
     feeds:"Sets the pace the rest is measured against"},
    {id:"criteria", t:"Interview scoring criteria", ic:I.target,
     d:"Every domain the panel scores, what it means, and what each mark band looks like",
     feeds:"Everything else in the hub is scored against this"},
    {id:"evid",     t:"Your evidence",  ic:I.clip, d:"What you already hold that answers each domain",
     feeds:"Read straight off your portfolio"},
    {id:"kb",       t:"Knowledge base", ic:I.book, d:"How to structure an answer, with a worked example per domain",
     feeds:"Technique and a model answer, domain by domain"},
    {id:"voice",    t:"Voice simulator", ic:I.mic, d:"Pick a scenario, answer it out loud, get graded",
     feeds:"Every attempt is graded and logged"},
    {id:"video",    t:"Video simulator", ic:I.video, d:"The same scenarios, on camera",
     feeds:"Every attempt is graded and logged"},
    {id:"mock",     t:"Mock interview", ic:I.flag, d:"A full session: several scenarios back to back, on camera",
     feeds:"Ends in a complete graded session summary"},
    {id:"stats",    t:"Analytics",      ic:I.chart, d:"Your full breakdown by domain, and the trend across sessions",
     feeds:"Reads every graded attempt and session"},
    {id:"tutor",    t:"Mock with a tutor", ic:I.user, d:"A scored practice interview with someone who has sat on a panel",
     feeds:"Attendance is logged to your record"}
  ];

  VIEWS.interviews = {
    title:"Interview prep", sub:"Every panel you could face, a hub for each one, and the order they come in.",
    render:function(){
      var open = S.ivOpen ? allInterviews().filter(function(x){ return x.id === S.ivOpen; })[0] : null;
      return open ? ivHub(open) : ivCatalogue();
    }
  };

  function ivShelf(){
    return allInterviews().map(function(iv){
      return {id:iv.id, kind:"interview", iv:iv, label:iv.t, grp:iv.grp, body:iv.body,
              meta:iv.fmt, d:iv.d};
    });
  }

  function ivCatalogue(){
    var shelf = ivShelf();
    var vis = shelf.filter(function(o){ return prepMatches(o) && prepInGroup(o); });
    var h = prepTabs("interview", shelf.length);

    /* the route tab is the same object the exams page shows. Separate pages,
       one order. */
    if (S.prepTab === "route"){
      return h + '<div id="prepPanel" role="tabpanel" tabindex="-1">' + routePanel() + "</div>";
    }

    h += '<div id="prepPanel" role="tabpanel" tabindex="-1">' + prepFilters(shelf, "interviews");
    if (!vis.length){
      return h + '<p class="empty"><b>Nothing matches.</b>Try a college, a specialty, or part of the ' +
        "interview name.</p></div>";
    }

    var shown = {}, out = "";
    function section(label, items, lead){
      if (!items.length) return;
      out += '<p class="sec-label">' + esc(label) + "</p>";
      out += '<div class="pgrid">' + items.map(function(o, i){
        shown[o.id] = 1;
        return ivCard(o.iv, lead && i === 0);
      }).join("") + "</div>";
    }

    var inc = vis.filter(function(o){ return ivIncluded(o.id); });
    section(inc.length > 1 ? "Included with your routes" : "Included with your route", inc, true);
    if (!inc.length && !S.specialty && !S.prepQuery && !S.prepGroup){
      out += ctx("No target specialty set, so nothing is included yet. Everything below is still here to browse, " +
        "and setting a route on your profile includes that interview automatically.");
    }
    section("You have unlocked", vis.filter(function(o){
      return !shown[o.id] && prepUnlocked(o.id); }), false);

    var rest = vis.filter(function(o){ return !shown[o.id]; });
    if (rest.length){
      out += '<p class="sec-label">Browse other routes</p>';
      prepGroups(rest).forEach(function(g){
        out += groupHead(g, true);
        /* the bucket says what it is where it sits, rather than leaving a
           reader to work out why four specialties share one heading */
        if (g === OTHER_LABEL){
          out += '<p class="group-n">' + esc(OTHER_SPECIALTIES.join(", ")) +
            ". Grouped together because each holds an interview and no exam, so none of them appears on the " +
            "other shelf. Every card still names its own.</p>";
        }
        out += '<div class="pgrid">' + rest.filter(function(o){ return specGroup(o.grp) === g; })
          .map(function(o){ return ivCard(o.iv, false); }).join("") + "</div>";
      });
    }
    h += out;
    h += ctxFoot("Unlocking records that you want a prep. Nothing here charges anybody and no billing is wired " +
      "up in this prototype. Interview formats and the domains they score are illustrative: each college sets " +
      "what it actually assesses.");
    return h + "</div>";
  }

  /* looking inside a locked prep. It shows the header, everything that is in
     there, and the way to unlock it, and it does NOT take over the shell:
     someone browsing has not entered a product yet. */
  function prepLocked(o, kind){
    var isExam = kind === "exam";
    var name = isExam ? examLabel(o) : o.t;
    var surfaces = isExam ? gymFor(o) : IV_GYM;
    var back = isExam ? "data-exam-open=\"\"" : "data-iv-open=\"\"";
    var h = '<button class="btn btn-sm btn-ghost" ' + back + ' style="margin-bottom:12px">' +
      ico(I.arrow, 13) + (isExam ? "All exams" : "All interviews") + "</button>";
    h += '<div class="gym-h"><div class="gym-id"><span class="gym-k">' + esc(o.body) + "</span>" +
      "<h2>" + esc(name) + "</h2><p>" + esc(o.fmt) + ". " + esc(o.d) + "</p></div>" +
      '<div class="gym-stat"><span class="k">Status</span><b>Locked</b>' +
      "<small>Not part of your route</small></div></div>";
    h += '<div class="card lead" style="margin-top:14px"><div class="card-head">' +
      "<h2>What is inside</h2>" +
      '<span class="chip mute">' + surfaces.length + " surfaces</span></div>" +
      '<p class="lede" style="max-width:66ch">Everything below is built for this ' +
      (isExam ? "stage" : "interview") + " specifically, and it all writes back to the one record you already keep.</p>" +
      prepFeatures(surfaces) +
      '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-sm btn-primary" data-unlock="' +
      esc(o.id) + '">Unlock this prep</button></div>' +
      ctxFoot("Unlocking records that you want it. Nothing here charges anybody and no billing is wired up in " +
        "this prototype.") + "</div>";
    return h;
  }

  /* One interview prep as a course card, in the same language as an exam card
     and a different colour, because a shelf that reads the same for both is
     how the two pages stay recognisably one product. */
  function ivCard(iv, lead){
    var d = iv.cycle ? until(iv.cycle.interview) : null, rd = ivReady(iv.id);
    var inc = ivIncluded(iv.id), open = prepOpen(iv.id, inc);
    var sessions = ivSessions(iv.id).length;
    var state = inc ? "included" : open ? "unlocked" : "locked";

    /* the same specialty hue an exam in this specialty wears, so a doctor's
       route is one colour across both shelves. What separates the two kinds is
       the hatched band and the icon, not the hue. */
    var h = '<div class="pc iv ' + specClass(iv.grp) + (open ? "" : " lock") + (lead ? " lead" : "") + '">' +
      '<div class="pc-band" aria-hidden="true"></div><div class="pc-b">' +
      '<p class="pc-k">' + ico(I.mic, 11) + esc(iv.grp) + " \u00b7 " + esc(iv.body) +
      " \u00b7 " + esc(state) + "</p>" +
      "<h2>" + esc(iv.t) + "</h2>" +
      '<p class="pc-sub">' + esc(iv.fmt) + (iv.target ? " \u00b7 for " + esc(iv.target) : "") + "</p>" +
      '<p class="pc-d">' + esc(iv.d) + "</p>";

    if (rd !== null){
      h += '<div class="pc-prog"><div class="pr"><span>' + rd + " % graded</span><span>" +
        sessions + " session" + (sessions === 1 ? "" : "s") + '</span></div><div class="pc-bar"><i style="width:' +
        rd + '%"></i></div></div>';
    } else if (!open){
      h += '<p class="pc-sub" style="margin-top:10px">' + IV_GYM.length +
        " surfaces inside. Look inside to see them before unlocking.</p>";
    }

    h += '<div class="pc-f">' +
      (open
        ? '<button class="btn btn-sm btn-primary" data-iv-open="' + esc(iv.id) + '">Open the hub</button>'
        : '<button class="btn btn-sm btn-primary" data-unlock="' + esc(iv.id) + '">Get access</button>' +
          '<button class="btn btn-sm btn-ghost" data-iv-open="' + esc(iv.id) + '">Look inside</button>') +
      /* a countdown only where the doctor is actually applying into that
         college's cycle. Every other card would be borrowing someone else's date. */
      (d !== null && inc
        ? '<span class="pc-wk ' + (d < 0 ? "" : d <= 21 ? "crit" : d <= 60 ? "warn" : "") + '">' +
          (d < 0 ? "Passed" : esc(awayText(d))) + "</span>"
        : "") +
      "</div></div></div>";
    return h;
  }

  function ivHub(iv){
    if (!prepOpen(iv.id, ivIncluded(iv.id))) return prepLocked(iv, "interview");
    var surface = S.gymSurface || "";
    var g = IV_GYM.filter(function(x){ return x.id === surface; })[0];
    var d = iv.cycle ? until(iv.cycle.interview) : null, rd = ivReady(iv.id), wk = ivWeeksTo(iv);

    var h = '<button class="btn btn-sm btn-ghost" data-iv-open="" style="margin-bottom:12px">' +
      ico(I.arrow, 13) + "All interviews</button>";
    h += '<div class="gym-h"><div class="gym-id"><span class="gym-k">' + esc(iv.body) + "</span>" +
      "<h2>" + esc(iv.t) + "</h2><p>" + esc(iv.fmt) + ". " +
      (d === null ? "No date held." : d < 0 ? "That date has passed." : awayText(d) + ", for " + esc(iv.target) + ".") + "</p></div>";
    h += '<div class="gym-stat"><span class="k">Graded average</span><b>' + (rd === null ? "—" : rd + "%") + "</b>" +
      "<small>" + (rd === null ? "Practise a scenario to start" : "Across " + ivAllScores(iv.id).length + " graded attempts") + "</small></div>";
    h += '<div class="gym-stat"><span class="k">Sessions run</span><b>' + ivSessions(iv.id).length + "</b>" +
      "<small>Full mock interviews</small></div></div>";

    h += '<div class="gym-grid">' + IV_GYM.map(function(x){
      return '<button class="gym-card' + (x.id === surface ? " on" : "") + '" data-gym="' + x.id + '">' +
        '<span class="gym-ic">' + ico(x.ic, 17) + "</span><b>" + esc(x.t) + "</b>" +
        '<span class="gd">' + esc(x.d) + "</span>" +
        '<span class="gf">' + ico(I.arrow, 11) + esc(x.feeds) + "</span></button>";
    }).join("") + "</div>";

    if (!g){
      h += ctx("This is the structure of the hub. The questions and model answers behind it are written by doctors " +
        "who have sat on these panels and are never generated.");
      return h;
    }
    h += '<p class="sec-label">' + esc(g.t) + "</p>" + ivSurface(g, iv, wk);
    return h;
  }

  function ivSurface(g, iv, wk){
    if (g.id === "plan"){
      if (wk === null){
        return '<div class="card"><p class="empty"><b>No date to plan against.</b>' +
          (iv.cycle ? "That date has passed, so there is nothing left to count down to."
                     : "This panel has no interview date on your record yet, so the plan starts once one is set.") +
          "</p></div>";
      }
      var blocks = [
        {w:"Weeks 1 to 2", t:"Map what you hold", d:"Read Interview scoring criteria and Your evidence together, so you know which domains you can already answer and which are thin"},
        {w:"Weeks 3 to 4", t:"Build your answers", d:"Work Knowledge base domain by domain, starting with the thinnest evidence, then try the matching scenarios in Voice simulator"},
        {w:"Week 5", t:"Move to camera", d:"Repeat your strongest scenarios in Video simulator -- the first time you are on camera should not be in front of a panel"},
        {w:"Weeks 6 to 7", t:"Run a full mock, then close what it found", d:"Sit a complete Mock interview session. Analytics ranks the weakest domains from your graded attempts -- work down, not across"},
        {w:"Final week", t:"Second mock, then taper", d:"Confirm the direction of travel and stop"}
      ];
      var h = '<div class="card"><div class="card-head"><h2>' + wk + (wk === 1 ? " week" : " weeks") + " to go</h2>" +
        '<span class="aside">Five to seven weeks is the working minimum</span></div>';
      h += blocks.map(function(b){
        return '<div class="row"><span class="t">' + esc(b.t) + "<small>" + esc(b.d) + "</small></span>" +
          '<span class="r"><span class="chip mute">' + esc(b.w) + "</span></span></div>";
      }).join("");
      return h + ctxFoot("The shape of the plan is ours. The weeks come from your own cycle dates, which are " +
        "illustrative in this prototype.") + "</div>";
    }

    if (g.id === "criteria"){
      var h = '<div class="card"><div class="card-head"><h2>What this panel scores</h2>' +
        '<span class="aside">' + esc(iv.fmt) + "</span></div>" +
        '<p class="lede" style="max-width:68ch">Six domains, each scored on its own, then combined. The weights ' +
        "and mark bands below are illustrative -- " + esc(iv.body) + " publishes what it actually scores and how " +
        "heavily.</p></div>";
      h += IV_DOMAINS.map(function(d){
        var crit = IV_CRITERIA[d.id];
        return '<div class="card" style="margin-top:12px"><div class="card-head"><h2>' + esc(d.t) + "</h2>" +
          '<span class="chip mute">' + crit.weight + "% illustrative weight</span></div>" +
          '<p class="lede" style="max-width:68ch;margin-bottom:14px">' + esc(crit.summary) + "</p>" +
          '<p class="group-h">Mark band, low to high</p><div class="rubric">' +
          crit.anchors.map(function(a, i){
            return '<div class="rub-row"><span class="rub-n">' + (i + 1) + "</span><span class=\"rub-t\">" +
              esc(a) + "</span></div>";
          }).join("") + "</div></div>";
      }).join("");
      return h + ctxFoot("Example content for this prototype. The real weights, and the wording a panel actually " +
        "scores against, are " + esc(iv.body) + "'s.");
    }

    if (g.id === "evid"){
      /* the reason this module is worth having: the portfolio is already here */
      var h2 = '<div class="card"><div class="card-head"><h2>What you already hold</h2>' +
        '<span class="aside">Read from your portfolio</span></div>' +
        '<p class="lede" style="max-width:68ch;margin-bottom:12px">The interview scores the same domains your ' +
        "application does. Nothing here is asked for again: this is what your record already says you can talk about.</p>";
      h2 += IV_DOMAINS.map(function(d){
        var ev = evidenceFor(d);
        var strong = ev.length && ev.every(function(x){ return x.pts() === x.maxPts; });
        var thin = ev.length && ev.every(function(x){ return x.pts() === 0; });
        return '<div class="chk' + (strong ? " done" : "") + '">' +
          '<span class="chk-box auto' + (strong ? " on" : "") + '" aria-hidden="true">' +
          (strong ? ico(I.tick, 12) : ico(I.clock, 11)) + "</span>" +
          '<div class="chk-b"><b>' + esc(d.t) + "</b>" +
          (ev.length
            ? "<small>" + ev.map(function(x){ return esc(x.name) + ": " + esc(x.note()); }).join(" · ") + "</small>"
            : '<small>Nothing in the portfolio scores this one. It is answered from how you talk about your practice, ' +
              "not from evidence you can upload.</small>") +
          (thin ? '<small class="chk-note">Nothing logged against this yet, so expect to be pushed on it.</small>' : "") +
          "</div>" +
          '<div class="chk-r">' + (ev.length && !strong
            ? '<a class="btn-link" href="#/gaps">Close it</a>' : "") + "</div></div>";
      }).join("");
      return h2 + "</div>";
    }

    if (g.id === "kb"){
      var kb = ivKbDone(iv.id), nkb = IV_DOMAINS.filter(function(d){ return kb[d.id]; }).length;
      var hk = '<div class="card"><div class="card-head"><h2>' + nkb + " of " + IV_DOMAINS.length + " reviewed</h2>" +
        '<span class="aside">' + esc(iv.t) + "</span></div>" + bar(Math.round(nkb / IV_DOMAINS.length * 100)) +
        '<p class="lede" style="max-width:68ch;margin:14px 0 4px">How to structure an answer, and a worked ' +
        "example of one, domain by domain.</p></div>";
      hk += IV_DOMAINS.map(function(d){
        var ex = IV_KB[d.id];
        return '<div class="card" style="margin-top:12px"><div class="card-head"><h2>' + esc(d.t) + "</h2>" +
          '<button class="btn btn-sm btn-ghost" data-iv-kb="' + esc(d.id) + '">' +
          (kb[d.id] ? "Mark unreviewed" : "Mark reviewed") + "</button></div>" +
          '<p class="group-h">Technique</p><p class="lede" style="max-width:70ch;margin-bottom:12px">' +
          esc(ex.technique) + "</p>" +
          '<p class="group-h">Example answer</p><p class="lede" style="max-width:70ch;font-style:italic">' +
          esc(ex.example) + "</p></div>";
      }).join("");
      return hk + ctx("Example content for this prototype, not " + esc(iv.body) + "'s real material -- the " +
        "technique notes and worked answers a doctor would actually rely on have to be written by doctors who " +
        "have sat this panel before this reaches a real one.", true);
    }

    if (g.id === "voice" || g.id === "video") return ivSimSurface(iv, g.id);

    if (g.id === "mock") return ivMockSurface(iv);

    if (g.id === "stats"){
      var scores = ivAllScores(iv.id);
      if (!scores.length){
        return '<div class="card"><p class="empty"><b>Nothing to read yet.</b>' +
          "Practise a scenario in Voice or Video simulator, or run a full Mock interview, and this ranks the " +
          "domains by where you are weakest.</p></div>";
      }
      var ranked = IV_DOMAINS.map(function(d){ return {d:d, avg:ivDomainAvg(iv.id, d.id)}; })
        .filter(function(x){ return x.avg !== null; })
        .sort(function(a, b){ return a.avg - b.avg; });
      var tr = ivTrend(iv.id);
      var h4 = '<div class="card"><div class="card-head"><h2>' + ivReady(iv.id) + "% graded average</h2>" +
        (tr ? '<span class="aside">' + (tr.delta >= 0 ? "up " : "down ") + Math.abs(tr.delta) + " across " +
          ivSessions(iv.id).length + " sessions</span></div>" : '<span class="aside">Weakest first</span></div>') +
        '<p class="lede" style="max-width:66ch;margin-bottom:4px">Every score here is simulated, the same as ' +
        "everywhere it is graded -- read this as what the shape of a real analysis would show, not a real " +
        "assessment of you.</p></div>";
      if (tr){
        h4 = h4.slice(0, -6) + '<p class="trend' + (tr.delta > 0 ? " up" : tr.delta < 0 ? " down" : "") + '">' +
          spark(tr.points, 80, 24) + "<span>From " + tr.from + "% to " + tr.to + "%</span></p></div>";
      }
      var h5 = '<div class="card" style="margin-top:12px"><div class="card-head"><h2>By domain</h2>' +
        '<span class="aside">Mean of every graded attempt</span></div>';
      h5 += ranked.map(function(x){
        return '<div class="barrow" style="padding:9px 0"><span class="lbl">' + esc(x.d.t) + "</span>" +
          '<span class="val num">' + x.avg + "%</span>" + bar(x.avg) + "</div>";
      }).join("");
      var kbDone = Object.keys(ivKbDone(iv.id)).length;
      h5 += '<div class="barrow" style="margin-top:14px"><span class="lbl">Domains reviewed in Knowledge base</span>' +
        '<span class="val num">' + kbDone + " of " + IV_DOMAINS.length + "</span>" +
        bar(Math.round(kbDone / IV_DOMAINS.length * 100)) + "</div>";
      h5 += '<div class="barrow" style="padding-top:9px"><span class="lbl">Attempts logged</span>' +
        '<span class="val num">' + ivAttempts(iv.id).length + "</span></div>";
      return h4 + h5 + ctxFoot("Grades are simulated for this prototype: a real version would transcribe the " +
        "recording and score it against Interview scoring criteria, and this page would not need to change " +
        "shape to read that instead.") + "</div>";
    }

    return '<div class="card"><div class="card-head"><h2>Mock with a tutor</h2>' +
      '<span class="chip mute">Not wired up in this prototype</span></div>' +
      '<p class="lede" style="max-width:66ch">A scored practice interview with a real doctor who has sat on a ' +
      esc(iv.body) + " panel -- live, not simulated. Availability, booking and payment are real product surfaces " +
      "rather than things to mock up here.</p></div>";
  }

  /* Voice simulator / Video simulator: a scenario library, and the
     record-and-grade flow once one is opened for practice */
  var simScenario = null;
  function ivSimSurface(iv, mode){
    var kind = mode === "video" ? "video" : "audio";
    var scenario = simScenario ? scenarioById(simScenario) : null;
    if (!scenario){
      var attempts = ivAttempts(iv.id).filter(function(a){ return a.mode === (mode === "video" ? "video" : "voice"); });
      var hs = '<div class="card"><div class="card-head"><h2>' +
        (mode === "video" ? "Video simulator" : "Voice simulator") + "</h2>" +
        '<span class="aside">' + attempts.length + " attempts so far</span></div>" +
        '<p class="lede" style="max-width:66ch">Pick a scenario, answer it ' +
        (mode === "video" ? "on camera" : "out loud") + ", then it is graded automatically. Grading is simulated " +
        "for this prototype -- see Analytics for what that means.</p></div>";
      IV_DOMAINS.forEach(function(d){
        hs += '<p class="sec-label" style="margin-top:20px">' + esc(d.t) + "</p>";
        hs += scenariosFor(d.id).map(function(s){
          var best = attempts.filter(function(a){ return a.scenarioId === s.id; })
            .sort(function(a, b){ return b.overall - a.overall; })[0];
          return '<div class="row"><span class="t">' + esc(s.t) + "<small>" + esc(s.prompt) + "</small></span>" +
            '<span class="r">' + (best ? '<span class="chip good">Best ' + best.overall + "%</span>" : "") +
            '<button class="btn btn-sm btn-primary" data-iv-scenario="' + esc(s.id) + '">Practice this</button></span></div>';
        }).join("");
      });
      return hs;
    }
    var dom = IV_DOMAINS.filter(function(d){ return d.id === scenario.domain; })[0];
    var h = '<div class="card" style="margin-bottom:12px">' +
      '<button class="btn btn-sm btn-ghost" data-iv-scenario="">' + ico(I.arrow, 13) + "Back to scenarios</button>" +
      '<p class="group-h" style="margin-top:12px">' + esc(dom ? dom.t : "") + "</p>" +
      '<h2 style="font-family:var(--fd);font-size:18px;margin-bottom:6px">' + esc(scenario.t) + "</h2>" +
      '<p class="lede" style="max-width:66ch">' + esc(scenario.prompt) + "</p></div>";
    return h + recordAndGradeUI(scenario, kind, false);
  }

  /* Mock interview: the same record-and-grade mechanic run once per domain,
     back to back, ending in a session summary */
  function ivMockSurface(iv){
    var sessions = ivSessions(iv.id);
    if (!mockSession || mockSession.ivId !== iv.id){
      var hm = '<div class="card"><div class="card-head"><h2>Mock interview</h2>' +
        '<span class="aside">' + sessions.length + " run so far</span></div>" +
        '<p class="lede" style="max-width:66ch;margin-bottom:14px">A full session: one scenario from every ' +
        "domain, back to back, on camera. Each answer is graded as you go, and the session ends in a complete " +
        "summary. Grading is simulated for this prototype.</p>" +
        '<button class="btn btn-sm btn-primary" data-iv-mock-start>Start mock interview</button></div>';
      if (sessions.length){
        hm += '<p class="group-h">Your sessions</p>' + sessions.slice().reverse().map(function(s){
          return '<div class="row"><span class="t">' + s.overall + "%<small>" + fmtLong(s.at) + "</small></span>" +
            '<span class="r"><span class="chip ' + (s.overall >= 70 ? "good" : s.overall >= 50 ? "warn" : "crit") + '">' +
            (s.overall >= 70 ? "Comfortable" : s.overall >= 50 ? "Borderline" : "Behind") + "</span></span></div>";
        }).join("");
      }
      return hm;
    }
    if (mockSession.idx >= mockSession.scenarioIds.length){
      var overall = Math.round(mockSession.results.reduce(function(a, r){ return a + r.overall; }, 0) /
        mockSession.results.length);
      var hf = '<div class="card"><div class="card-head"><h2>Session complete — ' + overall + "%</h2>" +
        '<span class="aside">' + mockSession.results.length + " scenarios</span></div>";
      hf += mockSession.results.map(function(r){
        var sc = scenarioById(r.scenarioId), dm = IV_DOMAINS.filter(function(d){ return d.id === r.domain; })[0];
        return '<div class="row"><span class="t">' + esc(sc ? sc.t : "") + "<small>" + esc(dm ? dm.t : "") + "</small></span>" +
          '<span class="r"><span class="chip mute">' + r.overall + "%</span></span></div>";
      }).join("");
      hf += '<div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">' +
        '<button class="btn btn-sm btn-primary" data-iv-mock-log>Log this session</button>' +
        '<button class="btn btn-sm btn-ghost" data-iv-mock-abandon>Discard</button></div></div>';
      return hf;
    }
    var scId = mockSession.scenarioIds[mockSession.idx];
    var sc2 = scenarioById(scId), dm2 = IV_DOMAINS.filter(function(d){ return d.id === sc2.domain; })[0];
    var hp = '<button class="btn btn-sm btn-ghost" data-iv-mock-abandon style="margin-bottom:10px">' +
      ico(I.out, 13) + "Leave session</button>";
    hp += '<div class="card" style="margin-bottom:12px"><div class="card-head">' +
      "<h2>Question " + (mockSession.idx + 1) + " of " + mockSession.scenarioIds.length + "</h2>" +
      '<span class="aside">' + esc(dm2 ? dm2.t : "") + "</span></div>" +
      '<p class="lede" style="max-width:66ch;font-weight:600">' + esc(sc2.prompt) + "</p></div>";
    return hp + recordAndGradeUI(sc2, "video", true);
  }

  VIEWS.profile = {
    title:"Your profile", sub:"Change any of this and every view recalculates.",

        '<div class="row"><span class="t">Application requirements<small>Documents and clearances in place</small></span>' +
