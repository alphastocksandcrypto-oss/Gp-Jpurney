       "a College of Psychiatrists" need different ones */
    return '<div class="prep"><p class="k">' + (near ? "Coming up" : "Worth knowing early") + "</p>" +
      "<h2>" + (near
        ? "Your interview is " + esc(awayText(iv))
        : "How " + esc(sit.college) + " scores your interview") + "</h2>" +
      '<p class="lede">' + (near
        ? "There are " + ranked.length + " scored domains and they are weighted. These two carry the most."
        : "Most doctors meet the scoring domains a fortnight before the interview. This far out is when they are " +
          "still cheap to fix.") + "</p>" +
      '<div class="prep-list">' +
      open.map(function(d){
        return '<div class="prep-row">' + esc(d.name) + "<b>" + d.weight + "%</b></div>";
      }).join("") +
      locked.map(function(d){
        return '<div class="prep-row locked">' + esc(d.name) + '<span class="lock">In interview prep</span></div>';
      }).join("") +
      (rest > 0 ? '<p class="lede" style="margin:2px 0 0">And ' + rest + " more, with what a strong answer covers.</p>" : "") +
      "</div>" +
      '<div class="prep-cta"><a class="btn btn-sm btn-primary" href="#/interviews">Open interview prep</a>' +
      (S.examStages < 3 ? '<a class="btn-link" href="#/exams">' + esc(sit.exam) + " prep</a>" : "") +
      "</div></div>";
  }

  VIEWS.today = {
    title:"Today", sub:"Your record, and the one thing worth doing next.",
    render:function(){
      var top = levers()[0], nd = nextDeadline();
      var open = deadlines().filter(function(d){ return !d.done && d.days >= 0; }).slice(0, 3);
      var hr = new Date().getHours();
      var greet = hr < 12 ? "Good morning" : (hr < 18 ? "Good afternoon" : "Good evening");
      var elig = cycleEligibility();
      var buildingForNext = elig && !elig.eligible;
      var h = '<p class="hello">' + greet + ", " + esc(S.name.split(/\s+/)[0]) + ".</p>" +
        '<p class="hello-sub">' + (buildingForNext
            ? "You are building towards the " + esc(elig.targetCycle) + " intake, not the one closing now."
            : top ? "One thing would move you further than anything else today."
                  : "Nothing is outstanding. Keep the evidence dated.") + "</p>";
      /* said once, at the top, before any figure that would otherwise read as
         a verdict on a race this doctor is not yet running */
      if (buildingForNext){
        h += ctx("The " + elig.thisCycle + " cycle is closing, but on your record it was never yours: " +
          elig.gaps.join("; ") + ". The first intake you can actually make is " + elig.targetCycle +
          ", starting " + fmtLong(elig.targetStart) + ". Everything below is measured against that.");
      }
      /* 1. every outstanding thing as one row of pills, not four sentences */
      h += nudgeStrip();

      /* 2. orientation before action. Greeting, ladder and next move together
         come to 513px and the phone's first fold holds 665px, so putting the
         ladder here costs nothing and answers "where am I" before "what now". */
      h += '<div class="card"><div class="card-head"><h2>Your ladder</h2><a class="btn-link aside" href="#/roadmap">Open roadmap</a></div>' +
        rungsHTML() + '<p class="rungs-note">Three of five stages. Full ladder on My roadmap.</p></div>';

      h += '<div class="move" style="margin-top:14px">' +
        '<span class="ic">' + ico(I.bolt, 22) + "</span>" +
        '<div class="body"><p class="k">Your next move</p><h2>' + (top ? esc(top.t) : "Nothing outstanding") + "</h2>" +
        "<p>" + (top ? esc(top.why) + ". Worth " + top.pts + " points on your shortlisting score, the largest single gain available to you right now."
                     : "Every scored domain is at its maximum. Keep the evidence dated and current.") + "</p></div>" +
        (top ? actBtn(top.act, top.cta, true) : "") + "</div>";

      /* 4. two figures, not four. Shortlisting score and milestones are each a
         whole page in the nav and neither is actionable from here. */
      h += '<div class="grid g2" style="margin-top:16px">' +
        stat("Application readiness", counter(readiness(), "%"),
          elig && !elig.eligible ? "Measured against " + esc(elig.targetCycle) : "Weighted across 6 domains", I.clip) +
        stat("Next deadline", nd ? counter(nd.days) + "<small> days</small>" : "None",
          nd ? esc(nd.t) : "Nothing open", I.cal) + "</div>";

      h += '<div style="margin-top:14px">';
      h += '<div class="card"><div class="card-head"><h2>What is closing</h2><a class="btn-link aside" href="#/deadlines">All deadlines</a></div>';
      h += open.length ? open.map(function(d){
        var k = d.days <= 14 ? "crit" : (d.days <= 60 ? "warn" : "mute");
        return '<div class="row"><span class="t">' + esc(d.t) + "<small>" + fmtLong(d.iso) + " · " + esc(d.note) + "</small></span>" +
          '<span class="r">' + chip({k:k, icon:d.days <= 14 ? I.warn : I.clock, label:awayText(d.days)}) + "</span></div>";
      }).join("") : '<p class="empty">Nothing open. Everything ahead of you is marked done.</p>';
      h += "</div>";

      h += "</div>";

      /* 6. the prep slot. "Where you would gain most" used to sit here and
         repeated the same ranked list the next move card already leads with,
         and the activity feed answered what you did rather than what to do.
         Activity moved to the progress tracker, which is where a log belongs. */
      h += prepBlock();
      return h;
    }
  };

  /* Each rung carries its distance from the doctor's current stage, so the
     phone can drop everything two steps away and show three rungs instead of
     five. Five rungs need 480px of rail and a 390px phone gives 314px, which
     used to clip the last one mid-word. Distance is computed rather than
     positional, so it works wherever "here" falls on the ladder. */
  function rungsHTML(){
    var rs = rungs();
    var here = 0;
    rs.forEach(function(r, i){ if (r.state === "here") here = i; });
    return '<div class="rungs">' + rs.map(function(r, i){
      return '<div class="rung ' + r.state + ' d' + Math.abs(i - here) + '">' +
        '<div class="dot"></div><b>' + esc(r.t) + "</b><span>" + esc(r.sub) + "</span></div>";
    }).join("") + "</div>";
  }

  /* ================= ROLL FORWARD =================
     The Irish training year turns over in July. A record that is never asked
     about drifts quietly: months keep accruing, so a doctor who did not get a
     place looks to the dashboard exactly like one who moved up a year. Rather
     than guess, ask once a year and branch on the answer.

     Deliberately not a modal. A doctor reading this on a shift break should be
     able to ignore it, and it will still be there next time. */
  /* shared by runAction and the roll-forward, which both need to append to the
     same feed the progress tracker reads */
  function logActivity(t, d){
    if (!t) return;
    S.activity = S.activity || [];
    S.activity.unshift({t:t, d:d || "", at:Date.now()});
    S.activity = S.activity.slice(0, 20);
    save();
  }

  function rollDue(){
    if (situation().isConsultant) return false;
    var now = new Date();
    /* the year turns in July, so a prompt for the 2026 turnover is only due
       from July 2026 onward */
    var turnover = now.getFullYear() + (now.getMonth() >= 6 ? 0 : -1);
    if (!S.lastRolledAt) return now.getMonth() >= 6;
    return day(S.lastRolledAt).getFullYear() < turnover;
  }

  /* Each step names its question and its answers. An answer either sets fields
     and finishes, or hands off to another step. */
  function rollFlow(){
    var sit = situation(), t = routeTiming();
    var scheme = S.schemeName || (sit.tier === "hst" ? sit.target : "basic specialist training");
    var F = {};

    F.start = {
      q: "The training year has turned over. Is your record still right?",
      sub: scopeBox().stage + ", " + t.yearsIn + " years post-internship" +
           (S.inScheme === false ? ", not in a training post" : S.schemeName ? ", on " + S.schemeName : ""),
      a: [
        {t:"Yes, nothing has changed", act:"rollDone"},
        {t:"No, something changed", go: S.inScheme === false ? "gotPlace" : "stillOn"}
      ]
    };
    /* on a scheme: did they move up, finish, or leave */
    /* only offer "moved up a year" when the scheme actually has another year
       in it. BST runs two years, so year 2 plus one is not year 3, it is
       finished, and offering the wrong answer invites a wrong record. */
    var yearNow = S.schemeYear || t.stageYear;
    var hasNextYear = yearNow < t.stageYears;
    F.stillOn = {
      q: "Are you still on " + scheme + "?",
      sub: "Year " + yearNow + " of " + t.stageYears + " on your record.",
      a: (hasNextYear ? [{t:"Yes, now in year " + (yearNow + 1), act:"rollAdvance"}] : [])
        .concat([
          {t:"Yes, same year again", act:"rollDone"},
          {t:"I have finished it", go:"gotPlace"},
          {t:"I left it", act:"rollLeft"}
        ])
    };
    /* standalone, or just finished: the question that decides everything else */
    F.gotPlace = {
      q: "Did you get a training place for this year?",
      sub:"Places are limited, so both answers are common.",
      a: [
        {t:"Yes", go:"whichScheme"},
        {t:"No", go:"whatRole"}
      ]
    };
    F.whichScheme = {
      q: "Which one?",
      a: [{t:sit.target, act:"rollJoinTarget"}]
        .concat(otherTargetsInfo().map(function(o){ return {t:o.name, act:"rollJoinOther", val:o.name}; }))
        .concat([{t:"Something else", act:"rollJoinOther", val:""}])
    };
    F.whatRole = {
      q: "What are you working as this year?",
      sub:"This is recorded as time in post. It is not scored against you.",
      a: [
        {t:"SHO", act:"rollRole", val:"SHO"},
        {t:"Registrar", act:"rollRole", val:"Registrar"},
        {t:"Something else", act:"rollRole", val:"Other"}
      ]
    };
    return F[S.rollStep || "start"] || F.start;
  }

  function rollCard(){
    if (!rollDue() && !S.rollStep) return "";
    var f = rollFlow();
    var h = '<div class="prep" style="margin-top:0;margin-bottom:14px"><p class="k">Once a year</p>' +
      "<h2>" + esc(f.q) + "</h2>" +
      (f.sub ? '<p class="lede">' + esc(f.sub) + "</p>" : "");
    h += '<div class="prep-cta">' + f.a.map(function(a, i){
      return '<button class="btn btn-sm ' + (i === 0 ? "btn-primary" : "btn-ghost") + '" data-roll="' +
        esc(a.go ? "go:" + a.go : a.act) + '" data-rollval="' + esc(a.val || "") + '">' + esc(a.t) + "</button>";
    }).join("") + "</div>";
    if (S.rollStep) h += '<p class="lede" style="margin-top:10px"><button class="btn-link" data-roll="rollCancel">Ask me later</button></p>';
    return h + "</div>";
  }

  /* ================= THE SHAPE OF THE YEAR =================
     The ladder counts years. It never showed what one year looks like, and
     the year has a fixed rhythm: applications close, interviews run, offers
     go out, the post starts. A doctor deciding when to run an audit is
     planning against that rhythm, not against a six-year total.

     Everything outstanding is back-planned to one date rather than to invented
     per-item lead times. Evidence has to be dated before the application
     closes, so that is the deadline for all of it, and how long each takes is
     the doctor's own business rather than something to guess at. */
  function yearBeats(){
    var sit = situation(), c = sit.cycle, step = nextStep();
    /* the cycle we hold is the target's. Someone applying to something else
       this year, or not applying at all, must not be shown it as their year:
       the same leak usesCycle was added to close on the next-step card. */
    if (!sit.stillApplying || !c || !step || !step.usesCycle) return null;
    return [
      {t:"Applications close", iso:c.apply, note:"Evidence must already be dated"},
      {t:"Interviews", iso:c.interview, note:esc(sit.college)},
      {t:"Offers issued", iso:c.offers || addDays(c.interview, 39), note:esc(sit.college)},
      {t:sit.target + " starts", iso:c.start, note:"If you are offered a place"}
    ];
  }

  function yearShapeCard(){
    var sit = situation(), beats = yearBeats();
    if (!beats) return "";

    /* the first beat still ahead is where the doctor actually stands in the
       year, and it is the only one that should carry emphasis */
    var nowIdx = -1;
    beats.forEach(function(bt, i){ if (nowIdx < 0 && until(bt.iso) >= 0) nowIdx = i; });

    var h = '<div class="card" style="margin-top:14px"><div class="card-head"><h2>How this year runs</h2>' +
      '<span class="aside">' + esc(cycleLabel()) + " cycle, " + esc(sit.college) + "</span></div>";
    h += '<div class="beats">' + beats.map(function(bt, i){
      var d = until(bt.iso), state = d < 0 ? "past" : (i === nowIdx ? "now" : "");
      return '<div class="beat ' + state + '"><span class="node">' +
        (d < 0 ? ico(I.tick, 8) : "") + "</span>" +
        '<span class="bk">' + esc(bt.t) + "</span>" +
        '<span class="bd">' + fmtLong(bt.iso) + "</span>" +
        chip(d < 0 ? {k:"mute", icon:I.tick, label:"Passed"}
           : {k: d <= 21 ? "crit" : (d <= 60 ? "warn" : "mute"), icon:I.clock, label:awayText(d)}) +
        '<span class="bn">' + bt.note + "</span></div>";
    }).join("") + "</div>";
    h += ctxFoot("These dates are illustrative and follow the same cycle as the rest of the dashboard. " +
      "Confirm them against " + sit.college + "'s published dates before you plan around them.");
    return h + "</div>";
  }

  /* ================= WHERE TWO ROUTES DIVERGE =================
     Two ladders side by side were mostly the same ladder twice, because both
     read off one record. The question a hedging doctor actually has is which
     work counts twice and which only counts once, so lead with that. */
  function divergenceCard(){
    var others = otherTargetsInfo();
    if (!others.length) return "";
    var sit = situation();
    var routes = [{name:S.specialty, exam:sit.exam, body:sit.college, cycle:sit.cycle}]
      .concat(others.map(function(o){ return {name:o.name, exam:o.exam, body:o.body, cycle:CYCLE[o.body] || null}; }));

    var h = '<div class="card" style="margin-top:14px"><div class="card-head"><h2>Where these routes differ</h2>' +
      '<span class="aside">' + routes.length + " routes</span></div>";

    /* the good news first, because it is the larger half and the one nobody
       tells them: the portfolio is one portfolio */
    h += '<p class="group-h">Counts for every route</p>';
    h += '<div class="row"><span class="t" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">' +
      "<b>Everything in your portfolio</b>" + chip({k:"good", icon:I.tick, label:"Shared"}) +
      "<small style=\"flex-basis:100%\">" + DOMAINS.map(function(d){ return d.name; }).join(", ") +
      '. Months post-internship count once and apply everywhere.</small></span></div>';

    h += '<p class="group-h">Differs by route</p>';
    var rows = [
      {t:"Exam family", get:function(r){ return r.exam || "Not set"; }},
      {t:"College", get:function(r){ return r.body || "Not set"; }},
      {t:"Applications close", get:function(r){ return r.cycle ? fmtLong(r.cycle.apply) : "Date not set"; }},
      {t:"Interview", get:function(r){ return r.cycle ? fmtLong(r.cycle.interview) : "Date not set"; }}
    ];
    h += '<div style="overflow-x:auto"><table class="data"><thead><tr><th></th>' +
      routes.map(function(r){ return "<th>" + esc(r.name) + "</th>"; }).join("") + "</tr></thead><tbody>";
    h += rows.map(function(row){
      var vals = routes.map(function(r){ return row.get(r); });
      /* a row where every route agrees is not a difference, so say so */
      var same = vals.every(function(v){ return v === vals[0]; });
      return "<tr><td><b>" + esc(row.t) + "</b>" +
        (same ? "<small>Same either way</small>" : "") + "</td>" +
        vals.map(function(v){ return "<td>" + esc(v) + "</td>"; }).join("") + "</tr>";
    }).join("");
    h += "</tbody></table></div>";
    h += ctxFoot("Both ladders read off one record, so your months and exam stages are shared. Entry rules that " +
      "let one route credit time served on another are not modelled here, so check eligibility with each college.");
    return h + "</div>";
  }

  /* ================= WHERE YOU HAVE BEEN =================
     The ladder is a projection. This is the record: what actually happened
     each July, including the years where the answer was "no place". Nothing
     else in the product stores that, and it is the fact a doctor is most
     often asked to account for. */
  function historyCard(){
    var hist = S.rollHistory || [];
    if (!hist.length){
      return '<div class="strip"><b>Where you have been</b><p>Nothing recorded yet. Each July the dashboard asks ' +
        "what changed, and the answers build up here as a record of the route you actually took rather than the " +
        "one you planned." + (S.rotations && S.rotations.length
          ? ' Your logged rotations are on <a href="#/profile">your profile</a> in the meantime.' : "") +
        "</p></div>";
    }
    var h = '<div class="card"><div class="card-head"><h2>Where you have been</h2>' +
      '<span class="aside">' + hist.length + (hist.length === 1 ? " update" : " updates") + "</span></div>";
    h += hist.map(function(e){
      return '<div class="row"><span class="t">' + esc(e.note) + "<small>Recorded " + fmtLong(e.at) +
        "</small></span><span class=\"r\"><span class=\"chip mute\">" + e.year + "</span></span></div>";
    }).join("");
    return h + "</div>";
  }

  /* ================= IF THIS CYCLE DOES NOT LAND =================
     Places are limited and a large share of applicants do not get one first
     time. The product knows that and says nothing about it, which leaves the
     doctor to discover it alone at the worst moment. Descriptive only: what
     people commonly do, never what this doctor should do.

     ALT_ROUTES content is ILLUSTRATIVE. The two cross-route facts here that
     trace to research are in the MedPath competitor analysis: ICAT is a
     funded-PhD pathway entered across specialties rather than through one,
     and several RCPI medicine subspecialties sit under a General Internal
     Medicine trunk. Anything not listed says so rather than inventing an
     alternative route into a named specialty. */
  /* ================= MOVING SIDEWAYS =================
     Two different kinds of move, and conflating them would be dishonest.

     Same membership exam: derived from SPECIALTY_INFO rather than asserted.
     Every RCPI medicine specialty is entered on MRCPI, so a doctor holding it
     genuinely does carry that exam across all of them. That is a fact about
     our own data, not a claim about entry rules.

     A different exam: NOT derivable, and not a free-for-all. You cannot drift
     from general medicine into plastic surgery, so listing every non-MRCPI
     specialty as reachable would be false. This map is deliberately narrow and
     holds only the move the product owner named as common, general practice,
     which ICGP does enter from hospital training. It is illustrative and says
     so: the entry and credit rules behind it are the college's, not ours. */
  var PIVOTS = {
    "MRCPI":    ["General Practice"],
    "MRCS":     ["General Practice"],
    "MRCPCH":   ["General Practice"],
    "MRCPsych": ["General Practice"],
    "MRCEM":    ["General Practice"],
    "MRCOG":    ["General Practice"]
  };

  function relatedSpecialties(){
    var sit = situation(), mine = S.specialty, myExam = sit.exam;
    if (!mine || !myExam) return {same:[], other:[]};
    var already = (S.otherTargets || []);
    function row(n){
      var i = SPECIALTY_INFO[n] || {};
      return {name:n, exam:i.exam || "", body:i.body || "", target:i.target || n,
              added: already.indexOf(n) > -1};
    }
    var same = Object.keys(SPECIALTY_INFO).filter(function(n){
      return n !== mine && SPECIALTY_INFO[n].exam === myExam;
    }).map(row);
    var other = (PIVOTS[myExam] || []).filter(function(n){
      return n !== mine && SPECIALTY_INFO[n];
    }).map(row);
    return {same:same, other:other};
  }

  function altRoutes(){
    var sit = situation();
    /* each route goes somewhere. A card that names an option and leaves the
       doctor to find it is only half the help. */
    var out = [
      {t:"Apply again next cycle", d:"Nothing in a portfolio expires between cycles, and another year of evidence " +
        "usually scores higher than the same application resubmitted.",
       go:[["#/deadlines","See the next cycle dates"],["#/gaps","Build the portfolio"]]},
      {t:"A standalone post in the meantime", d:"Service posts still count as clinical experience, and audit, " +
        "teaching and research all continue from one.",
       go:[["#/opportunities","Posts matched to you"]]}
    ];
    out.push({t:"ICAT", d:"Irish Clinical Academic Training, a funded PhD integrated with clinical training. " +
      "Entered across specialties rather than through one, so it runs parallel to this route.",
     go:[["#/readiness","Check your research evidence"]]});
    return out;
  }

  /* ================= PLAN B =================
     This was a card that sat on the page from the moment a doctor came within
     six months of applying, telling someone mid-application that we had
     already started planning around their failure. It is the same content, but
     asked for: a Plan B control on the application rung opens it.

     It opens on a question, because everything below depends on the answer and
     the product had no way of knowing it. The answer writes to the same
     applications[] record the ladder keeps, so answering here also updates the
     rung: one fact, one place. */
  function planBCard(){
    var target = S.planB;
    if (!target) return "";
    var sit = situation(), app = applicationFor(target), cy = cycleLabel();

    var h = '<div class="card" id="planb" style="margin-top:14px;border-color:var(--deep);border-width:1.5px">' +
      '<div class="card-head"><h2>Plan B for ' + esc(target) + "</h2>" +
      '<button class="btn btn-sm btn-ghost" data-rung="planb-close">Close</button></div>';

    /* the gate */
    if (!app || !app.outcome){
      h += '<p class="lede" style="max-width:62ch;margin-bottom:14px">Before anything else: did you get a place ' +
        "in the " + esc(cy) + " cycle? Nothing below is worth reading if you did, and your answer is recorded on " +
        "the ladder either way.</p>";
      h += '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
        '<button class="btn btn-sm btn-primary" data-rung="answer:offer" data-rungval="' + esc(target) +
          '">Yes, I have a place</button>' +
        '<button class="btn btn-sm btn-ghost" data-rung="answer:none" data-rungval="' + esc(target) +
          '">No, not this cycle</button>' +
        '<button class="btn btn-sm btn-ghost" data-rung="answer:waiting" data-rungval="' + esc(target) +
          '">Still waiting to hear</button></div>';
      return h + "</div>";
    }

    /* they have a place: say so and stop, rather than counselling them anyway */
    if (app.outcome === "offer"){
      h += '<p class="lede" style="max-width:62ch;margin-bottom:12px">You recorded an offer for ' + esc(target) +
        " in the " + esc(cy) + " cycle, so this is not the question any more. If that changes, the routes come back.</p>" +
        '<button class="btn btn-sm btn-ghost" data-rung="reanswer" data-rungval="' + esc(target) +
        '">Change the answer</button>';
      return h + "</div>";
    }

    var pt = routeTiming();
    h += '<p class="lede" style="max-width:64ch">' +
      (app.outcome === "waiting"
        ? "You are waiting to hear. Places are limited, so it is worth knowing the routes now rather than in the week the answer lands."
        : pt.holding
          /* someone years outside a scheme has already lived this, and telling
             them it happens as though it were news reads badly */
          ? "No place this cycle. You have already been here, so none of this is news: places are limited and missing one is not a verdict on the doctor."
          : "No place this cycle. That is common where places are limited and it is not a verdict on the doctor.") +
      " What stays true either way is that the portfolio carries forward. Months, exams, audit and teaching all " +
      "keep counting.</p>" +
      '<button class="btn btn-sm btn-ghost" style="margin-top:10px" data-rung="reanswer" data-rungval="' +
      esc(target) + '">Change the answer</button>';

    h += '<p class="group-h" style="margin-top:16px">What people commonly do</p>';
    h += '<div class="opts">' + altRoutes().map(function(r){
      return '<div class="opt"><b>' + esc(r.t) + "</b><p>" + esc(r.d) + "</p>" +
        ((r.go || []).length ? '<span class="acts">' + r.go.map(function(g){
          return '<a class="btn btn-sm btn-ghost" href="' + g[0] + '">' + esc(g[1]) + "</a>";
        }).join("") + "</span>" : "") + "</div>";
    }).join("") + "</div>";

    h += relatedBlock();
    h += ctxFoot("Routes are descriptive, not advice, and the alternatives above are illustrative in this " +
      "prototype. Check eligibility with the college before acting on any of them.");
    return h + "</div>";
  }

  /* ================= A DIFFERENT SPECIALTY FROM HERE =================
     The routes above all assume the same destination. A doctor who has missed
     a place twice is often asking a different question, which is whether the
     training already done opens anything else. Adding one here is not a
     detour: it writes to otherTargets, which is what the dual-track comparison
     on this same page already reads. */
  function relatedBlock(){
    var rel = relatedSpecialties();
    if (!rel.same.length && !rel.other.length) return "";
    var sit = situation();
    var h = '<p class="group-h" style="margin-top:18px">A different specialty from here</p>';

    function addCtl(r, small){
      return r.added
        ? '<span class="chip good">' + ico(I.tick, 12) + "Tracking</span>"
        : '<button class="btn btn-sm btn-ghost" data-addtarget="' + esc(r.name) + '">' +
          (small ? "Track" : "Track this too") + "</button>";
    }

    if (rel.same.length){
      h += '<p class="lede" style="max-width:64ch;margin-bottom:10px">These are entered on the same membership ' +
        "exam you are already working towards, so <b>" + esc(sit.exam) + " carries</b>, and so does the portfolio. " +
        "What differs is competition and the programme itself. Some are entered through a General Internal " +
        "Medicine trunk rather than directly, which is worth checking for any you are considering.</p>";
      /* one line each rather than a tile each: the describing sentence was the
         same for all of them, so it is said once above */
      h += '<div class="picks">' + rel.same.map(function(r){
        return '<span class="pick">' + esc(r.name) + addCtl(r, true) + "</span>";
      }).join("") + "</div>";
    }
    if (rel.other.length){
      h += '<p class="lede" style="max-width:64ch;margin:18px 0 10px">A different membership exam, but hospital ' +
        "training is commonly credited towards it. Your months and portfolio still count for something; the exam " +
        "does not carry.</p>";
      h += '<div class="opts">' + rel.other.map(function(r){
        return '<div class="opt"><b>' + esc(r.name) + "</b><p>" + esc(r.exam + " via " + r.body +
          ". A different exam, entered from hospital training.") + '</p><span class="acts">' +
          addCtl(r) + "</span></div>";
      }).join("") + "</div>";
      h += ctxFoot("Whether your specific posts count towards " + rel.other.map(function(r){ return r.name; }).join(" or ") +
        ", and how much, is set by " + rel.other.map(function(r){ return r.body; }).join(" and ") +
        " and is not modelled here. Confirm it with them before you plan around it.");
    }
    return h;
  }

  /* ================= LADDER STATE =================
     A stage is complete when the doctor says so. Failing that we infer it
     from months, which is a reasonable default and a bad certainty, so the
     inference is always overridable and a stated date always wins. */
  function stageDone(id, inferred){
    var d = (S.stagesDone || {})[id];
    if (d) return d;
    return inferred ? true : false;
  }
  function stageWhen(id, inferredLabel){
    var d = (S.stagesDone || {})[id];
    return d ? "Complete " + fmtLong(d) : inferredLabel;
  }

  /* the application for a given target in the cycle currently open */
  function cycleLabel(){
    var c = situation().cycle;
    if (!c) return "";
    var y = day(c.apply).getFullYear();
    return y + " to " + (y + 1);
  }
  function applicationFor(target){
    var cy = cycleLabel();
    return (S.applications || []).filter(function(a){
      return a.target === target && a.cycle === cy;
    })[0] || null;
  }

  var OUTCOMES = {
    offer:   {k:"good", label:"Offer"},
    none:    {k:"crit", label:"No offer"},
    waiting: {k:"warn", label:"Waiting"}
  };

  /* One ladder builder, called once for the main route and again for each
     hedged route when the dual-track view is on. It takes a specialty rather
     than reading the record's own, which is what makes side by side possible. */
  function trailFor(specName){
    var info = SPECIALTY_INFO[specName] || {};
    var exam = info.exam || S.exam, target = info.target || S.target;
    var c = CYCLE[info.body] || null;
    var onLadder = stageDone("internship", S.clinicalMonths > 0);
    var bstInferred = S.clinicalMonths >= 24;
    var bstDone = stageDone("bst", bstInferred);
    /* a doctor who told us they never got a place is not "complete" no matter
       what the month count says */
    if (S.inScheme === false && !S.schemeName && !(S.stagesDone || {}).bst) bstDone = false;

    var trail = [
      {k: onLadder ? "done" : "todo", t:"Internship",
       when: stageWhen("internship", onLadder ? "Complete" : "Not started"), rung:"internship"},
      {k:"flag", t: S.examStages >= 1 ? exam + " Part 1 passed" : exam + " Part 1 not held",
       when: S.examStages >= 1 ? "Passed" : "Outstanding", go:["#/exams","Exam prep"],
       rung: S.examStages < 1 ? "exam" : null, rungLabel:"Mark passed"},
      {k: bstDone ? "done" : "todo", t:"Basic specialist training",
       when: bstDone ? stageWhen("bst", "Complete")
         : (S.inScheme === false && !S.schemeName
             ? (S.roleTitle ? "Not on a scheme, working as " + S.roleTitle : "No training place yet")
             : S.clinicalMonths + " months in"),
       rung:"bst"},
      {k:"flag", t: S.examStages >= 3 ? "Full " + exam + " membership" : exam + " not yet complete",
       when: S.examStages + " of 3 stages", go: S.examStages < 3 ? ["#/exams","Exam prep"] : null,
       rung: S.examStages < 3 ? "exam" : null, rungLabel:"Mark a stage passed"}
    ];
    if (situation().stillApplying){
      /* the application rung is the application tracker: it records whether
         they applied, and then what came of it */
      var app = applicationFor(target);
      /* the cycle we hold is THIS year's. An intern reaches this rung in about
         three years, so naming this year's closing date on it is a date that
         is not theirs, the same leak the year cards and the contingency card
         each had. Only a doctor applying into this cycle gets the date. */
      var thisCycle = (nextStep() || {}).usesCycle;
      var appWhen = !app ? (c && thisCycle ? "Applications close " + fmt(c.apply) : "When you reach it")
        : app.outcome ? OUTCOMES[app.outcome].label + ", " + fmtLong(app.outcomeAt)
        : "Applied " + fmtLong(app.appliedAt);
      trail.push(
        {k: app && app.outcome === "offer" ? "done" : "here",
         t: target + (!app ? ", not yet applied" : app.outcome === "offer" ? ", offer accepted"
              : app.outcome === "none" ? ", no offer this cycle"
              : app.outcome === "waiting" ? ", waiting to hear" : ", applied"),
         when: appWhen, app: app || true, appTarget: target, planB: !!thisCycle},
        {k:"flag", t:"Interview", when: c && thisCycle ? fmt(c.interview) : "After you apply",
         go:["#/interviews","Interview prep"]},
        {k:"todo", t:"CSCST", when: stageWhen("cscst", "Future"), rung:"cscst"},
        {k:"todo", t:"Consultant post", when:"Future"}
      );
    } else {
      trail.push({k:"here", t:"Consultant post", when:"Reached"});
    }
    return trail;
  }

  function trailHTML(trail){
    return '<div class="trail">' + trail.map(function(s){
      if (s.k === "flag"){
        /* exam and interview markers used to be inert text. Both modules exist
           now, so the rung is the way into them, and an exam stage can be
           marked passed from here too. */
        return '<div class="trail-item flag"><span class="knob">' + ico(I.flag, 9) + "</span>" +
          '<p class="trail-flagline">' + esc(s.t) + '<span class="chip mute">' + esc(s.when) + "</span>" +
          (s.rung ? '<button class="btn-link" data-rung="' + esc(s.rung) + '">' +
            esc(s.rungLabel || "Mark complete") + "</button>" : "") +
          (s.go ? '<a class="btn-link" href="' + s.go[0] + '">' + esc(s.go[1]) + "</a>" : "") + "</p></div>";
      }
      var mark = s.k === "done" ? ico(I.tick, 11) : (s.k === "here" ? ico(I.target, 11) : "");
      var ctrl = "";
      /* the application rung carries its own small flow: applied, then what
         came of it. Both are facts only the doctor has. */
      if (s.app){
        var a = s.app === true ? null : s.app;
        if (!a){
          ctrl = '<button class="btn-link" data-rung="apply" data-rungval="' + esc(s.appTarget) + '">Mark as applied</button>';
        } else if (!a.outcome){
          ctrl = '<span class="rung-acts">' +
            Object.keys(OUTCOMES).map(function(o){
              return '<button class="btn-link" data-rung="outcome:' + o + '" data-rungval="' + esc(s.appTarget) + '">' +
                esc(OUTCOMES[o].label) + "</button>";
            }).join("") + "</span>";
        } else {
          ctrl = '<span class="chip ' + OUTCOMES[a.outcome].k + '">' + esc(OUTCOMES[a.outcome].label) + "</span>" +
            '<button class="btn-link" data-rung="unapply" data-rungval="' + esc(s.appTarget) + '">Undo</button>';
        }
        /* the way into the contingency, sitting on the rung it is contingent
           on. Pointless once they hold a place, and premature for a doctor who
           reaches this rung in three years: an intern was being offered a
           Plan B for an application they have not made yet. */
        if (s.planB && !(a && a.outcome === "offer")){
          ctrl += '<button class="btn-link plan-b" data-rung="planb" data-rungval="' + esc(s.appTarget) + '">' +
            ico(I.map, 12) + "Plan B</button>";
        }
      } else if (s.rung){
        ctrl = '<button class="btn-link" data-rung="' + esc(s.k === "done" ? "undo:" + s.rung : "done:" + s.rung) +
          '">' + esc(s.k === "done" ? "Undo" : (s.rungLabel || "Mark complete")) + "</button>";
      }
      return '<div class="trail-item ' + s.k + '"><span class="knob">' + mark + "</span>" +
        '<div class="trail-card"><b>' + esc(s.t) + '</b><span class="when">' + esc(s.when) + "</span>" +
        (ctrl ? '<span class="rung-ctrl">' + ctrl + "</span>" : "") + "</div></div>";
    }).join("") + "</div>";
  }

  VIEWS.roadmap = {
    title:"My roadmap", sub:"Your route to consultant, with your position pinned.",
    render:function(){
      var rsit = situation(), t = routeTiming(), step = nextStep();
      var others = otherTargetsInfo();
      var h = rollCard();

      /* Five equal white slabs in a row told the eye nothing about what
         mattered. Three labelled phases do: where you stand, the year you are
         in, and the longer view. The labels are the existing .sec-label the
         rest of the app already groups with. */
      h += '<p class="sec-label">Where you stand</p>';

      /* The ladder leads. It already shows position, so the separate "where you
         are" card was saying twice what the here-marker says once. What it did
         carry that the ladder cannot is the timing, so that folds in below. */
      h += '<div class="card"><div class="card-head"><h2>Your ladder in full</h2>' +
        '<span class="aside">' + esc(scopeBox().stage) + "</span></div>" +
        trailHTML(trailFor(S.specialty));

      h += '<div class="row" style="margin-top:12px;border-top:1px solid var(--line);padding-top:12px">' +
        '<span class="t">Time since internship<small>' +
        (t.holding
          ? Math.round(t.holdingMonths) + " months of that outside a training post"
          : rsit.isStudent ? "Not yet qualified"
          : rsit.isIntern ? "Intern year, before specialist training begins"
          : rsit.isConsultant ? "Training complete"
          : "In " + (rsit.tier === "hst" ? "higher" : "basic") + " specialist training") +
        "</small></span><span class=\"r\"><b class=\"num\">" + t.yearsIn + " years</b></span></div>";
      if (rsit.stillApplying){
        h += '<div class="row"><span class="t">Typical time from here<small>' +
          "Intern " + STAGE_YEARS.intern + ", BST " + STAGE_YEARS.bst + ", " +
          esc(rsit.target) + " " + hstYears() + ". Places are limited, so this is a range and not a date." +
          "</small></span><span class=\"r\"><b class=\"num\">" + t.remainLow + " to " + t.remainHigh + " years</b></span></div>";
      }
      /* the toggle only exists for someone actually hedging */
      if (others.length){
        h += '<button class="btn btn-sm btn-ghost" style="margin-top:12px" data-act="toggleDual">' +
          (S.showDual ? "Hide the other route" + (others.length > 1 ? "s" : "")
                      : "Compare with " + esc(others.map(function(o){ return o.name; }).join(" and "))) + "</button>";
      }
      h += "</div>";

      /* directly under the ladder, because that is where the control that
         opens it lives. A panel that answered a click three sections away
         would read as the click having done nothing. */
      h += planBCard();

      /* side by side rather than stacked, because the whole question a hedging
         doctor has is where the two routes differ */
      if (S.showDual && others.length){
        /* the comparison that answers the question, before the two ladders
           that mostly show the same thing twice */
        h += divergenceCard();
        h += '<div class="grid ' + (others.length > 1 ? "g3" : "g2") + '" style="margin-top:14px">';
        h += '<div class="card"><div class="card-head"><h3>' + esc(S.specialty) + "</h3>" +
          '<span class="chip good">Main route</span></div>' + trailHTML(trailFor(S.specialty)) + "</div>";
        others.forEach(function(o){
          h += '<div class="card"><div class="card-head"><h3>' + esc(o.name) + "</h3>" +
            '<span class="chip mute">' + esc(o.body) + "</span></div>" + trailHTML(trailFor(o.name)) + "</div>";
        });
        h += "</div>";
      }

      if (step){
        h += '<p class="sec-label">' + (step.usesCycle && rsit.cycle
          ? "This application year" : "What is next") + "</p>";
        h += '<div class="card"><div class="card-head"><h2>' + esc(step.k) + "</h2>" +
          (step.usesCycle && rsit.cycle
            ? '<span class="aside">Applications close ' + fmtLong(rsit.cycle.apply) + "</span>" : "") + "</div>" +
          '<p class="lede" style="max-width:62ch"><b style="color:var(--deep);font-size:14px">' + esc(step.t) +
          "</b><br>" + esc(step.why) + "</p>" +
          '<div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">' +
          step.links.map(function(l, i){
            return '<a class="btn btn-sm ' + (i === 0 ? "btn-primary" : "btn-ghost") + '" href="' + l[0] + '">' + esc(l[1]) + "</a>";
          }).join("") + "</div></div>";
      }

      /* the year's rhythm stays with the next step, because both are this
         cycle. The work that date governs is the gap analyser's, and stating
         it twice at full size was the roadmap restating another page. */
      if (yearBeats()) h += yearShapeCard();
      h += '<p class="sec-label">The longer view</p>' + historyCard();

      if (others.length && !S.showDual){
        h += '<div class="card" style="margin-top:14px"><div class="card-head"><h2>Also applying to</h2>' +
          '<span class="aside">' + others.length + (others.length === 1 ? " other route" : " other routes") + "</span></div>" +
          others.map(function(o){
            var c = CYCLE[o.body] || CYCLE.RCPI, d = until(c.apply);
            var k = d < 0 ? "mute" : (d <= 21 ? "crit" : (d <= 60 ? "warn" : "good"));
            return '<div class="row"><span class="t">' + esc(o.name) + "<small>" + esc(o.exam) + " via " + esc(o.body) + "</small></span>" +
              '<span class="r"><span class="chip mute">' + esc(o.body) + '</span><span class="chip ' + k + '">' +
              (d < 0 ? "Closed" : awayText(d) + " to apply") + "</span></span></div>";
          }).join("") +
          '<p class="lede" style="margin-top:10px">Illustrative application windows for these, not the published dates each college sets. ' +
          "This route stays your main one everywhere else on the dashboard. " + '<a href="#/deadlines">See the full dates</a>.</p></div>';
      }
      return h;
    }
  };

  VIEWS.gaps = {
    title:"Gap analyser", sub:"What is missing, ordered by what it costs you.",
    render:function(){
      var dls = deadlines();
      function dueFor(id){ var m = {auditqi:"qi", teaching:"teach"}; var d = dls.filter(function(x){ return x.id === m[id]; })[0]; return d || null; }
      var tiers = [
        {k:"crit", label:"Critical, and scored in bands", ids:["auditqi","teaching"]},
        {k:"warn", label:"Important before interview", ids:["research","clinical"]},
        {k:"mute", label:"Optional, smallest gain", ids:["leadership"]}
      ];
      var h = "";

      /* The one thing the roadmap's "Finish before" card carried that this
         page did not: every gap below is governed by a single date, because
         evidence has to be dated before the application closes. Per-domain due
         dates alone never said that. */
      var gsit = situation(), gstep = nextStep(), gc = gsit.cycle;
      if (gc && gstep && gstep.usesCycle && until(gc.apply) >= 0){
        var gleft = until(gc.apply), gowed = scoreMax() - scorePts();
        h += '<div class="card" style="margin-bottom:18px"><div class="card-head">' +
          "<h2>Everything here has to be dated before " + fmtLong(gc.apply) + "</h2>" +
          '<span class="aside">' + gowed + " points still on the table</span></div>" +
          '<p class="lede" style="max-width:64ch">Anything dated after that will not appear on this ' +
          "application, however good it is. " + (gleft <= 90
            ? "You have " + gleft + " days."
            : "That is " + Math.round(gleft / 30) + " months away, which is enough for all of it if you start now.") +
          "</p></div>";
      }

      var any = false;
      tiers.forEach(function(t){
        var items = DOMAINS.filter(function(d){ return t.ids.indexOf(d.id) > -1 && d.maxPts - d.pts() > 0; });
        if (!items.length) return;
        any = true;
        h += '<p class="sec-label" style="color:var(--' + (t.k === "crit" ? "crit" : t.k === "warn" ? "warn" : "txt") + '-text)">' + esc(t.label) + "</p>";
        h += items.map(function(d){
          var due = dueFor(d.id), lost = d.maxPts - d.pts();
          return '<div class="gap-item"><div class="gap-top"><b>' + esc(d.name) + "</b>" +
            '<span class="r">' + (due ? chip({k: due.days <= 21 ? "crit" : "warn", icon:I.clock, label:"Due " + fmt(due.iso) + ", " + awayText(due.days)}) : "") +
            '<span class="chip mute">' + lost + " points on the table</span></span></div>" +
            '<div class="gap-meta"><span>Portfolio weight <b>' + d.weight + '%</b></span><span>Scored: ' + esc(d.bands) + "</span><span>" + esc(d.note()) + "</span></div>" +
            bar(d.ready()) +
            '<div class="gap-acts" style="margin-top:12px">' + gapActions(d.id) + "</div></div>";
        }).join("");
      });
      if (!any) h += '<p class="empty"><b>No gaps left.</b>Every domain is complete against the published criteria.</p>';

      var missing = losingDomains();
      h += '<div class="card" style="margin-top:20px"><div class="card-head"><h2>Summary</h2></div>' +
        '<p class="lede">You are losing points in <b>' + missing + '</b> of 6 domains, worth <b>' + (scoreMax() - scorePts()) +
        '</b> unscored points. Closing the audit and QI gap alone is worth more than the other three together.</p>' +
        '<div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">' +
        '<a class="btn btn-sm btn-ghost" href="#/progress">Track progress</a>' +
        '<a class="btn btn-sm btn-primary" href="#/opportunities">Find what closes them</a></div></div>';
      return h;
    }
  };
  function gapActions(id){
    if (id === "auditqi") return actBtn("finishQI", "Mark QI project complete", true) +
      '<a class="btn btn-sm btn-ghost" href="#/opportunities">Find a QI course</a>';
    if (id === "teaching") return actBtn("logTeaching", "Log a session", true) +
      '<a class="btn btn-sm btn-ghost" href="#/opportunities">Find teaching opportunities</a>';
    if (id === "research") return actBtn("addResearch", "Record an output", true);
    if (id === "leadership") return actBtn("doLeadership", "Mark course complete", true);
    return '<span class="lede">Accrues with time in post. Nothing to do.</span>';
  }

  VIEWS.deadlines = {

      var notMine = delig && !delig.eligible;

          '<div class="dl-sub"><span>' + fmtLong(d.iso) + "</span>" +
          '<span class="chip mute">' + (!theirs ? "Next cycle for you" : d.kind === "official" ? "Official" : "Your own") + "</span>" +
          "<span>" + esc(d.note) + "</span>" +

  /* ================= NAV ================= */
  /* ================= MODULE REGISTRY =================
     Zones are fixed and ordered. The nav a doctor learns in week one is the
     same nav in month six, which is also what lets a pricing boundary land on
     a zone later without reshuffling anything.

     What adapts is not the order but the STATE of each module, and there are
     only three. Nothing is ever hidden: a module that does not apply says so
     in a sentence, because personalised disclosure without a stated reason
     reads as the product deciding things behind your back.

       active  the normal case
       ahead   real, just not yet, with the date it starts mattering
       aside   not on your route, with the reason in plain words          */
  var ZONES = ["Overview", "Your pathway", "Your readiness", "Your applications", "Preparation", "Practical", "Account"];

  /* the scored application apparatus, which a consultant has finished with */
  function applyingOnly(sit){
    return sit.stillApplying ? null
      : {k:"aside", why:"You have reached consultant, so nothing here is scoring you any more. It stays visible because your record does."};
  }

  var MODULES = [
    {id:"today",         t:"Today",                          ic:I.home,   zone:"Overview"},
    {id:"roadmap",       t:"My roadmap",                     ic:I.map,    zone:"Your pathway"},
    {id:"progress",      t:"Progress tracker",               ic:I.chart,  zone:"Your pathway"},
    {id:"gaps",          t:"Gap analyser",                   ic:I.list,   zone:"Your readiness", rel:applyingOnly},
    {id:"readiness",     t:"Application readiness",          ic:I.clip,   zone:"Your readiness", rel:applyingOnly},
    {id:"score",         t:"Shortlisting score",             ic:I.target, zone:"Your readiness", rel:applyingOnly},
    {id:"deadlines",     t:"Deadlines",                      ic:I.cal,    zone:"Your applications", rel:applyingOnly},
    {id:"opportunities", t:"Matched to you",                 ic:I.brief,  zone:"Your applications"},
    {id:"exams",         t:"Exam prep",                      ic:I.book,   zone:"Preparation", rel:function(sit){
      if (!sit.stillApplying) return {k:"aside", why:"Your membership exams are behind you. Kept here so the record stays complete."};
      if (S.examStages >= 3) return {k:"aside", why:"You hold full " + sit.exam + " membership, so there is nothing left to sit."};
      return null;
    }},
    {id:"interviews",    t:"Interview prep",                 ic:I.mic,    zone:"Preparation", rel:function(sit){
      if (!sit.stillApplying) return {k:"aside", why:"You are not interviewing for a training post."};
      if (sit.phase === "far" && sit.cycle) return {k:"ahead", why:"Interviews are " + fmtLong(sit.cycle.interview) + ". Worth opening once applications close."};
      return null;
    }},
    {id:"admin",         t:"Occupational health and admin",  ic:I.shield, zone:"Practical"},
    {id:"cpd",           t:"CPD tracker",                    ic:I.grad,   zone:"Practical"},
    {id:"profile",       t:"Your profile",                   ic:I.user,   zone:"Account"}
  ];

  /* the sidebar scope box, derived rather than stored. It used to render
     S.stageLabel, a string written once at onboarding, so a consultant was
     still told they were "working towards HST Cardiology, SHO 2 years
     post-intern" no matter what the rest of the record said. */
  function scopeBox(){
    var sit = situation();
    var yrs = (S.clinicalMonths / 12).toFixed(1).replace(/\.0$/, "");
    var stage = sit.isStudent ? "Final year student"
      : sit.isIntern ? "Intern"
      : sit.isConsultant ? "Consultant in " + (S.specialty || "practice")
      : (sit.tier === "hst" ? "SpR" : "SHO") + ", " + yrs + (yrs === "1" ? " year" : " years") + " post-intern";
    return sit.isConsultant
      ? {label:"Currently", target:"Consultant", stage:stage}
      : {label:"Working towards", target:sit.target || "No target set", stage:stage};
  }

  function moduleById(id){
    for (var i = 0; i < MODULES.length; i++) if (MODULES[i].id === id) return MODULES[i];
    return null;
  }
  /* the single place a module's state is decided, so the nav and the page it
     leads to can never disagree about whether something applies to you */
  function relevance(id){
    var m = moduleById(id);
    if (!m || !m.rel) return null;
    return m.rel(situation());
  }

  function navBadge(id){
    if (id === "gaps"){
      var n = losingDomains();
      return n ? {n:n, alert:false} : null;
    }
    if (id === "deadlines"){
      var u = deadlines().filter(function(d){ return !d.done && d.days >= 0 && d.days <= 21; }).length;
      return u ? {n:u, alert:true} : null;
    }
    if (id === "admin"){
      var gs = gardaStatus();
      return gs.k === "crit" ? {n:"!", alert:true} : null;
    }
    return null;
  }

  function renderNav(active){
    var sit = situation();
    var html = "";
    ZONES.forEach(function(zone){
      var items = MODULES.filter(function(m){ return m.zone === zone; });
      if (!items.length) return;
      html += '<p class="nav-group">' + esc(zone) + "</p>";
      html += items.map(function(n){
        var r = n.rel ? n.rel(sit) : null;
        var b = navBadge(n.id);
        /* a module that does not apply still renders, still routes, still
           reachable by keyboard. It just stops competing for attention. */
        var cls = "nav-item" + (n.id === active ? " on" : "") + (r ? " rel-" + r.k : "");
        return '<a class="' + cls + '" href="#/' + n.id + '"' +
          (n.id === active ? ' aria-current="page"' : "") +
          (r ? ' title="' + esc(r.why) + '"' : "") + ">" + ico(n.ic, 17) + esc(n.t) +
          (r ? '<span class="pill quiet">' + (r.k === "ahead" ? "later" : "n/a") + "</span>"
             : b ? '<span class="pill' + (b.alert ? " alert" : "") + '">' + b.n + "</span>" : "") + "</a>";
      }).join("");
    });
    document.getElementById("nav").innerHTML = html;
  }

  /* ================= ROUTER ================= */
  function currentId(){
    var id = (location.hash || "#/today").replace("#/", "");
    return VIEWS[id] ? id : "today";
  }
  function render(){
    var id = currentId(), v = VIEWS[id];
    document.getElementById("viewTitle").textContent = v.title;
    document.getElementById("viewSub").textContent = v.sub;
    var host = document.getElementById("view");
    /* if a module is dimmed in the nav, landing on it must say why in the same
       words, rather than leaving the doctor to guess why it looked greyed out */
    var r = relevance(id);
    host.innerHTML = (r ? ctx(r.why, r.k === "aside") : "") + v.render();
    host.classList.remove("enter");
    void host.offsetWidth;
    if (!reduced) host.classList.add("enter");
    animateAll();
    renderNav(id);
    var sc = scopeBox();
    document.getElementById("scopeLabel").textContent = sc.label;
    document.getElementById("scopeTarget").textContent = sc.target;
    document.getElementById("scopeStage").textContent = sc.stage;
    document.getElementById("whoName").textContent = S.name;
    document.getElementById("avatar").textContent = initials(S.name);
    document.title = v.title + " · MedNav";
  }
  function initials(n){
    return n.split(/\s+/).filter(Boolean).slice(0, 2).map(function(p){ return p[0].toUpperCase(); }).join("") || "MN";
  }
  window.addEventListener("hashchange", function(){
    render();
    document.getElementById("view").focus();
    window.scrollTo({top:0, behavior: reduced ? "auto" : "smooth"});
  });

  /* ================= TOAST ================= */
  var toastEl = document.getElementById("toast"), toastTimer = null;
  function toast(msg){
    document.getElementById("toastText").innerHTML = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove("show"); }, 4200);
  }

  /* ================= ACTIONS =================
     Every mutation reports the delta it actually caused, computed rather than
     asserted, because the causal link is the thing worth teaching. */
  var ACTIONS = {
    finishQI: function(){ S.auditComplete = 1; S.qiPct = 100; return "QI project marked complete"; },
    secondQI: function(){ S.auditComplete = 2; S.qiPct = 100; return "Second QI project marked complete"; },
    logTeaching: function(){
      S.teachingDone = Math.min(S.teachingTarget, S.teachingDone + 1);
      return "Teaching session logged, " + S.teachingDone + " of " + S.teachingTarget;
    },
    addResearch: function(){ S.research = Math.min(2, S.research + 1); return "Research output recorded"; },
    toggleDual: function(){ S.showDual = !S.showDual; return null; },
    useRegimeTarget: function(){
      S.cpdTargetSet = false;
      return "Tracking against the " + cpdRegime().target + "-point target for your regime";
    },
    passExam: function(){
      if (S.examStages >= 3) return null;
      S.examStages += 1;
      var ex = situation().exam;
      return S.examStages >= 3 ? "Full " + ex + " membership recorded" : ex + " stage recorded, " + S.examStages + " of 3";
    },
    doLeadership: function(){ S.leadership = true; return "Leadership course recorded"; },
    togglePast: function(){ S.showPast = !S.showPast; return null; },
    reset: function(){
      try { window.localStorage.removeItem(KEY); } catch (e) {}
      S = load();
      S.activity = [];
      return "Demo record reset";
    },
    printReport: function(){ window.print(); return null; },
    exportCal: function(){ toast("Calendar export is not wired up in this demo."); return null; },
    remind: function(){ toast("Reminders are not wired up in this demo."); return null; },
    saveProfile: function(){
      var name = document.getElementById("pName").value.trim();
      var spec = document.getElementById("pSpec").value;
      var months = parseInt(document.getElementById("pMonths").value, 10);
      var teach = parseInt(document.getElementById("pTeach").value, 10);
      if (name) S.name = name;
      /* every specialty the dropdown offers resolves here, not just the five a
         second lookup table used to carry: picking Nephrology once left the
         target reading "HST Cardiology" */
      if (SPECIALTY_INFO[spec]){
        S.specialty = spec;
        S.target = SPECIALTY_INFO[spec].target;
        S.body = SPECIALTY_INFO[spec].body;
        S.exam = SPECIALTY_INFO[spec].exam;
      }
      if (!isNaN(months) && months >= 0) S.clinicalMonths = months;
      if (!isNaN(teach) && teach >= 1){
        S.teachingTarget = teach;
        S.teachingDone = Math.min(S.teachingDone, teach);
      }
      return "Profile saved";
    },
    saveLocation: function(){
      S.basedIn = document.getElementById("pBased").value;
      var willing = Array.prototype.slice.call(document.querySelectorAll("[data-willing-box]:checked")).map(function(el){ return el.value; });
      S.willing = willing.indexOf("any") > -1 ? ["any"] : willing;
      S.dualTrack = document.getElementById("pDual").value;
      S.otherTargets = S.dualTrack === "single" ? [] :
        Array.prototype.slice.call(document.querySelectorAll("[data-other-box]:checked")).map(function(el){ return el.value; });
      return "Location and other applications saved";
    },
    logGarda: function(){
      var v = document.getElementById("fGarda").value;
      if (!v) { toast("Pick a date first."); return null; }
      S.gardaVettingDate = v;
      return "Garda vetting date saved, renews " + fmtLong(gardaExpiry());
    },
    logHepB: function(){
      S.hepBUpToDate = document.getElementById("fHepB").checked;
      S.hepBCheckedAt = document.getElementById("fHepBAt").value;
      return "Immunisation status saved";
    },
    logOcc: function(){
      S.occClearance = document.getElementById("fOcc").checked;
      S.occClearanceAt = document.getElementById("fOccAt").value;
      return "Occupational health status saved";
    },
    logCpd: function(){
      var n = parseInt(document.getElementById("fCpdAdd").value, 10);
      if (!n || n <= 0) { toast("Enter a number of points first."); return null; }
      S.cpdPoints += n;
      S.cpdLog = S.cpdLog || [];
      S.cpdLog.unshift({pts:n, at:Date.now() ? new Date().toISOString().slice(0, 10) : ""});
      return n + " CPD points logged, " + S.cpdPoints + " of " + cpdTarget() + " so far this cycle";
    },
    saveCpdTarget: function(){
      var t = parseInt(document.getElementById("fCpdTarget").value, 10);
      if (t > 0){ S.cpdTarget = t; S.cpdTargetSet = true; }
      var end = document.getElementById("fCpdEnd").value;
      if (end) S.cpdCycleEnd = end;
      return "CPD target and cycle saved";
    },
    saveCV: function(){
      S.cvUpdatedAt = new Date().toISOString().slice(0, 10);
      return "CV marked updated today";
    }
  };

  function runAction(name){
    var fn = ACTIONS[name];
    if (!fn) return;
    var beforeScore = scorePts(), beforeReady = readiness();
    var msg = fn();
    save();
    render();
    if (!msg) return;
    var dScore = scorePts() - beforeScore, dReady = readiness() - beforeReady;
    var bits = [];
    if (dScore) bits.push("shortlisting score <em>" + (dScore > 0 ? "+" : "") + dScore + "</em>");
    if (dReady) bits.push("readiness <em>" + (dReady > 0 ? "+" : "") + dReady + "%</em>");

    if (name !== "reset"){
      logActivity(msg,
        (dScore ? "Shortlisting score " + (dScore > 0 ? "+" : "") + dScore : "") +
        (dScore && dReady ? ", " : "") +
        (dReady ? "readiness " + (dReady > 0 ? "+" : "") + dReady + "%" : ""));
      render();
    }
    toast(esc(msg) + (bits.length ? ". " + bits.join(", ") : "."));
  }

  document.addEventListener("click", function(ev){
    var act = ev.target.closest("[data-act]");
    if (act){ ev.preventDefault(); runAction(act.getAttribute("data-act")); return; }

    var tog = ev.target.closest("[data-toggle]");
    if (tog){
      ev.preventDefault();
      var id = tog.getAttribute("data-toggle");
      S.deadlinesDone[id] = !S.deadlinesDone[id];
      save(); render();
      toast(S.deadlinesDone[id] ? "Marked done." : "Marked not done.");
      return;
    }

    /* ladder rungs. Marking a stage done, or recording an application and what
       came of it. Per-rung identity means these cannot go through ACTIONS. */
    /* "track this too" writes to otherTargets, which is the same list the
       dual-track comparison on this page reads. Exploring a specialty and
       tracking one are then the same act rather than two features. */
    var addT = ev.target.closest("[data-addtarget]");
    if (addT){
      ev.preventDefault();
      var tn = addT.getAttribute("data-addtarget");
      S.otherTargets = S.otherTargets || [];
      if (S.otherTargets.indexOf(tn) === -1 && tn !== S.specialty){
        S.otherTargets.push(tn);
        S.dualTrack = "multi";
        logActivity("Added " + tn + " as a second target", "From Plan B");
        save(); render();
        toast("Now tracking <em>" + esc(tn) + "</em> alongside " + esc(S.specialty) + ".");
      }
      return;
    }

    var rung = ev.target.closest("[data-rung]");
    if (rung){
      ev.preventDefault();
      var rc = rung.getAttribute("data-rung"), rv = rung.getAttribute("data-rungval") || "";
      var today = new Date().toISOString().slice(0, 10);
      S.stagesDone = S.stagesDone || {};
      S.applications = S.applications || [];
      var m;

      if ((m = /^done:(.+)$/.exec(rc))){
        S.stagesDone[m[1]] = today;
        logActivity(({internship:"Internship", bst:"Basic specialist training", cscst:"CSCST"}[m[1]] || m[1]) + " marked complete", "");
        save(); render(); toast("Marked complete."); return;
      }
      if ((m = /^undo:(.+)$/.exec(rc))){
        delete S.stagesDone[m[1]];
        save(); render(); toast("Unmarked."); return;
      }
      if (rc === "exam"){
        if (S.examStages < 3) S.examStages += 1;
        var ex = situation().exam;
        logActivity(S.examStages >= 3 ? "Full " + ex + " membership recorded"
                                      : ex + " stage recorded, " + S.examStages + " of 3", "");
        save(); render(); toast(S.examStages + " of 3 stages held."); return;
      }
      if (rc === "apply"){
        S.applications.unshift({target:rv, cycle:cycleLabel(), appliedAt:today, outcome:"", outcomeAt:""});
        logActivity("Applied to " + rv, cycleLabel() + " cycle");
        save(); render(); toast("Recorded as applied."); return;
      }
      if ((m = /^outcome:(.+)$/.exec(rc))){
        var app = applicationFor(rv);
        if (app){
          app.outcome = m[1];
          app.outcomeAt = today;
          logActivity(rv + ": " + OUTCOMES[m[1]].label, cycleLabel() + " cycle");
        }
        save(); render(); toast(app ? OUTCOMES[m[1]].label + " recorded." : "Nothing to record."); return;
      }
      if (rc === "planb"){
        S.planB = rv; save(); render();
        /* the panel renders below the ladder, which can be off-screen on a
           phone, so a control that appeared to do nothing would be the bug */
        var el = document.getElementById("planb");
        if (el) el.scrollIntoView({behavior: reduced ? "auto" : "smooth", block:"center"});
        return;
      }
      if (rc === "planb-close"){ S.planB = ""; save(); render(); return; }
      /* the Plan B gate. Same store as the rung's own outcome buttons: a
         doctor must never be able to answer this twice and get two answers.
         appliedAt stays empty when no application was logged, and is never
         rendered once an outcome exists. */
      if ((m = /^answer:(.+)$/.exec(rc))){
        var ans = applicationFor(rv);
        if (!ans){
          ans = {target:rv, cycle:cycleLabel(), appliedAt:"", outcome:"", outcomeAt:""};
          S.applications.unshift(ans);
        }
        ans.outcome = m[1];
        ans.outcomeAt = today;
        logActivity(rv + ": " + OUTCOMES[m[1]].label, cycleLabel() + " cycle");
        save(); render(); toast(OUTCOMES[m[1]].label + " recorded."); return;
      }
      if (rc === "reanswer"){
        var re = applicationFor(rv);
        if (re){ re.outcome = ""; re.outcomeAt = ""; }
        save(); render(); toast("Answer cleared."); return;
      }
      if (rc === "unapply"){
        var cy = cycleLabel();
        S.applications = S.applications.filter(function(a){ return !(a.target === rv && a.cycle === cy); });
        save(); render(); toast("Application record removed."); return;
      }
      return;
    }

    /* the annual roll-forward. Its buttons carry the branch or the commit
       directly, because each answer decides which question comes next and
       ACTIONS has no way to take an argument. */
    var roll = ev.target.closest("[data-roll]");
    if (roll){
      ev.preventDefault();
      var cmd = roll.getAttribute("data-roll"), val = roll.getAttribute("data-rollval") || "";
      var yr = new Date().getFullYear(), note = "";

      if (cmd.indexOf("go:") === 0){ S.rollStep = cmd.slice(3); save(); render(); return; }

      if (cmd === "rollCancel"){ S.rollStep = ""; save(); render(); toast("Asked again next time."); return; }
      if (cmd === "rollDone"){ note = "Confirmed record unchanged"; }
      if (cmd === "rollAdvance"){
        var rt = routeTiming();
        S.schemeYear = Math.min(rt.stageYears, (S.schemeYear || rt.stageYear) + 1);
        S.inScheme = true;
        note = "Moved up to year " + S.schemeYear + (S.schemeName ? " of " + S.schemeName : "");
      }
      if (cmd === "rollLeft"){
        S.inScheme = false; S.schemeName = ""; S.schemeYear = 0;
        note = "Left the training scheme";
      }
      if (cmd === "rollJoinTarget"){
        S.inScheme = true; S.schemeName = situation().target; S.schemeYear = 1; S.roleTitle = "";
        note = "Started " + S.schemeName;
      }
      if (cmd === "rollJoinOther"){
        S.inScheme = true; S.schemeName = val || "a training scheme"; S.schemeYear = 1; S.roleTitle = "";
        note = "Started " + S.schemeName;
      }
      if (cmd === "rollRole"){
        S.inScheme = false; S.schemeName = ""; S.schemeYear = 0; S.roleTitle = val;
        note = "Working as " + (val === "Other" ? "a non-training post" : val) + ", not in a scheme";
      }
      /* every turnover is recorded, including the ones where nothing happened,
         because "no place this year" is the fact the ladder needs most */
      S.rollHistory = S.rollHistory || [];
      S.rollHistory.unshift({ year: yr, note: note, at: new Date().toISOString().slice(0, 10) });
      S.rollHistory = S.rollHistory.slice(0, 12);
      S.lastRolledAt = new Date().toISOString().slice(0, 10);
      S.rollStep = "";
      logActivity(note, "Annual update for " + yr);
      save(); render();
      toast(esc(note) + ".");
      return;
    }

    var rmRot = ev.target.closest("[data-remove-rotation]");
    if (rmRot){
      ev.preventDefault();
      var ri = parseInt(rmRot.getAttribute("data-remove-rotation"), 10);
      (S.rotations || []).splice(ri, 1);
      save(); render();
      toast("Rotation removed.");
      return;
    }

    /* custom milestone: swap the button for an inline field rather than a
       browser prompt, which some embedded contexts block outright */
    var add = ev.target.closest('[data-act="addMilestone"]');
    if (add){ ev.preventDefault(); }
  });

  /* the add-milestone control is wired separately so it can replace itself */
  document.addEventListener("click", function(ev){
    var btn = ev.target.closest('button[data-act="addMilestone"]');
    if (!btn) return;
    var wrap = document.createElement("span");
    wrap.style.cssText = "display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap";
    wrap.innerHTML = '<input id="newMs" placeholder="Milestone name" style="border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;min-width:200px">' +
      '<button class="btn btn-sm btn-primary" id="newMsAdd">Add</button>' +
      '<button class="btn btn-sm btn-ghost" id="newMsCancel">Cancel</button>';
    btn.replaceWith(wrap);
    var input = document.getElementById("newMs");
    input.focus();
    function commit(){
      var val = input.value.trim();
      if (!val){ render(); return; }
      S.customMilestones = S.customMilestones || [];
      S.customMilestones.push(val.slice(0, 80));
      save(); render();
      toast("Milestone added.");
    }
    document.getElementById("newMsAdd").addEventListener("click", commit);
    document.getElementById("newMsCancel").addEventListener("click", function(){ render(); });
    input.addEventListener("keydown", function(e){ if (e.key === "Enter") commit(); });
  }, true);

  /* add-rotation wired the same way, four fields instead of one */
  document.addEventListener("click", function(ev){
    var btn = ev.target.closest('button[data-act="addRotation"]');
    if (!btn) return;
    var wrap = document.createElement("div");
    wrap.style.cssText = "display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-top:8px";
    var fld = "border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px";
    wrap.innerHTML =
      '<input id="rotHosp" placeholder="Hospital" style="' + fld + ';min-width:160px">' +
      '<input id="rotSpec" placeholder="Specialty" style="' + fld + ';min-width:140px">' +
      '<input id="rotFrom" type="date" style="' + fld + '">' +
      '<input id="rotTo" type="date" style="' + fld + '">' +
      '<button class="btn btn-sm btn-primary" id="rotAdd">Add</button>' +
      '<button class="btn btn-sm btn-ghost" id="rotCancel">Cancel</button>';
    btn.replaceWith(wrap);
    document.getElementById("rotHosp").focus();
    function commit(){
      var hosp = document.getElementById("rotHosp").value.trim();
      if (!hosp){ render(); return; }
      S.rotations = S.rotations || [];
      S.rotations.unshift({
        hospital: hosp.slice(0, 80),
        specialty: document.getElementById("rotSpec").value.trim().slice(0, 60),
        from: document.getElementById("rotFrom").value,
        to: document.getElementById("rotTo").value
      });
      save(); render();
      toast("Rotation added.");
    }
    document.getElementById("rotAdd").addEventListener("click", commit);
    document.getElementById("rotCancel").addEventListener("click", function(){ render(); });
  }, true);

  document.getElementById("resetBtn").addEventListener("click", function(){ runAction("reset"); });
  document.getElementById("signOut").addEventListener("click", function(){
    toast("Sign out is not wired up in this demo.");
  });

  render();
})();
</script>
</body>
