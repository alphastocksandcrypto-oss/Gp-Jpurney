  /* ================= APPLICATION TRACKER =================
     Was the Progress tracker, whose milestones became the roadmap ladder and
     whose portfolio items became Gap analysis. What was left was a page of
     other pages' content.

     It answers a question nothing else did: am I actually able to apply. The
     Gap analysis page scores a portfolio; this one tracks the paperwork, and
     they fail differently. A weak portfolio scores badly. A missing Garda
     vetting stops the application dead however good the portfolio is. */
  /* ================= APPLICATION TRACKER =================
     Was the Progress tracker, whose milestones became the roadmap ladder and
     whose portfolio items became Gap analysis.

     It answers a question nothing else does: am I actually able to apply, and
     what happens after I do. Gap analysis scores a portfolio; this tracks the
     paperwork and the calendar, and they fail differently. A weak portfolio
     scores badly. A missing Garda vetting delays a start date.

     Two rules. Nothing is asked for twice: wherever the record knows the
     answer the item derives it. And nothing sends the doctor away to do a
     thing they could do here: an item that can be acted on carries the action,
     with the fuller page as a second option rather than the only one. */
  VIEWS.progress = {
    title:"Application tracker", sub:"Every stage of the application, and what each one needs from you.",
    render:function(){
      var sit = situation();
      var targets = [S.specialty].concat(S.otherTargets || []).filter(function(t, i, a){
        return t && a.indexOf(t) === i;
      });

      if (!sit.stillApplying || !targets.length){
        return '<div class="card"><div class="card-head"><h2>No application open</h2></div><p class="lede">' +
          (sit.isConsultant
            ? "You have reached consultant, so there is no training application to track. Your record stays here."
            : "Set a specialty on your profile and this page tracks what that application needs, stage by stage.") + "</p>" +
          (sit.isConsultant ? "" : '<div style="margin-top:12px"><a class="btn btn-sm btn-primary" href="#/profile">Edit profile</a></div>') +
          "</div>" + '<p class="sec-label">Recent activity</p>' + activityCard();
      }

      /* which application, and which stage of it. Both stick, so a doctor who
         came back to chase a reference is not returned to the top each time. */
      var target = trackTarget();
      var cyc = cycleForTarget(target);
      var phase = PHASES.filter(function(x){ return x.id === S.trackPhase; })[0]
        ? S.trackPhase : currentPhase(cyc);
      var ph = PHASES.filter(function(x){ return x.id === phase; })[0];
      var info = SPECIALTY_INFO[target] || {};
      var primary = target === S.specialty;
      var body = (primary ? sit.college : info.body) || sit.college;
      var app = applicationFor(target);
      var overall = checkProgress(target);

      var h = "";

      /* ---- which application ---- */
      if (targets.length > 1){
        h += '<div class="switch" role="tablist" aria-label="Application">' + targets.map(function(t){
          var i2 = SPECIALTY_INFO[t] || {}, pr = checkProgress(t);
          return '<button class="sw' + (t === target ? " on" : "") + '" role="tab" aria-selected="' +
            (t === target ? "true" : "false") + '" data-track-target="' + esc(t) + '">' +
            "<b>" + esc(i2.target || t) + "</b><span>" + (i2.body || body) + " · " + pr.done + " of " + pr.total + "</span></button>";
        }).join("") + "</div>";
      }

      /* ---- the four phases ---- */
      h += '<div class="phases" role="tablist" aria-label="Stage">' + PHASES.map(function(x){
        var st = phaseState(x.id, cyc), pr = phaseProgress(x.id, target);
        return '<button class="ph ' + st + (x.id === phase ? " on" : "") + '" role="tab" aria-selected="' +
          (x.id === phase ? "true" : "false") + '" data-track-phase="' + x.id + '">' +
          '<span class="ph-n">' + x.n + "</span>" +
          '<span class="ph-t">' + esc(x.t) + "</span>" +
          '<span class="ph-p">' + (pr.total ? pr.done + "/" + pr.total : "—") +
          (st === "now" ? " · now" : st === "past" ? " · passed" : "") + "</span></button>";
      }).join("") + "</div>";

      /* ---- the phase itself ---- */
      var pst = phaseState(phase, cyc), pr = phaseProgress(phase, target);
      h += '<div class="card lead" style="margin-top:14px"><div class="card-head">' +
        '<h2>' + esc(ph.t) + "</h2>" +
        '<span class="r" style="margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap">' +
        (app && app.outcome ? '<span class="chip ' + OUTCOMES[app.outcome].k + '">' + esc(OUTCOMES[app.outcome].label) + "</span>" : "") +
        chip(pst === "now" ? {k:"good", icon:I.target, label:"You are here"}
           : pst === "past" ? {k:"mute", icon:I.tick, label:"Passed"}
           : {k:"mute", icon:I.clock, label:"Ahead"}) + "</span></div>";
      h += '<p class="ph-when">' + esc(phaseLabel(phase, cyc)) + "</p>";
      h += '<p class="lede" style="max-width:68ch;margin-bottom:14px">' + esc(ph.blurb) + "</p>";

      var ms = phaseMilestones(phase, cyc, target);
      if (ms.length){
        h += '<p class="group-h">Key dates</p>';
        h += ms.map(function(d){
          var dd = d.days === undefined ? until(d.iso) : d.days;
          return '<div class="ms"><span class="ms-d"><b>' + fmtLong(d.iso) + "</b><small>" + esc(d.t) + "</small></span>" +
            '<span class="ms-r">' + chip(d.done ? {k:"good", icon:I.tick, label:"Done"}
              : {k: dd < 0 ? "mute" : dd <= 21 ? "crit" : dd <= 60 ? "warn" : "mute",
                 icon:I.clock, label: dd < 0 ? "Passed" : awayText(dd)}) + "</span></div>";
        }).join("");
      }

      h += '<div class="barrow" style="margin:16px 0 6px">' +
        '<span class="lbl">' + pr.done + " of " + pr.total + " ready for this stage</span>" +
        '<span class="val num">' + pr.pct + "%</span>" + bar(pr.pct) +
        '<span class="note">' + overall.done + " of " + overall.total + " across the whole application, for " +
        esc(info.target || target) + " via " + esc(body) + "." +
        /* the rows below suppress a deadline chip when the closing date is the
           only date governing them, so the card has to say that once */
        (cyc && until(cyc.apply) >= 0
          ? " Everything here has to be in place by " + fmtLong(cyc.apply) + ", when applications close, " +
            "unless it carries a date of its own."
          : "") + "</span></div>";

      /* grouped, because eligibility failing is a different kind of problem to
         a reference not being back yet */
      var list = checksFor().filter(function(c){ return c.p === phase; }), groups = [];
      list.forEach(function(c){ if (groups.indexOf(c.g) === -1) groups.push(c.g); });
      if (!list.length){
        h += '<p class="empty">Nothing to prepare for this stage yet.</p>';
      }
      groups.forEach(function(g){
        var items = list.filter(function(c){ return c.g === g; });
        var gdone = items.filter(function(c){ return checkState(c, target).done; }).length;
        h += '<p class="group-h">' + esc(g) + ' <span class="g-count">' + gdone + " of " + items.length + "</span></p>";
        h += items.map(function(c){ return checkRow(c, target); }).join("");
      });
      h += "</div>";

      if (targets.length > 1){
        h += ctxFoot("Requirements marked shared are one fact about you and count for every application: one CV, " +
          "one Garda vetting. The rest belong to the application they sit under, because references and a " +
          "submitted form are not shared between two.");
      }

      h += '<div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center">' +
        '<button class="btn btn-sm btn-ghost" data-act="addMilestone">Add your own requirement</button>' +
        '<button class="btn btn-sm btn-ghost" data-act="printReport">Print this stage</button></div>';

      h += '<p class="sec-label">Recent activity</p>' + activityCard();
      h += ctxFoot("These requirements are the shape an Irish training application takes, not any college's " +
        "published list, and the stage dates follow the same illustrative cycle as the rest of the dashboard. " +
        esc(body || "Each college") + " sets what actually applies, and that list is the one that counts.");
      return h;
    }
  };

  function checkRow(c, target){
    var st = checkState(c, target), due = checkDue(c);
    var dd = due ? until(due.iso) : null;
    var h = '<div class="chk' + (st.done ? " done" : "") + '">' +
      (st.auto
        /* derived: not a control, because ticking it here would mean entering
           the same fact twice */
        ? '<span class="chk-box auto' + (st.done ? " on" : "") + '" aria-hidden="true">' +
          (st.done ? ico(I.tick, 12) : ico(I.clock, 11)) + "</span>"
        : '<button class="chk-box' + (st.done ? " on" : "") + '" data-check="' + esc(c.id) +
          '" data-check-target="' + esc(target) + '" aria-pressed="' + (st.done ? "true" : "false") +
          '"><span class="sr-only">' + (st.done ? "Mark not ready: " : "Mark ready: ") + esc(c.t) + "</span>" +
          (st.done ? ico(I.tick, 12) : "") + "</button>");

    h += '<div class="chk-b"><b>' + esc(c.t) + "</b>" +
      (c.shared ? '<span class="chip mute sm">Shared</span>' : "") +
      (st.auto ? '<span class="chip mute sm">From your record</span>' : "") +
      (c.d ? "<small>" + esc(c.d) + "</small>" : "") +
      (st.note ? '<small class="chk-note">' + esc(st.note) + "</small>" : "") +
      /* the action lives with the requirement. Sending a doctor to another
         page to tick something they are looking at is the whole complaint. */
      (!st.done && (c.act || c.fix)
        ? '<span class="chk-a">' +
          (c.act ? '<button class="btn btn-sm btn-primary" data-act="' + esc(c.act[0]) + '">' + esc(c.act[1]) + "</button>" : "") +
          (c.fix ? '<a class="btn btn-sm btn-ghost" href="' + c.fix[0] + '">' + esc(c.fix[1]) + "</a>" : "") +
          "</span>" : "") +
      "</div>";

    h += '<div class="chk-r">' +
      (!st.done && due && !due.governing && dd !== null && dd >= 0
        ? chip({k: dd <= 21 ? "crit" : dd <= 60 ? "warn" : "mute", icon:I.clock,
                label:due.why + ", " + awayText(dd)}) : "") +
      (c.custom ? '<button class="btn-link" data-check-remove="' + esc(c.id) + '">Remove</button>' : "") +
      "</div></div>";
    return h;
  }

  }

     revises for "MRCPI" — they revise for Part 1, sit it, and then start on
     something with a different format and a different syllabus. So a stage is
     what the catalogue lists, what gets recommended, and what has a hub.

     examParts() below assumed every family was three parts shaped Part 1 /
     Part 2 written / clinical. That is not what ICGP runs, and it is not what
     several of these run either, which is why a GP applicant was being shown
     an MRCPI-shaped exam they will never sit.

     WHEN matters as much as the name. An applicant to GP training sits the
     SJT and CPST to get in; MICGP is the membership exam they sit years later
     inside training. Listing both without saying which is which is how a
     doctor ends up preparing for the wrong one.

     they change. Confirmed structures replace these before launch. */

     fmt:"Clinical, OSCE", d:"Structured clinical stations."},
    /* paediatrics and obstetrics, on the RCPI faculties */
    {id:"mrcpch-1",  fam:"MRCPI Paediatrics", body:"RCPI", stage:"Part 1", when:"entry",
     fmt:"Written", d:"Basic and applied sciences in paediatrics."},
    {id:"mrcpch-2",  fam:"MRCPI Paediatrics", body:"RCPI", stage:"Part 2", when:"membership",
     fmt:"Written and clinical", d:"Applied knowledge and examined cases."},
    {id:"mrcog-1",   fam:"MRCPI O and G", body:"RCPI", stage:"Part 1", when:"entry",
     fmt:"Written", d:"Basic sciences for obstetrics and gynaecology."},
    {id:"mrcog-2",   fam:"MRCPI O and G", body:"RCPI", stage:"Part 2", when:"membership",
     fmt:"Written and clinical", d:"Applied knowledge and examined cases."},
    /* the language requirement, which is an exam a great many IMGs sit and
       which no part of this product acknowledged */
    {id:"ielts",     fam:"English language", body:"Medical Council", stage:"IELTS or OET", when:"entry",
     fmt:"Four papers", d:"Where your primary qualification was not taught in English. The accepted tests and scores are the Council's.",
     imgOnly:true}
  ];

  function examById(id){ return EXAMS.filter(function(e){ return e.id === id; })[0] || null; }
  function examsInFamily(fam){ return EXAMS.filter(function(e){ return e.fam === fam; }); }

  /* which family a given route actually needs to ENTER training. General
     practice is the case that makes this necessary: SPECIALTY_INFO says MICGP,
     which is the exam sat years into the scheme, not the one that gets you on
     it. */
  function entryFamilyFor(specialty){
    var info = SPECIALTY_INFO[specialty] || {};
    if (info.body === "ICGP") return "ICGP entry";
    return info.exam || "";
  }

  /* a stage is held when the doctor says so. The legacy counter seeded from
     onboarding still counts for the primary route's family, so nobody loses
     progress they already recorded. */
  function stageHeld(id){
    var rec = (S.examStageDone || {})[id];
    if (rec) return rec;
    var e = examById(id);
    if (!e) return null;
    var primary = entryFamilyFor(S.specialty);
    if (e.fam !== primary) return null;
    var fam = examsInFamily(primary), idx = fam.indexOf(e);
    return (idx > -1 && idx < (S.examStages || 0)) ? "seeded" : null;
  }
  function stagesHeldIn(fam){
    return examsInFamily(fam).filter(function(e){ return stageHeld(e.id); }).length;
  }
  /* the count for the route being looked at, which is what every scoring and
     eligibility check in the app actually meant when it read S.examStages */
  function stagesHeld(specialty){
    var fam = entryFamilyFor(specialty || S.specialty);
    return fam ? stagesHeldIn(fam) : 0;
  }
  function stagesTotal(specialty){
    var fam = entryFamilyFor(specialty || S.specialty);
    return fam ? Math.max(1, examsInFamily(fam).length) : 3;
  }

  /* what to recommend, derived from the record rather than chosen by us: the
     first stage they do not hold in the family their route needs, plus the
     same for any second route they are tracking. */
  function recommendedExams(){
    var out = [], sit = situation();
    var fams = [entryFamilyFor(S.specialty)].concat((S.otherTargets || []).map(entryFamilyFor));
    fams.filter(function(f, i, a){ return f && a.indexOf(f) === i; }).forEach(function(f){
      var next = examsInFamily(f).filter(function(e){ return !stageHeld(e.id); })[0];
      if (next) out.push({exam:next, why:"Your route needs " + f + ", and this is the next stage you do not hold."});
    });
    if (sit.isIMG || sit.newToIreland){
      var lang = examById("ielts");
      if (lang && !stageHeld("ielts")){
        out.push({exam:lang, why:"Commonly required where a primary qualification was not taught in English."});
      }
    }
    return out;
  }

  /* ================= EXAM PREP =================
     Two levels, because a doctor arrives with one of two questions.

     "What should I be sitting?" is answered by a catalogue: what your route
     needs next, then everything else, browsable. Someone who came to MedNav
     only for exams and never finished onboarding still gets a usable list.

     "Get me ready for MRCPI Part 1" is answered by a hub: a plan, the
     material, practice, a mock, and what the mock says. The hub belongs to the
     STAGE, because Part 1 and Part 2 Clinical share a family and nothing else:
     different format, different syllabus, and one of them cannot be prepared
     for with a question bank at all. */
  var GYM = [
    {id:"plan",  t:"Study planner",  ic:I.cal,   d:"Weeks to the sitting, and what this week is for",
     feeds:"Sets the pace the rest is measured against"},
    {id:"kb",    t:"Knowledge base", ic:I.book,  d:"The topics this stage covers, and what you have been through",
     feeds:"Coverage feeds your predicted result"},
    {id:"qbank", t:"Question bank",  ic:I.list,  d:"Practice by topic, with explanations",
     feeds:"Accuracy by topic feeds Analytics"},
    {id:"mock",  t:"Mock exam",      ic:I.clip,  d:"A full sitting under timed conditions",
     feeds:"Your score moves the predicted result"},
    {id:"stats", t:"Analytics",      ic:I.chart, d:"Where you are losing marks",
     feeds:"Reads your mocks and your coverage"},
    {id:"tutor", t:"Live tutor",     ic:I.mic,   d:"Sessions with someone who has sat this stage",
     feeds:"Attendance is logged to your record"}
  ];
  /* a clinical or OSCE stage is not prepared for with a question bank, and
     offering one is the fastest way to look like we have never sat it */
  function gymFor(e){
    var clinical = /Clinical|OSCE/i.test(e.fmt || "");
    return GYM.filter(function(g){ return !(clinical && g.id === "qbank"); });
  }

  function examActive(id){ return (S.examActive || []).indexOf(id) > -1; }
  function mocksFor(id){ return (S.mocks || {})[id] || []; }
  function topicsFor(id){ return (S.topicsDone || {})[id] || {}; }
  function predictedFor(id){
    var m = mocksFor(id);
    if (!m.length) return null;
    var r = m.slice(-3);
    return Math.round(r.reduce(function(a, x){ return a + x.pct; }, 0) / r.length);
  }
  function trendFor(id){
    var m = mocksFor(id);
    if (m.length < 2) return null;
    return {from:m[0].pct, to:m[m.length - 1].pct, delta:m[m.length - 1].pct - m[0].pct,
            points:m.map(function(x){ return x.pct; })};
  }
  /* weeks to the sitting. We hold a closing date, not a sitting timetable, so
     an entry-stage exam is paced against the application that asks for it and
     anything else says plainly that it has no date. */
  function weeksTo(e){
    var c = situation().cycle;
    if (!c || e.when !== "entry") return null;
    var d = until(c.apply);
    return d < 0 ? null : Math.max(0, Math.round(d / 7));
  }
  var TOPICS = ["Cardiology", "Respiratory", "Gastroenterology", "Nephrology",
                "Endocrinology", "Neurology", "Haematology", "Infectious disease"];

  VIEWS.exams = {
    title:"Exam prep", sub:"Every stage you could sit, and a hub for each one you are working on.",
    render:function(){
      var open = S.examOpen ? examById(S.examOpen) : null;
      return open ? examHub(open) : examCatalogue();
    }
  };

  function examCatalogue(){
    var sit = situation(), rec = recommendedExams();
    var h = "";

    /* what your record says you should be sitting. The gap the product owner
       named: onboarding collects everything needed to work this out and
       nothing ever told the doctor. */
    if (rec.length){
      h += '<p class="sec-label">Recommended for you</p>';
      h += rec.map(function(r){ return examCard(r.exam, r.why, true); }).join("");
    } else if (!S.specialty){
      h += ctx("No specialty set, so nothing is recommended yet. Everything below is still open to browse, " +
        "and setting a target on your profile turns this into a shortlist.");
    }

    var active = (S.examActive || []).map(examById).filter(Boolean)
      .filter(function(e){ return !rec.some(function(r){ return r.exam.id === e.id; }); });
    if (active.length){
      h += '<p class="sec-label">You are preparing for</p>';
      h += active.map(function(e){ return examCard(e, "", false); }).join("");
    }

    /* everything else, grouped by body, because a doctor browsing is asking
       "what does this college run" rather than scanning one flat list */
    h += '<p class="sec-label">All exams</p>';
    var bodies = [];
    EXAMS.forEach(function(e){ if (bodies.indexOf(e.body) === -1) bodies.push(e.body); });
    bodies.forEach(function(bd){
      var items = EXAMS.filter(function(e){ return e.body === bd; });
      h += '<p class="group-h">' + esc(bd) + "</p>";
      h += '<div class="card" style="padding:6px 18px">' + items.map(function(e){
        var held = stageHeld(e.id);
        return '<div class="row"><span class="t">' + esc(e.fam + " " + e.stage) +
          "<small>" + esc(e.fmt) + " · " + esc(WHEN_LABEL[e.when]) + "</small></span>" +
          '<span class="r">' + (held ? '<span class="chip good">' + ico(I.tick, 12) + "Held</span>" : "") +
          (examActive(e.id) ? '<span class="chip mute">Preparing</span>' : "") +
          '<button class="btn btn-sm btn-ghost" data-exam-open="' + e.id + '">Open</button></span></div>';
      }).join("") + "</div>";
    });

    h += ctxFoot("Stage names, formats and structures are illustrative in this prototype and are each college's " +
      "to set. Confirm the current structure with the college before planning around it.");
    return h;
  }

  var WHEN_LABEL = {entry:"Usually needed to apply", membership:"Sat during training", exit:"Sat to complete training"};

  function examCard(e, why, recommended){
    var held = stageHeld(e.id), wk = weeksTo(e), pred = predictedFor(e.id);
    return '<div class="card' + (recommended ? " lead" : "") + '" style="margin-bottom:10px">' +
      '<div class="card-head"><h2>' + esc(e.fam + " " + e.stage) + "</h2>" +
      '<span class="r" style="margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap">' +
      (held ? '<span class="chip good">' + ico(I.tick, 12) + "Held</span>" : "") +
      (pred !== null ? '<span class="chip mute">' + pred + "% predicted</span>" : "") +
      (wk !== null ? chip({k: wk <= 4 ? "crit" : wk <= 10 ? "warn" : "mute", icon:I.clock,
                           label:wk + (wk === 1 ? " week" : " weeks")}) : "") + "</span></div>" +
      '<p class="lede" style="max-width:64ch">' + (why ? "<b>" + esc(why) + "</b><br>" : "") +
      esc(e.d) + "</p>" +
      '<div style="margin-top:13px;display:flex;gap:8px;flex-wrap:wrap">' +
      '<button class="btn btn-sm btn-primary" data-exam-open="' + e.id + '">' +
      (examActive(e.id) ? "Open the hub" : "Start preparing") + "</button>" +
      (held ? "" : '<button class="btn btn-sm btn-ghost" data-exam-held="' + e.id + '">Mark as held</button>') +
      "</div></div>";
  }

  function examHub(e){
    var surface = S.gymSurface || "";
    var list = gymFor(e), g = list.filter(function(x){ return x.id === surface; })[0];
    var wk = weeksTo(e), pred = predictedFor(e.id), held = stageHeld(e.id);

    var h = '<button class="btn btn-sm btn-ghost" data-exam-open="" style="margin-bottom:12px">' +
      ico(I.arrow, 13) + "All exams</button>";

    h += '<div class="gym-h"><div class="gym-id"><span class="gym-k">' + esc(e.body) + "</span>" +
      "<h2>" + esc(e.fam + " " + e.stage) + "</h2>" +
      "<p>" + esc(e.fmt) + ". " + (wk === null
        ? "No sitting dated for this stage in your record."
        : wk + (wk === 1 ? " week" : " weeks") + " until the application that asks for it closes.") + "</p></div>";
    h += '<div class="gym-stat"><span class="k">Predicted</span><b>' + (pred === null ? "—" : pred + "%") + "</b>" +
      "<small>" + (pred === null ? "Sit a mock to start" : "Mean of your last " + Math.min(3, mocksFor(e.id).length)) + "</small></div>";
    h += '<div class="gym-stat"><span class="k">This stage</span><b>' + (held ? "Held" : "Open") + "</b>" +
      "<small>" + (held ? "Recorded on your ladder" : "Not yet passed") + "</small></div></div>";

    h += '<div class="gym-grid">' + list.map(function(x){
      return '<button class="gym-card' + (x.id === surface ? " on" : "") + '" data-gym="' + x.id + '">' +
        '<span class="gym-ic">' + ico(x.ic, 17) + "</span><b>" + esc(x.t) + "</b>" +
        '<span class="gd">' + esc(x.d) + "</span>" +
        '<span class="gf">' + ico(I.arrow, 11) + esc(x.feeds) + "</span></button>";
    }).join("") + "</div>";

    if (!g){
      h += ctx("This is the structure of the hub. The teaching text and the questions behind each surface are " +
        "written by doctors who have sat this stage and are never generated, so what is here is the shape they " +
        "go into.");
      return h;
    }
    h += '<p class="sec-label">' + esc(g.t) + "</p>" + gymSurface(g, e, wk);
    return h;
  }

  function gymSurface(g, e, wk){
    if (g.id === "plan"){
      if (wk === null){
        return '<div class="card"><p class="empty"><b>No date to plan against.</b>' +
          "This stage is sat during training rather than to enter it, so the plan starts when you book a sitting.</p></div>";
      }
      var blocks = [
        {w:"Weeks 1 to 2", t:"Cover the ground", d:"One pass of the knowledge base, flagging what you do not know rather than stopping to fix it"},
        {w:"Weeks 3 to 5", t:"Practice by topic", d:"Work the flagged topics in blocks, reading the explanations"},
        {w:"Week 6", t:"First mock", d:"Timed and full length, to find out where you actually are"},
        {w:"Weeks 7 to 8", t:"Close what the mock found", d:"Analytics ranks them. Work down, not across."},
        {w:"Final week", t:"Second mock, then taper", d:"Confirm the direction of travel and stop"}
      ];
      var h = '<div class="card"><div class="card-head"><h2>' + wk + (wk === 1 ? " week" : " weeks") + " to go</h2>" +
        '<span class="aside">Six to eight weeks is the working minimum</span></div>';
      h += blocks.map(function(b){
        return '<div class="row"><span class="t">' + esc(b.t) + "<small>" + esc(b.d) + "</small></span>" +
          '<span class="r"><span class="chip mute">' + esc(b.w) + "</span></span></div>";
      }).join("");
      return h + ctxFoot("The shape of the plan is ours. The weeks come from your own cycle dates, which are " +
        "illustrative in this prototype.") + "</div>";
    }

    if (g.id === "kb" || g.id === "qbank"){
      var done = topicsFor(e.id), n = TOPICS.filter(function(t){ return done[t]; }).length;
      var h2 = '<div class="card"><div class="card-head"><h2>' + n + " of " + TOPICS.length + " topics covered</h2>" +
        '<span class="aside">' + esc(e.fam + " " + e.stage) + "</span></div>" + bar(Math.round(n / TOPICS.length * 100));
      h2 += '<div class="picks" style="margin-top:14px">' + TOPICS.map(function(t){
        return '<span class="pick">' + esc(t) + (done[t]
          ? '<span class="chip good">' + ico(I.tick, 12) + "Covered</span>"
          : '<button class="btn btn-sm btn-ghost" data-topic="' + esc(t) + '">Mark covered</button>') + "</span>";
      }).join("") + "</div>";
      return h2 + ctx("The topic list is illustrative and is not this stage's syllabus. The teaching text and the " +
        "questions behind each topic are authored by doctors who have sat it and are not generated, which is why " +
        "this shows the structure rather than pretending to hold the content.", true) + "</div>";
    }

    if (g.id === "mock"){
      var ms = mocksFor(e.id);
      var h3 = '<div class="card"><div class="card-head"><h2>Record a mock result</h2>' +
        '<span class="aside">' + ms.length + " recorded for this stage</span></div>" +
        '<p class="lede" style="max-width:64ch;margin-bottom:14px">Sit it timed and full length, then enter what you ' +
        "scored. It moves the predicted result for this stage and nothing else on your record: a mock is not a stage held.</p>" +
        '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">' +
        '<input id="mockPct" type="number" min="0" max="100" placeholder="Score %" ' +
        'style="border:1.5px solid var(--line);border-radius:11px;padding:9px 13px;font-size:13.5px;width:118px">' +
        '<button class="btn btn-sm btn-primary" data-act="logMock">Record it</button></div>';
      if (ms.length){
        h3 += '<p class="group-h">Your mocks</p>' + ms.slice().reverse().map(function(m){
          return '<div class="row"><span class="t">' + m.pct + "%<small>" + fmtLong(m.at) + "</small></span>" +
            '<span class="r"><span class="chip ' + (m.pct >= 70 ? "good" : m.pct >= 50 ? "warn" : "crit") + '">' +
            (m.pct >= 70 ? "Comfortable" : m.pct >= 50 ? "Borderline" : "Behind") + "</span></span></div>";
        }).join("");
      }
      return h3 + "</div>";
    }

    if (g.id === "stats"){
      var tr = trendFor(e.id), pr = predictedFor(e.id);
      var h4 = '<div class="card"><div class="card-head"><h2>' + (pr === null ? "Nothing to read yet" : pr + "% predicted") + "</h2>" +
        (tr ? '<span class="aside">' + (tr.delta >= 0 ? "up " : "down ") + Math.abs(tr.delta) + " across " +
          mocksFor(e.id).length + " mocks</span>" : "") + "</div>";
      if (pr === null){
        h4 += '<p class="empty">Record a mock and this reads it back: your trend, and what your coverage says.</p>';
      } else {
        h4 += '<p class="trend' + (tr && tr.delta > 0 ? " up" : tr && tr.delta < 0 ? " down" : "") + '">' +
          (tr ? spark(tr.points, 80, 24) : "") + "<span>" +
          (tr ? "From " + tr.from + "% to " + tr.to + "%" : "One mock recorded, so no trend yet") + "</span></p>";
        var cov = Object.keys(topicsFor(e.id)).length;
        h4 += '<div class="barrow" style="margin-top:14px"><span class="lbl">Topics covered</span>' +
          '<span class="val num">' + cov + " of " + TOPICS.length + "</span>" +
          bar(Math.round(cov / TOPICS.length * 100)) +
          '<span class="note">Coverage and score together are what a prediction can honestly be built from.</span></div>';
      }
      return h4 + ctxFoot("Predicted is the mean of your last three mocks for this stage. It reads your own scores " +
        "back to you and is not a claim about what the college will award.") + "</div>";
    }

    return '<div class="card"><div class="card-head"><h2>Live tutor</h2>' +
      '<span class="chip mute">Not wired up in this prototype</span></div>' +
      '<p class="lede" style="max-width:64ch">Sessions with a doctor who has sat ' + esc(e.fam + " " + e.stage) +
      ". Availability, booking and payment are real product surfaces rather than things to mock up here, so this " +
      "one is named and left honest.</p></div>";
  }

  /* ================= INTERVIEW PREP =================
     Built the same shape as exam prep, because it is the same kind of thing:
     a catalogue of what you could be sitting, and a hub for each one you are.

     The unit is the interview for a PROGRAMME, not a generic "interview". An
     RCPI HST panel and the ICGP scenario assessment are different formats
     scored on different things, and a doctor tracking both is preparing twice.

     The surface that makes this worth having is "Your evidence". The interview
     scores the same domains the portfolio does, and this product already holds
     the portfolio. So when the panel asks about quality improvement it can
     name the audit the doctor logged, rather than leaving them to remember it
     under pressure. Nothing else in the market can do that, because nothing
     else holds both halves. */
  var IV_DOMAINS = [
    {id:"clinical",   t:"Clinical skills and knowledge", from:["clinical","exams"],
     d:"Judgement on real cases, and the knowledge behind it"},
    {id:"qi",         t:"Quality improvement", from:["auditqi"],
     d:"A project you ran, what changed, and what you would do differently"},
    {id:"comm",       t:"Communication and teaching", from:["teaching"],
     d:"Explaining to patients, families and colleagues"},
    {id:"appraisal",  t:"Research and critical appraisal", from:["research"],
     d:"Reading a paper properly and saying what it is worth"},
    {id:"teamwork",   t:"Teamwork and leadership", from:["leadership"],
     d:"Where you led, where you followed, and how you handled it going wrong"},
    {id:"self",       t:"Professionalism and self-awareness", from:[],
     d:"Insight, probity, and knowing your own limits"}
  ];

  /* one interview per college, keyed the way CYCLE is, so a doctor's active
     interviews derive from the routes they are already tracking */
  var INTERVIEWS = {
    "RCPI":                              {t:"HST selection interview", fmt:"Structured panel",
      d:"A panel scoring you against set domains, with your portfolio in front of them."},
    "RCSI":                              {t:"HST selection interview", fmt:"Structured panel",
      d:"A panel scoring you against set domains, with your portfolio in front of them."},
    "ICGP":                              {t:"Scenario-Based Competency Assessment", fmt:"Simulated stations",
      d:"Competency-based stations rather than a panel. Scored per station, on the same domains."},
    "College of Psychiatrists":          {t:"HST selection interview", fmt:"Structured panel",
      d:"A panel scoring you against set domains."},
    "College of Anaesthesiologists":     {t:"HST selection interview", fmt:"Structured panel",
      d:"A panel scoring you against set domains."},
    "Faculty of Radiologists":           {t:"HST selection interview", fmt:"Structured panel",
      d:"A panel scoring you against set domains."},
    "Faculty of Pathology":              {t:"HST selection interview", fmt:"Structured panel",
      d:"A panel scoring you against set domains."},
    "Faculty of Public Health Medicine": {t:"HST selection interview", fmt:"Structured panel",
      d:"A panel scoring you against set domains."}
  };

  function interviewFor(specialty){
    var info = SPECIALTY_INFO[specialty] || {};
    var body = (specialty === S.specialty ? situation().college : info.body) || info.body;
    var iv = INTERVIEWS[body];
    return iv ? {id:body, body:body, t:iv.t, fmt:iv.fmt, d:iv.d, target:info.target || specialty,
                 cycle: CYCLE[body] || null} : null;
  }
  function myInterviews(){
    var out = [], seen = [];
    [S.specialty].concat(S.otherTargets || []).forEach(function(sp){
      if (!sp) return;
      var iv = interviewFor(sp);
      if (iv && seen.indexOf(iv.id) === -1){ seen.push(iv.id); out.push(iv); }
    });
    return out;
  }
  /* every prep that exists, not only the ones a doctor's route implies. A
     product people browse has to show its shelf: someone switching specialty,
     or hedging late, needs to see what is there before they commit to it. */
  function allInterviews(){
    var mine = myInterviews(), mineIds = mine.map(function(x){ return x.id; });
    var rest = Object.keys(INTERVIEWS).filter(function(bd){ return mineIds.indexOf(bd) === -1; })
      .map(function(bd){
        var iv = INTERVIEWS[bd];
        return {id:bd, body:bd, t:iv.t, fmt:iv.fmt, d:iv.d, target:"", cycle:CYCLE[bd] || null};
      });
    return mine.concat(rest);
  }
  /* the doctor's own routes come with the account; anything else is taken on */
  function ivIncluded(id){ return myInterviews().some(function(x){ return x.id === id; }); }
  function ivHas(id){ return ivIncluded(id) || (S.ivSubscribed || []).indexOf(id) > -1; }
  function ivRatings(id){ return (S.ivRatings || {})[id] || {}; }
  function ivMocks(id){ return (S.ivMocks || {})[id] || []; }
  function ivReady(id){
    var r = ivRatings(id), keys = Object.keys(r);
    if (!keys.length) return null;
    return Math.round(keys.reduce(function(a, k){ return a + r[k]; }, 0) / keys.length * 20);
  }
  /* what the doctor already holds that answers a given interview domain,
     read straight off the portfolio rather than asked for again */
  function evidenceFor(d){
    return (d.from || []).map(function(id){
      return DOMAINS.filter(function(x){ return x.id === id; })[0];
    }).filter(Boolean);
  }

  var IV_GYM = [
    {id:"what",  t:"What is assessed", ic:I.target, d:"The domains this format scores, and what each one means",
     feeds:"Frames everything else in the hub"},
    {id:"evid",  t:"Your evidence",    ic:I.clip,   d:"What you already hold that answers each domain",
     feeds:"Read straight off your portfolio"},
    {id:"qs",    t:"Practice questions", ic:I.list, d:"Questions by domain, with what a strong answer covers",
     feeds:"Practice is tracked per domain"},
    {id:"mock",  t:"Mock interview",   ic:I.mic,    d:"Run one, then rate yourself honestly per domain",
     feeds:"Your ratings drive the readiness figure"},
    {id:"stats", t:"Analytics",        ic:I.chart,  d:"Which domains you are weakest on",
     feeds:"Reads your self-ratings and your evidence"},

     feeds:"Attendance is logged to your record"}

  function ivCatalogue(){
    var mine = myInterviews(), all = allInterviews();
    var h = "";

    if (mine.length){
      h += '<p class="sec-label">' + (mine.length > 1 ? "Included with your routes" : "Included with your route") + "</p>";
      h += mine.map(function(iv, i){ return ivCard(iv, i === 0); }).join("");
    } else {
      h += ctx("No target specialty set, so nothing is included yet. Everything below is still here to browse, " +
        "and setting a route on your profile includes that interview automatically.");
    }

    var extra = (S.ivSubscribed || []).map(function(id){
      return all.filter(function(x){ return x.id === id; })[0];
    }).filter(function(x){ return x && !ivIncluded(x.id); });
    if (extra.length){
      h += '<p class="sec-label">You have added</p>';
      h += extra.map(function(iv){ return ivCard(iv, false); }).join("");
    }

    var rest = all.filter(function(iv){ return !ivHas(iv.id); });
    if (rest.length){
      h += '<p class="sec-label">Everything else</p>';
      h += '<div class="card" style="padding:6px 18px">' + rest.map(function(iv){
        return '<div class="row"><span class="t">' + esc(iv.t) + "<small>" + esc(iv.body) + " · " + esc(iv.fmt) +
          "</small></span>" +
          '<span class="r"><button class="btn btn-sm btn-ghost" data-iv-sub="' + esc(iv.id) + '">Add</button>' +
          '<button class="btn btn-sm btn-ghost" data-iv-open="' + esc(iv.id) + '">Look inside</button></span></div>';
      }).join("") + "</div>";
    }

    h += ctxFoot("Adding a prep records that you want it. Nothing here charges anybody and no billing is wired " +
      "up in this prototype. Interview formats and the domains they score are illustrative: each college sets " +
      "what it actually assesses.");

  function ivCard(iv, lead){
    var d = iv.cycle ? until(iv.cycle.interview) : null, rd = ivReady(iv.id);
    return '<div class="card' + (lead ? " lead" : "") + '" style="margin-bottom:10px">' +
      '<div class="card-head"><h2>' + esc(iv.t) + "</h2>" +
      '<span class="r" style="margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap">' +
      '<span class="chip mute">' + esc(iv.body) + "</span>" +
      (ivIncluded(iv.id) ? '<span class="chip good">' + ico(I.tick, 12) + "Included</span>" : "") +
      (rd !== null ? '<span class="chip ' + (rd >= 70 ? "good" : rd >= 50 ? "warn" : "crit") + '">' + rd + "% ready</span>" : "") +
      (d !== null ? chip({k: d < 0 ? "mute" : d <= 21 ? "crit" : d <= 60 ? "warn" : "mute", icon:I.clock,
                          label: d < 0 ? "Passed" : awayText(d)}) : "") + "</span></div>" +
      '<p class="lede" style="max-width:66ch">' + (iv.target ? "For <b>" + esc(iv.target) + "</b>. " : "") +
      esc(iv.fmt) + ". " + esc(iv.d) + "</p>" +
      '<div style="margin-top:13px;display:flex;gap:8px;flex-wrap:wrap">' +
      '<button class="btn btn-sm btn-primary" data-iv-open="' + esc(iv.id) + '">Open the hub</button>' +
      (ivHas(iv.id) || ivIncluded(iv.id) ? ""
        : '<button class="btn btn-sm btn-ghost" data-iv-sub="' + esc(iv.id) + '">Add it</button>') +
      "</div></div>";
  }

  function ivHub(iv){
    var surface = S.gymSurface || "";
    var g = IV_GYM.filter(function(x){ return x.id === surface; })[0];
    var d = iv.cycle ? until(iv.cycle.interview) : null, rd = ivReady(iv.id);

    var h = '<button class="btn btn-sm btn-ghost" data-iv-open="" style="margin-bottom:12px">' +
      ico(I.arrow, 13) + "All interviews</button>";
    h += '<div class="gym-h"><div class="gym-id"><span class="gym-k">' + esc(iv.body) + "</span>" +
      "<h2>" + esc(iv.t) + "</h2><p>" + esc(iv.fmt) + ". " +

  function ivSurface(g, iv){
    if (g.id === "what"){
      var h = '<div class="card"><div class="card-head"><h2>' + IV_DOMAINS.length + " domains</h2>" +
        '<span class="aside">' + esc(iv.fmt) + "</span></div>";
      h += IV_DOMAINS.map(function(d){
        return '<div class="row"><span class="t">' + esc(d.t) + "<small>" + esc(d.d) + "</small></span></div>";
      }).join("");
      return h + ctxFoot("The domain list is illustrative. " + esc(iv.body) + " publishes what it actually scores.") + "</div>";
    }

    if (g.id === "evid"){
      /* the reason this module is worth having: the portfolio is already here */
      var h2 = '<div class="card"><div class="card-head"><h2>What you already hold</h2>' +
        '<span class="aside">Read from your portfolio</span></div>' +
        '<p class="lede" style="max-width:68ch;margin-bottom:12px">The interview scores the same domains your ' +
        "application does. Nothing here is asked for again: this is what your record already says you can talk about.</p>";
      h2 += IV_DOMAINS.map(function(d){
        var ev = evidenceFor(d);
        var strong = ev.length && ev.every(function(x){ return x.pts() === x.maxPts; });
        var thin = ev.length && ev.every(function(x){ return x.pts() === 0; });
        return '<div class="chk' + (strong ? " done" : "") + '">' +
          '<span class="chk-box auto' + (strong ? " on" : "") + '" aria-hidden="true">' +
          (strong ? ico(I.tick, 12) : ico(I.clock, 11)) + "</span>" +
          '<div class="chk-b"><b>' + esc(d.t) + "</b>" +
          (ev.length
            ? "<small>" + ev.map(function(x){ return esc(x.name) + ": " + esc(x.note()); }).join(" · ") + "</small>"
            : '<small>Nothing in the portfolio scores this one. It is answered from how you talk about your practice, ' +
              "not from evidence you can upload.</small>") +
          (thin ? '<small class="chk-note">Nothing logged against this yet, so expect to be pushed on it.</small>' : "") +
          "</div>" +
          '<div class="chk-r">' + (ev.length && !strong
            ? '<a class="btn-link" href="#/gaps">Close it</a>' : "") + "</div></div>";
      }).join("");
      return h2 + "</div>";
    }

    if (g.id === "qs"){
      return '<div class="card"><div class="card-head"><h2>Practice questions</h2>' +
        '<span class="chip mute">Content to be authored</span></div>' +
        '<p class="lede" style="max-width:66ch">Questions by domain, each with what a strong answer covers and what ' +
        "a panel is listening for. Written by doctors who have sat on these panels, never generated, so the " +
        "structure is here and the content is the work.</p>" +
        '<p class="group-h">Domains they would be organised under</p>' +
        '<div class="picks">' + IV_DOMAINS.map(function(d){
          return '<span class="pick">' + esc(d.t) + "</span>";
        }).join("") + "</div></div>";
    }

    if (g.id === "mock"){
      var r = ivRatings(iv.id);
      var h3 = '<div class="card"><div class="card-head"><h2>Rate yourself by domain</h2>' +
        '<span class="aside">' + ivMocks(iv.id).length + " mocks run</span></div>" +
        '<p class="lede" style="max-width:66ch;margin-bottom:12px">Run a mock, then rate each domain one to five. ' +
        "Honestly: the figure is only worth having if it is uncomfortable.</p>";
      h3 += IV_DOMAINS.map(function(d){
        var v = r[d.id] || 0;
        return '<div class="row"><span class="t">' + esc(d.t) +
          (v ? "<small>Rated " + v + " of 5</small>" : "<small>Not rated</small>") + "</span>" +
          '<span class="r rate">' + [1,2,3,4,5].map(function(n){
            return '<button class="rt' + (v >= n ? " on" : "") + '" data-iv-rate="' + d.id + ':' + n +
              '" aria-label="Rate ' + esc(d.t) + " " + n + ' of 5">' + n + "</button>";
          }).join("") + "</span></div>";
      }).join("");
      h3 += '<div style="margin-top:14px"><button class="btn btn-sm btn-primary" data-iv-mock="' + esc(iv.id) +
        '">Log this mock</button></div>';
      return h3 + "</div>";
    }

    if (g.id === "stats"){
      var r2 = ivRatings(iv.id), keys = Object.keys(r2);
      if (!keys.length){
        return '<div class="card"><p class="empty"><b>Nothing to read yet.</b>' +
          "Rate yourself after a mock and this ranks the domains by where you are weakest.</p></div>";
      }
      var ranked = IV_DOMAINS.filter(function(d){ return r2[d.id]; })
        .sort(function(a, b){ return r2[a.id] - r2[b.id]; });
      var h4 = '<div class="card"><div class="card-head"><h2>' + ivReady(iv.id) + "% self-rated</h2>" +
        '<span class="aside">Weakest first</span></div>';
      h4 += ranked.map(function(d){
        var pct = r2[d.id] * 20;
        return '<div class="barrow" style="padding:9px 0"><span class="lbl">' + esc(d.t) + "</span>" +
          '<span class="val num">' + r2[d.id] + "/5</span>" + bar(pct) + "</div>";
      }).join("");
      return h4 + ctxFoot("This is your own rating of yourself, not a mark. It is useful because it ranks what to " +
        "work on, not because the number means anything on its own.") + "</div>";
    }

    return '<div class="card"><div class="card-head"><h2>Mock with a tutor</h2>' +
      '<span class="chip mute">Not wired up in this prototype</span></div>' +
      '<p class="lede" style="max-width:66ch">A scored practice interview with a doctor who has sat on a ' +
      esc(iv.body) + " panel. Availability, booking and payment are real product surfaces rather than things to " +
      "mock up here.</p></div>";
  }

  /* ================= NAV ================= */
  /* ================= MODULE REGISTRY =================
     Zones are fixed and ordered. The nav a doctor learns in week one is the
     same nav in month six, which is also what lets a pricing boundary land on
     a zone later without reshuffling anything.

     What adapts is not the order but the STATE of each module, and there are
     only three. Nothing is ever hidden: a module that does not apply says so
     in a sentence, because personalised disclosure without a stated reason
     reads as the product deciding things behind your back.

       active  the normal case
       ahead   real, just not yet, with the date it starts mattering
       aside   not on your route, with the reason in plain words          */
  var ZONES = ["Overview", "Your pathway", "Your applications", "Preparation", "Practical", "Account"];

  /* the scored application apparatus, which a consultant has finished with */
  function applyingOnly(sit){
    return sit.stillApplying ? null
      : {k:"aside", why:"You have reached consultant, so nothing here is scoring you any more. It stays visible because your record does."};
  }

  var MODULES = [
    {id:"today",         t:"Today",                          ic:I.home,   zone:"Overview"},
    {id:"roadmap",       t:"My roadmap",                     ic:I.map,    zone:"Your pathway"},
    {id:"progress",      t:"Application tracker",            ic:I.clip,   zone:"Your applications", rel:applyingOnly},
    /* one entry, because it is one table. Readiness and Shortlisting score
       still resolve as routes, they just no longer occupy the nav with two
       more views of what this one already shows. */
    {id:"gaps",          t:"Gap analysis",                   ic:I.list,   zone:"Your applications", rel:applyingOnly},
    {id:"deadlines",     t:"Deadlines",                      ic:I.cal,    zone:"Your applications", rel:applyingOnly},
    {id:"opportunities", t:"Matched to you",                 ic:I.brief,  zone:"Your applications"},
    {id:"exams",         t:"Exam prep",                      ic:I.book,   zone:"Preparation", rel:function(sit){
      if (!sit.stillApplying) return {k:"aside", why:"Your membership exams are behind you. Kept here so the record stays complete."};
      if (stagesHeld() >= stagesTotal()) return {k:"aside", why:"You hold every stage your route asks for. The catalogue stays open for anything else you want to sit."};
      return null;
    }},
    {id:"interviews",    t:"Interview prep",                 ic:I.mic,    zone:"Preparation", rel:function(sit){
      if (!sit.stillApplying) return {k:"aside", why:"You are not interviewing for a training post."};
      if (sit.phase === "far" && sit.cycle) return {k:"ahead", why:"Interviews are " + fmtLong(sit.cycle.interview) + ". Worth opening once applications close."};
      return null;
    }},
    {id:"admin",         t:"Occupational health and admin",  ic:I.shield, zone:"Practical"},
    {id:"cpd",           t:"CPD tracker",                    ic:I.grad,   zone:"Practical"},
    {id:"profile",       t:"Your profile",                   ic:I.user,   zone:"Account"}

  /* the sidebar scope box, derived rather than stored. It used to render
     S.stageLabel, a string written once at onboarding, so a consultant was
     still told they were "working towards HST Cardiology, SHO 2 years
     post-intern" no matter what the rest of the record said. */
  /* ================= PREP WORKSPACES =================
     A prep product is opened daily for six to eight weeks. The dashboard
     around it is built for a monthly visit, and making someone climb back out
     to a card grid every time they want the next surface is the wrong shape.

     So entering one swaps the shell: the sidebar becomes that product's own
     nav, the scope box says which product you are in rather than which
     consultant post you are years from, and one item at the top gets you out.
     Same app, same record, different chrome. */
  function activeWorkspace(){
    var id = currentId();
    if (id === "exams" && S.examOpen){
      var e = examById(S.examOpen);
      if (e) return {kind:"exam", id:e.id, name:e.fam + " " + e.stage, sub:e.body,
                     surfaces:gymFor(e), backTo:"exams"};
    }
    if (id === "interviews" && S.ivOpen){
      var iv = allInterviews().filter(function(x){ return x.id === S.ivOpen; })[0];
      if (iv) return {kind:"interview", id:iv.id, name:iv.t, sub:iv.body,
                      surfaces:IV_GYM, backTo:"interviews"};
    }
    return null;
  }

  function renderWorkspaceNav(ws){
    var cur = S.gymSurface || "";
    var html = '<p class="nav-group">' + esc(ws.kind === "exam" ? "Exam prep" : "Interview prep") + "</p>";
    /* the way out, first, because being unable to find it is the failure mode
       of every product that takes over the screen */
    html += '<button class="nav-item nav-back" data-ws-exit="1">' + ico(I.arrow, 16) +
      "All of MedNav</button>";
    html += '<p class="nav-group">' + esc(ws.name) + "</p>";
    html += '<button class="nav-item' + (cur === "" ? " on" : "") + '" data-gym="">' +
      ico(I.home, 17) + "Overview</button>";
    html += ws.surfaces.map(function(g){
      return '<button class="nav-item' + (cur === g.id ? " on" : "") + '" data-gym="' + g.id + '">' +
        ico(g.ic, 17) + esc(g.t) + "</button>";
    }).join("");
    document.getElementById("nav").innerHTML = html;
  }

  function scopeBox(){
    var sit = situation();
    var yrs = (S.clinicalMonths / 12).toFixed(1).replace(/\.0$/, "");
    var stage = sit.isStudent ? "Final year student"
      : sit.isIntern ? "Intern"
      : sit.isConsultant ? "Consultant in " + (S.specialty || "practice")
      : (sit.tier === "hst" ? "SpR" : "SHO") + ", " + yrs + (yrs === "1" ? " year" : " years") + " post-intern";
    return sit.isConsultant
      ? {label:"Currently", target:"Consultant", stage:stage}
      : {label:"Working towards", target:sit.target || "No target set", stage:stage};
  }

  function moduleById(id){
    for (var i = 0; i < MODULES.length; i++) if (MODULES[i].id === id) return MODULES[i];
    return null;
  }
  /* the single place a module's state is decided, so the nav and the page it
     leads to can never disagree about whether something applies to you */
  function relevance(id){
    var m = moduleById(id);
    if (!m || !m.rel) return null;
    return m.rel(situation());
  }

  function navBadge(id){
    if (id === "gaps"){
      var n = losingDomains();
      return n ? {n:n, alert:false} : null;
    }
    if (id === "deadlines"){
      var u = deadlines().filter(function(d){ return !d.done && d.days >= 0 && d.days <= 21; }).length;
      return u ? {n:u, alert:true} : null;
    }
    if (id === "admin"){
      var gs = gardaStatus();
      return gs.k === "crit" ? {n:"!", alert:true} : null;
    }
    return null;
  }

  function renderNav(active){
    var sit = situation();
    var html = "";
    ZONES.forEach(function(zone){
      var items = MODULES.filter(function(m){ return m.zone === zone; });
      if (!items.length) return;
      html += '<p class="nav-group">' + esc(zone) + "</p>";
      html += items.map(function(n){
        var r = n.rel ? n.rel(sit) : null;
        var b = navBadge(n.id);
        /* a module that does not apply still renders, still routes, still
           reachable by keyboard. It just stops competing for attention. */
        var cls = "nav-item" + (n.id === active ? " on" : "") + (r ? " rel-" + r.k : "");
        return '<a class="' + cls + '" href="#/' + n.id + '"' +
          (n.id === active ? ' aria-current="page"' : "") +
          (r ? ' title="' + esc(r.why) + '"' : "") + ">" + ico(n.ic, 17) + esc(n.t) +
          (r ? '<span class="pill quiet">' + (r.k === "ahead" ? "later" : "n/a") + "</span>"
             : b ? '<span class="pill' + (b.alert ? " alert" : "") + '">' + b.n + "</span>" : "") + "</a>";
      }).join("");
    });
    document.getElementById("nav").innerHTML = html;
  }

  /* ================= ROUTER ================= */
  function currentId(){
    var id = (location.hash || "#/today").replace("#/", "");
    return VIEWS[id] ? id : "today";
  }
  /* routes that survive a merge, pointing at the module that absorbed them */
  var ROUTE_ALIAS = {readiness:"gaps", score:"gaps"};
  function moduleFor(id){ return ROUTE_ALIAS[id] || id; }
  function render(){
    var id = currentId(), v = VIEWS[id];
    var wsT = activeWorkspace();
    document.getElementById("viewTitle").textContent = wsT ? wsT.name : v.title;
    document.getElementById("viewSub").textContent = wsT
      ? wsT.sub + " · " + (wsT.kind === "exam" ? "Exam preparation" : "Interview preparation")
      : v.sub;
    var host = document.getElementById("view");
    /* if a module is dimmed in the nav, landing on it must say why in the same
       words, rather than leaving the doctor to guess why it looked greyed out */
    var r = relevance(moduleFor(id));
    host.innerHTML = (r ? ctx(r.why, r.k === "aside") : "") + v.render();
    host.classList.remove("enter");
    void host.offsetWidth;
    if (!reduced) host.classList.add("enter");
    animateAll();
    var ws = activeWorkspace();
    document.body.classList.toggle("in-ws", !!ws);
    if (ws){
      renderWorkspaceNav(ws);
      document.getElementById("scopeLabel").textContent = ws.kind === "exam" ? "Preparing for" : "Interview";
      document.getElementById("scopeTarget").textContent = ws.name;
      document.getElementById("scopeStage").textContent = ws.sub;
    } else {
      renderNav(moduleFor(id));
      var sc = scopeBox();
      document.getElementById("scopeLabel").textContent = sc.label;
      document.getElementById("scopeTarget").textContent = sc.target;
      document.getElementById("scopeStage").textContent = sc.stage;
    }
    document.getElementById("whoName").textContent = S.name;
    document.getElementById("avatar").textContent = initials(S.name);
    document.title = v.title + " · MedNav";
  }
  function initials(n){
    return n.split(/\s+/).filter(Boolean).slice(0, 2).map(function(p){ return p[0].toUpperCase(); }).join("") || "MN";
  }
  window.addEventListener("hashchange", function(){
    render();
    document.getElementById("view").focus();
    window.scrollTo({top:0, behavior: reduced ? "auto" : "smooth"});
  });

  /* ================= TOAST ================= */
  var toastEl = document.getElementById("toast"), toastTimer = null;
  function toast(msg){
    document.getElementById("toastText").innerHTML = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove("show"); }, 4200);
  }

  /* ================= ACTIONS =================
     Every mutation reports the delta it actually caused, computed rather than
     asserted, because the causal link is the thing worth teaching. */
  var ACTIONS = {
    finishQI: function(){ S.auditComplete = 1; S.qiPct = 100; return "QI project marked complete"; },
    secondQI: function(){ S.auditComplete = 2; S.qiPct = 100; return "Second QI project marked complete"; },
    logTeaching: function(){
      S.teachingDone = Math.min(S.teachingTarget, S.teachingDone + 1);
      return "Teaching session logged, " + S.teachingDone + " of " + S.teachingTarget;
    },
    addResearch: function(){ S.research = Math.min(2, S.research + 1); return "Research output recorded"; },
    toggleDual: function(){ S.showDual = !S.showDual; return null; },
    useRegimeTarget: function(){
      S.cpdTargetSet = false;
      return "Tracking against the " + cpdRegime().target + "-point target for your regime";
    },
    passExam: function(){
      var nx = examsInFamily(entryFamilyFor(S.specialty)).filter(function(e){ return !stageHeld(e.id); })[0];
      if (!nx) return null;
      S.examStageDone = S.examStageDone || {};
      S.examStageDone[nx.id] = new Date().toISOString().slice(0, 10);
      var ex = situation().exam;
      return stagesHeld() >= stagesTotal() ? "Full " + ex + " recorded"
        : nx.stage + " recorded, " + stagesHeld() + " of " + stagesTotal();
    },
    doLeadership: function(){ S.leadership = true; return "Leadership course recorded"; },
    togglePast: function(){ S.showPast = !S.showPast; return null; },
    reset: function(){
      try { window.localStorage.removeItem(KEY); } catch (e) {}
      S = load();
      S.activity = [];
      return "Demo record reset";
    },
    printReport: function(){ window.print(); return null; },
    exportCal: function(){ toast("Calendar export is not wired up in this demo."); return null; },
    remind: function(){ toast("Reminders are not wired up in this demo."); return null; },
    saveProfile: function(){
      var name = document.getElementById("pName").value.trim();
      var spec = document.getElementById("pSpec").value;
      var months = parseInt(document.getElementById("pMonths").value, 10);
      var teach = parseInt(document.getElementById("pTeach").value, 10);
      if (name) S.name = name;
      /* every specialty the dropdown offers resolves here, not just the five a
         second lookup table used to carry: picking Nephrology once left the
         target reading "HST Cardiology" */
      if (SPECIALTY_INFO[spec]){
        S.specialty = spec;
        S.target = SPECIALTY_INFO[spec].target;
        S.body = SPECIALTY_INFO[spec].body;
        S.exam = SPECIALTY_INFO[spec].exam;
      }
      if (!isNaN(months) && months >= 0) S.clinicalMonths = months;
      if (!isNaN(teach) && teach >= 1){
        S.teachingTarget = teach;
        S.teachingDone = Math.min(S.teachingDone, teach);
      }
      return "Profile saved";
    },
    saveLocation: function(){
      S.basedIn = document.getElementById("pBased").value;
      var willing = Array.prototype.slice.call(document.querySelectorAll("[data-willing-box]:checked")).map(function(el){ return el.value; });
      S.willing = willing.indexOf("any") > -1 ? ["any"] : willing;
      S.dualTrack = document.getElementById("pDual").value;
      S.otherTargets = S.dualTrack === "single" ? [] :
        Array.prototype.slice.call(document.querySelectorAll("[data-other-box]:checked")).map(function(el){ return el.value; });
      return "Location and other applications saved";
    },
    logGarda: function(){
      var v = document.getElementById("fGarda").value;
      if (!v) { toast("Pick a date first."); return null; }
      S.gardaVettingDate = v;
      return "Garda vetting date saved, renews " + fmtLong(gardaExpiry());
    },
    logHepB: function(){
      S.hepBUpToDate = document.getElementById("fHepB").checked;
      S.hepBCheckedAt = document.getElementById("fHepBAt").value;
      return "Immunisation status saved";
    },
    logOcc: function(){
      S.occClearance = document.getElementById("fOcc").checked;
      S.occClearanceAt = document.getElementById("fOccAt").value;
      return "Occupational health status saved";
    },
    logCpd: function(){
      var n = parseInt(document.getElementById("fCpdAdd").value, 10);
      if (!n || n <= 0) { toast("Enter a number of points first."); return null; }
      S.cpdPoints += n;
      S.cpdLog = S.cpdLog || [];
      S.cpdLog.unshift({pts:n, at:Date.now() ? new Date().toISOString().slice(0, 10) : ""});
      return n + " CPD points logged, " + S.cpdPoints + " of " + cpdTarget() + " so far this cycle";
    },
    saveCpdTarget: function(){
      var t = parseInt(document.getElementById("fCpdTarget").value, 10);
      if (t > 0){ S.cpdTarget = t; S.cpdTargetSet = true; }
      var end = document.getElementById("fCpdEnd").value;
      if (end) S.cpdCycleEnd = end;
      return "CPD target and cycle saved";
    },
    /* a mock result belongs to the stage it was sat for, and moves the
       predicted figure only: a mock is not a stage held and must never touch
       the shortlisting rubric. */
    logMock: function(){
      var el = document.getElementById("mockPct");
      var n = el ? parseInt(el.value, 10) : NaN;
      if (isNaN(n) || n < 0 || n > 100){ toast("Enter a score between 0 and 100."); return null; }
      if (!S.examOpen) return null;
      S.mocks = S.mocks || {};
      S.mocks[S.examOpen] = S.mocks[S.examOpen] || [];
      S.mocks[S.examOpen].push({pct:n, at:new Date().toISOString().slice(0, 10)});
      var me = examById(S.examOpen);
      logActivity("Mock recorded, " + n + "%", me ? me.fam + " " + me.stage : "");
      return "Mock recorded. Predicted now " + predictedFor(S.examOpen) + "%";
    },
    saveCV: function(){
      S.cvUpdatedAt = new Date().toISOString().slice(0, 10);
      return "CV marked updated today";
    },
    /* the admin page's versions read date inputs that only exist there. These
       record today, which is the common case, and the admin page stays the
       way to enter any other date. */
    logGardaToday: function(){
      S.gardaVettingDate = new Date().toISOString().slice(0, 10);
      return "Garda vetting dated today, renews " + fmtLong(gardaExpiry());
    },
    logOccToday: function(){
      S.occClearance = true;
      S.occClearanceAt = new Date().toISOString().slice(0, 10);
      return "Occupational health clearance recorded";
    }
  };

  function runAction(name){
    var fn = ACTIONS[name];
    if (!fn) return;
    var beforeScore = scorePts(), beforeReady = readiness();
    var msg = fn();
    save();
    render();
    if (!msg) return;
    var dScore = scorePts() - beforeScore, dReady = readiness() - beforeReady;
    var bits = [];
    if (dScore) bits.push("shortlisting score <em>" + (dScore > 0 ? "+" : "") + dScore + "</em>");
    if (dReady) bits.push("readiness <em>" + (dReady > 0 ? "+" : "") + dReady + "%</em>");

    if (name !== "reset"){
      logActivity(msg,
        (dScore ? "Shortlisting score " + (dScore > 0 ? "+" : "") + dScore : "") +
        (dScore && dReady ? ", " : "") +
        (dReady ? "readiness " + (dReady > 0 ? "+" : "") + dReady + "%" : ""));
      render();
    }
    toast(esc(msg) + (bits.length ? ". " + bits.join(", ") : "."));
  }

  document.addEventListener("click", function(ev){
    var act = ev.target.closest("[data-act]");
    if (act){ ev.preventDefault(); runAction(act.getAttribute("data-act")); return; }

    var tog = ev.target.closest("[data-toggle]");
    if (tog){
      ev.preventDefault();
      var id = tog.getAttribute("data-toggle");
      S.deadlinesDone[id] = !S.deadlinesDone[id];
      save(); render();
      toast(S.deadlinesDone[id] ? "Marked done." : "Marked not done.");
      return;
    }

    /* ladder rungs. Marking a stage done, or recording an application and what
       came of it. Per-rung identity means these cannot go through ACTIONS. */
    /* "track this too" writes to otherTargets, which is the same list the
       dual-track comparison on this page reads. Exploring a specialty and
       tracking one are then the same act rather than two features. */
    var addT = ev.target.closest("[data-addtarget]");
    if (addT){
      ev.preventDefault();
      var tn = addT.getAttribute("data-addtarget");
      S.otherTargets = S.otherTargets || [];
      if (S.otherTargets.indexOf(tn) === -1 && tn !== S.specialty){
        S.otherTargets.push(tn);
        S.dualTrack = "multi";
        logActivity("Added " + tn + " as a second target", "From Plan B");
        save(); render();
        toast("Now tracking <em>" + esc(tn) + "</em> alongside " + esc(S.specialty) + ".");
      }
      return;
    }

    var rung = ev.target.closest("[data-rung]");
    if (rung){
      ev.preventDefault();
      var rc = rung.getAttribute("data-rung"), rv = rung.getAttribute("data-rungval") || "";
      var today = new Date().toISOString().slice(0, 10);
      S.stagesDone = S.stagesDone || {};
      S.applications = S.applications || [];
      var m;

      if ((m = /^done:(.+)$/.exec(rc))){
        S.stagesDone[m[1]] = today;
        logActivity(({internship:"Internship", bst:"Basic specialist training", cscst:"CSCST"}[m[1]] || m[1]) + " marked complete", "");
        save(); render(); toast("Marked complete."); return;
      }
      if ((m = /^undo:(.+)$/.exec(rc))){
        delete S.stagesDone[m[1]];
        save(); render(); toast("Unmarked."); return;
      }
      if (rc === "exam"){
        var nex = examsInFamily(entryFamilyFor(S.specialty)).filter(function(e){ return !stageHeld(e.id); })[0];
        if (nex){ S.examStageDone = S.examStageDone || {}; S.examStageDone[nex.id] = today; }
        var ex = situation().exam;
        logActivity(stagesHeld() >= stagesTotal() ? "Full " + ex + " recorded"
                                      : (nex ? nex.stage : "Stage") + " recorded", "");
        save(); render();
        toast(stagesHeld() + " of " + stagesTotal() + " stages held."); return;
      }
      if (rc === "apply"){
        S.applications.unshift({target:rv, cycle:cycleLabel(), appliedAt:today, outcome:"", outcomeAt:""});
        logActivity("Applied to " + rv, cycleLabel() + " cycle");
        save(); render(); toast("Recorded as applied."); return;
      }
      if ((m = /^outcome:(.+)$/.exec(rc))){
        var app = applicationFor(rv);
        if (app){
          app.outcome = m[1];
          app.outcomeAt = today;
          logActivity(rv + ": " + OUTCOMES[m[1]].label, cycleLabel() + " cycle");
        }
        save(); render(); toast(app ? OUTCOMES[m[1]].label + " recorded." : "Nothing to record."); return;
      }
      if (rc === "planb"){
        S.planB = rv; save(); render();
        /* the panel renders below the ladder, which can be off-screen on a
           phone, so a control that appeared to do nothing would be the bug */
        var el = document.getElementById("planb");
        if (el) el.scrollIntoView({behavior: reduced ? "auto" : "smooth", block:"center"});
        return;
      }
      if (rc === "planb-close"){ S.planB = ""; save(); render(); return; }
      /* the Plan B gate. Same store as the rung's own outcome buttons: a
         doctor must never be able to answer this twice and get two answers.
         appliedAt stays empty when no application was logged, and is never
         rendered once an outcome exists. */
      if ((m = /^answer:(.+)$/.exec(rc))){
        var ans = applicationFor(rv);
        if (!ans){
          ans = {target:rv, cycle:cycleLabel(), appliedAt:"", outcome:"", outcomeAt:""};
          S.applications.unshift(ans);
        }
        ans.outcome = m[1];
        ans.outcomeAt = today;
        logActivity(rv + ": " + OUTCOMES[m[1]].label, cycleLabel() + " cycle");
        save(); render(); toast(OUTCOMES[m[1]].label + " recorded."); return;
      }
      if (rc === "reanswer"){
        var re = applicationFor(rv);
        if (re){ re.outcome = ""; re.outcomeAt = ""; }
        save(); render(); toast("Answer cleared."); return;
      }
      if (rc === "unapply"){
        var cy = cycleLabel();
        S.applications = S.applications.filter(function(a){ return !(a.target === rv && a.cycle === cy); });
        save(); render(); toast("Application record removed."); return;
      }
      return;
    }

    /* the annual roll-forward. Its buttons carry the branch or the commit
       directly, because each answer decides which question comes next and
       ACTIONS has no way to take an argument. */
    var roll = ev.target.closest("[data-roll]");
    if (roll){
      ev.preventDefault();
      var cmd = roll.getAttribute("data-roll"), val = roll.getAttribute("data-rollval") || "";
      var yr = new Date().getFullYear(), note = "";

      if (cmd.indexOf("go:") === 0){ S.rollStep = cmd.slice(3); save(); render(); return; }

      if (cmd === "rollCancel"){ S.rollStep = ""; save(); render(); toast("Asked again next time."); return; }
      if (cmd === "rollDone"){ note = "Confirmed record unchanged"; }
      if (cmd === "rollAdvance"){
        var rt = routeTiming();
        S.schemeYear = Math.min(rt.stageYears, (S.schemeYear || rt.stageYear) + 1);
        S.inScheme = true;
        note = "Moved up to year " + S.schemeYear + (S.schemeName ? " of " + S.schemeName : "");
      }
      if (cmd === "rollLeft"){
        S.inScheme = false; S.schemeName = ""; S.schemeYear = 0;
        note = "Left the training scheme";
      }
      if (cmd === "rollJoinTarget"){
        S.inScheme = true; S.schemeName = situation().target; S.schemeYear = 1; S.roleTitle = "";
        note = "Started " + S.schemeName;
      }
      if (cmd === "rollJoinOther"){
        S.inScheme = true; S.schemeName = val || "a training scheme"; S.schemeYear = 1; S.roleTitle = "";
        note = "Started " + S.schemeName;
      }
      if (cmd === "rollRole"){
        S.inScheme = false; S.schemeName = ""; S.schemeYear = 0; S.roleTitle = val;
        note = "Working as " + (val === "Other" ? "a non-training post" : val) + ", not in a scheme";
      }
      /* every turnover is recorded, including the ones where nothing happened,
         because "no place this year" is the fact the ladder needs most */
      S.rollHistory = S.rollHistory || [];
      S.rollHistory.unshift({ year: yr, note: note, at: new Date().toISOString().slice(0, 10) });
      S.rollHistory = S.rollHistory.slice(0, 12);
      S.lastRolledAt = new Date().toISOString().slice(0, 10);
      S.rollStep = "";
      logActivity(note, "Annual update for " + yr);
      save(); render();
      toast(esc(note) + ".");
      return;
    }

    var rmRot = ev.target.closest("[data-remove-rotation]");
    if (rmRot){
      ev.preventDefault();
      var ri = parseInt(rmRot.getAttribute("data-remove-rotation"), 10);
      (S.rotations || []).splice(ri, 1);
      save(); render();
      toast("Rotation removed.");
      return;
    }

    /* custom milestone: swap the button for an inline field rather than a
       browser prompt, which some embedded contexts block outright */
    var add = ev.target.closest('[data-act="addMilestone"]');
    if (add){ ev.preventDefault(); }
  });

  /* the add-milestone control is wired separately so it can replace itself */
  document.addEventListener("click", function(ev){
    var btn = ev.target.closest('button[data-act="addMilestone"]');
    if (!btn) return;
    var wrap = document.createElement("span");
    wrap.style.cssText = "display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap";
    wrap.innerHTML = '<input id="newMs" placeholder="What else does this application need?" style="border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;min-width:240px">' +
      '<button class="btn btn-sm btn-primary" id="newMsAdd">Add</button>' +
      '<button class="btn btn-sm btn-ghost" id="newMsCancel">Cancel</button>';
    btn.replaceWith(wrap);
    var input = document.getElementById("newMs");
    input.focus();
    function commit(){
      var val = input.value.trim();
      if (!val){ render(); return; }
      /* the doctor's own requirement, which joins the checklist rather than a
         milestone list no page shows any more */
      S.customChecks = S.customChecks || [];
      S.customChecks.push({id:String(Date.now()), t:val.slice(0, 80), g:"Your own"});
      save(); render();
      toast("Requirement added.");
    }

    document.getElementById("newMsCancel").addEventListener("click", function(){ render(); });
    input.addEventListener("keydown", function(e){ if (e.key === "Enter") commit(); });

  /* add-rotation wired the same way, four fields instead of one */
  document.addEventListener("click", function(ev){
    var btn = ev.target.closest('button[data-act="addRotation"]');
    if (!btn) return;

    wrap.style.cssText = "display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-top:8px";

      });
