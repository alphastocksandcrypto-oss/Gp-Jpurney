<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Evidence — MedNav</title>
<meta name="description" content="Ask a clinical question. Get an answer where every statement carries the guideline it came from, and every citation opens the passage it rests on.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
/* ──────────────────────────────────────────────────────────────
   Evidence v2 — MedNav
   One self-contained file, no build step.

   v1 was a stack of cards. This is a document. The answer is the
   page; the machinery around it stays quiet until you want it.
   Citations are named, not numbered, because a clinician reads
   [NICE] and knows what weight to give it before clicking.
   ────────────────────────────────────────────────────────────── */

:root{
  --lime:#cdf565; --lime-deep:#b6e845; --lime-soft:#e8f9c2;
  --ink:#101310; --ink-2:#41493f; --muted:#7b847a;
  --shell:#ffffff; --page:#e7e9e3; --line:#ecefe8; --field:#f4f6f1;
  --haze-a:#ffffff; --haze-b:#eef4e2;
  --amber:#b07d1c; --amber-bg:#fdf7e8; --amber-line:#f0e0b8;
  --red:#b4482f; --red-bg:#fdf1ee; --red-line:#f2d6cd;
  --on-lime:#16210f; --mark:#e8f9c2;
  color-scheme:light;
}
html[data-theme="dark"]{
  --ink:#f2f5ef; --ink-2:#b9c2b6; --muted:#7e877c;
  --shell:#0e100e; --page:#000; --line:#1e221d; --field:#171a16;
  --haze-a:#0f120f; --haze-b:#141a10;
  --amber:#d9ad55; --amber-bg:#1d1810; --amber-line:#3a3019;
  --red:#d98d72; --red-bg:#1d1210; --red-line:#3a2119;
  --mark:#26331a;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Instrument Sans',ui-sans-serif,system-ui,-apple-system,sans-serif;
  min-height:100vh;padding:20px;color:var(--ink);
  background:
    radial-gradient(120% 90% at 8% 100%,#dcefbc 0%,rgba(220,239,188,0) 52%),
    radial-gradient(80% 60% at 96% 0%,#f1f3ed 0%,rgba(241,243,237,0) 58%),
    var(--page);
  -webkit-font-smoothing:antialiased;
}
html[data-theme="dark"] body{background:radial-gradient(120% 90% at 8% 100%,#141d0e 0%,rgba(20,29,14,0) 52%),var(--page)}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit;text-align:left;font-size:inherit}
input,textarea{font-family:inherit}
:focus-visible{outline:2px solid var(--lime-deep);outline-offset:2px;border-radius:8px}
kbd{font-family:inherit;font-size:10px;padding:2px 5px;border-radius:5px;background:#8a938626;opacity:.75}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:1px 2px}

/* ── shell ───────────────────────────────────────────────────── */
.shell{max-width:1420px;margin:0 auto;display:grid;grid-template-columns:262px 1fr;
  background:var(--shell);border-radius:24px;overflow:hidden;position:relative;
  box-shadow:0 1px 3px rgba(16,19,16,.05),0 24px 60px -22px rgba(16,19,16,.22);
  height:min(920px,calc(100vh - 40px))}
html[data-theme="dark"] .shell{box-shadow:0 26px 70px -24px rgba(0,0,0,.85)}

/* ── sidebar ─────────────────────────────────────────────────── */
.side{display:flex;flex-direction:column;padding:14px 12px;border-right:1px solid var(--line);min-width:0}
.brand{display:flex;align-items:center;gap:9px;padding:4px 5px 16px}
.logo{width:30px;height:30px;border-radius:9px;background:var(--ink);color:var(--lime);display:grid;place-items:center;flex:none}
html[data-theme="dark"] .logo{background:var(--lime);color:#101310}
.wordmark{font-size:18px;font-weight:600;letter-spacing:-.03em}
.themebtn{margin-left:auto;color:var(--muted);padding:6px;border-radius:9px;display:grid;place-items:center}
.themebtn:hover{color:var(--ink);background:var(--field)}
.newq{display:flex;align-items:center;gap:10px;width:100%;padding:10px 11px;border-radius:13px;
  background:var(--field);font-size:13.5px;font-weight:500;margin-bottom:4px}
.newq:hover{background:var(--line)}
.plus{width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--shell);display:grid;place-items:center;flex:none}
html[data-theme="dark"] .plus{background:var(--lime);color:#101310}
.newq kbd{margin-left:auto;background:var(--shell);border:1px solid var(--line);color:var(--muted);opacity:1}
.scrollnav{flex:1;overflow-y:auto;margin:0 -3px;padding:0 3px}
.sechead{display:flex;align-items:center;gap:8px;padding:14px 7px 6px;font-size:10.5px;font-weight:600;
  letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.secbar{width:3px;height:11px;border-radius:2px;background:var(--lime-deep);flex:none}
.seccount{margin-left:auto;letter-spacing:0;font-size:10.5px}
.navitem{display:flex;align-items:center;gap:10px;width:100%;padding:8px;border-radius:11px;
  font-size:13px;color:var(--ink-2);transition:background .15s,color .15s}
.navitem:hover{background:var(--field);color:var(--ink)}
.navitem.on{background:var(--lime);color:#111a0d;font-weight:500}
.tile{width:28px;height:28px;border-radius:8px;background:var(--field);display:grid;place-items:center;flex:none}
.navitem.on .tile{background:#ffffffb0;color:#2c3a22}
.nlab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{margin-left:auto;font-size:8.5px;font-weight:700;letter-spacing:.09em;padding:3px 6px;border-radius:5px;
  background:var(--field);color:var(--muted);flex:none}
.navitem.on .pill{background:#ffffff9e;color:#3d4a30}
.hist{display:flex;flex-direction:column;padding-left:8px;margin:2px 0 6px 11px;border-left:1px solid var(--line)}
.hist button{padding:7px 9px;font-size:12.5px;color:var(--muted);border-radius:8px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:100%}
.hist button:hover,.hist button.on{color:var(--ink);background:var(--field)}
.histempty{padding:7px 9px;font-size:12px;color:var(--muted);line-height:1.5;margin:0}
.usercard{display:flex;align-items:center;gap:10px;background:var(--ink);color:#f4f7f0;border-radius:16px;
  padding:10px 12px;margin-top:8px;flex:none}
html[data-theme="dark"] .usercard{background:#181c16;border:1px solid var(--line)}
.avatar{width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--lime),var(--lime-deep));color:#16210f;font-weight:600;font-size:12.5px}
.uinfo{min-width:0;flex:1}
.uname{display:block;font-size:12.5px;font-weight:500;line-height:1.25}
.uplan{display:block;font-size:10.5px;color:#a3ada0;margin-top:2px}

/* ── main ────────────────────────────────────────────────────── */
.main{position:relative;display:flex;flex-direction:column;min-width:0;overflow:hidden;
  background:linear-gradient(180deg,var(--haze-a) 0%,var(--haze-b) 100%)}
.top{display:flex;align-items:center;gap:7px;padding:13px 18px;flex:none;
  border-bottom:1px solid var(--line);background:var(--shell);z-index:5;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--shell);border:1px solid var(--line);
  border-radius:999px;padding:7px 12px;font-size:12px;font-weight:500;color:var(--ink-2);
  transition:border-color .15s,background .15s}
.chip:hover{border-color:var(--lime-deep)}
.chip b{font-weight:600;color:var(--ink)}
.chip.flat{background:var(--field);border-color:transparent}
.topright{margin-left:auto;display:flex;gap:7px;align-items:center}
.burger{display:none}
.stage{flex:1;overflow-y:auto;padding:0 20px 32px;overflow-anchor:none}
.col{max-width:760px;margin:0 auto}

/* ── home ────────────────────────────────────────────────────── */
.home{padding-top:8vh;text-align:center;animation:rise .4s cubic-bezier(.2,.7,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.hero{width:46px;height:46px;border-radius:14px;margin:0 auto 20px;color:#18220e;display:grid;place-items:center;
  background:linear-gradient(155deg,var(--lime),var(--lime-deep));box-shadow:0 10px 24px -8px rgba(182,232,69,.7)}
h1{margin:0;font-size:clamp(28px,4vw,42px);font-weight:600;letter-spacing:-.04em;line-height:1.06}
h1 em{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;color:var(--muted);
  letter-spacing:-.02em;display:block;margin-top:2px}
.lede{margin:14px auto 0;max-width:50ch;font-size:14.5px;line-height:1.6;color:var(--ink-2)}

.ask{margin-top:24px;background:var(--shell);border:1px solid var(--line);border-radius:20px;
  padding:14px 15px 11px;text-align:left;transition:border-color .2s;
  box-shadow:0 2px 5px rgba(16,19,16,.03),0 16px 36px -20px rgba(16,19,16,.22)}
.ask:focus-within{border-color:var(--lime-deep)}
html[data-theme="dark"] .ask{box-shadow:0 18px 42px -22px rgba(0,0,0,.85)}
.ask textarea{width:100%;border:0;outline:none;background:none;resize:none;font:inherit;font-size:15.5px;
  color:var(--ink);min-height:56px;line-height:1.5}
.ask.compact textarea{min-height:42px;font-size:14.5px}
.ask textarea::placeholder{color:var(--muted)}
.askrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:4px}
.grow{flex:1}
.mini{display:inline-flex;align-items:center;gap:6px;background:var(--field);border-radius:999px;padding:7px 12px;
  font-size:12px;color:var(--ink-2);transition:background .15s,color .15s}
.mini:hover{background:var(--lime);color:var(--on-lime)}
.mini.on{background:var(--lime);color:var(--on-lime);font-weight:500}
.iconbtn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--field);
  color:var(--ink-2);flex:none}
.iconbtn:hover{background:var(--line)}
.send{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--lime);
  color:var(--on-lime);flex:none;transition:transform .15s,opacity .15s}
.send:hover:not(:disabled){transform:translateY(-1px)}
.send:disabled{opacity:.4;cursor:not-allowed}
.send.stop{background:var(--ink);color:var(--shell)}
html[data-theme="dark"] .send.stop{background:var(--field);color:var(--ink)}
.attached{display:flex;align-items:center;gap:7px;background:var(--field);border-radius:9px;padding:6px 9px;
  font-size:11.5px;color:var(--ink-2);margin-bottom:8px;width:fit-content;max-width:100%}
.attached svg{flex:none;color:var(--lime-deep)}
.attached span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.attached button{color:var(--muted);display:grid;place-items:center;flex:none}

.trust{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px;font-size:11.5px;
  color:var(--muted);flex-wrap:wrap}
.trust svg{color:var(--lime-deep)}
.trust .sep{width:1px;height:10px;background:var(--line)}

.sugg{margin-top:26px;text-align:left}
.sugghead{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  margin:0 0 10px 2px}
.suggrow{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:13px;
  background:var(--shell);border:1px solid var(--line);margin-bottom:7px;transition:border-color .15s,transform .15s}
.suggrow:hover{border-color:var(--lime-deep);transform:translateY(-1px)}
.sspec{font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);
  background:var(--field);border-radius:5px;padding:4px 7px;flex:none;width:104px;text-align:center}
.sq{font-size:13.5px;color:var(--ink-2);line-height:1.45;flex:1;min-width:0}
.suggrow:hover .sq{color:var(--ink)}
.sgo{color:var(--muted);flex:none}
.disc{display:flex;gap:8px;align-items:flex-start;margin-top:22px;padding-top:14px;border-top:1px solid var(--line);
  font-size:11.5px;color:var(--muted);line-height:1.55;text-align:left}
.disc svg{flex:none;margin-top:1px;color:var(--lime-deep)}

/* ── a turn: question, pipeline, answer, references ──────────── */
.turn{padding:26px 0 4px;border-top:1px solid var(--line)}
.turn:first-child{border-top:0;padding-top:20px}
.qline{display:flex;gap:11px;align-items:flex-start;margin-bottom:14px}
.qav{width:26px;height:26px;border-radius:8px;background:var(--field);color:var(--muted);display:grid;
  place-items:center;flex:none;margin-top:2px;font-size:10px;font-weight:700}
.qtext{margin:0;font-size:20px;font-weight:600;letter-spacing:-.025em;line-height:1.35;flex:1;min-width:0}
.qdoc{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);background:var(--field);
  border-radius:6px;padding:3px 7px;margin-top:8px}

/* the pipeline line — one quiet row, not a panel */
.pipe{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--muted);padding:7px 0;min-height:32px}
.pipe .spin{width:13px;height:13px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--lime-deep);
  animation:spin .7s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.pipe b{color:var(--ink-2);font-weight:500}
.pipe .step{opacity:0;animation:fadein .3s ease forwards}
@keyframes fadein{to{opacity:1}}
.pipetog{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);padding:7px 0;
  border-radius:8px}
.pipetog:hover{color:var(--ink)}
.pipetog .chev{transition:transform .2s}
.pipetog .chev.up{transform:rotate(180deg)}
.pipetog .ok{color:var(--lime-deep);flex:none}

.reflist{margin:4px 0 14px;border-left:2px solid var(--line);padding-left:13px}
.refrow{display:grid;grid-template-columns:78px 1fr auto;align-items:center;gap:11px;padding:6px 0;font-size:11.5px;
  animation:rowin .3s cubic-bezier(.2,.7,.3,1) backwards;animation-delay:calc(var(--i) * 45ms)}
@keyframes rowin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.refrow.out{opacity:.45}
.refrow.out .rt{text-decoration:line-through;text-decoration-thickness:1px}
.rtag{font-size:9.5px;font-weight:700;letter-spacing:.05em;color:var(--ink-2);background:var(--field);
  border-radius:5px;padding:4px 6px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.refrow.out .rtag{color:var(--muted)}
.rt{color:var(--ink-2);line-height:1.4;min-width:0}
.rwhy{font-size:10.5px;color:var(--muted);white-space:nowrap;flex:none}
.rrank{font-size:10px;font-weight:700;color:var(--lime-deep);white-space:nowrap}

/* ── the answer itself: a document, not a card ───────────────── */
.ans{font-size:15px;line-height:1.72;color:var(--ink-2)}
.ans p{margin:0 0 15px}
.ans p.lead{font-size:16px;line-height:1.65;color:var(--ink)}
.ans h3{margin:24px 0 9px;font-size:11px;font-weight:700;letter-spacing:.09em;color:var(--ink);
  text-transform:uppercase}
.ans strong{color:var(--ink);font-weight:600}
.ans ul{margin:0 0 15px;padding-left:0;list-style:none}
.ans li{position:relative;padding-left:17px;margin-bottom:7px}
.ans li::before{content:"";position:absolute;left:3px;top:10px;width:5px;height:5px;border-radius:50%;
  background:var(--lime-deep)}
.callout{display:flex;gap:9px;align-items:flex-start;margin:0 0 15px;padding:11px 13px;border-radius:11px;
  font-size:13px;line-height:1.6;background:var(--field);border:1px solid var(--line);color:var(--ink-2)}
.callout svg{flex:none;margin-top:2px;color:var(--muted)}
.callout.warn{background:var(--amber-bg);border-color:var(--amber-line)}
.callout.warn svg{color:var(--amber)}

/* named citations — the thing you read before you click */
.cite{display:inline-flex;align-items:center;height:17px;padding:0 6px;border-radius:5px;background:var(--mark);
  color:#3f4b2c;font-size:10px;font-weight:700;letter-spacing:.02em;vertical-align:1px;margin:0 1px;
  position:relative;animation:citein .2s cubic-bezier(.2,.9,.3,1.4);white-space:nowrap}
html[data-theme="dark"] .cite{color:#c2d4a4}
@keyframes citein{from{opacity:0;transform:scale(.6)}}
.cite::after{content:"";position:absolute;inset:-10px -2px}
.cite:hover,.cite.on{background:var(--lime);color:var(--on-lime)}
.cite.checking{background:var(--field);color:var(--muted)}
.caret{display:inline-block;width:2px;height:15px;background:var(--lime-deep);vertical-align:-2px;margin-left:2px;
  animation:blink .9s steps(2) infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

/* faithfulness pass */
.faith{display:flex;align-items:center;gap:9px;margin:18px 0 0;padding:10px 12px;border-radius:11px;
  background:var(--field);font-size:12px;color:var(--ink-2)}
.faith svg{flex:none;color:var(--lime-deep)}
.faith.running svg{color:var(--muted)}
.faith b{font-weight:600;color:var(--ink)}
.faith .fgrow{flex:1}
.faith .fbar{width:74px;height:4px;border-radius:2px;background:var(--line);overflow:hidden;flex:none}
.faith .fbar i{display:block;height:4px;border-radius:2px;background:var(--lime-deep);transition:width .3s linear}

/* ── references at the end of the answer ─────────────────────── */
.refshead{display:flex;align-items:center;gap:8px;margin:24px 0 10px;font-size:10px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.refshead .rgrow{flex:1}
.refshead span{letter-spacing:0;text-transform:none;font-weight:500;font-size:11px}
.srcs{display:flex;flex-direction:column;gap:6px}
.src{display:flex;gap:11px;align-items:flex-start;background:var(--shell);border:1px solid var(--line);
  border-radius:12px;padding:11px 12px;width:100%;transition:border-color .15s,background .15s;scroll-margin:20px}
.src:hover,.src.on{border-color:var(--lime-deep)}
.stag{font-size:9.5px;font-weight:700;letter-spacing:.04em;background:var(--mark);color:#3f4b2c;border-radius:5px;
  padding:5px 7px;flex:none;min-width:64px;text-align:center;margin-top:1px}
html[data-theme="dark"] .stag{color:#c2d4a4}
.sbody{min-width:0;flex:1}
.stitle{display:block;font-size:13px;color:var(--ink);line-height:1.45;font-weight:500}
.smeta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:5px;font-size:10.5px;color:var(--muted)}
.smeta .dot{width:3px;height:3px;border-radius:50%;background:var(--muted);opacity:.6;flex:none}
.styp{font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:4px;
  background:var(--field);color:var(--muted)}
.styp.guide{background:var(--mark);color:#3f4b2c}
html[data-theme="dark"] .styp.guide{color:#c2d4a4}
.sgo2{color:var(--muted);flex:none;margin-top:3px}

/* ── actions and suggested follow-ups ────────────────────────── */
.acts{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:16px;padding-top:13px;border-top:1px solid var(--line)}
.act{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding:7px 10px;border-radius:9px}
.act:hover{background:var(--field);color:var(--ink)}
.act.on{background:var(--lime);color:var(--on-lime)}
.act.on.down{background:var(--amber-bg);color:var(--amber)}
.agrow{flex:1}
.menu{position:relative}
.mpop{position:absolute;right:0;bottom:calc(100% + 6px);z-index:30;background:var(--shell);border:1px solid var(--line);
  border-radius:13px;padding:5px;min-width:212px;box-shadow:0 16px 40px -14px rgba(16,19,16,.32)}
html[data-theme="dark"] .mpop{box-shadow:0 18px 44px -14px rgba(0,0,0,.85)}
.mpop button{display:flex;align-items:center;gap:9px;width:100%;padding:9px 10px;border-radius:9px;font-size:12.5px;color:var(--ink-2)}
.mpop button:hover{background:var(--field);color:var(--ink)}
.mpop .mrule{display:block;border-top:1px solid var(--line);margin:4px 6px}
.mpop small{display:block;padding:4px 10px 7px;font-size:10.5px;color:var(--muted);line-height:1.45}

.nexts{margin-top:18px}
.nexthead{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:9px}
.next{display:flex;align-items:center;gap:11px;width:100%;padding:10px 13px;border-radius:12px;
  border:1px solid var(--line);background:var(--shell);margin-bottom:6px;transition:border-color .15s,transform .15s}
.next:hover{border-color:var(--lime-deep);transform:translateY(-1px)}
.nkind{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);

function route(q){
  const t = q.toLowerCase();
  if(/otitis|ear ?ache|amoxicillin|otalgia|otorrhoea|ent\b/.test(t)) return 'otitis';
  if(/statin|score2|qrisk|cholesterol|lipid|ldl|primary prevention|atorvastatin/.test(t)) return 'statin';
  if(/\baf\b|atrial|irregular pulse|fibrillation|cha2ds2|cha₂ds₂|anticoagul|doac|east-afnet/.test(t)) return 'af';
  return 'fallback';
}

/* — tokenizer and delay budget ——————————————————————— */
const CITE_RE = /\[[A-Za-z0-9][A-Za-z0-9 \-/]*\]/;
function tokenize(text){
  const out=[]; let sp=false;
  const push=(k,w)=>{ out.push({k,w,sp:sp&&out.length>0}); sp=false; };
  const words=(k,s)=>{
    if(/^\s/.test(s)) sp=true;
    const t=s.trim();
    if(t) t.split(/\s+/).forEach((w,n)=>{ if(n>0) sp=true; push(k,w); });
    if(/\s$/.test(s)) sp=true;
  };
  text.split(/(\*\*[^*]+\*\*|\[[A-Za-z0-9][A-Za-z0-9 \-/]*\])/g).forEach(seg=>{
    if(!seg) return;
    if(seg.startsWith('**')) words('b', seg.slice(2,-2));
    else if(CITE_RE.test(seg) && seg[0]==='[') push('c', seg.slice(1,-1));
    else words('t', seg);
  });
  return out;
}
const D={BASE:6,JIT:12,SENT:60,CLAUSE:24,CITE:30,PARA:80,HEAD:200,CALL:240,LI:110};
function delay(tok,i){
  let d = D.BASE + ((i*2654435761)%997)/997*D.JIT;
  if(tok.k==='c') d += D.CITE;
  else if(/[.!?]["')\]]?$/.test(tok.w)) d += D.SENT;
  else if(/[,;:—]$/.test(tok.w)) d += D.CLAUSE;
  if(i===0) d += D.PARA;
  return d;
}
function buildOps(a){
  const ops=[];
  ops.push({o:'lead', d:100});
  tokenize(a.lead).forEach((tk,i)=>ops.push({o:'tok',tk,d:delay(tk,i)}));
  a.body.forEach(b=>{
    if(b.t==='h') ops.push({o:'h', x:b.x, d:D.HEAD});
    else if(b.t==='p'){ ops.push({o:'p', d:D.PARA});
      tokenize(b.x).forEach((tk,i)=>ops.push({o:'tok',tk,d:delay(tk,i)})); }
    else if(b.t==='ul'){ ops.push({o:'ul', d:D.LI});
      b.items.forEach(it=>{ ops.push({o:'li', d:D.LI});
        tokenize(it).forEach((tk,i)=>ops.push({o:'tok',tk,d:delay(tk,i)})); }); }
    else ops.push({o:'call', kind:b.t, x:b.x, d:D.CALL});
  });
  return ops;
}

function applyOp(op){
  const c = stream, root = c.root;
  if(op.o==='lead'){ const p=document.createElement('p'); p.className='lead'; root.appendChild(p); c.cur=p; c.list=null; return; }
  if(op.o==='p'){ const p=document.createElement('p'); root.appendChild(p); c.cur=p; c.list=null; return; }
  if(op.o==='h'){ const h=document.createElement('h3'); h.textContent=op.x; root.appendChild(h); c.cur=null; c.list=null; return; }
  if(op.o==='ul'){ const u=document.createElement('ul'); root.appendChild(u); c.list=u; c.cur=null; return; }
  if(op.o==='li'){ const li=document.createElement('li'); (c.list||root).appendChild(li); c.cur=li; return; }
  if(op.o==='call'){
    const d=document.createElement('div');
    d.className = 'callout' + (op.kind==='warn'?' warn':'');
    d.innerHTML = ico(op.kind==='warn'?'alert':'info',14) + '<span>' + esc(op.x) + '</span>';
    root.appendChild(d); c.cur=null; c.list=null; return;
  }
  const t=op.tk, cur=c.cur; if(!cur) return;
  if(t.sp) cur.appendChild(document.createTextNode(' '));
  if(t.k==='c'){
    const b=document.createElement('button');
    b.className='cite'; b.textContent=t.w; b.dataset.tag=t.w; b.dataset.turn=c.turn;
    b.setAttribute('aria-label','Source: '+t.w);
    cur.appendChild(b);
  } else if(t.k==='b'){
    const s=document.createElement('strong'); s.textContent=t.w; cur.appendChild(s);
  } else cur.appendChild(document.createTextNode(t.w));
}

function tick(){
  if(!stream) return;
  const op = stream.ops[stream.i];
  if(!op){ endWrite(); return; }
  stream.i++;
  applyOp(op);
  if(stream.cur && stream.caret) stream.cur.appendChild(stream.caret);
  follow();
  stream.timer = setTimeout(tick, reduced()?0:op.d);
}
function startWrite(i){
  const a=A(i);
  stream = {ops:buildOps(a), i:0, root:$('#ans-'+i), cur:null, list:null,
            caret:Object.assign(document.createElement('span'),{className:'caret'}), turn:i, idx:i};
  setPipe(i, 'Writing the answer, citing as it goes', true);
  if(reduced()){ while(stream.i<stream.ops.length){ applyOp(stream.ops[stream.i]); stream.i++; } endWrite(); return; }
  tick();
}
function killCaret(){ if(stream&&stream.caret&&stream.caret.parentNode) stream.caret.parentNode.removeChild(stream.caret); }
function endWrite(){
  const i = stream ? stream.idx : -1;
  killCaret();
  if(stream&&stream.timer) clearTimeout(stream.timer);
  stream = null;
  if(i>=0 && S.turns[i].phase!=='stopped') verifyPass(i);
}
function stopRun(){
  const i = S.turns.length-1, t = S.turns[i];
  if(!t || t.phase==='done') return;
  t.phase='stopped';
  killCaret(); if(stream&&stream.timer) clearTimeout(stream.timer); stream=null; clearTimers();
  $('#pipe-'+i).innerHTML = `<div class="pipe"><span style="color:var(--amber)">${ico('alert',13)}</span>
    Stopped. The partial answer below is kept, and its citations still open.</div>`;
  renderSources(i, true); renderActs(i); renderComposer();
  say('Stopped.');
}

/* — the faithfulness pass: does each cited source actually say it —
   the check Evidence exists to make, so it happens where you can
   watch it rather than silently before the answer appears. */
function verifyPass(i){
  const t=S.turns[i]; t.phase='verify';
  const chips = $$('#turn-'+i+' .cite');
  const total = chips.length;
  const slot = $('#faith-'+i);
  let n = 0;
  const paint = ()=>{
    slot.innerHTML = `<div class="faith running">${ico('shield',14)}
      <span>Checking each statement against the passage it cites</span>
      <span class="fgrow"></span><span>${n}/${total}</span>
      <span class="fbar"><i style="width:${total?Math.round(n/total*100):100}%"></i></span></div>`;
  };
  paint();
  const step = ()=>{
    if(n>0 && chips[n-1]) chips[n-1].classList.remove('checking');
    if(n>=total){ finishVerify(i,total); return; }
    chips[n].classList.add('checking'); n++;
    paint();
    later(step, reduced()?0:Math.max(38, 420/Math.max(total,1)));
  };
  later(step, 260);
}
function finishVerify(i,total){
  const t=S.turns[i]; t.phase='done'; t.refsOpen=false;
  $('#faith-'+i).innerHTML = `<div class="faith">${ico('shield',14)}
    <span><b>${total} of ${total} statements</b> resolve to a passage in the source they cite.
    Click any citation to read that passage.</span></div>`;
  pipeDone(i); renderReadList(i,true);
  renderSources(i); renderActs(i); renderNext(i); renderComposer();
  say('Answer complete. '+Object.keys(A(i).refs).length+' sources cited.');
  follow();
}

/* ══════════════════════════════════════════════════════════════
   References, actions, follow-ups
   ══════════════════════════════════════════════════════════════ */
function allText(a){
  return [a.lead].concat(a.body.map(b=>b.t==='ul'?b.items.join(' '):b.x)).join(' ');
}
function citedTags(a){
  const seen=[], re=/\[([A-Za-z0-9][A-Za-z0-9 \-/]*)\]/g; let m;
  const txt = allText(a);
  while((m=re.exec(txt))) if(a.refs[m[1]] && seen.indexOf(m[1])<0) seen.push(m[1]);
  return seen;
}
function claimsFor(a, tag){
  const out=[];
  const add = (label, text)=>{
    (text.match(/[^.!?]+[.!?]*\s*/g) || [text]).forEach(s=>{
      if(s.indexOf('['+tag+']')>=0) out.push({label, s:s.replace(/\[[A-Za-z0-9][A-Za-z0-9 \-/]*\]/g,'').replace(/\*\*/g,'').replace(/\s+([.,;])/g,'$1').trim()});
    });
  };
  add('Direct answer', a.lead);
  let head = 'Answer';
  a.body.forEach(b=>{
    if(b.t==='h'){ head=b.x; return; }
    if(b.t==='ul') b.items.forEach(it=>add(head,it));
    else add(head, b.x);
  });
  return out;
}

function renderSources(i, partial){
  const a=A(i);
  // on a stopped run, list only what the partial answer actually cited
  const tags = partial
    ? $$('#turn-'+i+' .cite').map(c=>c.dataset.tag).filter((t,n,arr)=>a.refs[t] && arr.indexOf(t)===n)
    : citedTags(a);
  if(!tags.length){ $('#srcs-'+i).innerHTML=''; return; }
  $('#srcs-'+i).innerHTML = `
    <div class="refshead">${ico('quote',12)} References <span class="rgrow"></span>

            </span>
          </span>
          <span class="sgo2">${ico('ext',13)}</span></button>`;
      }).join('')}
    </div>`;
}

/* ══════════════════════════════════════════════════════════════
   The source drawer — Evidence's whole point is that this is one
   click from any statement, not a search in another tab.
   ══════════════════════════════════════════════════════════════ */
function openSource(i, tag){
  const a=A(i), r=a.refs[tag];
  if(!r){ toast('That source is not in this answer'); return; }
  const claims = claimsFor(a, tag);
  const body = r.excerpt.map(p=>{
    if(r.hi && p.indexOf(r.hi)>=0){
      const parts = p.split(r.hi);
      return `<p>${esc(parts[0])}<mark>${esc(r.hi)}</mark>${esc(parts.slice(1).join(r.hi))}</p>`;
    }
    return `<p>${esc(p)}</p>`;
  }).join('');
  drawer.innerHTML = `
    <div class="dhead">
      <span class="dtag">${esc(tag)}</span>
      <span class="dlab">Source</span>
      <button class="dclose" data-act="closedrawer" aria-label="Close">${ico('x',15)}</button>
    </div>
    <div class="dbody">
      <h3 class="dtitle">${esc(r.title)}</h3>
      <div class="dmeta">
        <span class="styp ${r.type==='Guideline'?'guide':''}">${esc(r.type)}</span>
        ${esc(r.publisher)} <span class="dot"></span> ${esc(r.date)} <span class="dot"></span> ${esc(r.region)}
      </div>
      <button class="dopen" data-act="openext" data-url="${esc(r.url)}">${ico('ext',14)} Open ${esc(r.url)}</button>

      <p class="dsec">The passage this rests on</p>
      <div class="excerpt">${body}</div>

      <p class="dsec">Statements citing this source &middot; ${claims.length}</p>
      ${claims.map(c=>`<button class="dclaim" data-act="jumpclaim" data-turn="${i}" data-tag="${esc(tag)}">
          <em>${esc(c.label)}</em>${esc(c.s)}</button>`).join('') ||
        `<p class="emptyq">No statement in this answer cites it directly.</p>`}

      <div class="dnote">${ico('info',13)}<span>Excerpts on this page are illustrative stand-ins for the
        published text. In production this pane shows the retrieved passage verbatim, with the sentence
        the claim was grounded in highlighted.</span></div>
    </div>`;
  drawer.classList.add('open'); drawer.setAttribute('aria-hidden','false');
  $$('.cite.on').forEach(e=>e.classList.remove('on'));
  $$('.src.on').forEach(e=>e.classList.remove('on'));
  $$(`#turn-${i} .cite[data-tag="${tag}"]`).forEach(e=>e.classList.add('on'));
  const row = $('#src-'+i+'-'+cssId(tag)); if(row) row.classList.add('on');
}
function closeDrawer(){
  drawer.classList.remove('open'); drawer.setAttribute('aria-hidden','true');
  $$('.cite.on').forEach(e=>e.classList.remove('on'));
  $$('.src.on').forEach(e=>e.classList.remove('on'));
}

/* ══════════════════════════════════════════════════════════════
   Running a question
   ══════════════════════════════════════════════════════════════ */
function ask(text){
  const q=(text||'').trim(); if(!q) return;
  if(stream || (S.turns.length && ['search','rank','write','verify'].indexOf(S.turns[S.turns.length-1].phase)>=0)) return;
  if(S.view!=='thread') enterThread();
  closeDrawer();
  const i = S.turns.length;
  S.turns.push({q, key:route(q), phase:'search', refsOpen:true, vote:null, saved:false, doc:S.attached});
  if(S.history.indexOf(q)<0) S.history.unshift(q);
  S.attached = null;
  renderNav();
  $('#composerslot').insertAdjacentHTML('beforebegin', turnHTML(i, S.turns[i]));
  renderComposer();
  stuck = true;
  $('#turn-'+i).scrollIntoView({block:'start'});
  runPipeline(i);
}

function runPipeline(i){
  const a=A(i), t=S.turns[i];
  const kept = a.read.filter(r=>r.keep).length;
  const steps = [
    [700,  `Reading your question against <b>${esc(S.specialty)}</b>`],
    [850,  `Searching <b>${enabledCount()} source sets</b>, ranked for Ireland`]
  ];
  // the specialty setting is not decoration: when the question sits outside it,
  // say which stack got pulled in rather than silently reordering
  if(a.specialty !== S.specialty)
    steps.push([800, `Question reads as <b>${esc(a.specialty)}</b> — that guidance ranked in alongside ${esc(S.specialty)}`]);
  steps.push(
    [900,  `Read <b>${a.read.length} references</b>`, ()=>renderReadList(i,false)],
    [950,  `Re-ranking by source tier and how directly each answers the question`],
    [700,  `Kept <b>${kept}</b>, dropped <b>${a.read.length-kept}</b> with a stated reason`, ()=>{ t.phase='rank'; renderReadList(i,true); }]
  );
  let n=0;
  const next = ()=>{
    if(t.phase==='stopped') return;
    if(n>=steps.length){ t.phase='write'; startWrite(i); return; }
    const [ms, html, after] = steps[n++];
    setPipe(i, html, true);
    if(after) after();
    say(html.replace(/<[^>]+>/g,''));
    follow();
    later(next, ms);
  };
  next();
}

function goHome(){
  clearTimers(); killCaret();
  if(stream&&stream.timer) clearTimeout(stream.timer);
  stream=null; S.turns=[]; S.view='home'; S.draft=''; S.attached=null; S.menuOpen=null;
  closeDrawer(); stuck=true; jumpBtn.hidden=true;
  renderNav(); renderTop(); renderHome();
}

/* — scroll —————————————————————————————————————————— */
const nearBottom = ()=> stage.scrollHeight - stage.scrollTop - stage.clientHeight < 130;
function running(){ const t=S.turns[S.turns.length-1]; return !!t && ['search','rank','write','verify'].indexOf(t.phase)>=0; }
function jumpVisible(){ return !stuck && S.view==='thread' && running(); }
function follow(){ if(stuck && !reduced()) stage.scrollTop = stage.scrollHeight; jumpBtn.hidden = !jumpVisible(); }
stage.addEventListener('scroll', ()=>{ stuck = nearBottom(); jumpBtn.hidden = !jumpVisible(); });
jumpBtn.addEventListener('click', ()=>{ stuck=true; stage.scrollTop=stage.scrollHeight; jumpBtn.hidden=true; });

/* ══════════════════════════════════════════════════════════════
   Export
   ══════════════════════════════════════════════════════════════ */
function plain(i, forMd){
  const a=A(i), t=S.turns[i], B=forMd?'**':'';
  const strip = s => s.replace(/\*\*/g, B);
  const L=[];
  L.push(forMd?('# '+t.q):('Q: '+t.q), '');
  L.push(strip(a.lead));
  a.body.forEach(b=>{
    if(b.t==='h') L.push('', forMd?('## '+b.x):b.x.toUpperCase());
    else if(b.t==='p') L.push('', strip(b.x));
    else if(b.t==='ul'){ L.push(''); b.items.forEach(x=>L.push('- '+strip(x))); }
    else L.push('', (b.t==='warn'?'CAUTION: ':'NOTE: ')+strip(b.x));
  });
  L.push('', forMd?'## References':'REFERENCES');
  citedTags(a).forEach(tag=>{
    const r=a.refs[tag];
    L.push(`[${tag}] ${r.publisher}. ${r.title}. ${r.type}, ${r.date}. ${r.url}`);
  });
  L.push('', `Assembled by MedNav Evidence on ${STAMP}, specialty setting: ${S.specialty}, preset: ${presetName()}.`,
            'Figures are illustrative — verify each against the cited document. Not a treatment decision.');
  return L.join('\n');
}
function refsOnly(i){
  const a=A(i);
  return citedTags(a).map(tag=>{
    const r=a.refs[tag];
    return `[${tag}] ${r.publisher}. ${r.title}. ${r.type}, ${r.date}. ${r.url}. Accessed ${STAMP}.`;
  }).join('\n');
}
function copy(text,msg){
  const ok=()=>toast(msg);
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok,()=>fb(text,ok));
  else fb(text,ok);
}
function fb(text,ok){
  const ta=document.createElement('textarea');
  ta.value=text; ta.setAttribute('readonly',''); ta.style.cssText='position:fixed;opacity:0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); ok(); }catch(e){ toast('Copy failed — select the text manually'); }
  ta.remove();
}
function download(i){
  try{
    const blob = new Blob([plain(i,true)], {type:'text/markdown'});
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href=url; a.download='evidence-answer.md'; document.body.appendChild(a); a.click();
    a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 1000);
    toast('Downloaded evidence-answer.md');
  }catch(e){ copy(plain(i,true),'Download blocked here — copied the Markdown instead'); }
}

/* ══════════════════════════════════════════════════════════════
   Wiring
   ══════════════════════════════════════════════════════════════ */
document.addEventListener('click', e=>{
  const scrim = e.target.classList && e.target.classList.contains('scrim');
  if(scrim){ S.modal=null; renderModal(); return; }
  const b = e.target.closest('button');
  if(S.menuOpen!==null && !e.target.closest('.mpop') && !(b && b.dataset.act==='menu')){
    const i=S.menuOpen; S.menuOpen=null; renderActs(i);
  }
  if(!b) return;

  if(b.id==='themebtn'){ setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark'); return; }
  if(b.id==='burger'){ S.sideOpen=!S.sideOpen; $('#side').classList.toggle('open',S.sideOpen); return; }
  if(b.id==='newq'){ goHome(); return; }
  if(b.id==='aboutbtn'){ S.modal='about'; renderModal(); return; }

  const open=b.dataset.open;
  if(open){ S.modal=open; specQuery=''; renderModal(); S.sideOpen=false; $('#side').classList.remove('open'); return; }
  if(b.dataset.spec){ S.specialty=b.dataset.spec; S.modal=null; renderModal(); renderTop(); renderNav();
    if(S.view==='home') renderHome(); else renderComposer();
    toast('Specialty set to '+S.specialty+'. The next answer is ranked for it.'); return; }
  if(b.dataset.preset){ S.preset=b.dataset.preset; renderModal(); renderTop(); return; }
  if(b.dataset.togSrc){ const id=b.dataset.togSrc; S.sources[id]=!S.sources[id]; renderModal(); renderTop();
    if(S.view==='home') renderHome(); return; }
  if(b.dataset.unblock){ S.blocked=S.blocked.filter(x=>x!==b.dataset.unblock); renderModal(); return; }
  if(b.dataset.ex){ ask(b.dataset.ex); return; }
  if(b.dataset.hist!==undefined && b.dataset.hist!==''){ ask(S.history[+b.dataset.hist]);
    S.sideOpen=false; $('#side').classList.remove('open'); return; }
  if(b.dataset.tog!==undefined && b.dataset.tog!==''){ const i=+b.dataset.tog;
    S.turns[i].refsOpen=!S.turns[i].refsOpen; pipeDone(i); renderReadList(i,true); return; }
  if(b.dataset.tag && b.classList.contains('cite')){ openSource(+b.dataset.turn, b.dataset.tag); return; }
  if(b.dataset.src){ openSource(+b.dataset.turn, b.dataset.src); return; }

  const act=b.dataset.act, i=b.dataset.turn!==undefined?+b.dataset.turn:-1;
  if(act==='closemodal'){ S.modal=null; renderModal(); return; }
  if(act==='closedrawer'){ closeDrawer(); return; }
  if(act==='openext'){ toast('Opening '+b.dataset.url+' is not wired in this prototype'); return; }
  if(act==='jumpclaim'){
    const c=$(`#turn-${b.dataset.turn} .cite[data-tag="${b.dataset.tag}"]`);
    if(c){ stuck=false; c.scrollIntoView({block:'center',behavior:reduced()?'auto':'smooth'}); }
    return;
  }
  if(act==='send'){ const ta=$('#'+b.dataset.for); if(ta) ask(ta.value); return; }
  if(act==='stop'){ stopRun(); return; }
  if(act==='attach'){ const f=b.closest('.ask').querySelector('input[type=file]'); if(f) f.click(); return; }
  if(act==='unattach'){ S.attached=null; if(S.view==='home') renderHome(); else renderComposer(); return; }
  if(act==='menu'){ S.menuOpen = S.menuOpen===i?null:i; renderActs(i); return; }
  if(act==='save'){ S.turns[i].saved=!S.turns[i].saved; renderActs(i);
    toast(S.turns[i].saved?'Saved to your answers':'Removed'); return; }
  if(act==='copy'){ copy(plain(i,false),'Answer copied with its citations'); return; }
  if(act==='refs'){ S.menuOpen=null; renderActs(i); copy(refsOnly(i),'Reference list copied'); return; }
  if(act==='dl'){ S.menuOpen=null; renderActs(i); download(i); return; }
  if(act==='print'){ S.menuOpen=null; renderActs(i); setTimeout(()=>window.print(),60); return; }
  if(act==='session'){ toast('Linking to a patient session is not wired in this prototype'); return; }
  if(act==='cpd'){ toast('Logged 5 minutes of self-directed CPD against this question'); return; }
  if(act==='up'||act==='down'){
    const t=S.turns[i]; t.vote = t.vote===act?null:act; renderActs(i);
    if(t.vote==='down') toast('Logged. Tell us which statement was wrong and we re-check it against its source.');
    else if(t.vote==='up') toast('Logged.');
    return;
  }
});

document.addEventListener('input', e=>{
  const t=e.target;
  if(t.id==='specq'){ specQuery=t.value; renderModal(); return; }
  if(t.tagName==='TEXTAREA' && t.closest('.ask')){
    if(t.id==='ask') S.draft=t.value;
    autosize(t); syncSend(t);
  }
});
document.addEventListener('change', e=>{
  if(e.target.type==='file' && e.target.files && e.target.files[0]){
    S.attached = e.target.files[0].name;          // the name only — nothing is read or uploaded
    if(S.view==='home') renderHome(); else renderComposer();
    toast('Attached. The next answer is read against it.');
  }
});
document.addEventListener('keydown', e=>{
  const meta = e.metaKey||e.ctrlKey;
  if(meta && e.key.toLowerCase()==='k'){ e.preventDefault(); goHome(); return; }
  if(meta && e.key==='Enter'){
    e.preventDefault();
    const ta = $('#ask2') || $('#ask'); if(ta) ask(ta.value); return;
  }
  if(e.key==='Escape'){
    if(S.modal){ S.modal=null; renderModal(); }
    else if(drawer.classList.contains('open')) closeDrawer();
    else if(S.sideOpen){ S.sideOpen=false; $('#side').classList.remove('open'); }
    else if(running()) stopRun();
  }
});

/* ══════════════════════════════════════════════════════════════
   Theme and boot
   ══════════════════════════════════════════════════════════════ */
function setTheme(m){
  document.documentElement.dataset.theme=m;
  try{ localStorage.setItem('mednav-evidence-theme',m); }catch(err){}
  renderTop();
}
(function boot(){
  let saved=null; try{ saved=localStorage.getItem('mednav-evidence-theme'); }catch(err){}
  const dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme = saved || (dark?'dark':'light');
  renderNav(); renderTop(); renderHome();
})();
})();
</script>
